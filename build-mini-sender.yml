          [IO.File]::WriteAllBytes(
            $archive,
            [Convert]::FromBase64String(($archiveBase64 -replace '\s', '')))
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "68ae30c23bd03bcf67581a34418e0f8add7f23ced9fa7bd0e9c47fa8f950aafc"
          if ($actual -ne $expected) {
            throw "Embedded source checksum mismatch: $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $env:GITHUB_WORKSPACE -Force
          if (-not (Test-Path "mini_sender\flash_sender.py")) {
            throw "Embedded source was not restored."
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini_sender/requirements.txt

      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r mini_sender/requirements.txt

      - name: Verify source and default timer
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\mini_sender"
          python -m compileall -q mini_sender
          python -m unittest discover -s mini_sender/tests -v
          python -c "from core import DEFAULT_TTL_SECONDS; assert DEFAULT_TTL_SECONDS == 3"
          if (Select-String -Path "mini_sender\*.py" -Pattern "b18441a1ff607e10a989891a5462e627" -Quiet) {
            throw "A public sample API hash must never be embedded."
          }

      - name: Build one-file Windows application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --noupx `
            --name Telegram-Self-Destruct-Sender `
            --version-file mini_sender/version_info.txt `
            --paths mini_sender `
            --collect-submodules telethon `
            mini_sender/flash_sender.py
          if (-not (Test-Path "dist\Telegram-Self-Destruct-Sender.exe")) {
            throw "PyInstaller did not create the executable."
          }

      - name: Create portable ZIP and checksum
        shell: pwsh
        run: |
          $package = "output\Telegram-Self-Destruct-Sender"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "dist\Telegram-Self-Destruct-Sender.exe" "$package\Telegram-Self-Destruct-Sender.exe"
          Copy-Item "mini_sender\USER_GUIDE_ZH.txt" "$package\使用说明.txt"
          Copy-Item "mini_sender\THIRD_PARTY_NOTICES.txt" "$package\THIRD_PARTY_NOTICES.txt"

          $zip = "output\Telegram-Self-Destruct-Sender-Windows10.zip"
          Compress-Archive -Path "$package\*" -DestinationPath $zip -CompressionLevel Optimal
          $resultHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$resultHash  Telegram-Self-Destruct-Sender-Windows10.zip" |
            Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "Package size: $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"
          Write-Host "SHA256: $resultHash"

      - name: Upload finished program
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Telegram-Self-Destruct-Sender-Windows10
          path: |
            output/Telegram-Self-Destruct-Sender-Windows10.zip
            output/Telegram-Self-Destruct-Sender-Windows10.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

