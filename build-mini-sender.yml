      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini_sender/requirements.txt

      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r mini_sender/requirements.txt

      - name: Verify source, cache, proxy, and default timer
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\mini_sender"
          python -m compileall -q mini_sender
          python -m unittest discover -s mini_sender/tests -v
          python -c "from core import DEFAULT_TTL_SECONDS, ProxySettings, SettingsStore; from pathlib import Path; import tempfile; assert DEFAULT_TTL_SECONDS == 3; d=tempfile.TemporaryDirectory(); assert SettingsStore(Path(d.name)).cache_enabled(); assert ProxySettings('socks5','127.0.0.1',1080).validated().port == 1080"
          if (Select-String -Path "mini_sender\*.py" -Pattern "b18441a1ff607e10a989891a5462e627" -Quiet) {
            throw "A public sample API hash must never be embedded."
          }

      - name: Build one-file Windows application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --noupx `
            --name Unofficial-Telegram-Self-Destruct-Sender `
            --version-file mini_sender/version_info.txt `
            --paths mini_sender `
            --collect-submodules telethon `
            --collect-submodules python_socks `
            mini_sender/flash_sender.py
          if (-not (Test-Path "dist\Unofficial-Telegram-Self-Destruct-Sender.exe")) {
            throw "PyInstaller did not create the executable."
          }

      - name: Create portable ZIP and checksum
        shell: pwsh
        run: |
          $package = "output\Unofficial-Telegram-Self-Destruct-Sender"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "dist\Unofficial-Telegram-Self-Destruct-Sender.exe" "$package\Unofficial-Telegram-Self-Destruct-Sender.exe"
          Copy-Item "mini_sender\USER_GUIDE_ZH.txt" "$package\使用说明.txt"
          Copy-Item "mini_sender\THIRD_PARTY_NOTICES.txt" "$package\THIRD_PARTY_NOTICES.txt"

          $zip = "output\Unofficial-Telegram-Self-Destruct-Sender-Windows10.zip"
          Compress-Archive -Path "$package\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
