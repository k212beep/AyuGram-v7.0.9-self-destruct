            @{ File = "Telegram\SourceFiles\ayu\features\groups\group_restriction_refresh.cpp"; Text = "MTPmessages_Search(" }
            @{ File = "Telegram\SourceFiles\ayu\features\groups\group_restriction_refresh.cpp"; Text = "MTPchannels_EditBanned(" }
