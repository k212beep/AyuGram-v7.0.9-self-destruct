          $ayuBuildRecipePath = "$env:RUNNER_TEMP\ayu-main-build-ayugram-offline-native-v3.cmd"
          $ayuBuildRecipe = "@echo off`r`n" + $ayuBuildRecipe.Replace("`r`n", "`n").Replace("`n", "`r`n") + "`r`n"
