      - name: Verify and stage Windows runtime dependencies before compilation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $report = "$env:RUNNER_TEMP\ayu-startup-errors-ayugram-offline-native-v3.txt"
          try {
            $output = "$env:GITHUB_WORKSPACE\output"
            $official = "$output\official.zip"
            $stage = "$output\official"
            $package = "$output\package"
            New-Item -ItemType Directory -Force -Path $output, $package | Out-Null
            $verified = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest -Uri $env:OFFICIAL_ZIP_URL -OutFile $official -TimeoutSec 120
                if ((Get-FileHash $official -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:OFFICIAL_ZIP_SHA256) { throw "Official dependency ZIP checksum mismatch" }
                $verified = $true
                break
              } catch {
                if ($attempt -eq 3) { throw }
                Write-Host "Runtime download or verification failed; retrying ($attempt/3)."
                Start-Sleep -Seconds 5
              }
            }
            if (-not $verified) { throw "Windows runtime dependencies were not verified" }
            Expand-Archive -Path $official -DestinationPath $stage -Force
            Get-ChildItem -Path $stage -Filter *.dll -File -Recurse | ForEach-Object {
              $target = Join-Path $package ([IO.Path]::GetRelativePath($stage, $_.FullName))
              New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $target
            }
          } catch {
            "Windows runtime staging failed:`n$($_ | Out-String)" | Set-Content -LiteralPath $report -Encoding utf8
            throw
          }

      - name: Prepare libraries and build AyuGram
        shell: cmd
        run: |
          python "%RUNNER_TEMP%\ayu-build-diagnostics-ayugram-offline-native-v3.py" "%RUNNER_TEMP%\ayu-main-build-ayugram-offline-native-v3.cmd" "%RUNNER_TEMP%\ayu-build-errors-ayugram-offline-native-v3.txt"

      - name: Verify the actual original Windows interface before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $report = "$env:RUNNER_TEMP\ayu-startup-errors-ayugram-offline-native-v3.txt"
          try {
            $output = "$env:GITHUB_WORKSPACE\output"
            $package = "$output\package"
            if (-not (Test-Path -LiteralPath $package -PathType Container)) { throw "The verified Windows runtime package was not staged" }
            $exe = "$package\AyuGram-Offline-ReadOnly.exe"
            Copy-Item "$env:BUILD_ROOT\tdesktop\out\Release\AyuGram.exe" $exe
            Copy-Item "$env:NATIVE_CHECK_ROOT\README-original.txt" "$package\README-使用说明.txt"
            foreach ($license in @("LICENSE", "LEGAL", "COPYING")) {
              $path = "$env:BUILD_ROOT\tdesktop\$license"
              if (Test-Path -LiteralPath $path -PathType Leaf) { Copy-Item -LiteralPath $path -Destination $package }
            }
            python "$env:NATIVE_CHECK_ROOT\smoke_original.py" $exe $report
            if ($LASTEXITCODE -ne 0) { throw "Actual original UI or zero-source-write verification failed; see the startup error report." }
            $zip = "$output\AyuGram-Offline-ReadOnly-v3-Windows-x64.zip"
            Compress-Archive -Path "$package\*" -DestinationPath $zip -CompressionLevel Optimal
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  AyuGram-Offline-ReadOnly-v3-Windows-x64.zip" | Set-Content "$zip.sha256" -Encoding ascii
          } catch {
            "`nOriginal UI verification or packaging failed:`n$($_ | Out-String)" | Add-Content -LiteralPath $report -Encoding utf8
            throw
          }

      - name: Upload the verified original-interface offline viewer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: AyuGram-Offline-ReadOnly-v3-Windows-x64
          path: |
            output/AyuGram-Offline-ReadOnly-v3-Windows-x64.zip
            output/AyuGram-Offline-ReadOnly-v3-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build error diagnostics
        if: failure() && !cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: AyuGram-build-errors-ayugram-offline-native-v3
          path: |
            ${{ runner.temp }}/ayu-build-errors-ayugram-offline-native-v3.txt
            ${{ runner.temp }}/ayu-startup-errors-ayugram-offline-native-v3.txt
          if-no-files-found: ignore
          retention-days: 7
