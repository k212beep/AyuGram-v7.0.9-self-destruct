      - name: Check original UI identity and disable persistent dependency caches
        shell: python
        run: |
          import os,subprocess,sys
          from pathlib import Path
          root=Path(os.environ['BUILD_ROOT'])/'tdesktop'
          checks=Path(os.environ['NATIVE_CHECK_ROOT'])
          subprocess.run([sys.executable,'-m','unittest','discover','-s',str(checks),'-p','test_ui_identity.py','-v'],check=True)
          subprocess.run([sys.executable,str(checks/'apply_dependencies.py'),str(root)],check=True)
          subprocess.run([sys.executable,str(checks/'verify_source.py'),str(root)],check=True)
          subprocess.run([sys.executable,'-m','unittest','discover','-s',str(checks),'-p','test_runtime_headers.py','-v'],check=True)
          headers=subprocess.run([sys.executable,str(checks/'verify_runtime_headers.py'),str(root)],text=True,capture_output=True,encoding='utf-8')
          print(headers.stdout,end='')
          print(headers.stderr,end='',file=sys.stderr)
          if headers.returncode:
              report=Path(os.environ['RUNNER_TEMP'])/'ayu-build-errors-ayugram-offline-native-v3.txt'
              report.write_text(headers.stdout+headers.stderr,encoding='utf-8')
              raise SystemExit(headers.returncode)
          subprocess.run([sys.executable,'-m','unittest','discover','-s',str(checks),'-p','test_offline_guards.py','-v'],check=True)
          result=subprocess.run([sys.executable,str(checks/'verify_offline_guards.py'),str(root)],text=True,capture_output=True,encoding='utf-8')
          print(result.stdout,end='')
          print(result.stderr,end='',file=sys.stderr)
          if result.returncode:
              report=Path(os.environ['RUNNER_TEMP'])/'ayu-build-errors-ayugram-offline-native-v3.txt'
              report.write_text(result.stdout+result.stderr,encoding='utf-8')
              raise SystemExit(result.returncode)

      - name: Fetch pinned Breakpad with retry and official mirror
        shell: pwsh
        run: |
          $breakpadBootstrap = @'
          """Fetch the pinned Breakpad commit before dependency builds begin."""
          from pathlib import Path
          import os
          import subprocess
          import sys
          import time
          
          PRIMARY_URL = 'https://chromium.googlesource.com/breakpad/breakpad'
          MIRROR_URL = 'https://github.com/google/breakpad.git'
          PINNED_SHA = 'dfcb7b6799b7c1e2c8d65e857d8afede185471d8'
          SOURCES = ((PRIMARY_URL, 2), (MIRROR_URL, 3))
          
          
          def run_git(*arguments):
              environment = dict(os.environ, GIT_TERMINAL_PROMPT='0', GCM_INTERACTIVE='Never')
              try:
                  result = subprocess.run(
                      ['git', *arguments],
                      env=environment,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      encoding='utf-8',
                      errors='replace',
                      timeout=180,
                  )
                  return result.returncode, result.stdout
              except subprocess.TimeoutExpired:
                  return 124, 'Git command exceeded its 180-second timeout.'
          
          
          def require_git(*arguments):
              code, output = run_git(*arguments)
              if code:
                  raise RuntimeError('Git setup/verification failed:\n' + output)
              return output.strip()
          
          
          def prepare(cache):
              cache = Path(cache).resolve()
              cache.mkdir(parents=True, exist_ok=True)
              require_git('init', '--bare', str(cache))
              failures = []
              for url, attempts in SOURCES:
                  for attempt in range(1, attempts + 1):
                      print(f'Breakpad: fetching pinned commit from {url}, attempt {attempt}/{attempts}.', flush=True)
                      code, output = run_git(
                          '-C', str(cache),
                          '-c', 'http.lowSpeedLimit=1024',
                          '-c', 'http.lowSpeedTime=30',
                          'fetch', '--no-tags', '--depth=1', url, PINNED_SHA,
                      )
                      if not code:
                          actual = require_git('-C', str(cache), 'rev-parse', '--verify', 'FETCH_HEAD^{commit}')
                          if actual != PINNED_SHA:
                              raise RuntimeError(f'Breakpad commit mismatch: expected {PINNED_SHA}, received {actual}.')
                          require_git('-C', str(cache), 'update-ref', 'refs/heads/ayu-pinned', PINNED_SHA)
                          require_git('-C', str(cache), 'symbolic-ref', 'HEAD', 'refs/heads/ayu-pinned')
                          local_url = cache.as_uri() + '/'
                          require_git('config', '--global', 'url.' + local_url + '.insteadOf', PRIMARY_URL)
                          print(f'Breakpad: verified {actual}; dependency clone will use the local pinned source.', flush=True)
                          return
                      failures.append(f'{url}, attempt {attempt}/{attempts}, exit {code}:\n{output.strip()}')
                      print(f'Breakpad: fetch did not complete (exit {code}); continuing within the retry limit.', flush=True)
                      if attempt < attempts:
                          time.sleep(5 * attempt)
              raise RuntimeError('All pinned Breakpad download attempts failed:\n' + '\n'.join(failures))
          
          
          def main():
              try:
                  if len(sys.argv) != 2:
                      raise RuntimeError('Expected exactly one dedicated Breakpad cache path.')
                  prepare(sys.argv[1])
              except (OSError, RuntimeError) as error:
                  print('ERROR: ' + str(error), file=sys.stderr, flush=True)
                  return 1
              return 0
          
          
          if __name__ == '__main__':
              sys.exit(main())
          '@
          $bootstrapPath = "$env:RUNNER_TEMP\ayu-breakpad-bootstrap-ayugram-offline-native-v3.py"
          [IO.File]::WriteAllText($bootstrapPath, $breakpadBootstrap, [Text.UTF8Encoding]::new($false))
          python $bootstrapPath "$env:RUNNER_TEMP\ayu-breakpad-cache-ayugram-offline-native-v3.git"
          if ($LASTEXITCODE -ne 0) { throw "Pinned Breakpad sources could not be prepared; dependency build was not started." }

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw "Visual Studio C++ tools were not found."
          }
          $devcmd = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          "VSINSTALLPATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VSDEVCMD=$devcmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install ATL and MFC for the v14.44 toolset
        shell: pwsh
        run: |
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $arguments = @(
            "modify"
            "--installPath `"$env:VSINSTALLPATH`""
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL"
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC"
            "--quiet"
            "--norestart"
            "--nocache"
          )
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          $exitCode = $process.ExitCode
          if ($exitCode -notin @(0, 3010)) {
            throw "Visual Studio component installation failed with exit code $exitCode."
          }
          $toolset = Get-ChildItem "$env:VSINSTALLPATH\VC\Tools\MSVC" -Directory |
            Where-Object Name -Like "14.44.*" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $toolset -or -not (Test-Path "$($toolset.FullName)\atlmfc\include\atlbase.h")) {
            throw "The v14.44 ATL/MFC headers were not installed."
          }
          Write-Host "Using ATL/MFC from $($toolset.FullName)."

      - name: Check actual composer style and constructor types
        shell: cmd
        run: |
          call "%VSDEVCMD%" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          python "%RUNNER_TEMP%\ayu-verify-compose-ayugram-offline-native-v3.py" --source "%BUILD_ROOT%\tdesktop" --compiler cl
          if errorlevel 1 exit /b 1

      - name: Test zero-write SQLite and WAL access before the heavy build
        shell: cmd
        run: |
          call "%VSDEVCMD%" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          python "%NATIVE_CHECK_ROOT%\compile_reader.py" "%BUILD_ROOT%\tdesktop"
          if errorlevel 1 exit /b 1

      - name: Prepare libraries and build AyuGram
        shell: cmd
        run: |
          python "%RUNNER_TEMP%\ayu-build-diagnostics-ayugram-offline-native-v3.py" "%RUNNER_TEMP%\ayu-main-build-ayugram-offline-native-v3.cmd" "%RUNNER_TEMP%\ayu-build-errors-ayugram-offline-native-v3.txt"

      - name: Verify the actual original Windows interface before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = "$env:GITHUB_WORKSPACE\output"
          $official = "$output\official.zip"
          $stage = "$output\official"
          $package = "$output\package"
          New-Item -ItemType Directory -Force -Path $output, $package | Out-Null
          Invoke-WebRequest -Uri $env:OFFICIAL_ZIP_URL -OutFile $official
          if ((Get-FileHash $official -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:OFFICIAL_ZIP_SHA256) { throw "Official dependency ZIP checksum mismatch" }
          Expand-Archive -Path $official -DestinationPath $stage
          Get-ChildItem -Path $stage -Filter *.dll -File -Recurse | ForEach-Object {
            $target = Join-Path $package ([IO.Path]::GetRelativePath($stage, $_.FullName))
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            Copy-Item -LiteralPath $_.FullName -Destination $target
          }
          $exe = "$package\AyuGram-Offline-ReadOnly.exe"
          Copy-Item "$env:BUILD_ROOT\tdesktop\out\Release\AyuGram.exe" $exe
          Copy-Item "$env:NATIVE_CHECK_ROOT\README-original.txt" "$package\README-使用说明.txt"
          foreach ($license in @("LICENSE", "LEGAL", "COPYING")) {
            $path = "$env:BUILD_ROOT\tdesktop\$license"
            if (Test-Path -LiteralPath $path -PathType Leaf) { Copy-Item -LiteralPath $path -Destination $package }
          }
          python "$env:NATIVE_CHECK_ROOT\smoke_original.py" $exe
          if ($LASTEXITCODE -ne 0) { throw "Actual original UI or zero-source-write verification failed; no executable package will be published." }
          $zip = "$output\AyuGram-Offline-ReadOnly-v3-Windows-x64.zip"
          Compress-Archive -Path "$package\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AyuGram-Offline-ReadOnly-v3-Windows-x64.zip" | Set-Content "$zip.sha256" -Encoding ascii

      - name: Upload the verified original-interface offline viewer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: AyuGram-Offline-ReadOnly-v3-Windows-x64
          path: |
            output/AyuGram-Offline-ReadOnly-v3-Windows-x64.zip
            output/AyuGram-Offline-ReadOnly-v3-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build error diagnostics
        if: failure() && !cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: AyuGram-build-errors-ayugram-offline-native-v3
          path: ${{ runner.temp }}/ayu-build-errors-ayugram-offline-native-v3.txt
          if-no-files-found: ignore
          retention-days: 7
