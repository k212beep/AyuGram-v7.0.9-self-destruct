          foreach ($check in $quickInputHistoryChecks) {
            if (-not (Select-String -Path "$env:BUILD_ROOT\tdesktop\$($check.File)" -SimpleMatch $check.Text -Quiet)) {
              throw "Three-text quick input source check failed: $($check.File) -> $($check.Text)"
            }
          }
          $databaseSchemaForValidation = Get-Content "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\ayu\data\ayu_database.cpp" -Raw
          $deletedPreviewIndexPosition = $databaseSchemaForValidation.IndexOf('make_index("idx_deleted_message_preview"')
          $deletedMessageTablePosition = $databaseSchemaForValidation.IndexOf('make_table<DeletedMessage>(')
          if ($deletedPreviewIndexPosition -lt 0 -or $deletedMessageTablePosition -lt 0 -or $deletedPreviewIndexPosition -ge $deletedMessageTablePosition) {
            throw "DeletedMessage preview index order would break a fresh database."
          }

          $loaderForAlbums = Get-Content "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\storage\localimageloader.cpp" -Raw
          $fingerprintStart = $loaderForAlbums.IndexOf("const auto reusableSend = reusableType")
          $fingerprintEnd = $loaderForAlbums.IndexOf("if (reusableSend)", $fingerprintStart)
          if ($fingerprintStart -lt 0 -or $fingerprintEnd -le $fingerprintStart) {
            throw "Could not isolate upload fingerprint eligibility."
          }
          $fingerprintEligibility = $loaderForAlbums.Substring($fingerprintStart, $fingerprintEnd - $fingerprintStart)
          if ($fingerprintEligibility.Contains("!_album")) {
            throw "Album photos are still excluded from fingerprint generation."
          }

