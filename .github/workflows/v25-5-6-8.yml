          v25-5-6-8 每小时后台复查群权限：
          默认启用，无需打开群窗口；每个已登录账号分别检查，覆盖普通会话列表与归档群聊。
          首次启用后约 15 秒开始检查，正常情况下每小时开始一轮，不同时运行两轮。
          重启后沿用上次记录的下一次检查时间；已到期时在启动约 15 秒后开始。
          先分页读取会话列表，再分批核对普通群、超级群及列表中保留的受限群，批次最多 50 个群。
          两个请求之间间隔 2 秒；网络超时或临时错误时延后 5 分钟重试。
          Telegram 返回 FLOOD_WAIT 时按服务器指定时间等待，并将等待期限按账号保存。
          复查成功后自动更新聊天列表现有的临时/永久禁言、临时/永久封禁和无法访问标识。
          已解除的限制按服务器返回自动更新；网络失败保持原状态，不将下载或连接问题误认为封禁。
          无法访问不代表已确定永久封禁；服务器未提供明确限制信息时沿用此标识。
          后台复查只读取群信息，不发送测试消息；单个群访问失败时拆分批次继续检查其余群。
