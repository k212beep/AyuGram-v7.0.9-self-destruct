          $ayuBuildMonitor = @'
          """Run the unchanged Windows build batch, retaining a bounded error report."""
          from collections import deque
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys
          
          ANSI = re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          ERROR = re.compile(r'\berror(?:\s+[A-Z]\d+\s*:|\s*:)|\bfatal\s+error\b', re.I)
          FAILED = re.compile(r'^\s*FAILED:')
          
          
          def escape_annotation(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          
          
          def run_build(command, report):
              report = Path(report)
              report.parent.mkdir(parents=True, exist_ok=True)
              report.write_text('Build started; detailed output is in the job log.\n', encoding='utf-8')
              tail = deque(maxlen=200)
              first_error = []
              remaining = 0
              annotations = []
              # Runtime credentials never belong in diagnostic artifacts or annotations.
              secrets = [value for key, value in os.environ.items()
                         if re.search(r'TOKEN|SECRET|PASSWORD|API_KEY', key, re.I) and len(value) >= 8]
          
              def redact(text):
                  for value in secrets:
                      text = text.replace(value, '***')
                  return ANSI.sub('', text)
          
              try:
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  for raw in iter(process.stdout.readline, b''):
                      # Keep live build progress and GitHub's ordinary masking behavior.
                      sys.stdout.buffer.write(raw)
                      sys.stdout.buffer.flush()
                      line = redact(raw.decode('utf-8', errors='replace').rstrip('\r\n'))[:4000]
                      is_error = bool(ERROR.search(line))
                      if not first_error and (is_error or FAILED.search(line)):
                          first_error = list(tail)[-8:] + [line]
                          remaining = 24
                      elif remaining:
                          first_error.append(line)
                          remaining -= 1
                      tail.append(line)
                      if is_error and line not in annotations and len(annotations) < 8:
                          annotations.append(line)
                  process.stdout.close()
                  code = process.wait()
              except OSError as error:
                  code = 1
                  first_error = [redact(str(error))]
                  tail.append(first_error[0])
                  print('::error title=AyuGram build launch error::' + escape_annotation(first_error[0]), flush=True)
              first = '\n'.join(first_error)[:64 * 1024]
              last = '\n'.join(tail)[-128 * 1024:]
              content = (f'Build exit code: {code}\n\n'
                         'First error and surrounding output:\n' + first + '\n\n'
                         'Last 200 build output lines:\n' + last + '\n')
              report.write_text(content, encoding='utf-8')
              if code:
                  for line in annotations:
                      print('::error title=AyuGram build error::' + escape_annotation(line[:1200]), flush=True)
              if code and not annotations:
                  print('::error title=AyuGram build failed::Build exited with code '
                        + str(code) + '; see the build-errors artifact.', flush=True)
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary and code:
                  with open(summary, 'a', encoding='utf-8') as stream:
                      stream.write('### AyuGram build failure\n\n')
                      stream.write(f'Exit code: `{code}`. The build-errors artifact contains the first error context and last 200 lines.\n\n')
                      if first_error:
                          stream.write('```text\n' + first[:12000].replace('```', "'''") + '\n```\n')
              return code if code >= 0 else 1
          
          
          def main():
              if len(sys.argv) != 3:
                  raise SystemExit('Expected the Windows batch path and diagnostic report path.')
              if os.name != 'nt':
                  raise SystemExit('The actual AyuGram build is restricted to the Windows CI runner.')
              batch = Path(sys.argv[1]).resolve()
              comspec = os.environ.get('COMSPEC', r'C:\Windows\System32\cmd.exe')
              # /s /c strips the outer pair, retaining quotes around a batch path with spaces.
              command = f'"{comspec}" /d /s /c ""{batch}""'
              raise SystemExit(run_build(command, Path(sys.argv[2])))
          
          
          if __name__ == '__main__':
              main()
          '@
          $ayuBuildMonitorPath = "$env:RUNNER_TEMP\ayu-build-diagnostics-v24-3-2-1.py"
          [IO.File]::WriteAllText($ayuBuildMonitorPath, $ayuBuildMonitor, [Text.UTF8Encoding]::new($false))

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw "Visual Studio C++ tools were not found."
          }
          $devcmd = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          "VSINSTALLPATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VSDEVCMD=$devcmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install ATL and MFC for the v14.44 toolset
        shell: pwsh
        run: |
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $arguments = @(
            "modify"
            "--installPath `"$env:VSINSTALLPATH`""
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL"
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC"
            "--quiet"
            "--norestart"
            "--nocache"
          )
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          $exitCode = $process.ExitCode
          if ($exitCode -notin @(0, 3010)) {
            throw "Visual Studio component installation failed with exit code $exitCode."
          }
          $toolset = Get-ChildItem "$env:VSINSTALLPATH\VC\Tools\MSVC" -Directory |
            Where-Object Name -Like "14.44.*" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $toolset -or -not (Test-Path "$($toolset.FullName)\atlmfc\include\atlbase.h")) {
            throw "The v14.44 ATL/MFC headers were not installed."
          }
          Write-Host "Using ATL/MFC from $($toolset.FullName)."

      - name: Prepare libraries and build AyuGram
        shell: cmd
        run: |
          python "%RUNNER_TEMP%\ayu-build-diagnostics-v24-3-2-1.py" "%RUNNER_TEMP%\ayu-main-build-v24-3-2-1.cmd" "%RUNNER_TEMP%\ayu-build-errors-v24-3-2-1.txt"

      - name: Create the portable ZIP
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\output"
          $official = "$output\official.zip"
          $package = "$output\package"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Invoke-WebRequest -Uri $env:OFFICIAL_ZIP_URL -OutFile $official
          $actual = (Get-FileHash $official -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:OFFICIAL_ZIP_SHA256) {
            throw "Official ZIP checksum mismatch: $actual"
          }
          Expand-Archive -Path $official -DestinationPath $package
          Copy-Item "$env:BUILD_ROOT\tdesktop\out\Release\AyuGram.exe" "$package\AyuGram.exe" -Force
          @"
          AyuGram v7.0.9 定制版（阅后即焚、永久保留与媒体秒发 v24-3-2-1）

          设置位置：AyuGram 设置 -> 阅后即焚与保留
          默认自毁时间：3 秒，可设置 1–60 秒。
          发送照片或视频时，发送窗口会显示“阅后即焚”复选框。
          改变复选框后可勾选“记住此选择”，下次会沿用，直到再次改变并记住。
          多个媒体会拆开逐个发送。定时发送、机器人、群组、频道、收藏夹和“作为文件”不受影响。
          照片的自毁时间会贯穿本地消息、上传和最终发送请求。阅后即焚照片不再默认显示马赛克；视频继续保持原来的遮罩显示。

          收到的私聊照片和视频会先自动下载到：
          tdata\AyuPermanentMedia\账号编号\聊天编号_用户名
          “下载完成后自动启动自毁”开启时，保存成功后自动启动倒计时；关闭时需右键手动启动。
          对方或服务器删除、阅后即焚以及重启软件后，文本、已下载照片和视频仍会重新显示。
          启动时先显示已保存的本地聊天记录，联网后再同步并按需载入；离线能看到部分记录属于正常行为。
          v24-3-2-1 消息保留：收到或载入消息、普通消息发送确认后，先将原消息快照写入本地数据库。
          对方删除消息或双向清空聊天时，保留原文、原编号、回复关系和已经下载的媒体。
          修复双清时最后一条被空占位消息覆盖，以及重启后同秒消息漏显示、排序或聊天摘要错误。
          重复发送同一视频会保留旧归档文件；媒体查找按账号、聊天和原编号隔离。
          兼容旧版已经保存的记录。升级前请退出软件并备份整个 tdata，保留原 tdata 使用。
          软件从未收到、未写入数据库的历史消息不能补救；媒体需要实际完成本地下载。
          我方阅后即焚照片和视频不写入永久缓存；对方读取后开始本机自毁倒计时，倒计时结束后显示标准的“照片/视频已自毁”提示。
          普通照片和视频首次成功上传后，会按账号持久保存本地 SHA-256 指纹到 Telegram 服务器媒体引用的映射；之后普通发送或阅后即焚发送同一文件都会跳过分块上传。
          相册媒体秒发：普通相册中每张照片/视频会生成独立指纹，并在发送成功后按对应 random_id 保存服务器媒体引用。之后单独重发其中任意一张，可命中媒体秒发缓存。相册自身的再次发送仍走原上传路径；编辑、定时、快捷回复和付费媒体仍排除。
          v19 已发送的相册不会自动补建指纹映射，升级后请先向收藏夹再发送一次相册。
          每次加载历史片段都会按服务器范围重新核对，并按原消息编号稳定排序，避免重复、漏恢复和同秒消息顺序混乱。
          删除到达但媒体尚未落盘时会继续后台下载；清空已删除消息也会清理尚未显示的恢复项。
          使用 AyuGram 菜单中的“清空已删除消息”，会同时删除对应记录和文件。
          群组默认不保存；在目标群聊右上角菜单选择 AyuGram → 永久保存此群，可单独启用普通群或超级群。频道和机器人仍不处理；长期使用会占用磁盘空间。

          群组内存缓存：AyuGram 设置 -> 阅后即焚与保留 -> 一键清理所有群组内存缓存。
          处理所有已登录账号中的已加载普通群和超级群，跳过私聊、频道及已启用永久保存的群组。
          清理聊天视图、历史消息对象和历史索引缓存，保留发送/下载任务、通知、置顶消息、草稿引用及必要的聊天列表摘要。
          不调用服务器删除接口，不删除手工下载的文件、磁盘媒体缓存或永久保存目录。再次进入群聊会按需重新加载。
          清理的是群组可释放的内存缓存，不能保证消除其他模块的内存增长，也不能保证任务管理器数值立即回落。

          私聊录屏：点击私聊顶部搜索按钮旁的眼睛图标，可一键隐藏/恢复自己的消息。
          隐藏时，我方消息内容（包括媒体）显示为不含原文的马赛克；聊天内已解析的我方消息引用也会被遮住。
          每个对话独立开关，同一对话的多个窗口同步；新发送和重新加载的消息自动遵循该开关。重启后默认恢复显示。
          此功能只改变聊天内消息的显示，不改变发送内容。输入框草稿、左侧聊天摘要、通知、导出和独立媒体查看器不属于遮罩范围。

          v24-3-2-1 运行修复：归档消息按原编号批量标记已读，纯本地记录不向服务器发送本地编号。
          归档校对按账号和聊天隔离，其他聊天的新消息不会反复触发当前归档的整段读取。
          已确认删除的记录不重复标记，校对结果使用完成后的变更编号；聊天摘要查询增加索引。
          保留 v24 消息保存、双清末条保护、媒体保存，以及以下消息遮罩功能。

          v24-3-2-1 选中消息遮罩：
          选中一条或多条消息，在顶部“转发 / 删除 / SHOT”旁点击“遮罩”。
          我方、对方以及混合选中的消息均可遮罩，文本和媒体一起隐藏；相册中单独选中的媒体可以单独遮罩。
          选中的消息全部已遮罩时，按钮显示“取消遮罩”，点击恢复；混合选中时点击“遮罩”会统一遮住。
          聊天内已经解析的被遮罩消息引用也会遮住，遮罩区域不会因鼠标悬停或点击而打开内容。
          滚动重新加载、切换对话和同一账号的多个窗口共享遮罩状态；发送确认后消息编号变化也会保留遮罩。
          支持主聊天、评论/回复、置顶消息和定时消息的选中操作栏。
          遮罩用于当前录屏过程，重启软件后恢复显示。
          顶部眼睛图标的“隐藏我方发言”和单条遮罩分别生效；开启全体我方隐藏时，取消单条遮罩后仍需关闭眼睛开关才能显示我方消息。
          只改变聊天中的显示，发送、转发、消息原文和媒体文件保持原样。通知、左侧聊天摘要、导出及独立媒体查看器不属于遮罩范围。

          v24-3-2-1 新增和优化：
          1. 双清恢复消息遮罩：重启后恢复到聊天内的双清消息，右键菜单可选择消息；也支持与普通消息混合选择。
          选中后点击顶部“遮罩”，再次点击“取消遮罩”恢复；我方和对方、文字和图片/视频均可使用。
          恢复消息按原始消息 ID 遮罩；不会把本地恢复消息的编号提交到服务器转发、删除或举报。
          遮罩继续只在当前运行期间生效，重启后恢复显示。

          2. 群组备注：群组右键菜单或聊天右上角菜单 → AyuGram → 设置群组备注（仅自己可见）。
          设置后在聊天列表、聊天顶部、资料页和搜索结果显示；可以用原群名或备注搜索本地聊天。
          选择“清除群组备注”可恢复原群名；备注在重启后保留，按账号和群组分别保存。
          备注仅用于本机显示，不修改服务器群名，也不要求管理员权限。

          3. 群聊快捷输入：让输入框为空，按方向键 ↑，调出本账号在该群组上一条发送过的文本。
          文本可包含多行、中文、表情和媒体说明文字；可以修改，确认后自行发送，不会自动发送或进入编辑旧消息模式。
          私聊、频道、非空输入框、正在编辑消息、按组合键或中文输入法选词时保留原有行为。
          同一个群组的回复/话题输入框也可使用；按群组保存，不按单个话题分别保存。
          已在此版本确认发送的最近文本会保存到本地，重启后也可调出；升级前的记录会从加载的聊天或双清保存记录补全。
          无本地记录时，首次按 ↑ 会联网查询本账号在该群最近的文本；没有发言或查询失败时输入框保持为空，可以稍后重试。
          查询期间切换群组、输入或清空草稿、改变输入焦点后，旧查询结果不会覆盖当前输入框。

          v24-3-2-1 视频设置模板（以已成功运行的 v24-3-1 为基础）：
          设置 → AyuGram Preferences → 视频设置模板 → 一键应用视频设置。
          新登录的账号默认自动应用；已登录账号由此按钮应用。可关闭“新账号首次登录自动应用”。
          已应用的云端步骤会记录状态；软件重启后不会反复覆盖你后续调整的设置。
          无网络时继续正常使用软件，待网络恢复自动继续未完成的步骤。
          不同账号独立记录进度；本机设置由同一 tdata 目录中的账号共享，云端设置只用于当前账号。

          通知：启用桌面通知关、任务栏闪烁开、声音开、音量 100%；私聊通知开，群组/频道/回应通知关。
          联系人加入事件和置顶事件通知开；允许本设备接收通话开。
          未读：不包含已关闭通知的对话；文件夹未读包含静音聊天；按消息数量统计。
          原生 Windows 通知关、遵循专注模式关；通知位于右下角，数量 3。
          隐私：手机号和最后上线时间为任何人不可见，生日为仅联系人；头像、转发、通话、语音、礼物、简介、保存音乐和群组邀请为所有人。
          新消息接受所有人，常用联系人推荐关，默认自动删除关，账号保留 18 个月（548 天）。
          聊天：自动夜间模式关、字体默认、聊天列表快捷操作为更改文件夹。
          大号 Emoji、自动替换、替换建议、贴纸推荐、动画贴纸循环均关。
          Enter 发送、双击回复；回复按钮、回应按钮、滑动到下一未读频道均开。
          分组：左侧标签、默认标签外观、关闭文件夹标签。
          下载：仅私聊自动下载；群组和频道关，下载前询问目录关。私聊已有下载类别/大小限制继续沿用；原先全部关闭的私聊恢复原程序默认值。
          窗口：显示聊天名称和总未读；系统框架、托盘、最小化到任务栏、自启动、发送到菜单均关；显示任务栏图标。
          性能：硬件视频解码关、ANGLE 自动；系统拼写检查开；所有动画关。
          语言使用视频中的“简体中文 (@zh_CN)”包（classic-zh-cn），界面缩放采用系统默认。
          敏感内容过滤按视频关闭；服务器不允许调整或要求账号验证时，保留现状并显示未应用提示。
          需要会员的选项等若被服务器拒绝，会列出受限项；获得权限后可再次一键应用。

          视频未展开的子选项、下载目录、现有文件夹成员和每个账号的通知/隐私例外沿用原值。
          密码、通行密钥、登录邮箱、个人资料、设备和屏蔽列表由各账号自行保留。
          部分界面选项在正常重启后生效；应用模板不会主动重启程序。
          ↑ 快捷输入本版继续保存上一条，三条去重功能留待下一步。

          本程序没有官方数字签名。首次启动时 Windows 可能显示安全提示。
          "@ | Set-Content -Path "$package\使用说明.txt" -Encoding utf8
          $zip = "$output\AyuGram-v7.0.9-self-destruct-persistence-reuse-v24-3-2-1.zip"
          Compress-Archive -Path "$package\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AyuGram-v7.0.9-self-destruct-persistence-reuse-v24-3-2-1.zip" | Set-Content "$zip.sha256" -Encoding ascii

