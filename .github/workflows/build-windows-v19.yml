          '@
          [IO.File]::WriteAllBytes($patch, [Convert]::FromBase64String(($patchBase64 -replace '\s', '')))
          $patchHash = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne $env:PATCH_SHA256) {
            throw "Embedded patch checksum mismatch: $patchHash"
          }
          git -C "$env:BUILD_ROOT\tdesktop" apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch application or whitespace validation failed." }
          git -C "$env:BUILD_ROOT\tdesktop" apply $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch application or whitespace validation failed." }

          git -C "$env:BUILD_ROOT\tdesktop" diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patch application or whitespace validation failed." }

          $v19Checks = @(
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "SerializeMtp<MTPInputPhoto>(input)" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "SerializeMtp<MTPInputDocument>(input)" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "DeserializeUploadReference<MTPInputPhoto>" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "DeserializeUploadReference<MTPInputDocument>" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "binding.vrandom_id().v" }
            @{ File = "Telegram\SourceFiles\apiwrap.cpp"; Text = "_session->uploader().upload(localId, file);" }
            @{ File = "Telegram\SourceFiles\apiwrap.cpp"; Text = "recover && recover(error)" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = "void HistoryItem::markAyuMediaExpired(bool video)" }
            @{ File = "Telegram\SourceFiles\history\history.cpp"; Text = "AyuMessages::restoreExpiredMediaNotice(result);" }
            @{ File = "Telegram\SourceFiles\ayu\ayu_settings.cpp"; Text = "hiddenExpiredMediaDialogs" }
            @{ File = "Telegram\SourceFiles\ayu\utils\telegram_helpers.cpp"; Text = "hideExpiredMediaNotices" }
            @{ File = "Telegram\SourceFiles\ayu\ui\context_menu\context_menu.cpp"; Text = "ayu_HideExpiredMediaNotices" }
          )
          foreach ($check in $v19Checks) {
            if (-not (Select-String -Path "$env:BUILD_ROOT\tdesktop\$($check.File)" -SimpleMatch $check.Text -Quiet)) {
              throw "v19 source check failed: $($check.File) -> $($check.Text)"
            }
          }
          $reuseStorage = Get-Content "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\ayu\data\messages_storage.cpp" -Raw
          if ($reuseStorage.Contains(".inputSerialized = SerializeMtp(input)")) {
            throw "Upload references are still serialized without their constructor identifiers."
          }

          $requiredFiles = @(
            "Telegram\SourceFiles\ayu\ui\settings\settings_self_destruct.cpp"
            "Telegram\SourceFiles\ayu\ui\settings\settings_self_destruct.h"
          )
          foreach ($relative in $requiredFiles) {
            if (-not (Test-Path "$env:BUILD_ROOT\tdesktop\$relative")) {
              throw "Required patched file is missing: $relative"
            }
          }
          $sourceChecks = @(
            @{ File = "Telegram\SourceFiles\boxes\send_files_box.cpp"; Text = "ayu_SendSelfDestructMedia" }
            @{ File = "Telegram\SourceFiles\apiwrap.cpp"; Text = "action.options.ttlSeconds > 0" }
            @{ File = "Telegram\SourceFiles\api\api_sending.cpp"; Text = "f_ttl_seconds" }
            @{ File = "Telegram\SourceFiles\api\api_sending.cpp"; Text = "MessageFlag::MediaIsUnread" }
            @{ File = "Telegram\SourceFiles\api\api_media.cpp"; Text = "MTP_inputMediaUploadedDocument" }
            @{ File = "Telegram\SourceFiles\api\api_media.cpp"; Text = "MTP_inputMediaUploadedPhoto" }
            @{ File = "Telegram\SourceFiles\data\data_media_types.cpp"; Text = "crl::time MediaPhoto::ttlSeconds() const" }
            @{ File = "Telegram\SourceFiles\data\data_media_types.h"; Text = "crl::time _ttlSeconds = 0" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "requestManualSelfDestruct" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "PendingSelfDestructRequests" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "changeDeletedMessageId" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "MTP_messageMediaEmpty" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "IsExpiredMediaPlaceholder" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "LoadedServerRange" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "LoadedRangeCovers" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "history->minMsgId()" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "history->maxMsgId()" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "isOutgoingSelfDestructingMedia" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "existing->destroy();" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "injected->destroy();" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "message.mediaPath.empty()" }
            @{ File = "Telegram\SourceFiles\ayu\ui\context_menu\context_menu.cpp"; Text = "history->clientSideMessages()" }
            @{ File = "Telegram\SourceFiles\ayu\utils\telegram_helpers.cpp"; Text = "isOutgoingSelfDestructingMedia" }
            @{ File = "Telegram\SourceFiles\ayu\data\ayu_database.cpp"; Text = "make_table<AyuUploadReuse>" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "reusableUploadMedia" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "rememberReusableUpload" }
            @{ File = "Telegram\SourceFiles\api\api_sending.cpp"; Text = "preparePermanentMedia(localItem)" }
            @{ File = "Telegram\SourceFiles\api\api_sending.cpp"; Text = "sendAyuReusableMedia" }
            @{ File = "Telegram\SourceFiles\api\api_updates.cpp"; Text = "AyuMessages::expireOutgoingMedia(item);" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "ttlSeconds > 0 ? Flag::f_ttl_seconds" }
            @{ File = "Telegram\SourceFiles\ayu\ayu_settings.cpp"; Text = "persistentGroupKeys" }
            @{ File = "Telegram\SourceFiles\ayu\ui\context_menu\context_menu.cpp"; Text = "ayu_EnableGroupPersistence" }
            @{ File = "Telegram\SourceFiles\history\history.cpp"; Text = "AyuMessages::reinjectPermanentMedia(this);" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = "AyuMessages::messageIdChanged" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = "media.vttl_seconds().value_or_empty()" }
          )
          foreach ($check in $sourceChecks) {
            $file = "$env:BUILD_ROOT\tdesktop\$($check.File)"
            if (-not (Select-String -Path $file -SimpleMatch $check.Text -Quiet)) {
              throw "Patched source validation failed: $($check.File) -> $($check.Text)"
            }
          }
          $forbiddenChecks = @(
            @{ File = "Telegram\SourceFiles\apiwrap.cpp"; Text = "outgoingSelfDestructByDefault" }
            @{ File = "Telegram\SourceFiles\api\api_sending.cpp"; Text = "outgoingSelfDestructByDefault" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "5000" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "if (history->owner().message(peer, serverId))" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "outgoingToPersist" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "view->data()->id" }
            @{ File = "Telegram\SourceFiles\history\history.h"; Text = "_ayuDeletedMessagesReinjected" }
          )
          foreach ($check in $forbiddenChecks) {
            $file = "$env:BUILD_ROOT\tdesktop\$($check.File)"
            if (Select-String -Path $file -SimpleMatch $check.Text -Quiet) {
              throw "Forbidden stale source logic found: $($check.File) -> $($check.Text)"
            }
          }

          # A document/video class in this old source legitimately keeps the
          # same diagnostic text. Restrict this regression check to the photo
          # method whose old TTL rejection caused photos to be sent normally.
          $mediaTypesPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\data\data_media_types.cpp"
          $mediaTypesSource = Get-Content $mediaTypesPath -Raw
          $photoUpdateStart = $mediaTypesSource.IndexOf(
            "bool MediaPhoto::updateSentMedia")
          if ($photoUpdateStart -lt 0) {
            throw "Could not find MediaPhoto::updateSentMedia for validation."
          }
          $mediaFileStart = $mediaTypesSource.IndexOf(
            "MediaFile::MediaFile",
            $photoUpdateStart)
          if ($mediaFileStart -le $photoUpdateStart) {
            throw "Could not isolate MediaPhoto::updateSentMedia for validation."
          }
          $photoUpdateRegion = $mediaTypesSource.Substring(
            $photoUpdateStart,
            $mediaFileStart - $photoUpdateStart)
          $photoRejectsTtl = $photoUpdateRegion.Contains("mediaPhoto.vttl_seconds()") -or $photoUpdateRegion.Contains("or with ttl_seconds in updateSentMedia()")
          if ($photoRejectsTtl) {
            throw "MediaPhoto still rejects a valid TTL server response."
          }

          # The durable record must be committed before Telegram is asked to
          # start the countdown, otherwise a quick close can lose the record.
          $storagePath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\ayu\data\messages_storage.cpp"
          $storageSource = Get-Content $storagePath -Raw
          $archiveStart = $storageSource.IndexOf("void archivePermanentMedia")
          if ($archiveStart -lt 0) {
            throw "Could not find archivePermanentMedia for validation."
          }
          $prepareStart = $storageSource.IndexOf(
            "void preparePermanentMedia",
            $archiveStart)
          if ($prepareStart -le $archiveStart) {
            throw "Could not isolate archivePermanentMedia for validation."
          }
          $archiveRegion = $storageSource.Substring(
            $archiveStart,
            $prepareStart - $archiveStart)
          $databaseWrite = $archiveRegion.IndexOf(
            "AyuDatabase::addDeletedMessage(message);")
          $startCountdown = $archiveRegion.IndexOf(
            "StartSelfDestructAfterArchive(item, manuallyRequested);")
          $invalidArchiveOrder = ($databaseWrite -lt 0) -or ($startCountdown -lt 0) -or ($databaseWrite -ge $startCountdown)
          if ($invalidArchiveOrder) {
            throw "Permanent record is not written before self-destruct starts."
          }

          # Restart recovery must be repeatable and must reconcile only IDs
          # covered by the currently loaded server history range.
          $reinjectStart = $storageSource.IndexOf(
            "void reinjectPermanentMedia")
          $removeStart = $storageSource.IndexOf(
            "void removeDeletedMessage",
            $reinjectStart)
          if ($reinjectStart -lt 0 -or $removeStart -le $reinjectStart) {
            throw "Could not isolate reinjectPermanentMedia for validation."
          }
          $reinjectRegion = $storageSource.Substring(
            $reinjectStart,
            $removeStart - $reinjectStart)
          $rangeStart = $storageSource.IndexOf(
            "LoadedServerRange ComputeLoadedServerRange")
          $rangeEnd = $storageSource.IndexOf(
            "bool LoadedRangeCovers",
            $rangeStart)
          if ($rangeStart -lt 0 -or $rangeEnd -le $rangeStart) {
            throw "Could not isolate ComputeLoadedServerRange for validation."
          }
          $rangeRegion = $storageSource.Substring(
            $rangeStart,
            $rangeEnd - $rangeStart)
          if ($rangeRegion.Contains("view->data()") -or -not $rangeRegion.Contains("history->minMsgId()") -or -not $rangeRegion.Contains("history->maxMsgId()")) {
            throw "Loaded history range still depends on the incomplete view element type."
          }
          foreach ($required in @(
            "ComputeLoadedServerRange(history)"
            "LoadedRangeCovers(history, range, serverId)"
            "injected->destroy();"
            "existing->destroy();"
          )) {
            if (-not $reinjectRegion.Contains($required)) {
              throw "Restart reconciliation is incomplete: $required"
            }
          }

          $historyPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\history\history.cpp"
          $historySource = Get-Content $historyPath -Raw
          $checkLocalStart = $historySource.IndexOf(
            "void History::checkLocalMessages")
          $checkLocalEnd = $historySource.IndexOf(
            "HistoryItem *History::joinedMessageInstance",
            $checkLocalStart)
          if ($checkLocalStart -lt 0 -or $checkLocalEnd -le $checkLocalStart) {
            throw "Could not isolate History::checkLocalMessages."
          }
          $checkLocalRegion = $historySource.Substring(
            $checkLocalStart,
            $checkLocalEnd - $checkLocalStart)
          $boundaryPosition = $checkLocalRegion.IndexOf("const auto firstDate")
          $reinjectPosition = $checkLocalRegion.IndexOf(
            "AyuMessages::reinjectPermanentMedia(this);")
          $invalidHistoryOrder = ($boundaryPosition -lt 0) -or ($reinjectPosition -lt 0) -or ($boundaryPosition -ge $reinjectPosition)
          if ($invalidHistoryOrder) {
            throw "History boundaries are not preserved before reconciliation."
          }

          # TTL photos must keep their TTL without being converted into a
          # spoiler. Videos retain their existing protected rendering path.
          $historyItemPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\history\history_item.cpp"
          $historyItemSource = Get-Content $historyItemPath -Raw
          $photoMediaStart = $historyItemSource.IndexOf(
            "const MTPDmessageMediaPhoto &media")
          $documentMediaStart = $historyItemSource.IndexOf(
            "const MTPDmessageMediaDocument &media",
            $photoMediaStart)
          if ($photoMediaStart -lt 0 -or $documentMediaStart -le $photoMediaStart) {
            throw "Could not isolate the photo media creation path."
          }
          $photoMediaRegion = $historyItemSource.Substring(
            $photoMediaStart,
            $documentMediaStart - $photoMediaStart)
          $photoForcesSpoiler = $photoMediaRegion.Contains(
            "media.vttl_seconds().has_value()")
          if ($photoForcesSpoiler -or -not $photoMediaRegion.Contains("media.is_spoiler()")) {
            throw "TTL photos are still forced behind a spoiler."
          }

          # Peer opening replaces outgoing media with a retained notice, without a local timer.
          $updatesPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\api\api_updates.cpp"
          $updatesSource = Get-Content $updatesPath -Raw
          $readCasePosition = $updatesSource.IndexOf("case mtpc_updateReadMessagesContents")
          $peerReadPosition = $updatesSource.IndexOf("if (AyuMessages::isOutgoingSelfDestructingMedia(item))", $readCasePosition)
          $unreadMediaPosition = $updatesSource.IndexOf("if (item->isUnreadMedia()", $peerReadPosition)
          if ($readCasePosition -lt 0 -or $peerReadPosition -lt 0 -or $unreadMediaPosition -le $peerReadPosition) {
            throw "Could not isolate the outgoing media read handler."
          }
          $peerReadRegion = $updatesSource.Substring($peerReadPosition, $unreadMediaPosition - $peerReadPosition)
          if (-not $peerReadRegion.Contains("AyuMessages::expireOutgoingMedia(item);") -or $peerReadRegion.Contains("item->destroy();") -or $peerReadRegion.Contains("item->markMediaAndMentionRead();")) {
            throw "Outgoing media read must retain a notice without a local countdown."
          }

          $loaderPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\storage\localimageloader.cpp"
          $loaderSource = Get-Content $loaderPath -Raw
          foreach ($required in @(
            "QCryptographicHash::Sha256"
            "ayuReuseFingerprint = hash.result().toHex()"
            "(!_album || _type == SendMediaType::Photo)"
            "!_result->to.replaceMediaOf"
          )) {
            if (-not $loaderSource.Contains($required)) {
              throw "Upload fingerprint validation failed: $required"
            }
          }
          if ($loaderSource.Contains("&& !_result->to.options.ttlSeconds")) {
            throw "TTL media is still excluded from fingerprint generation."
          }

          $sendingPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\api\api_sending.cpp"
          $sendingSource = Get-Content $sendingPath -Raw
          $reuseLookupPosition = $sendingSource.IndexOf(
            "AyuMessages::reusableUploadMedia")
          $reusePreparePosition = $sendingSource.IndexOf(
            "prepareLocalMedia(file, false)",
            $reuseLookupPosition)
          $reuseSendPosition = $sendingSource.IndexOf(
            "sendAyuReusableMedia",
            $reusePreparePosition)
          if ($reuseLookupPosition -lt 0 -or $reusePreparePosition -lt 0 -or $reuseSendPosition -lt 0) {
            throw "Server-media reuse is not connected to the confirmed-file send path."
          }

          $databasePath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\ayu\data\ayu_database.cpp"
          $databaseSource = Get-Content $databasePath -Raw
          if (-not $databaseSource.Contains("make_table<AyuUploadReuse>") -or -not $databaseSource.Contains("storage.replace(entry)")) {
            throw "Persistent upload-reuse table is missing."
          }

          $uploadPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\storage\file_upload.cpp"
          $uploadSource = Get-Content $uploadPath -Raw
          if (-not $uploadSource.Contains(".ayuReuseFingerprint = entry.file->ayuReuseFingerprint")) {
            throw "The successful-upload fingerprint is not propagated."
          }

          if (-not $historySource.Contains("beforeOrderId <= originalId")) {
            throw "Restored messages do not use stable same-second ordering."
          }

          $v20Checks = @(
            @{ File = "Telegram\SourceFiles\ayu\data\entities.h"; Text = "int readState = -1;" }
            @{ File = "Telegram\SourceFiles\ayu\data\ayu_database.cpp"; Text = "default_value(-1)" }
            @{ File = "Telegram\SourceFiles\ayu\data\ayu_database.cpp"; Text = "c(column<DeletedMessage>(&DeletedMessage::readState)) = 1" }
            @{ File = "Telegram\SourceFiles\ayu\data\ayu_database.cpp"; Text = "existing.front().readState == 1" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = "bool keepDeleted)" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = "processMessageDelete(this);" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = "applyEditionToHistoryCleared(false);" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = "_ayuDeletedReadState == 1" }
            @{ File = "Telegram\SourceFiles\history\history.cpp"; Text = "AyuMessages::markDeletedMessagesRead(this, outboxReadTillId(), true);" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "item->setAyuDeletedReadState(message.readState);" }
            @{ File = "Telegram\SourceFiles\ayu\ui\message_history\history_item.cpp"; Text = "item->setAyuDeletedReadState(message.readState);" }
            @{ File = "Telegram\SourceFiles\apiwrap.cpp"; Text = "uploadAlbumMedia(item, groupId, media, fingerprint);" }
            @{ File = "Telegram\SourceFiles\apiwrap.cpp"; Text = "AyuMessages::rememberReusableUploadMedia(_session, result, fingerprint);" }
            @{ File = "Telegram\SourceFiles\data\data_histories.cpp"; Text = "int Histories::unloadAyuGroupCaches()" }
            @{ File = "Telegram\SourceFiles\history\history.cpp"; Text = "bool History::unloadAyuGroupCache()" }
            @{ File = "Telegram\SourceFiles\data\data_session.cpp"; Text = "void Session::unloadAyuMediaCache(" }
            @{ File = "Telegram\SourceFiles\ayu\ui\settings\settings_self_destruct.cpp"; Text = "ayu_ClearGroupMemoryCache" }
            @{ File = "Telegram\SourceFiles\ayu\ui\settings\settings_self_destruct.cpp"; Text = "QString::number(count)" }
            @{ File = "Telegram\SourceFiles\ayu\ui\settings\settings_self_destruct.cpp"; Text = "lt_groups" }
            @{ File = "Telegram\Resources\langs\lang.strings"; Text = "{groups}" }
          )
          foreach ($check in $v20Checks) {
            if (-not (Select-String -Path "$env:BUILD_ROOT\tdesktop\$($check.File)" -SimpleMatch $check.Text -Quiet)) {
              throw "v20 source check failed: $($check.File) -> $($check.Text)"
            }
          }

          $prepareSource = Get-Content "$env:BUILD_ROOT\tdesktop\Telegram\build\prepare\prepare.py" -Raw
          foreach ($required in @(
            "ThirdParty\\msys64\\ucrt64\\bin"
            "mingw-w64-ucrt-x86_64-diffutils"
            "mingw-w64-ucrt-x86_64-gperf"
            "mingw-w64-ucrt-x86_64-nasm"
            "mingw-w64-ucrt-x86_64-perl"
            "mingw-w64-ucrt-x86_64-pkgconf"
            "ucrt64\\bin\\diff.exe --version"
            "ucrt64\\bin\\gperf.exe --version"
            "ucrt64\\bin\\nasm.exe -v"
            "ucrt64\\bin\\perl.exe -v"
            "ucrt64\\bin\\pkgconf.exe --version"
          )) {
            if (-not $prepareSource.Contains($required)) {
              throw "MSYS2 dependency fix is incomplete: $required"
            }
          }
          if ($prepareSource.Contains("mingw-w64-x86_64-") -or $prepareSource.Contains("msys64\\mingw64\\bin")) {
            throw "The dependency recipe still uses obsolete MINGW64 tool packages or paths."
          }
          Write-Host "MSYS2 UCRT64 packages and tool paths validated."

          $fingerprintStart = $loaderSource.IndexOf("const auto reusableSend = reusableType")
          $fingerprintEnd = $loaderSource.IndexOf("_result->filename = filename;", $fingerprintStart)
          if ($fingerprintStart -lt 0 -or $fingerprintEnd -le $fingerprintStart) {
            throw "Could not isolate upload fingerprint generation."
          }
          $fingerprintRegion = $loaderSource.Substring($fingerprintStart, $fingerprintEnd - $fingerprintStart)
          if ($fingerprintRegion.Contains("&& !_album")) {
            throw "Album photos are still excluded from upload fingerprint generation."
          }

          $groupCacheStart = $historySource.IndexOf("bool History::unloadAyuGroupCache()")
          $groupCacheEnd = $historySource.IndexOf("void History::clearUpTill", $groupCacheStart)
          if ($groupCacheStart -lt 0 -or $groupCacheEnd -le $groupCacheStart) {
            throw "Could not isolate group cache cleanup."
          }
          $groupCacheRegion = $historySource.Substring($groupCacheStart, $groupCacheEnd - $groupCacheStart)
          foreach ($required in @(
            "AyuMessages::isGroupPersistenceEnabled(peer)"
            "item->isSending()"
            "document && document->loading()"
            "clear(ClearType::Unload)"
            "owner().notifyItemsAboutToBeDestroyed(remove)"
            "owner().unloadAyuMediaCache(photos, documents)"
          )) {
            if (-not $groupCacheRegion.Contains($required)) {
              throw "Group cache protection is incomplete: $required"
            }
          }
          if ($groupCacheRegion.Contains("ClearType::DeleteChat") -or $groupCacheRegion.Contains("ClearType::ClearHistory") -or $groupCacheRegion.Contains("QFile::remove")) {
            throw "Group cache cleanup must only unload local memory."
          }

          # Ninja uses per-source language-key subsets. AyuGram's pinned
          # code generator scans lng_* keys only, so teach it about ayu_* too.
          $langPatch = "$env:RUNNER_TEMP\ninja-lang-subsets-ayu.patch"
          $langPatchBase64 = @'
