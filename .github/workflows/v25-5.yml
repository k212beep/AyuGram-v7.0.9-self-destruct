# 使用方法：保存为 .github/workflows/v25-5.yml，提交到 main 后自动构建，也可手动 Run workflow。
# 基于成功编译的 v25-2-1，合入 v25-1-1（1）的下载超时恢复与一键取消遮罩。
# 保留群聊导出、跨账号导入筛选、私人邀请链接补充及基线原有功能。
# 沿用 Breakpad 原站重试、官方 GitHub 镜像和完整固定提交校验，提前准备构建依赖。
# 内嵌完整源码补丁；针对性验证通过，完整 Windows 编译由本工作流执行。
name: Build AyuGram v7.0.9 groups, download recovery and unmask v25-5

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v25-5.yml

permissions:
  contents: read

concurrency:
  group: ayugram-v7.0.9-self-destruct-v25-5
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: https://github.com/AyuGram/AyuGramDesktop.git
  SOURCE_TAG: v7.0.9
  SOURCE_SHA: 032ad328549cff9f612d106d8660fbc03eb43130
  OFFICIAL_ZIP_URL: https://github.com/AyuGram/AyuGramDesktop/releases/download/v7.0.9/AyuGram.zip
  OFFICIAL_ZIP_SHA256: 5360e93f71a5acb4938ade03872dc7ce556c41853d63c0144f26ddbda74768c3
  PATCH_SHA256: 60f705ccec62352af45cf87800d5957d1109815364b70e06eab149d4a7e83429

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout build recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate PowerShell syntax before downloading dependencies
        shell: pwsh
        run: |
          $recipe = Get-Content "$env:GITHUB_WORKSPACE\.github\workflows\v25-5.yml" -Raw
          $blocks = [regex]::Matches($recipe, '(?m)^        shell: pwsh\r?\n        run: \|\r?\n((?:^          .*\r?\n|^\r?\n)+)')
          if ($blocks.Count -eq 0) { throw "No workflow scripts were found." }
          foreach ($block in $blocks) {
            $script = $block.Groups[1].Value -replace '(?m)^          ', ''
            $parsedTokens = $null
            $syntaxErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$parsedTokens, [ref]$syntaxErrors)
            if ($syntaxErrors.Count -gt 0) {
              $syntaxErrors | ForEach-Object { Write-Host $_.Message }
              throw "A workflow PowerShell script did not parse."
            }
          }
          Write-Host "All $($blocks.Count) PowerShell scripts parsed successfully."

      - name: Select a drive with enough free space
        shell: pwsh
        run: |
          $minimum = 45GB
          $selected = $null
          foreach ($name in @("D", "C")) {
            $drive = Get-PSDrive -Name $name -ErrorAction SilentlyContinue
            if ($drive -and $drive.Free -ge $minimum) {
              $selected = $drive
              break
            }
          }
          if (-not $selected) {
            Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
            throw "The runner has less than 45 GB free. Retry the workflow later."
          }
          $root = "$($selected.Name):\AyuBuild"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          "BUILD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $root with $([math]::Round($selected.Free / 1GB, 1)) GB free."

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Clone the fixed source and apply the patch
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $sourceCheckout = @'
          import os
          from pathlib import Path
          import subprocess
          import time
          
          
          MAX_ATTEMPTS = 5
          NETWORK_TIMEOUT_SECONDS = 900
          RETRY_DELAYS = (5, 10, 20, 30)
          
          
          def run_git(arguments, *, network=False, capture_output=False):
              command = ["git", "-c", "http.version=HTTP/1.1"]
              command.extend(arguments)
              environment = dict(os.environ, GIT_TERMINAL_PROMPT="0")
              attempts = MAX_ATTEMPTS if network else 1
              for attempt in range(1, attempts + 1):
                  print(f"Git attempt {attempt}/{attempts}: {' '.join(arguments)}", flush=True)
                  try:
                      result = subprocess.run(
                          command,
                          env=environment,
                          text=True,
                          capture_output=capture_output,
                          timeout=NETWORK_TIMEOUT_SECONDS if network else 180,
                      )
                  except subprocess.TimeoutExpired:
                      failure = "download timed out"
                  else:
                      if result.returncode == 0:
                          return result
                      failure = f"exit code {result.returncode}"
                  if attempt == attempts:
                      raise RuntimeError(
                          f"Git command failed after {attempts} attempt(s): {failure}: "
                          + " ".join(arguments)
                      )
                  delay = RETRY_DELAYS[attempt - 1]
                  print(f"Git download interrupted ({failure}); retrying in {delay}s.", flush=True)
                  time.sleep(delay)
          
          
          def main():
              source = Path(os.environ["BUILD_ROOT"]) / "tdesktop"
              repository = os.environ["SOURCE_REPOSITORY"]
              tag = os.environ["SOURCE_TAG"]
              expected = os.environ["SOURCE_SHA"]
              source.mkdir(parents=True, exist_ok=True)
              run_git(["init", str(source)])
              prefix = ["-C", str(source)]
              run_git(prefix + ["config", "core.longpaths", "true"])
              run_git(prefix + ["config", "remote.origin.url", repository])
              tag_ref = f"refs/tags/{tag}"
              run_git(
                  prefix + ["fetch", "--depth", "1", "origin", f"{tag_ref}:{tag_ref}"],
                  network=True,
              )
              actual = run_git(
                  prefix + ["rev-parse", tag_ref + "^{commit}"], capture_output=True
              ).stdout.strip()
              if actual != expected:
                  raise RuntimeError(f"Unexpected source commit: {actual}; expected {expected}")
              run_git(prefix + ["checkout", "--detach", actual])
              run_git(prefix + ["submodule", "sync", "--recursive"])
              run_git(
                  prefix + ["submodule", "update", "--init", "--recursive", "--depth", "1"],
                  network=True,
              )
              status = run_git(
                  prefix + ["submodule", "status", "--recursive"], capture_output=True
              ).stdout
              invalid = [line for line in status.splitlines() if not line.startswith(" ")]
              if invalid:
                  raise RuntimeError("Submodules are not at their pinned commits:\n" + "\n".join(invalid))
              print(f"Source and all recursive submodules are at their pinned commits: {actual}", flush=True)
          
          
          if __name__ == "__main__":
              main()
          '@
          $sourceCheckoutPath = "$env:RUNNER_TEMP\source-checkout-v25-5.py"
          [IO.File]::WriteAllText($sourceCheckoutPath, $sourceCheckout, [Text.UTF8Encoding]::new($false))
          python $sourceCheckoutPath
          if ($LASTEXITCODE -ne 0) { throw "Pinned source or submodule download failed after retries." }
          $patch = "$env:RUNNER_TEMP\self-destruct-persistence-v25-5.patch"
          # Gzip-compressed complete patch against SOURCE_SHA, including all new files.
