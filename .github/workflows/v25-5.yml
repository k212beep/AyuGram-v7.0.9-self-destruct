          '@
          $ayuBuildRecipePath = "$env:RUNNER_TEMP\ayu-main-build-v25-5.cmd"
          $ayuBuildRecipe = "@echo off`r`n" + $ayuBuildRecipe.Replace("`r`n", "`n").Replace("`n", "`r`n") + "`r`n"
          [IO.File]::WriteAllText($ayuBuildRecipePath, $ayuBuildRecipe, [Text.ASCIIEncoding]::new())
          $ayuBuildMonitor = @'
          """Run the unchanged Windows build batch, retaining a bounded error report."""
          from collections import deque
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys
          
          ANSI = re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          ERROR = re.compile(r'\berror(?:\s+[A-Z]\d+\s*:|\s*:)|\bfatal\s+error\b', re.I)
          FAILED = re.compile(r'^\s*FAILED:')
          SCRIPT_ECHO = re.compile(r'^\s*@?echo(?:\s|$)', re.I)
          
          
          def escape_annotation(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          
          
          def run_build(command, report):
              report = Path(report)
              report.parent.mkdir(parents=True, exist_ok=True)
              report.write_text('Build started; detailed output is in the job log.\n', encoding='utf-8')
              tail = deque(maxlen=200)
              first_error = []
              remaining = 0
              annotations = set()
              # Runtime credentials never belong in diagnostic artifacts or annotations.
              secrets = [value for key, value in os.environ.items()
                         if re.search(r'TOKEN|SECRET|PASSWORD|API_KEY', key, re.I) and len(value) >= 8]
          
              def redact(text):
                  for value in secrets:
                      text = text.replace(value, '***')
                  return ANSI.sub('', text)
          
              try:
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  for raw in iter(process.stdout.readline, b''):
                      # Keep live build progress and GitHub's ordinary masking behavior.
                      sys.stdout.buffer.write(raw)
                      sys.stdout.buffer.flush()
                      line = redact(raw.decode('utf-8', errors='replace').rstrip('\r\n'))[:4000]
                      is_error = bool(ERROR.search(line)) and not SCRIPT_ECHO.search(line)
                      if not first_error and (is_error or FAILED.search(line)):
                          first_error = list(tail)[-8:] + [line]
                          remaining = 24
                      elif remaining:
                          first_error.append(line)
                          remaining -= 1
                      tail.append(line)
                      if is_error and line not in annotations and len(annotations) < 8:
                          annotations.add(line)
                  process.stdout.close()
                  code = process.wait()
              except OSError as error:
                  code = 1
                  first_error = [redact(str(error))]
                  tail.append(first_error[0])
                  print('::error title=AyuGram build launch error::' + escape_annotation(first_error[0]), flush=True)
              first = '\n'.join(first_error)[:64 * 1024]
              last = '\n'.join(tail)[-128 * 1024:]
              content = (f'Build exit code: {code}\n\n'
                         'First error and surrounding output:\n' + first + '\n\n'
                         'Last 200 build output lines:\n' + last + '\n')
              report.write_text(content, encoding='utf-8')
              if code:
                  for line in sorted(annotations):
                      print('::error title=AyuGram build error::' + escape_annotation(line[:1200]), flush=True)
              if code and not annotations:
                  print('::error title=AyuGram build failed::Build exited with code '
                        + str(code) + '; see the build-errors artifact.', flush=True)
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary and code:
                  with open(summary, 'a', encoding='utf-8') as stream:
                      stream.write('### AyuGram build failure\n\n')
                      stream.write(f'Exit code: `{code}`. The build-errors artifact contains the first error context and last 200 lines.\n\n')
                      if first_error:
                          stream.write('```text\n' + first[:12000].replace('```', "'''") + '\n```\n')
              return code if code >= 0 else 1
          
          
          def main():
              if len(sys.argv) != 3:
                  raise SystemExit('Expected the Windows batch path and diagnostic report path.')
              if os.name != 'nt':
                  raise SystemExit('The actual AyuGram build is restricted to the Windows CI runner.')
              batch = Path(sys.argv[1]).resolve()
              comspec = os.environ.get('COMSPEC', r'C:\Windows\System32\cmd.exe')
              # /s /c strips the outer pair, retaining quotes around a batch path with spaces.
              command = f'"{comspec}" /d /s /c ""{batch}""'
              raise SystemExit(run_build(command, Path(sys.argv[2])))
          
          
          if __name__ == '__main__':
              main()
          '@
          $ayuBuildMonitorPath = "$env:RUNNER_TEMP\ayu-build-diagnostics-v25-5.py"
          [IO.File]::WriteAllText($ayuBuildMonitorPath, $ayuBuildMonitor, [Text.UTF8Encoding]::new($false))

      - name: Fetch pinned Breakpad with retry and official mirror
        shell: pwsh
        run: |
          $breakpadBootstrap = @'
          """Fetch the pinned Breakpad commit before dependency builds begin."""
          from pathlib import Path
          import os
          import subprocess
          import sys
          import time
          
          PRIMARY_URL = 'https://chromium.googlesource.com/breakpad/breakpad'
          MIRROR_URL = 'https://github.com/google/breakpad.git'
          PINNED_SHA = 'dfcb7b6799b7c1e2c8d65e857d8afede185471d8'
          SOURCES = ((PRIMARY_URL, 2), (MIRROR_URL, 3))
          
          
          def run_git(*arguments):
              environment = dict(os.environ, GIT_TERMINAL_PROMPT='0', GCM_INTERACTIVE='Never')
              try:
                  result = subprocess.run(
                      ['git', *arguments],
                      env=environment,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      encoding='utf-8',
                      errors='replace',
                      timeout=180,
                  )
                  return result.returncode, result.stdout
              except subprocess.TimeoutExpired:
                  return 124, 'Git command exceeded its 180-second timeout.'
          
          
          def require_git(*arguments):
              code, output = run_git(*arguments)
              if code:
                  raise RuntimeError('Git setup/verification failed:\n' + output)
              return output.strip()
          
          
          def prepare(cache):
              cache = Path(cache).resolve()
              cache.mkdir(parents=True, exist_ok=True)
              require_git('init', '--bare', str(cache))
              failures = []
              for url, attempts in SOURCES:
                  for attempt in range(1, attempts + 1):
                      print(f'Breakpad: fetching pinned commit from {url}, attempt {attempt}/{attempts}.', flush=True)
                      code, output = run_git(
                          '-C', str(cache),
                          '-c', 'http.lowSpeedLimit=1024',
                          '-c', 'http.lowSpeedTime=30',
                          'fetch', '--no-tags', '--depth=1', url, PINNED_SHA,
                      )
                      if not code:
                          actual = require_git('-C', str(cache), 'rev-parse', '--verify', 'FETCH_HEAD^{commit}')
                          if actual != PINNED_SHA:
                              raise RuntimeError(f'Breakpad commit mismatch: expected {PINNED_SHA}, received {actual}.')
                          require_git('-C', str(cache), 'update-ref', 'refs/heads/ayu-pinned', PINNED_SHA)
                          require_git('-C', str(cache), 'symbolic-ref', 'HEAD', 'refs/heads/ayu-pinned')
                          local_url = cache.as_uri() + '/'
                          require_git('config', '--global', 'url.' + local_url + '.insteadOf', PRIMARY_URL)
                          print(f'Breakpad: verified {actual}; dependency clone will use the local pinned source.', flush=True)
                          return
                      failures.append(f'{url}, attempt {attempt}/{attempts}, exit {code}:\n{output.strip()}')
                      print(f'Breakpad: fetch did not complete (exit {code}); continuing within the retry limit.', flush=True)
                      if attempt < attempts:
                          time.sleep(5 * attempt)
              raise RuntimeError('All pinned Breakpad download attempts failed:\n' + '\n'.join(failures))
          
          
          def main():
              try:
                  if len(sys.argv) != 2:
                      raise RuntimeError('Expected exactly one dedicated Breakpad cache path.')
                  prepare(sys.argv[1])
              except (OSError, RuntimeError) as error:
                  print('ERROR: ' + str(error), file=sys.stderr, flush=True)
                  return 1
              return 0
          
          
          if __name__ == '__main__':
              sys.exit(main())
          '@
          $bootstrapPath = "$env:RUNNER_TEMP\ayu-breakpad-bootstrap-v25-5.py"
          [IO.File]::WriteAllText($bootstrapPath, $breakpadBootstrap, [Text.UTF8Encoding]::new($false))
          python $bootstrapPath "$env:RUNNER_TEMP\ayu-breakpad-cache-v25-5.git"
          if ($LASTEXITCODE -ne 0) { throw "Pinned Breakpad sources could not be prepared; dependency build was not started." }

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw "Visual Studio C++ tools were not found."
          }
          $devcmd = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          "VSINSTALLPATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VSDEVCMD=$devcmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install ATL and MFC for the v14.44 toolset
        shell: pwsh
        run: |
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $arguments = @(
            "modify"
            "--installPath `"$env:VSINSTALLPATH`""
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL"
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC"
            "--quiet"
            "--norestart"
            "--nocache"
          )
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          $exitCode = $process.ExitCode
          if ($exitCode -notin @(0, 3010)) {
            throw "Visual Studio component installation failed with exit code $exitCode."
          }
          $toolset = Get-ChildItem "$env:VSINSTALLPATH\VC\Tools\MSVC" -Directory |
            Where-Object Name -Like "14.44.*" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $toolset -or -not (Test-Path "$($toolset.FullName)\atlmfc\include\atlbase.h")) {
            throw "The v14.44 ATL/MFC headers were not installed."
          }
          Write-Host "Using ATL/MFC from $($toolset.FullName)."

      - name: Prepare libraries and build AyuGram
        shell: cmd
        run: |
          python "%RUNNER_TEMP%\ayu-build-diagnostics-v25-5.py" "%RUNNER_TEMP%\ayu-main-build-v25-5.cmd" "%RUNNER_TEMP%\ayu-build-errors-v25-5.txt"

      - name: Create the portable ZIP
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\output"
          $official = "$output\official.zip"
          $package = "$output\package"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Invoke-WebRequest -Uri $env:OFFICIAL_ZIP_URL -OutFile $official
          $actual = (Get-FileHash $official -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:OFFICIAL_ZIP_SHA256) {
            throw "Official ZIP checksum mismatch: $actual"
          }
          Expand-Archive -Path $official -DestinationPath $package
          Copy-Item "$env:BUILD_ROOT\tdesktop\out\Release\AyuGram.exe" "$package\AyuGram.exe" -Force
          @"
          AyuGram v7.0.9 定制版（阅后即焚、永久保留与媒体秒发 v25-5）

          v25-5 整合版本：
          以成功编译的 v25-2-1 为基础，整合成功编译的 v25-1-1（1）的下载恢复和一键取消遮罩。
          保留群聊导出与跨账号导入筛选、私人邀请链接补充，以及已有的消息保存、媒体复用、群备注和三条快捷输入。
          群聊工具入口：设置 -> AyuGram -> 通用 -> 页面底部“群聊导出与筛选”。
          点击“一键导出已加入的群聊”；其他账号可使用“导入群聊并筛选未加入”。
          取消遮罩入口：聊天右上角菜单 -> AyuGram -> 一键取消遮罩（当前账号）。
          设置 -> AyuGram -> 阅后即焚与保留 -> 消息遮罩，也有同名按钮。
          一次取消当前账号所有聊天的选中消息遮罩，包括双方消息、双清恢复消息和相册单项。
          同时关闭“隐藏我方发言”，使两种显示遮罩都恢复；其他账号的遮罩不受影响，之后可以重新添加遮罩。
          下载超时回调正确换算连接序号，保留下载失败/超时诊断日志。
          构建前预取并校验原版固定的 Breakpad 提交；原站有限重试，失败后使用 Google 官方 GitHub 镜像。
          已通过合并后实际代码的遮罩、175 种下载连接组合、群聊导出筛选及完整补丁检查。
          完整 Windows 编译和实机运行仍需本次 Actions 构建验证。

          设置位置：AyuGram 设置 -> 阅后即焚与保留
          默认自毁时间：3 秒，可设置 1–60 秒。
          发送照片或视频时，发送窗口会显示“阅后即焚”复选框。
          改变复选框后可勾选“记住此选择”，下次会沿用，直到再次改变并记住。
          多个媒体会拆开逐个发送。定时发送、机器人、群组、频道、收藏夹和“作为文件”不受影响。
          照片的自毁时间会贯穿本地消息、上传和最终发送请求。阅后即焚照片不再默认显示马赛克；视频继续保持原来的遮罩显示。

          收到的私聊照片和视频会先自动下载到：
          tdata\AyuPermanentMedia\账号编号\聊天编号_用户名
          “下载完成后自动启动自毁”开启时，保存成功后自动启动倒计时；关闭时需右键手动启动。
          对方或服务器删除、阅后即焚以及重启软件后，文本、已下载照片和视频仍会重新显示。
          启动时先显示已保存的本地聊天记录，联网后再同步并按需载入；离线能看到部分记录属于正常行为。
          v25-5 消息保留：收到或载入消息、普通消息发送确认后，先将原消息快照写入本地数据库。
          对方删除消息或双向清空聊天时，保留原文、原编号、回复关系和已经下载的媒体。
          修复双清时最后一条被空占位消息覆盖，以及重启后同秒消息漏显示、排序或聊天摘要错误。
          重复发送同一视频会保留旧归档文件；媒体查找按账号、聊天和原编号隔离。
          兼容旧版已经保存的记录。升级前请退出软件并备份整个 tdata，保留原 tdata 使用。
          软件从未收到、未写入数据库的历史消息不能补救；媒体需要实际完成本地下载。
          我方阅后即焚照片和视频不写入永久缓存；对方读取后开始本机自毁倒计时，倒计时结束后显示标准的“照片/视频已自毁”提示。
          普通照片和视频首次成功上传后，会按账号持久保存本地 SHA-256 指纹到 Telegram 服务器媒体引用的映射；之后普通发送或阅后即焚发送同一文件都会跳过分块上传。
          相册媒体秒发：普通相册中每张照片/视频会生成独立指纹，并在发送成功后按对应 random_id 保存服务器媒体引用。之后单独重发其中任意一张，可命中媒体秒发缓存。相册自身的再次发送仍走原上传路径；编辑、定时、快捷回复和付费媒体仍排除。
          v19 已发送的相册不会自动补建指纹映射，升级后请先向收藏夹再发送一次相册。
          每次加载历史片段都会按服务器范围重新核对，并按原消息编号稳定排序，避免重复、漏恢复和同秒消息顺序混乱。
          删除到达但媒体尚未落盘时会继续后台下载；清空已删除消息也会清理尚未显示的恢复项。
          使用 AyuGram 菜单中的“清空已删除消息”，会同时删除对应记录和文件。
          群组默认不保存；在目标群聊右上角菜单选择 AyuGram → 永久保存此群，可单独启用普通群或超级群。频道和机器人仍不处理；长期使用会占用磁盘空间。

          群组内存缓存：AyuGram 设置 -> 阅后即焚与保留 -> 一键清理所有群组内存缓存。
          处理所有已登录账号中的已加载普通群和超级群，跳过私聊、频道及已启用永久保存的群组。
          清理聊天视图、历史消息对象和历史索引缓存，保留发送/下载任务、通知、置顶消息、草稿引用及必要的聊天列表摘要。
          不调用服务器删除接口，不删除手工下载的文件、磁盘媒体缓存或永久保存目录。再次进入群聊会按需重新加载。
          清理的是群组可释放的内存缓存，不能保证消除其他模块的内存增长，也不能保证任务管理器数值立即回落。

          私聊录屏：点击私聊顶部搜索按钮旁的眼睛图标，可一键隐藏/恢复自己的消息。
          隐藏时，我方消息内容（包括媒体）显示为不含原文的马赛克；聊天内已解析的我方消息引用也会被遮住。
          每个对话独立开关，同一对话的多个窗口同步；新发送和重新加载的消息自动遵循该开关。重启后默认恢复显示。
          此功能只改变聊天内消息的显示，不改变发送内容。输入框草稿、左侧聊天摘要、通知、导出和独立媒体查看器不属于遮罩范围。

          v25-5 编译与日志修复：
          群详情匹配保留普通群和超级群邀请读取，社区等其他详情类型返回空链接，不再导致编译失败。
          使用此版本的协议生成器、base/rpl 匹配头文件复现旧错误，并验证修复后的所有群详情分支。
          构建诊断忽略脚本中打印的 echo ERROR 行，只在实际失败时标注错误；保留真实编译错误上下文。
          本版保留 v25-2 群聊导出、跨账号筛选、私人邀请链接补充及 v25-1 原有功能。

          v25-5 群聊导出与筛选：
          设置 → AyuGram → 通用 → 群聊导出与筛选。
          账号 A 点击“一键导出已加入的群聊”，读取普通列表和归档列表，导出 UTF-8 CSV。
          CSV 前两列为群聊链接、群聊名称，第三列群编号用于跨账号准确匹配，请保留。
          导出排除频道、已退出和旧迁移群；包括普通群、超级群和论坛群。
          私人群优先读取现有邀请链接，再使用本软件已经确认并保存的入群链接。
          没有可用链接时仍保存群名和编号；群菜单 → AyuGram →“补充群邀请链接”可检查并保存原邀请。
          普通成员无法取得的私人邀请无法凭群编号生成；请使用现有邀请链接或向管理员获取。
          账号 B 点击“导入群聊并筛选未加入”，选择账号 A 导出的 CSV，重新检查当前账号状态。
          结果分为已加入、未加入、无法确认、链接失效/无效及非群聊，默认显示未加入；支持分页、复制和保存筛选结果。
          复制格式为“链接 + 名称”；保存结果含群编号和状态，也能在其他账号重新导入检查。
          群编号可确认当前群列表中的已加入群；缺少邀请和查询权限、失效链接不能冒充未加入。
          邀请可能需要管理员批准，请自行打开链接并手动加入；工具只读取群信息，不发送加入请求。
          查询逐项进行，可停止；遇到限流、登录或网络错误暂停。列表读取不完整时明确提示，可手动保存部分结果。
          群链接按账号保存，重启后保留；批量导出合并保存配置，CSV 使用临时文件完整提交。
          CSV/TSV、中文、引号、换行、去重、配置重启、分页、归档、置顶、成员查询及失败处理的针对性检查已通过。
          完整 Windows 程序仍由本工作流编译，请在 Actions 中选择名称以 v25-5 结尾的构建。

          v25-5 照片/视频复用修复：
          普通媒体缓存记录来源聊天、来源消息编号及频道访问信息，软件重启后仍可使用。
          优先保留收藏夹中的普通媒体来源；发送闪图不会用闪图覆盖它。
          相册中的每一张照片/视频按自己的 random_id 对应服务器消息，之后可以单独复用。
          文件引用过期时读取一条来源消息并刷新引用，不要求事先打开收藏夹或来源聊天。
          刷新后沿用相同发送标识重试一次，保持闪图时长、剧透设置和原来的发送选项。
          来源不可用、媒体已更换或刷新后仍被拒绝时，正常上传当前消息；不循环刷新。
          取消或删除待发送消息后忽略刷新结果；限流及登录错误按原有错误流程处理。
          旧版缓存没有来源编号：升级后请把常用照片以普通照片/相册重新发送到收藏夹一次。
          收藏夹中的普通来源需要继续保留，删除后失去刷新来源时仍需重新上传。
          本地已验证旧数据库升级与新目录启动、重启保存及缓存刷新回退；完整 Windows 编译由此工作流执行。

          v25-5 已读和设置保存修复：
          本地提示消息之前的恢复消息会按原编号批量标记已读；纯本地提示不再报未知消息错误。
          主设置写入临时文件，完整写入并提交后才替换原文件；保存成功后更新同目录 .bak 备份。
          主配置缺失、JSON 损坏或无法解析时尝试读取备份；旧配置字段和旧版迁移逻辑保留。
          修正媒体异常日志措辞，不再未经检查就声称缺少 ttl_seconds。
          保留双清消息、媒体持久保存、末条保护、遮罩、群组备注、三条去重快捷输入及新目录启动。

          v25-5 全新目录启动修复：
          数据库同步时先建消息表，再创建依赖这些表的索引。
          修复全新 tdata 目录因 DeletedMessage 表尚未创建而无法进入软件的问题。
          新目录自动创建数据库，可用于新账号；已有目录继续使用原数据库和已保存记录。
          保留群聊最近三条不同文本、重复文本去重、连续 ↑ 循环调取和重启保存。

          v25-5 运行修复：归档消息按原编号批量标记已读，纯本地记录不向服务器发送本地编号。
          归档校对按账号和聊天隔离，其他聊天的新消息不会反复触发当前归档的整段读取。
          已确认删除的记录不重复标记，校对结果使用完成后的变更编号；聊天摘要查询增加索引。
