      - name: Validate language keys before preparing libraries
        shell: pwsh
        run: |
          Write-Host "Build recipe: $env:RECIPE_REVISION"
          $script = "$env:RUNNER_TEMP\ayu-language-preflight.py"
          $source = "$env:BUILD_ROOT\tdesktop"
          $preflight = @'
          from pathlib import Path
          import re
          import subprocess
          import sys
          
          
          TOKEN = re.compile(r'\s+|//[^\r\n]*|/\*.*?\*/|"(?:\\[^\r\n]|[^"\\\r\n])*"|[=;]', re.S)
          KEY = re.compile(r'[a-z0-9_.-]+(?:#(?:one|other))?', re.I)
          TAG = re.compile(r'[a-z0-9_]+', re.I)
          PLURAL_TAGS = {'count', 'count_short', 'count_decimal'}
          
          
          def decode_string(token):
              return re.sub(r'\\(.)', lambda m: {
                  'n': '\n', 't': '\t', '"': '"', '\\': '\\'
              }.get(m.group(1), ''), token[1:-1])
          
          
          def parse_language(path):
              text = path.read_text(encoding='utf-8')
              if text.startswith('\ufeff'):
                  raise ValueError(f'{path}: UTF-8 BOM is not permitted')
              tokens = []
              offset = 0
              line = 1
              while offset < len(text):
                  match = TOKEN.match(text, offset)
                  if not match:
                      raise ValueError(f'{path}:{line}: invalid language token')
                  token = match.group()
                  if not token.isspace() and not token.startswith(('//', '/*')):
                      tokens.append((token, line))
                  line += token.count('\n')
                  offset = match.end()
              entries = {}
              for offset in range(0, len(tokens), 4):
                  group = tokens[offset:offset + 4]
                  if len(group) != 4:
                      raise ValueError(f'{path}: incomplete language entry')
                  key, equals, value, semicolon = [part[0] for part in group]
                  line = group[0][1]
                  if not key.startswith('"') or equals != '=' or not value.startswith('"') or semicolon != ';':
                      raise ValueError(f'{path}:{line}: expected "key" = "value";')
                  key, value = decode_string(key), decode_string(value)
                  if not KEY.fullmatch(key) or '__' in key:
                      raise ValueError(f'{path}:{line}: invalid language key {key!r}')
                  if key in entries:
                      raise ValueError(f'{path}:{line}: duplicate language key {key!r}')
                  tags = []
                  cursor = 0
                  while True:
                      start = value.find('{', cursor)
                      if start < 0:
                          break
                      end = value.find('}', start + 1)
                      if end < 0:
                          raise ValueError(f'{path}:{line}: unterminated placeholder in {key!r}')
                      placeholder = value[start + 1:end]
                      tag, colon, options = placeholder.partition(':')
                      if not TAG.fullmatch(tag) or '__' in tag:
                          raise ValueError(f'{path}:{line}: invalid placeholder {placeholder!r}')
                      if tag in tags:
                          raise ValueError(f'{path}:{line}: duplicate placeholder {tag!r} in {key!r}')
                      tags.append(tag)
                      if colon:
                          parts = options.split('|')
                          if len(parts) != 3 or any(part.count('#') > 1 for part in parts):
                              raise ValueError(f'{path}:{line}: invalid numeric placeholder {placeholder!r}')
                          if '#' in key:
                              raise ValueError(f'{path}:{line}: numeric options in a plural key are not supported')
                      if tag in PLURAL_TAGS and '#' not in key:
                          raise ValueError(
                              f'{path}:{line}: plural tag {tag!r} used in non-plural key {key!r}')
                      cursor = end + 1
                  entries[key] = (value, tags, line)
              phrases = {}
              for key, (_, tags, line) in entries.items():
                  base, marker, part = key.partition('#')
                  if marker and base in entries:
                      raise ValueError(f'{path}:{line}: plural and non-plural keys share {base!r}')
                  phrases.setdefault(base, set()).update(tags)
                  if marker:
                      phrases[base].add('count')
              for base in phrases:
                  if base + '#one' in entries and base + '#other' not in entries:
                      raise ValueError(f'{path}: plural key {base!r} has no #other fallback')
              return entries, phrases
          
          
          def validate_source_references(source, phrases):
              changed = subprocess.check_output(
                  ['git', '-C', str(source), 'diff', '--name-only', 'HEAD'], text=True).splitlines()
              changed += subprocess.check_output(
                  ['git', '-C', str(source), 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
              checked = 0
              for relative in dict.fromkeys(changed):
                  if not relative.endswith(('.cpp', '.h')):
                      continue
                  text = (source / relative).read_text(encoding='utf-8')
                  for match in re.finditer(r'\btr::((?:ayu|lng)_[A-Za-z0-9_]+)\b', text):
                      key = match.group(1)
                      if key not in phrases:
                          line = text.count('\n', 0, match.start()) + 1
                          raise ValueError(f'{relative}:{line}: unknown generated language key {key!r}')
                      checked += 1
              return checked
          
          
          def main():
              source = Path(sys.argv[1]).resolve()
              language = source / 'Telegram/Resources/langs/lang.strings'
              entries, phrases = parse_language(language)
              required = 'ayu_GroupMemoryCacheCleared'
              for part in ('one', 'other'):
                  if required + '#' + part not in entries:
                      raise ValueError(f'{language}: required cache notification #{part} is missing')
              references = validate_source_references(source, phrases)
              print(f'Language preflight passed: {len(entries)} entries, '
                    f'{len(phrases)} generated phrases, {references} source references')
          
          
          if __name__ == '__main__':
              main()
          '@
          [IO.File]::WriteAllText($script, $preflight, [Text.UTF8Encoding]::new($false))
          python $script $source
          if ($LASTEXITCODE -ne 0) { throw "Language preflight failed before dependency preparation." }

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw "Visual Studio C++ tools were not found."
          }
          $devcmd = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          "VSINSTALLPATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VSDEVCMD=$devcmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install ATL and MFC for the v14.44 toolset
        shell: pwsh
        run: |
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $arguments = @(
            "modify"
            "--installPath `"$env:VSINSTALLPATH`""
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL"
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC"
            "--quiet"
            "--norestart"
            "--nocache"
          )
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          $exitCode = $process.ExitCode
          if ($exitCode -notin @(0, 3010)) {
            throw "Visual Studio component installation failed with exit code $exitCode."
          }
          $toolset = Get-ChildItem "$env:VSINSTALLPATH\VC\Tools\MSVC" -Directory |
            Where-Object Name -Like "14.44.*" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $toolset -or -not (Test-Path "$($toolset.FullName)\atlmfc\include\atlbase.h")) {
            throw "The v14.44 ATL/MFC headers were not installed."
          }
          Write-Host "Using ATL/MFC from $($toolset.FullName)."

      - name: Prepare libraries and build AyuGram
        shell: cmd
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          call "%VSDEVCMD%" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          rem Use VideoLAN's official GitHub mirror if code.videolan.org is unreachable.
          git config --global url.https://github.com/videolan/.insteadOf https://code.videolan.org/videolan/
          cd /d "%BUILD_ROOT%"
          call tdesktop\Telegram\build\prepare\win.bat
          if errorlevel 1 exit /b 1
          cd /d "%BUILD_ROOT%\tdesktop\Telegram"
          where ninja
          if errorlevel 1 exit /b 1
          set CMAKE_BUILD_PARALLEL_LEVEL=2
          set _CL_=/MP1
          rem Omit release debug symbols so the final link does not exhaust runner memory.
          call configure.bat "-GNinja Multi-Config" -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT:STRING= -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627
          if errorlevel 1 exit /b 1
          cmake --build ..\out --config Release --target Telegram --parallel 2
          if errorlevel 1 exit /b 1
          if not exist "%BUILD_ROOT%\tdesktop\out\Release\AyuGram.exe" exit /b 1

      - name: Create the portable ZIP
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\output"
          $official = "$output\official.zip"
          $package = "$output\package"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Invoke-WebRequest -Uri $env:OFFICIAL_ZIP_URL -OutFile $official
          $actual = (Get-FileHash $official -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:OFFICIAL_ZIP_SHA256) {
            throw "Official ZIP checksum mismatch: $actual"
          }
          Expand-Archive -Path $official -DestinationPath $package
          Copy-Item "$env:BUILD_ROOT\tdesktop\out\Release\AyuGram.exe" "$package\AyuGram.exe" -Force
          @"
          AyuGram v7.0.9 定制版（阅后即焚、永久保留与媒体秒发 v21）

          设置位置：AyuGram 设置 -> 阅后即焚与保留
          默认自毁时间：3 秒，可设置 1–60 秒。
          发送照片或视频时，发送窗口会显示“阅后即焚”复选框。
          改变复选框后可勾选“记住此选择”，下次会沿用，直到再次改变并记住。
          多个媒体会拆开逐个发送。定时发送、机器人、群组、频道、收藏夹和“作为文件”不受影响。
          照片的自毁时间会贯穿本地消息、上传和最终发送请求。阅后即焚照片不再默认显示马赛克；视频继续保持原来的遮罩显示。

          收到的私聊照片和视频会先自动下载到：
          tdata\AyuPermanentMedia\账号编号\聊天编号_用户名
          “下载完成后自动启动自毁”开启时，保存成功后自动启动倒计时；关闭时需右键手动启动。
          对方或服务器删除、阅后即焚以及重启软件后，文本、已下载照片和视频仍会重新显示。
          收到的普通及阅后即焚内容继续永久保存；我方普通照片和视频发送时主动落盘。
          v21 修复：被删除的尾部消息和已自毁提示在切换聊天、重载历史及重启后重新挂回视图；同秒消息按原编号排序，并保持正确的聊天列表尾部。
          归档消息恢复发送方向和已读/媒体已读状态；后续读回执同步写入数据库。媒体文件查找限定账号和聊天目录，避免同编号消息串用其它聊天的媒体。
          v21 补充：对方双向清空聊天记录时保护最后一条普通消息的原内容并归档；重复清空通知和历史重载不会再将它改成空记录。
          我方阅后即焚媒体继续按原规则自毁；本机主动清空和关闭保存时保留原有行为。
          我方阅后即焚照片和视频不写入永久缓存；对方读取后保留标准的“照片/视频已自毁”提示。
          普通照片和视频首次成功上传后，会按账号持久保存本地 SHA-256 指纹到 Telegram 服务器媒体引用的映射；之后普通发送或阅后即焚发送同一文件都会跳过分块上传。
          v21：普通照片作为相册发送时，成功后会逐张记录各自的指纹与服务器引用。以后单独发送其中任意一张可直接复用；首次相册仍正常上传。
          相册视频、编辑、定时、快捷回复、付费媒体和带单独封面/贴纸的媒体仍排除在复用路径之外；普通单发照片和视频保持原有复用功能。
          每次加载历史片段都会按服务器范围重新核对，并按原消息编号稳定排序，避免重复、漏恢复和同秒消息顺序混乱。
          恢复范围改用 History 的公开消息编号接口，避免依赖未完整定义的视图元素类型。
