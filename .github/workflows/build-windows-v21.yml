            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "!hasStoredText && !expired" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "accountDirectory.entryList" }
