          $databasePath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\ayu\data\ayu_database.cpp"
          $databaseSource = Get-Content $databasePath -Raw
          if (-not $databaseSource.Contains("make_table<AyuUploadReuse>") -or -not $databaseSource.Contains("storage.replace(entry)")) {
            throw "Persistent upload-reuse table is missing."
          }

          $uploadPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\storage\file_upload.cpp"
          $uploadSource = Get-Content $uploadPath -Raw
          if (-not $uploadSource.Contains(".ayuReuseFingerprint = entry.file->ayuReuseFingerprint")) {
            throw "The successful-upload fingerprint is not propagated."
          }

          if (-not $historySource.Contains("beforeOrderId <= originalId")) {
            throw "Restored messages do not use stable same-second ordering."
          }


          $v21FixChecks = @(
            @{ File = "Telegram\SourceFiles\history\history.cpp"; Text = "const auto goodArchivedItem" }
            @{ File = "Telegram\SourceFiles\history\history.cpp"; Text = "goodArchivedItem(item.get())" }
            @{ File = "Telegram\SourceFiles\history\history.cpp"; Text = "const auto lastOrderId" }
            @{ File = "Telegram\SourceFiles\history\history.cpp"; Text = "retainedId > item->id" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = "_ayuArchivedUnread && _ayuOriginalMessageId > readTill" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "setAyuArchivedUnread((message.flags & 1) != 0)" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "!hasStoredText && !expired" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "accountDirectory.entryList" }
            @{ File = "Telegram\SourceFiles\ayu\data\ayu_database.cpp"; Text = "void markDeletedMessagesRead" }
            @{ File = "Telegram\SourceFiles\ayu\data\ayu_database.cpp"; Text = "void clearDeletedMessageUnreadFlags" }
            @{ File = "Telegram\SourceFiles\ayu\ui\message_history\history_item.cpp"; Text = "setAyuArchivedUnread((message.flags & 1) != 0)" }
            @{ File = "Telegram\SourceFiles\apiwrap.cpp"; Text = "uploadAlbumMedia(item, groupId, media, fingerprint)" }
            @{ File = "Telegram\SourceFiles\apiwrap.cpp"; Text = "part.ayuReuseFingerprint" }
            @{ File = "Telegram\SourceFiles\storage\localimageloader.cpp"; Text = "i->ayuReuseFingerprint = fingerprint" }
            @{ File = "Telegram\SourceFiles\data\data_session.cpp"; Text = "!AyuMessages::isGroupPersistenceEnabled(peer)" }
            @{ File = "Telegram\SourceFiles\data\data_session.cpp"; Text = "ranges::all_of(items" }
            @{ File = "Telegram\SourceFiles\history\history.cpp"; Text = "void History::unloadAyuGroupCache" }
            @{ File = "Telegram\SourceFiles\data\data_photo_media.cpp"; Text = "void PhotoMedia::unloadAyuCache" }
            @{ File = "Telegram\SourceFiles\data\data_document_media.cpp"; Text = "void DocumentMedia::unloadAyuCache" }
            @{ File = "Telegram\SourceFiles\ayu\ui\settings\settings_self_destruct.cpp"; Text = "ayu_ClearGroupMemoryCache" }
            @{ File = "Telegram\SourceFiles\history\history.cpp"; Text = "result->applyEdition(message.c_messageService())" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = "bool allowDeletedPreservation" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = ").c_messageService(), false)" }
            @{ File = "Telegram\SourceFiles\history\history_item.h"; Text = "bool allowDeletedPreservation = true" }
            @{ File = "Telegram\build\prepare\prepare.py"; Text = "mingw-w64-ucrt-x86_64-diffutils" }
            @{ File = "Telegram\build\prepare\prepare.py"; Text = "ucrt64" }
            @{ File = "Telegram\build\prepare\prepare.py"; Text = "pkgconf.exe --version" }
            @{ File = "Telegram\Resources\langs\lang.strings"; Text = "ayu_GroupMemoryCacheCleared#one" }
            @{ File = "Telegram\Resources\langs\lang.strings"; Text = "ayu_GroupMemoryCacheCleared#other" }
          )
          foreach ($check in $v21FixChecks) {
            if (-not (Select-String -Path "$env:BUILD_ROOT\tdesktop\$($check.File)" -SimpleMatch $check.Text -Quiet)) {
              throw "v21 fix validation failed: $($check.File) -> $($check.Text)"
            }
          }
          $cacheHistory = Get-Content "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\history\history.cpp" -Raw
          $cacheStart = $cacheHistory.IndexOf("void History::unloadAyuGroupCache")
          $cacheEnd = $cacheHistory.IndexOf("void History::clearUpTill", $cacheStart)
          if ($cacheStart -lt 0 -or $cacheEnd -le $cacheStart) {
            throw "Could not isolate the group memory-cache cleanup method."
          }
          $cacheRegion = $cacheHistory.Substring($cacheStart, $cacheEnd - $cacheStart)
          foreach ($required in @("ClearType::Unload", "owner().unregisterMessage(item)", "_items.erase(i)", "isGroupPersistenceEnabled(peer)")) {
            if (-not $cacheRegion.Contains($required)) {
              throw "Group memory-cache cleanup is incomplete: $required"
            }
          }
          foreach ($forbidden in @("ClearType::DeleteChat", "ClearType::ClearHistory", "deleteMessages(", "clearSharedMedia()", "item->destroy()")) {
            if ($cacheRegion.Contains($forbidden)) {
              throw "Memory cleanup must not perform history deletion: $forbidden"
            }
          }

          # Ninja uses per-source language-key subsets. AyuGram's pinned
          # code generator scans lng_* keys only, so teach it about ayu_* too.
          $langPatch = "$env:RUNNER_TEMP\ninja-lang-subsets-ayu.patch"
          $langPatchBase64 = @'
