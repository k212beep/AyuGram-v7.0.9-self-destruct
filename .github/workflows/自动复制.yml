            $reportName = if ($mode -eq '--self-test') { 'engine.json' } else { 'gui.json' }
            $reportPath = Join-Path $PWD (Join-Path 'reports' $reportName)
            $argumentText = $mode + ' "' + $reportPath + '"'
            $process = Start-Process -FilePath $exePath -ArgumentList $argumentText -PassThru
            if (-not $process.WaitForExit(90000)) {
              taskkill /PID $process.Id /T /F
              throw ('Packaged application timed out: ' + $mode)
            }
            $process.Refresh()
            if (-not (Test-Path -LiteralPath $reportPath)) {
              throw ('Application did not produce a test report: ' + $mode)
            }
            $reportText = Get-Content -LiteralPath $reportPath -Raw -Encoding utf8
            Write-Output $reportText
            $report = $reportText | ConvertFrom-Json
            if ($process.ExitCode -ne 0 -or -not $report.ok) {
              throw ('Packaged application test failed: ' + $mode)
            }
          }

      - name: 添加使用说明与文件校验值
        shell: python
        run: |
          import hashlib
          import os
          import shutil
          from pathlib import Path
          shutil.copyfile('README.md', 'dist/使用说明.md')
          lines = []
          for name in ('自动复制.exe', '使用说明.md'):
              item = Path('dist') / name
              lines.append(hashlib.sha256(item.read_bytes()).hexdigest() + '  ' + name)
          Path('dist/SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## 自动复制：编译与测试成功\n\n')
              summary.write('在页面下方 **Artifacts** 下载 **AutomaticCopy-Windows-x64**，解压后运行 **自动复制.exe**。\n\n')
              summary.write('包含 MD5 跳过/覆盖、后缀筛选、子目录和定时复制。定时任务需要软件保持运行。\n')

      - name: 上传 Windows 程序
        uses: actions/upload-artifact@v7.0.0
        with:
          name: AutomaticCopy-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: 保存 EXE 测试报告
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: AutomaticCopy-TestReports
          path: reports/*
          if-no-files-found: ignore
          retention-days: 7
