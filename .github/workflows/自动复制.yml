# 上传路径必须是 .github/workflows/自动复制.yml
# 修正版 1.0.1：统一 Windows 文件时间字段，避免正常文件被误判为变化。
# 此文件已内嵌全部源码与测试，无需另外上传项目文件。
# 源码分段写入，每个 run 步骤均低于 GitHub 的 21,000 字符上限。
# 产物：Windows 10/11 x64 的 自动复制.exe；运行时无需安装 Python。
name: 自动复制 · Windows 编译

on:
  push:
    paths:
      - '.github/workflows/自动复制.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-copy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试并打包 Windows 软件
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 设置 Python 3.12 x64
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: 写入 auto_copy.py（1/4）
        shell: python
        run: |
          from pathlib import Path
          destination = Path('auto_copy.py')
          destination.parent.mkdir(parents=True, exist_ok=True)
          payload = r'''from __future__ import annotations

          import argparse
          import hashlib
          import json
          import logging
          from logging.handlers import RotatingFileHandler
          import math
          import os
          from pathlib import Path
          import queue
          import re
          import stat
          import subprocess
          import sys
          import tempfile
          import threading
          import time
          import traceback
          from dataclasses import asdict, dataclass
          from typing import Callable


          APP_NAME = "自动复制"
          VERSION = "1.0.1"
          WINDOWS = os.name == "nt"
          CHUNK_SIZE = 1024 * 1024
          PRESETS = {
              "全部文件": "*",
              "文本与文档": "txt,rtf,md,pdf,doc,docx,odt,wps",
              "表格与演示": "xls,xlsx,xlsm,csv,tsv,ods,et,ppt,pptx,odp,dps",
              "图片": "jpg,jpeg,png,gif,bmp,webp,tif,tiff,svg,heic,ico",
              "音频与视频": "mp3,wav,flac,aac,m4a,ogg,mp4,mkv,mov,avi,wmv,webm",
              "压缩文件": "zip,7z,rar,tar,gz,bz2,xz,tar.gz",
              "代码与配置": "py,js,ts,tsx,jsx,html,css,cs,cpp,c,h,java,go,rs,json,yml,yaml,xml,ini,toml",
              "仅 TXT / RTF": "txt,rtf",
          }
          UNITS = {"秒": 1, "分钟": 60, "小时": 3600}


          class CopyCancelled(Exception):
              pass


          class FileChangedError(OSError):
              pass


          @dataclass(frozen=True)
          class Settings:
              source: str = ""
              target: str = ""
              extensions: str = "*"
              recursive: bool = True
              interval: float = 60
              unit: str = "秒"
              auto_on_launch: bool = False

              @property
              def seconds(self) -> float:
                  value = float(self.interval)
                  if not math.isfinite(value) or self.unit not in UNITS:
                      raise ValueError("请输入有效的检测间隔。")
                  seconds = value * UNITS[self.unit]
                  if not 1 <= seconds <= 365 * 24 * 3600:
                      raise ValueError("检测间隔应在 1 秒到 365 天之间。")
                  return seconds


          @dataclass
          class CopyStats:
              scanned: int = 0
              copied: int = 0
              updated: int = 0
              skipped: int = 0
              filtered: int = 0
              links: int = 0
              errors: int = 0
              cancelled: bool = False


          @dataclass
          class RunSchedule:
              enabled: bool = False
              busy: bool = False
              interval: float = 60
              next_due: float | None = None

              def begin(self, automatic: bool, interval: float) -> bool:
                  if self.busy:
                      return False
                  self.enabled, self.busy = automatic, True
                  self.interval, self.next_due = interval, None
                  return True

              def finish(self, now: float) -> None:
                  self.busy = False
                  self.next_due = now + self.interval if self.enabled else None

              def stop(self) -> None:
                  self.enabled, self.next_due = False, None

              def due(self, now: float) -> bool:
                  return self.enabled and not self.busy and self.next_due is not None and now >= self.next_due


          def parse_extensions(text: str) -> tuple[str, ...]:
              """An empty tuple means all files. Matching is case-insensitive."""
              parts = [part for part in re.split(r"[\s,;，；、]+", text.strip().lower()) if part]
              if not parts:
                  return ()
              result = set()
              all_files = False
              for part in parts:
                  if part in ("*", "*.*"):
                      all_files = True
                      continue
                  if part.startswith("*."):
                      part = part[1:]
                  elif not part.startswith("."):
                      part = "." + part
                  if not re.fullmatch(r"\.[a-z0-9_\-\u0080-\uffff]+(?:\.[a-z0-9_\-\u0080-\uffff]+)*", part):
                      raise ValueError(f"无效的文件后缀：{part}。示例：txt,rtf,pdf 或 *。")
                  result.add(part)
              return () if all_files else tuple(sorted(result))


          def matches_extension(path: Path, extensions: tuple[str, ...]) -> bool:
              return not extensions or path.name.lower().endswith(extensions)


          def is_linklike(path: Path) -> bool:
              try:
                  info = path.lstat()
              except FileNotFoundError:
                  return False
              return stat.S_ISLNK(info.st_mode) or bool(getattr(info, "st_file_attributes", 0) & 0x400)


          def within(path: Path, parent: Path) -> bool:
              try:
                  path.relative_to(parent)
                  return True
              except ValueError:
                  return False


          def validate_settings(settings: Settings) -> tuple[Path, Path]:
              if not settings.source.strip() or not settings.target.strip():
                  raise ValueError("请先设置源文件夹 A 和目标文件夹 B。")
              settings.seconds
              parse_extensions(settings.extensions)
              source = Path(os.path.expandvars(settings.source.strip())).expanduser().resolve()
              target = Path(os.path.expandvars(settings.target.strip())).expanduser().resolve()
              if not source.is_dir():
                  raise ValueError("源文件夹 A 不存在或不是文件夹。")
              if within(source, target) or within(target, source):
                  raise ValueError("A、B 不能相同，也不能互相包含，请选择两个独立的文件夹。")
              if target.exists() and not target.is_dir():
                  raise ValueError("目标位置 B 已被同名文件占用。")
              return source, target


          def check_cancel(cancel: threading.Event) -> None:
              if cancel.is_set():
                  raise CopyCancelled()


          def fingerprint(info: os.stat_result) -> tuple:
              # CPython 3.12+ on Windows can expose creation time through stat().ctime
              # and metadata change time through fstat().ctime for the same file.
              # Birth time has the same meaning for both calls. Keep identity, size,
              # mtime and the MD5 checks; avoid rejecting unchanged Windows files.
              timestamp = getattr(info, "st_birthtime_ns", info.st_ctime_ns) if WINDOWS else info.st_ctime_ns
              return (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, timestamp)


          def file_signature(path: Path) -> tuple:
              if is_linklike(path):
                  raise OSError(f"跳过符号链接或目录联接：{path}")
              info = path.stat()
              if not stat.S_ISREG(info.st_mode):
                  raise OSError(f"不是普通文件：{path}")
              return fingerprint(info)


          def stable_md5(path: Path, cancel: threading.Event) -> tuple[str, tuple]:
              before = file_signature(path)
              digest = hashlib.md5(usedforsecurity=False)
              with path.open("rb") as stream:
                  if fingerprint(os.fstat(stream.fileno())) != before:
                      raise FileChangedError(f"读取时文件发生变化，留待下次检测：{path}")
                  while True:
                      check_cancel(cancel)
                      chunk = stream.read(CHUNK_SIZE)
                      if not chunk:
                          break
                      digest.update(chunk)
                  after = fingerprint(os.fstat(stream.fileno()))
              if before != after or before != file_signature(path):
                  raise FileChangedError(f"文件正在写入，本轮跳过：{path}")
              return digest.hexdigest(), before


          def safe_parent(root: Path, destination: Path) -> None:
              relative = destination.relative_to(root)
              current = root
              if is_linklike(root):
                  raise OSError("目标根目录已变成链接，请重新选择目标文件夹。")
              for part in relative.parts[:-1]:
                  current /= part
                  if is_linklike(current):
                      raise OSError(f"目标子目录是链接，已跳过：{current}")
                  current.mkdir(exist_ok=True)
                  if not current.is_dir():
                      raise OSError(f"目标子目录被文件占用：{current}")
              if is_linklike(destination):
                  raise OSError(f"目标文件是链接，已跳过：{destination}")


          def atomic_copy(source: Path, destination: Path, root: Path, source_md5: str,
                          source_signature: tuple, target_signature: tuple | None,
                          cancel: threading.Event) -> None:
              """Verify staged bytes before replacing the destination on the same volume."""
              safe_parent(root, destination)
              handle, temporary_name = tempfile.mkstemp(prefix=".autocopy-", suffix=".tmp", dir=destination.parent)
              temporary = Path(temporary_name)
              try:
                  with os.fdopen(handle, "wb") as output:
                      if file_signature(source) != source_signature:
                          raise FileChangedError("源文件已经变化，本轮跳过，下次检测重试。")
                      with source.open("rb") as input_file:
                          if fingerprint(os.fstat(input_file.fileno())) != source_signature:
                              raise FileChangedError("源文件已经变化，本轮跳过。")
                          digest = hashlib.md5(usedforsecurity=False)
                          while True:
                              check_cancel(cancel)
                              chunk = input_file.read(CHUNK_SIZE)
                              if not chunk:
                                  break
                              output.write(chunk)
                              digest.update(chunk)
                          if fingerprint(os.fstat(input_file.fileno())) != source_signature:
                              raise FileChangedError("复制时源文件发生变化，保留原目标文件。")
                      output.flush()
                      os.fsync(output.fileno())
                  if digest.hexdigest() != source_md5 or file_signature(source) != source_signature:
                      raise FileChangedError("源文件内容已经变化，保留原目标文件。")
                  staged_md5, _ = stable_md5(temporary, cancel)
                  if staged_md5 != source_md5:
                      raise OSError("临时副本的 MD5 校验失败，保留原目标文件。")
                  source_stat = source.stat()
                  os.utime(temporary, ns=(source_stat.st_atime_ns, source_stat.st_mtime_ns))
                  safe_parent(root, destination)
                  if target_signature is None:
                      if os.path.lexists(destination):
                          raise FileChangedError("目标位置刚刚被其他程序写入，留待下次检测。")
                  elif file_signature(destination) != target_signature:
                      raise FileChangedError("目标文件被其他程序修改，留待下次检测。")
                  if file_signature(source) != source_signature:
                      raise FileChangedError("源文件仍在变化，留待下次检测。")
                  check_cancel(cancel)
                  os.replace(temporary, destination)
              finally:
                  temporary.unlink(missing_ok=True)


          def run_copy(settings: Settings, cancel: threading.Event | None = None,
                       emit: Callable[[str, str], None] | None = None,
                       progress: Callable[[CopyStats], None] | None = None) -> CopyStats:
              cancel = cancel if cancel is not None else threading.Event()
              emit = emit or (lambda level, text: None)
              progress = progress or (lambda stats: None)
              source, target = validate_settings(settings)
              extensions = parse_extensions(settings.extensions)
              stats = CopyStats()
              last_progress = 0.0

              def walk_error(error: OSError) -> None:
                  stats.errors += 1
                  emit("error", f"无法扫描：{error}")

              try:
                  check_cancel(cancel)
                  target.mkdir(parents=True, exist_ok=True)
                  for directory, directories, filenames in os.walk(source, topdown=True, onerror=walk_error, followlinks=False):
                      check_cancel(cancel)
                      directory_path = Path(directory)
                      if is_linklike(directory_path):
                          directories[:] = []
                          stats.links += 1
                          continue
                      kept = []
                      for name in directories:
                          child = directory_path / name
                          if is_linklike(child):
                              stats.links += 1
                              emit("warning", f"跳过链接文件夹：{child.relative_to(source)}")
                          else:
                              kept.append(name)
                      directories[:] = kept if settings.recursive else []
                      for name in filenames:
                          check_cancel(cancel)
                          original = directory_path / name
                          relative = original.relative_to(source)
                          stats.scanned += 1
                          try:
                              if is_linklike(original):
                                  stats.links += 1
                                  emit("warning", f"跳过链接文件：{relative}")
                                  continue
                              if not matches_extension(original, extensions):
                                  stats.filtered += 1
                                  continue
                              # A subdirectory may have been replaced since os.walk visited it.
          '''
          with destination.open('wb') as output:
              output.write(payload.encode('utf-8'))

      - name: 写入 auto_copy.py（2/4）
        shell: python
        run: |
          from pathlib import Path
          destination = Path('auto_copy.py')
          destination.parent.mkdir(parents=True, exist_ok=True)
          payload = r'''                    if not within(original.resolve(), source):
                                  raise OSError("源路径指向 A 文件夹之外，已跳过。")
                              destination = target / relative
                              safe_parent(target, destination)
                              original_md5, original_signature = stable_md5(original, cancel)
                              existed = os.path.lexists(destination)
                              destination_signature = None
                              if existed:
                                  target_md5, destination_signature = stable_md5(destination, cancel)
                                  if original_md5 == target_md5:
                                      if file_signature(original) != original_signature or file_signature(destination) != destination_signature:
                                          raise FileChangedError("比对时文件发生变化，留待下次检测。")
                                      stats.skipped += 1
                                      continue
                              atomic_copy(original, destination, target, original_md5,
                                          original_signature, destination_signature, cancel)
                              if existed:
                                  stats.updated += 1
                                  emit("info", f"已覆盖：{relative}")
                              else:
                                  stats.copied += 1
                                  emit("info", f"已新增：{relative}")
                          except CopyCancelled:
                              raise
                          except OSError as error:
                              stats.errors += 1
                              emit("error", f"处理失败 [{relative}]：{error}")
                          finally:
                              now = time.monotonic()
                              if now - last_progress >= 0.15:
                                  progress(CopyStats(**asdict(stats)))
                                  last_progress = now
              except CopyCancelled:
                  stats.cancelled = True
                  emit("warning", "复制已停止，未完成的临时副本已清理。")
              progress(CopyStats(**asdict(stats)))
              return stats


          def state_directory() -> Path:
              if os.name == "nt":
                  base = Path(os.environ.get("LOCALAPPDATA", str(Path.home() / "AppData" / "Local")))
              else:
                  base = Path(os.environ.get("XDG_CONFIG_HOME", str(Path.home() / ".config")))
              return base / "AutomaticCopy"


          def load_settings(path: Path) -> Settings:
              if not path.exists():
                  return Settings()
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise ValueError("设置文件格式无效。")
              defaults = asdict(Settings())
              for key, default in defaults.items():
                  if key not in data:
                      continue
                  value = data[key]
                  if isinstance(default, bool):
                      if not isinstance(value, bool):
                          raise ValueError(f"设置项格式无效：{key}")
                  elif key == "interval":
                      if isinstance(value, bool) or not isinstance(value, (int, float)):
                          raise ValueError("检测间隔格式无效。")
                  elif not isinstance(value, str):
                      raise ValueError(f"设置项格式无效：{key}")
                  defaults[key] = value
              result = Settings(**defaults)
              result.seconds
              parse_extensions(result.extensions)
              return result


          def save_settings(path: Path, settings: Settings) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              handle, name = tempfile.mkstemp(prefix="settings-", suffix=".tmp", dir=path.parent)
              try:
                  with os.fdopen(handle, "w", encoding="utf-8") as stream:
                      json.dump(asdict(settings), stream, ensure_ascii=False, indent=2)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(name, path)
              finally:
                  Path(name).unlink(missing_ok=True)


          class InstanceLock:
              def __init__(self, directory: Path):
                  directory.mkdir(parents=True, exist_ok=True)
                  self.stream = (directory / "instance.lock").open("a+b")
                  self.locked = False

              def acquire(self) -> bool:
                  self.stream.seek(0, os.SEEK_END)
                  if self.stream.tell() == 0:
                      self.stream.write(b"0")
                      self.stream.flush()
                  self.stream.seek(0)
                  try:
                      if os.name == "nt":
                          import msvcrt
                          msvcrt.locking(self.stream.fileno(), msvcrt.LK_NBLCK, 1)
                      else:
                          import fcntl
                          fcntl.flock(self.stream.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB)
                      self.locked = True
                      return True
                  except OSError:
                      return False

              def close(self) -> None:
                  if self.locked:
                      self.stream.seek(0)
                      if os.name == "nt":
                          import msvcrt
                          msvcrt.locking(self.stream.fileno(), msvcrt.LK_UNLCK, 1)
                      else:
                          import fcntl
                          fcntl.flock(self.stream.fileno(), fcntl.LOCK_UN)
                  self.stream.close()


          def open_folder(path: Path) -> None:
              if os.name == "nt":
                  os.startfile(str(path))
              else:
                  subprocess.Popen(["open" if sys.platform == "darwin" else "xdg-open", str(path)])


          def build_app(root, directory: Path, smoke: bool = False):
              # Lazy imports keep engine tests usable on machines without a graphical desktop.
              import tkinter as tk
              from tkinter import filedialog, messagebox, scrolledtext, ttk
              from tkinter import font as tkfont

              class App:
                  def __init__(self):
                      self.root, self.directory = root, directory
                      self.config_path = directory / "settings.json"
                      directory.mkdir(parents=True, exist_ok=True)
                      self.logger = logging.getLogger(f"AutomaticCopy.{id(self)}")
                      self.logger.setLevel(logging.INFO)
                      self.logger.propagate = False
                      handler = RotatingFileHandler(directory / "自动复制.log", maxBytes=5_000_000, backupCount=2, encoding="utf-8")
                      handler.setFormatter(logging.Formatter("%(asctime)s [%(levelname)s] %(message)s", "%Y-%m-%d %H:%M:%S"))
                      self.logger.addHandler(handler)
                      self.events = queue.Queue(maxsize=1500)
                      self.cancel = threading.Event()
                      self.schedule = RunSchedule()
                      self.active_settings = None
                      self.stats = CopyStats()
                      self.closing = False
                      self.completed_runs = 0
                      self.editables = []
                      self.load_error = None
                      try:
                          settings = load_settings(self.config_path)
                      except (OSError, ValueError, TypeError) as error:
                          settings = Settings()
                          self.load_error = str(error)
                      self.source = tk.StringVar(value=settings.source)
                      self.target = tk.StringVar(value=settings.target)
                      self.extensions = tk.StringVar(value=settings.extensions)
                      self.recursive = tk.BooleanVar(value=settings.recursive)
                      self.interval = tk.StringVar(value=f"{settings.interval:g}")
                      self.unit = tk.StringVar(value=settings.unit)
                      self.auto_on_launch = tk.BooleanVar(value=settings.auto_on_launch)
                      self.status = tk.StringVar(value="就绪 · 请设置源文件夹与目标文件夹")
                      self.counts = {key: tk.StringVar(value="0") for key in ("scanned", "copied", "updated", "skipped", "errors")}
                      self._layout()
                      root.protocol("WM_DELETE_WINDOW", self.close)
                      root.report_callback_exception = self.report_error
                      self.log("info", f"自动复制 {VERSION} 已启动。MD5 相同跳过，不同则覆盖。")
                      if self.load_error:
                          self.log("warning", "原设置未能读取，已使用默认设置：" + self.load_error)
                      root.after(100, self.poll)
                      if settings.auto_on_launch and not smoke:
                          root.after(500, lambda: self.start(True))

                  def _layout(self):
                      root.title(f"{APP_NAME} · {VERSION}")
                      root.geometry("1000x800")
                      root.minsize(860, 700)
                      root.configure(bg="#F3F5FA")
                      if os.name == "nt":
                          family = "Microsoft YaHei UI"
                      else:
                          family = "DejaVu Sans"
                      for name in ("TkDefaultFont", "TkTextFont", "TkMenuFont"):
                          tkfont.nametofont(name).configure(family=family, size=10)
                      style = ttk.Style(root)
                      style.theme_use("clam")
                      style.configure("TFrame", background="#F3F5FA")
                      style.configure("Card.TFrame", background="white")
                      style.configure("TLabel", background="white", foreground="#243247", font=(family, 10))
                      style.configure("Section.TLabel", font=(family, 11, "bold"))
                      style.configure("Hint.TLabel", foreground="#63718A", font=(family, 9))
                      style.configure("TButton", padding=(12, 7), font=(family, 10))
                      style.configure("Primary.TButton", foreground="white", background="#2563EB", borderwidth=0)
                      style.map("Primary.TButton", background=[("active", "#1D4ED8"), ("disabled", "#A8BDE9")])
                      style.configure("TCheckbutton", background="white", font=(family, 10))
                      style.configure("TEntry", padding=6)
                      style.configure("TCombobox", padding=5)
                      root.columnconfigure(0, weight=1)
                      root.rowconfigure(5, weight=1)
                      header = tk.Frame(root, bg="#F3F5FA")
                      header.grid(row=0, column=0, sticky="ew", padx=24, pady=(20, 14))
                      tk.Label(header, text="自动复制", font=(family, 23, "bold"), fg="#172640", bg="#F3F5FA").pack(side="left")
                      tk.Label(header, text="A → B   /   MD5 内容校验", font=(family, 11), fg="#63718A", bg="#F3F5FA").pack(side="left", padx=20, pady=(9, 0))

                      folders = ttk.Frame(root, style="Card.TFrame", padding=16)
                      folders.grid(row=1, column=0, sticky="ew", padx=24, pady=(0, 12))
                      folders.columnconfigure(1, weight=1)
                      ttk.Label(folders, text="01  复制位置", style="Section.TLabel").grid(row=0, column=0, columnspan=3, sticky="w", pady=(0, 10))
                      for row, caption, variable in ((1, "源文件夹 A", self.source), (2, "目标文件夹 B", self.target)):
                          ttk.Label(folders, text=caption).grid(row=row, column=0, sticky="w", padx=(0, 14), pady=4)
                          entry = ttk.Entry(folders, textvariable=variable)
                          entry.grid(row=row, column=1, sticky="ew", pady=4)
                          button = ttk.Button(folders, text="选择文件夹", command=lambda value=variable: self.browse(value))
                          button.grid(row=row, column=2, padx=(10, 0), pady=4)
                          self.editables.extend((entry, button))

                      rules = ttk.Frame(root, style="Card.TFrame", padding=16)
                      rules.grid(row=2, column=0, sticky="ew", padx=24, pady=(0, 12))
                      rules.columnconfigure(1, weight=1)
                      ttk.Label(rules, text="02  复制规则", style="Section.TLabel").grid(row=0, column=0, columnspan=2, sticky="w", pady=(0, 10))
