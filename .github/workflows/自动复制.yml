      - name: 写入 README.md（1/1）
        shell: python
        run: |
          from pathlib import Path
          destination = Path('README.md')
          destination.parent.mkdir(parents=True, exist_ok=True)
          payload = r'''# 自动复制

          中文 Windows 桌面软件，将源文件夹 A 的文件单向复制到目标文件夹 B。
          采用 MD5 内容比对：同一路径下内容相同则跳过，不同则自动覆盖，B 中缺少的文件自动新增。

          版本 1.0.1 修复 Windows 上 `stat()` 与 `fstat()` 的 `ctime` 含义不同、导致正常文件被误判为变化的问题。
          Windows 改为统一比较创建时间，同时保留文件身份、大小、修改时间与 MD5 校验。

          ## 最快使用方式：只上传一个 YML 文件

          1. 下载随附的 **自动复制.yml**。
          2. 在 GitHub 仓库中进入 **Add file → Create new file**，文件名填写 `.github/workflows/自动复制.yml`，粘贴下载文件的全部内容，再提交。也可以先进入 `.github/workflows/` 文件夹，使用 **Add file → Upload files** 上传该文件并提交。**只放在仓库根目录不会生效。**
          3. 打开仓库的 **Actions**，选择“自动复制 · Windows 编译”，查看自动触发的运行。若仓库禁用了 Actions，先在仓库设置中启用；也可通过 **Run workflow** 手动编译。
          4. 等所有步骤显示成功，在该次运行页面底部的 **Artifacts** 中下载 `AutomaticCopy-Windows-x64`。
          5. 解压下载的 ZIP，双击 **自动复制.exe**。无需自行安装 Python。

          此 YML 已内嵌完整程序、测试和使用说明，无需额外上传源码，也不需要设置 GitHub Token 或 Secret。
          源码通过多个步骤分段写入，每个步骤低于 GitHub Actions 单个 `run` 最多 21,000 字符的限制。
          上传后触发 `push` 编译；文件需位于 `.github/workflows/`。手动运行入口需要工作流位于默认分支。
          适用于 GitHub.com 的 Windows 10/11 x64 编译产物。程序未进行付费数字签名。

          ## 软件使用

          1. 选择源文件夹 **A** 和目标文件夹 **B**。B 不存在时首次运行会自动创建。A 与 B 必须独立，不能相同或互相包含。
          2. 选择常用后缀预设，或者输入自定义后缀，例如 `txt,rtf`、`docx,pdf,xlsx`。后缀不区分大小写，支持英文逗号、中文逗号、分号和空格分隔，支持 `txt`、`.txt`、`*.txt` 写法。
          3. 留空、`*` 或 `*.*` 表示全部文件，包括无后缀文件。`txt` 只匹配以 `.txt` 结尾的文件，不会复制 `a.txt.bak`。支持 `tar.gz` 等复合后缀。
          4. 默认包含子文件夹，并在 B 内保持同样的相对目录结构。可取消勾选，只复制 A 顶层文件。
          5. 点击 **立即复制** 执行一轮；或填写间隔并点击 **启动定时**。支持秒、分钟和小时，最小 1 秒。
          6. 定时启动时立即执行第一轮，**每轮结束后等待指定间隔**再开始下一轮。大文件处理期间不会启动重叠任务。
          7. 点击 **停止** 取消当前检测和后续定时任务；程序会清理本次未完成的临时副本。
          8. **保存设置** 保存当前选项。开始复制或定时运行时也会自动保存。勾选“打开软件后启动定时”后，下次手动打开软件即可恢复定时任务。

          **定时复制需要软件保持运行。**最小化窗口可以继续执行，关闭软件后停止；该选项不代表开机自启，也不依赖 GitHub 定时访问本机文件。
          需要修改规则时先点击“停止”，修改后重新开始。

          ## 常用文件预设

          | 预设 | 常见后缀 |
          | --- | --- |
          | 文本与文档 | txt、rtf、md、pdf、doc、docx、odt、wps |
          | 表格与演示 | xls、xlsx、xlsm、csv、tsv、ods、et、ppt、pptx、odp、dps |
          | 图片 | jpg、jpeg、png、gif、bmp、webp、tif、tiff、svg、heic、ico |
          | 音频与视频 | mp3、wav、flac、aac、m4a、ogg、mp4、mkv、mov、avi、wmv、webm |
          | 压缩文件 | zip、7z、rar、tar、gz、bz2、xz、tar.gz |
          | 代码与配置 | py、js、ts、tsx、jsx、html、css、cs、cpp、c、h、java、go、rs、json、yml、yaml、xml、ini、toml |

          ## 复制行为

          - 以相对路径定位文件：`A/子目录/a.txt` 对应 `B/子目录/a.txt`。
          - 对存在的源文件和目标文件分别读取内容计算 MD5，不以文件大小或修改时间代替内容比较。
          - 内容不同即以 A 为准覆盖 B，**不按新旧时间判断**，也不额外保留历史版本。被覆盖的旧内容不会进入回收站。
          - 先在 B 对应目录内写入临时文件，校验临时副本的 MD5，再原子替换对应目标文件。复制失败或主动停止时保留原目标文件。
          - 复制中检测到源文件或目标文件发生变化，会记录失败并留待下一轮检测；这能处理常见的持续写入场景，但不能提供数据库级别的并发快照。
          - 正在占用、无权限或不可读取的文件会记录失败，继续处理其余文件。定时模式会在后续轮次重试。
          - 不会删除 A 文件；A 中被删除的文件及 B 独有的文件都保留在 B。该工具是单向复制，不是删除镜像或双向同步。
          - 跳过源目录下的符号链接、Windows 目录联接及其他重解析点，避免循环复制；拒绝通过目标子目录中的链接写入其他位置。直接选择的 A/B 根目录会先解析到真实路径。
          - 不专门复制空文件夹，不复制 NTFS 权限、备用数据流或其他特殊元数据。保留普通文件的修改时间。
          - 软件没有上传文件的功能，复制和 MD5 校验在本机进行。选择网络共享文件夹时，文件访问由系统处理。

          ## 设置与日志

          Windows 保存位置：`%LOCALAPPDATA%\AutomaticCopy\`。

          - `settings.json`：文件夹、后缀、间隔等设置。
          - `自动复制.log`：新增、覆盖、失败、每轮汇总；可点击“查看日志文件”打开目录。
          - 日志单文件约 5 MB，最多另保留两份历史日志。界面只显示最近约 1000 行，避免长期运行耗尽内存。
          - 同一用户只允许运行一个正常程序实例，避免多实例互相覆盖。

          ## 源码运行与开发

          使用 Python 3.12（标准 Windows 安装包含 Tkinter）：

          ```powershell
          python auto_copy.py
          python -m unittest discover -s tests -v
          python -m unittest discover -s tools -p "test_*.py" -v
          python auto_copy.py --self-test engine-report.json
          python auto_copy.py --smoke-test gui-report.json
          ```

          本地打包：

          ```powershell
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name 自动复制 auto_copy.py
          ```

          GitHub Actions 会先运行单元测试，再打包 EXE，并实际启动打包后的程序执行引擎自检和界面定时复制测试；全部成功后才上传产物。
          产物附带使用说明和 `SHA256SUMS.txt`。构建产物默认保留 30 天，可重新运行编译。

          源码与工作流的内嵌副本由 `tools/generate_workflow.py` 统一生成；修改源码后，运行 `python tools/generate_workflow.py` 更新工作流。
          因为采用单文件上传方式，工作流运行的是 YML 内的源码；仅修改独立 `.py` 文件不会改变构建结果。

          ## 构建所依据的官方说明

          - Python 设置动作：https://github.com/actions/setup-python
          - 构建产物上传与下载：https://github.com/actions/upload-artifact
          - Windows 单文件打包：https://pyinstaller.org/en/stable/usage.html
          - Windows stat/fstat 时间字段差异：https://github.com/python/cpython/issues/157671
          '''
          with destination.open('wb') as output:
              output.write(payload.encode('utf-8'))

