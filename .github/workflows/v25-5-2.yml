          群聊工具入口：设置 -> AyuGram -> 通用 -> 页面底部“群聊导出与筛选”。
          点击“一键导出已加入的群聊”；其他账号可使用“导入群聊并筛选未加入”。
          取消遮罩入口：聊天右上角菜单 -> AyuGram -> 一键取消遮罩（当前账号）。
          设置 -> AyuGram -> 阅后即焚与保留 -> 消息遮罩，也有同名按钮。
          一次取消当前账号所有聊天的选中消息遮罩，包括双方消息、双清恢复消息和相册单项。
          同时关闭“隐藏我方发言”，使两种显示遮罩都恢复；其他账号的遮罩不受影响，之后可以重新添加遮罩。
          下载超时回调正确换算连接序号，保留下载失败/超时诊断日志。
          构建前预取并校验原版固定的 Breakpad 提交；原站有限重试，失败后使用 Google 官方 GitHub 镜像。
          已通过合并后实际代码的遮罩、175 种下载连接组合、群聊导出筛选及完整补丁检查。
          完整 Windows 编译和实机运行仍需本次 Actions 构建验证。

          v25-5-2 群聊自动加入、验证标记和人数：
          保留成功编译的 v25-5 全部原有功能。
          设置 -> AyuGram -> 通用 -> 页面底部“群聊导出与筛选”。
          账号 A 导出群聊时，列表和 CSV 显示人数：1000 为 1K，1250 为 1.25K，1000000 为 1M；另存精确人数原值。
          人数取服务器返回及已有资料的快照；无法取得时显示“未知”，不会伪造为 0。
          CSV 前三列仍为群聊链接、群聊名称、群编号；兼容旧版导出文件，新列包含人数及验证标记。
          账号 B 导入后先检查，点击“开始自动加入未加入的群”才会开始；不会因选择文件立即加群。
          可暂停/继续，保留当前进度；停止或关闭窗口后不再发送下一项请求。
          暂停不能撤回已发出的请求，会等待其返回；停止时尚无法确认的结果标为“结果待确认”，重新检查后再处理。
          默认每次实际加群请求间隔 300 秒，可输入 60–3600 秒。这是客户端设置，不是 Telegram 官方保证的配额。
          官方接口文档未给出固定每分钟加群次数；FLOOD_WAIT_X / FLOOD_PREMIUM_WAIT_X 必须等待服务器指定秒数。
          本地间隔和服务器等待取更晚的期限，按账号保存到设置；重启、重新导入或另开窗口不会清除已保存的等待期限。
          同一账号在本软件内仅允许一个自动加群任务；账号冻结、受限、加群上限等错误停止任务，不反复尝试。
          已加入、链接无效、群编号改变、无法确认成员状态、需要付费、明确需要审批或验证的群不自动加入。
          默认开启“跳过验证未知的群”；可在群菜单 -> AyuGram -> 入群验证标记，人工选择“人工确认无需验证”或“需要人工验证或审批”，再重新导出。
          也可在 CSV 的“验证标记”列使用 confirmed / manual / unknown；记录随文件传给其他账号。
          主动关闭“跳过验证未知的群”后才会尝试未知群；机器人验证和管理员审批仍不会自动完成。
          可识别本版协议的审批/验证机器人信号；实际收到机器人验证或待审批结果会记录并暂停后续任务，不冒充已加入。
          新版能记录本机遇到的官方验证机器人流程；私人邀请会在导出时重新核对，确认属于已加入群后关联标记。
          旧账号首次入群是否验证无法回溯；普通第三方机器人也没有统一的入群前识别标志，未知不会标成“无需验证”。
          群规则可能变化，人工确认标记也不能保证其他账号加入时一定不出现新的验证；请查看逐群结果。
          工具只执行用户启动的加群任务，不发送广告或其他群消息，不自动解验证码、提交验证答案或付费。
          私人邀请预览群名改变时先跳过；加入后再读取当前成员状态，未核实的结果保留待确认，不盲目重试。
          已通过实际状态代码、公私群协议返回、暂停/继续、限频、跨进程设置恢复、旧 CSV、人数和验证标记的针对性检查。
          完整 Windows 编译及实机运行仍需本次 GitHub Actions 构建验证。

