        run: |
          $breakpadBootstrap = @'
          """Fetch the pinned Breakpad commit before dependency builds begin."""
          from pathlib import Path
          import os
          import subprocess
          import sys
          import time
          
          PRIMARY_URL = 'https://chromium.googlesource.com/breakpad/breakpad'
          MIRROR_URL = 'https://github.com/google/breakpad.git'
          PINNED_SHA = 'dfcb7b6799b7c1e2c8d65e857d8afede185471d8'
          SOURCES = ((PRIMARY_URL, 2), (MIRROR_URL, 3))
          
          
          def run_git(*arguments):
              environment = dict(os.environ, GIT_TERMINAL_PROMPT='0', GCM_INTERACTIVE='Never')
              try:
                  result = subprocess.run(
                      ['git', *arguments],
                      env=environment,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      encoding='utf-8',
                      errors='replace',
                      timeout=180,
                  )
                  return result.returncode, result.stdout
              except subprocess.TimeoutExpired:
                  return 124, 'Git command exceeded its 180-second timeout.'
          
          
          def require_git(*arguments):
              code, output = run_git(*arguments)
              if code:
                  raise RuntimeError('Git setup/verification failed:\n' + output)
              return output.strip()
          
          
          def prepare(cache):
              cache = Path(cache).resolve()
              cache.mkdir(parents=True, exist_ok=True)
              require_git('init', '--bare', str(cache))
              failures = []
              for url, attempts in SOURCES:
                  for attempt in range(1, attempts + 1):
                      print(f'Breakpad: fetching pinned commit from {url}, attempt {attempt}/{attempts}.', flush=True)
                      code, output = run_git(
                          '-C', str(cache),
                          '-c', 'http.lowSpeedLimit=1024',
                          '-c', 'http.lowSpeedTime=30',
                          'fetch', '--no-tags', '--depth=1', url, PINNED_SHA,
                      )
                      if not code:
                          actual = require_git('-C', str(cache), 'rev-parse', '--verify', 'FETCH_HEAD^{commit}')
                          if actual != PINNED_SHA:
                              raise RuntimeError(f'Breakpad commit mismatch: expected {PINNED_SHA}, received {actual}.')
                          require_git('-C', str(cache), 'update-ref', 'refs/heads/ayu-pinned', PINNED_SHA)
                          require_git('-C', str(cache), 'symbolic-ref', 'HEAD', 'refs/heads/ayu-pinned')
                          local_url = cache.as_uri() + '/'
                          require_git('config', '--global', 'url.' + local_url + '.insteadOf', PRIMARY_URL)
                          print(f'Breakpad: verified {actual}; dependency clone will use the local pinned source.', flush=True)
                          return
                      failures.append(f'{url}, attempt {attempt}/{attempts}, exit {code}:\n{output.strip()}')
                      print(f'Breakpad: fetch did not complete (exit {code}); continuing within the retry limit.', flush=True)
                      if attempt < attempts:
                          time.sleep(5 * attempt)
              raise RuntimeError('All pinned Breakpad download attempts failed:\n' + '\n'.join(failures))
          
          
          def main():
              try:
                  if len(sys.argv) != 2:
                      raise RuntimeError('Expected exactly one dedicated Breakpad cache path.')
                  prepare(sys.argv[1])
              except (OSError, RuntimeError) as error:
                  print('ERROR: ' + str(error), file=sys.stderr, flush=True)
                  return 1
              return 0
          
          
          if __name__ == '__main__':
              sys.exit(main())
          '@
          $bootstrapPath = "$env:RUNNER_TEMP\ayu-breakpad-bootstrap-v25-5-2.py"
          [IO.File]::WriteAllText($bootstrapPath, $breakpadBootstrap, [Text.UTF8Encoding]::new($false))
          python $bootstrapPath "$env:RUNNER_TEMP\ayu-breakpad-cache-v25-5-2.git"
          if ($LASTEXITCODE -ne 0) { throw "Pinned Breakpad sources could not be prepared; dependency build was not started." }

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw "Visual Studio C++ tools were not found."
          }
          $devcmd = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          "VSINSTALLPATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VSDEVCMD=$devcmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install ATL and MFC for the v14.44 toolset
        shell: pwsh
        run: |
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $arguments = @(
            "modify"
            "--installPath `"$env:VSINSTALLPATH`""
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL"
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC"
            "--quiet"
            "--norestart"
            "--nocache"
          )
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          $exitCode = $process.ExitCode
          if ($exitCode -notin @(0, 3010)) {
            throw "Visual Studio component installation failed with exit code $exitCode."
          }
          $toolset = Get-ChildItem "$env:VSINSTALLPATH\VC\Tools\MSVC" -Directory |
            Where-Object Name -Like "14.44.*" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $toolset -or -not (Test-Path "$($toolset.FullName)\atlmfc\include\atlbase.h")) {
            throw "The v14.44 ATL/MFC headers were not installed."
          }
          Write-Host "Using ATL/MFC from $($toolset.FullName)."

      - name: Prepare libraries and build AyuGram
        shell: cmd
        run: |
          python "%RUNNER_TEMP%\ayu-build-diagnostics-v25-5-2.py" "%RUNNER_TEMP%\ayu-main-build-v25-5-2.cmd" "%RUNNER_TEMP%\ayu-build-errors-v25-5-2.txt"

      - name: Create the portable ZIP
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\output"
          $official = "$output\official.zip"
          $package = "$output\package"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Invoke-WebRequest -Uri $env:OFFICIAL_ZIP_URL -OutFile $official
          $actual = (Get-FileHash $official -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:OFFICIAL_ZIP_SHA256) {
            throw "Official ZIP checksum mismatch: $actual"
          }
          Expand-Archive -Path $official -DestinationPath $package
          Copy-Item "$env:BUILD_ROOT\tdesktop\out\Release\AyuGram.exe" "$package\AyuGram.exe" -Force
          @"
          AyuGram v7.0.9 定制版（阅后即焚、永久保留与媒体秒发 v25-5-2）

          v25-5-2 整合版本：
