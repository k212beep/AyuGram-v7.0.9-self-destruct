          path: |
            output/AyuGram-v7.0.9-self-destruct-persistence-v16.zip
            output/AyuGram-v7.0.9-self-destruct-persistence-v16.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
