          [IO.File]::WriteAllBytes($patch, [Convert]::FromBase64String(($patchBase64 -replace '\s', '')))
          $patchHash = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne $env:PATCH_SHA256) {
            throw "Embedded patch checksum mismatch: $patchHash"
          }
          git -C "$env:BUILD_ROOT\tdesktop" apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch application or whitespace validation failed." }
          git -C "$env:BUILD_ROOT\tdesktop" apply $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch application or whitespace validation failed." }

          git -C "$env:BUILD_ROOT\tdesktop" diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patch application or whitespace validation failed." }

          $langStringsForValidation = Get-Content "$env:BUILD_ROOT\tdesktop\Telegram\Resources\langs\lang.strings" -Raw
          $langEntries = [regex]::Matches($langStringsForValidation, '(?m)^[ \t]*"([^"]+)"[ \t]*=[ \t]*"((?:\\.|[^"\\])*)";[ \t]*\r?$')
          if ($langEntries.Count -eq 0) { throw "No language entries were found." }
          foreach ($entry in $langEntries) {
            $key = $entry.Groups[1].Value
            $value = $entry.Groups[2].Value
            if ($key -notmatch '#(zero|one|two|few|many|other)$' -and $value -match '\{count(?:_short|_decimal)?(?=[:}])') {
              throw "Reserved plural tag in non-plural language key: $key"
            }
          }

          $prepareSource = Get-Content "$env:BUILD_ROOT\tdesktop\Telegram\build\prepare\prepare.py" -Raw
          if ($prepareSource.Contains("mingw-w64-x86_64-diffutils") -or $prepareSource -notmatch '(?m)^\s+diffutils \^\r?$') {
            throw "MSYS2 diffutils dependency fix is missing."
          }

