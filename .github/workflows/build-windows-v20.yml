          $fingerprintEnd = $loaderForAlbums.IndexOf("if (reusableSend)", $fingerprintStart)
          if ($fingerprintStart -lt 0 -or $fingerprintEnd -le $fingerprintStart) {
            throw "Could not isolate upload fingerprint eligibility."
          }
          $fingerprintEligibility = $loaderForAlbums.Substring($fingerprintStart, $fingerprintEnd - $fingerprintStart)
          if ($fingerprintEligibility.Contains("!_album")) {
            throw "Album photos are still excluded from fingerprint generation."
          }

