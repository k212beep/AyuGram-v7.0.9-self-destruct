              }
              if(test=="all") {
                AyuDatabase::rows.clear();AyuMessageBase v;v.messageId=77;v.date=4000;v.documentType=int(AyuMediaType::Photo);v.text="saved flash";AyuDatabase::rows.push_back(v);
                History h(&peer,&session);
                auto expired=h.add(77,4000,false);expired->expired=1;expired->service=true;
                h.applyDialogTopMessage(77);h.dialogEntryApplied();
                require(h.lastMessage()&&h.lastMessage()->ayuOriginalMessageId()==77&&!h.lastMessage()->ayuExpiredMediaType(),"expired incoming placeholder suppressed full saved flash");
