          $cppScript = "$env:RUNNER_TEMP\ayu-cpp-preflight.py"
          $cppPreflight = @'
          from pathlib import Path
          import subprocess
          import sys
          
          
          def modified_cpp_files(source):
              tracked = subprocess.check_output(
                  ['git', '-C', str(source), 'diff', '--name-only', 'HEAD'], text=True).splitlines()
              added = subprocess.check_output(
                  ['git', '-C', str(source), 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
              files = sorted(set(tracked + added))
              return [path for path in files
                      if path.startswith('Telegram/SourceFiles/') and path.endswith('.cpp')]
          
          
          def choose_object_targets(files, available):
              normalized = {target.replace('\\', '/'): target for target in available}
              selected = []
              for path in files:
                  suffix = 'Release/' + path.removeprefix('Telegram/') + '.obj'
                  expected = 'Telegram/CMakeFiles/Telegram.dir/' + suffix
                  target = normalized.get(expected)
                  if target is None:
                      matches = [original for name, original in normalized.items()
                                 if '/CMakeFiles/Telegram.dir/' in name and name.endswith('/' + suffix)]
                      if len(matches) != 1:
                          raise RuntimeError(f'Could not resolve the configured object target for {path}')
                      target = matches[0]
                  selected.append(target)
              return selected
          
          
          def main():
              source = Path(sys.argv[1]).resolve()
              output = source / 'out'
              files = modified_cpp_files(source)
              if not files:
                  raise RuntimeError('No modified C++ sources were found')
              ninja = ['ninja', '-C', str(output), '-f', 'build-Release.ninja']
              inventory = subprocess.run(
                  ninja + ['-t', 'targets', 'all'],
                  check=True, capture_output=True, text=True, encoding='utf-8', errors='replace')
              available = [line.rsplit(': ', 1)[0] for line in inventory.stdout.splitlines() if ': ' in line]
              targets = choose_object_targets(files, available)
              targets.sort(key=lambda target: (
                  0 if '/ayu/data/ayu_database.cpp.obj' in target.replace('\\', '/') else
                  1 if '/ayu/data/messages_storage.cpp.obj' in target.replace('\\', '/') else 2,
                  target))
              print(f'Compiling {len(targets)} patched C++ files with the configured MSVC flags', flush=True)
              for target in targets:
                  print(f'  {target}', flush=True)
              compiled = subprocess.run(ninja + ['-j', '2', '-k', '0'] + targets)
              if compiled.returncode:
                  print('Patched C++ compilation failed. All independent patched targets were attempted.',
                        file=sys.stderr, flush=True)
                  return compiled.returncode
              print('Patched C++ compilation passed; continuing with the remaining program and final link',
                    flush=True)
              return 0
          
          
          if __name__ == '__main__':
              raise SystemExit(main())
          '@
          [IO.File]::WriteAllText($cppScript, $cppPreflight, [Text.UTF8Encoding]::new($false))
          "CPP_PREFLIGHT_SCRIPT=$cppScript" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $archiveScript = "$env:RUNNER_TEMP\ayu-archive-runtime-preflight.py"
          $archiveRuntimePreflight = @'
          from pathlib import Path
          import subprocess
          import sys
          
          ROOT = Path(__file__).resolve().parent
          
          
          def extract(text, signature):
              start = text.index(signature)
              brace = text.index('{', start)
              depth, end = 1, brace + 1
              while depth:
                  depth += (text[end] == '{') - (text[end] == '}')
                  end += 1
              return text[start:end]
          
          
          # These adapters provide storage, message/view ownership and Qt payload types.
          # The functions deciding restore scope, duplicate handling, last-message choice,
          # dialog refresh and re-entry are extracted from the production source below.
          # The actual SQLite query is separately compiled by check_database_production.py.
          STUBS = r'''
          #include <algorithm>
