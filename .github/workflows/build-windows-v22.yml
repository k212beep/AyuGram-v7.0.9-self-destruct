          '''
          
          kind = sys.argv[1] if len(sys.argv)>1 else 'current'
          if Path(kind).is_dir():
              source = Path(kind).resolve()/'Telegram/SourceFiles'
              kind = 'current'
          else:
              source = ROOT / ('ayu-verification-v22-scope/Telegram/SourceFiles' if kind=='v22' else 'ayu-source/Telegram/SourceFiles')
          history = (source/'history/history.cpp').read_text(encoding='utf-8')
          storage = (source/'ayu/data/messages_storage.cpp').read_text(encoding='utf-8')
          functions = '\n\n'.join(extract(history,s) for s in (
              'void History::setLastMessage(', 'void History::setLastServerMessage(',
              'void History::resolveChatListMessageGroup()', 'bool History::hasOrphanMediaGroupPart() const',
              'void History::destroyMessage(', 'void History::itemRemoved(',
              'void History::checkChatListMessageRemoved(', 'void History::refreshChatListMessage()',
              'void History::clear(', 'void History::clearUpTill(', 'void History::restoreAyuChatListEntry()',
              'void History::insertMessageToBlocks(', 'void History::checkLocalMessages(',
              'MsgId History::minMsgId() const', 'MsgId History::maxMsgId() const',
              'bool History::isReadyFor(', 'void History::getReadyFor(',
              'void History::applyDialogTopMessage(', 'void History::dialogEntryApplied()',
              'void History::unregisterClientSideMessage(',
              'void History::addOlderSlice(', 'void History::addNewerSlice(',
              'void History::checkLastMessage()', 'HistoryItem *History::lastAvailableMessage() const'))
          functions += '\n' + (extract(history,'bool History::ayuServerHistoryEmpty() const')
                                if kind!='before' else 'bool History::ayuServerHistoryEmpty() const { return false; }')
          if 'bool History::ayuArchiveAlreadyReconciled(' in history:
              functions += '\n'+extract(history,'bool History::ayuArchiveAlreadyReconciled(')
              functions += '\n'+extract(history,'void History::noteAyuArchiveReconciled(')
              functions += '\n'+extract(history,'void History::releaseAyuArchivedCache(')
          if 'bool History::beginAyuArchiveRestore(' in history:
              functions += '\n'+extract(history,'bool History::beginAyuArchiveRestore(')
              functions += '\n'+extract(history,'void History::endAyuArchiveRestore(')
          if 'void History::releaseAyuArchivedCache(' not in history:
              functions += '\nvoid History::releaseAyuArchivedCache() {}\n'
          functions += '\n' + (extract(history,'std::optional<MsgId> History::lastServerMessageId() const')
                                if kind!='before' else 'std::optional<MsgId> History::lastServerMessageId() const { return std::nullopt; }')
          functions += '\n' + extract(storage,'[[nodiscard]] bool IsExpiredMediaPlaceholder(')
          functions += '\nstruct LoadedServerRange { MsgId minId,maxId; };\n'
          functions += extract(storage,'[[nodiscard]] LoadedServerRange ComputeLoadedServerRange(')
          functions += '\n' + extract(storage,'[[nodiscard]] bool LoadedRangeCovers(')
          functions += '\nnamespace AyuMessages {\n'
          if kind!='before':
              functions += extract(storage,'[[nodiscard]] std::vector<AyuMessageBase> LoadArchivedMessages(') + '\n'
              functions += extract(storage,'[[nodiscard]] std::optional<AyuMessageBase> LoadArchivedLastMessage(') + '\n'
              functions += extract(storage,'[[nodiscard]] HistoryItem *RestoreArchivedMessage(')
              functions += '\n'+extract(storage,'HistoryItem *restoreArchivedLastMessage(')
          else:
              functions += 'HistoryItem *restoreArchivedLastMessage(not_null<History*>) { return nullptr; }\n'
          functions += '\n'+extract(storage,'void reinjectPermanentMedia(')+'\n}\n'
          api_source=(source/'apiwrap.cpp').read_text(encoding='utf-8')
          api=extract(api_source,'void ApiWrap::deleteHistory(')
          prepare=extract(api,'if (justClear)')
          functions += '\nstruct ApiWrap { History *history; std::optional<MsgId> boundary;\n'
          functions += 'void deleteHistory(PeerData *peer,bool justClear,bool revoke) {\nMsgId deleteTillId;\n'
          functions += 'const auto history=this->history;\n'+prepare+'\nboundary=deleteTillId;\n}\n};\n'
          cpp = ROOT / ('archive_lifecycle_'+kind+'.cpp')
          exe = ROOT / ('archive_lifecycle_'+kind+('.exe' if sys.platform=='win32' else ''))
          cpp.write_text(STUBS+'\n'+functions+'\n'+TESTS,encoding='utf-8')
          if sys.platform=='win32':
              subprocess.run(['cl','/nologo','/std:c++20','/EHsc','/Od','/utf-8',
                              '/Fe'+str(exe),str(cpp)],cwd=ROOT,check=True,timeout=120)
          else:
              subprocess.run(['g++','-std=c++20','-O0','-g','-fsanitize=address,undefined',
                              '-fno-omit-frame-pointer',str(cpp),'-o',str(exe)],check=True,timeout=120)
          if kind=='v22':
              for case in ['album-lifecycle','callback-lifecycle','unload-callback','restore-map-callback','ordered-restore']:
                  failed=subprocess.run([str(exe),case],capture_output=True,text=True)
                  (ROOT/('archive_lifecycle_v22_'+case+'_failure.log')).write_text(failed.stdout+failed.stderr)
                  expected_failure = ('recursive archive restoration' if case=='callback-lifecycle'
                                      else 'repeatedly rescanned the whole history' if case=='ordered-restore'
                                      else 'heap-use-after-free')
                  if failed.returncode==0 or expected_failure not in failed.stderr:
                      raise RuntimeError('Expected old source failure '+case+', got: '+failed.stderr[:2000])
                  print('v22.2 production functions reproduce '+case+': '+expected_failure)
                  print('\n'.join(failed.stderr.splitlines()[:8]))
          else:
              subprocess.run([str(exe),'all'],check=True)
              for case in ['album-lifecycle','callback-lifecycle','unload-callback','clear-lifecycle',
                           'restore-map-callback','live-album','ordered-restore']:
                  subprocess.run([str(exe),case],check=True)
          '@
          [IO.File]::WriteAllText($archiveScript, $archiveRuntimePreflight, [Text.UTF8Encoding]::new($false))
          "ARCHIVE_PREFLIGHT_SCRIPT=$archiveScript" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw "Visual Studio C++ tools were not found."
          }
          $devcmd = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          "VSINSTALLPATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VSDEVCMD=$devcmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install ATL and MFC for the v14.44 toolset
        shell: pwsh
        run: |
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $arguments = @(
            "modify"
            "--installPath `"$env:VSINSTALLPATH`""
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL"
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC"
            "--quiet"
            "--norestart"
            "--nocache"
          )
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          $exitCode = $process.ExitCode
          if ($exitCode -notin @(0, 3010)) {
            throw "Visual Studio component installation failed with exit code $exitCode."
          }
          $toolset = Get-ChildItem "$env:VSINSTALLPATH\VC\Tools\MSVC" -Directory |
            Where-Object Name -Like "14.44.*" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $toolset -or -not (Test-Path "$($toolset.FullName)\atlmfc\include\atlbase.h")) {
            throw "The v14.44 ATL/MFC headers were not installed."
          }
          Write-Host "Using ATL/MFC from $($toolset.FullName)."

      - name: Prepare libraries and build AyuGram
        shell: cmd
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          call "%VSDEVCMD%" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          python "%ARCHIVE_PREFLIGHT_SCRIPT%" "%BUILD_ROOT%\tdesktop"
          if errorlevel 1 exit /b 1
          rem Use VideoLAN's official GitHub mirror if code.videolan.org is unreachable.
          git config --global url.https://github.com/videolan/.insteadOf https://code.videolan.org/videolan/
          cd /d "%BUILD_ROOT%"
          call tdesktop\Telegram\build\prepare\win.bat
          if errorlevel 1 exit /b 1
          cd /d "%BUILD_ROOT%\tdesktop\Telegram"
          where ninja
          if errorlevel 1 exit /b 1
          set CMAKE_BUILD_PARALLEL_LEVEL=2
          set _CL_=/MP1
          rem Omit release debug symbols so the final link does not exhaust runner memory.
          call configure.bat "-GNinja Multi-Config" -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT:STRING= -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627
          if errorlevel 1 exit /b 1
          python "%CPP_PREFLIGHT_SCRIPT%" "%BUILD_ROOT%\tdesktop"
          if errorlevel 1 exit /b 1
          cmake --build ..\out --config Release --target Telegram --parallel 2 -- -k 0
          if errorlevel 1 exit /b 1
          if not exist "%BUILD_ROOT%\tdesktop\out\Release\AyuGram.exe" exit /b 1

      - name: Create the portable ZIP
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\output"
          $official = "$output\official.zip"
          $package = "$output\package"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Invoke-WebRequest -Uri $env:OFFICIAL_ZIP_URL -OutFile $official
          $actual = (Get-FileHash $official -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:OFFICIAL_ZIP_SHA256) {
            throw "Official ZIP checksum mismatch: $actual"
          }
          Expand-Archive -Path $official -DestinationPath $package
          Copy-Item "$env:BUILD_ROOT\tdesktop\out\Release\AyuGram.exe" "$package\AyuGram.exe" -Force
          @"
          AyuGram v7.0.9 定制版（阅后即焚、永久保留与媒体秒发 v22.3）
          构建标识：$env:RECIPE_REVISION

          设置位置：AyuGram 设置 -> 阅后即焚与保留
          默认自毁时间：3 秒，可设置 1–60 秒。
          发送照片或视频时，发送窗口会显示“阅后即焚”复选框。
          改变复选框后可勾选“记住此选择”，下次会沿用，直到再次改变并记住。
