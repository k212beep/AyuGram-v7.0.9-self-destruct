          v21 补充：对方双向清空聊天记录时保护最后一条普通消息的原内容并归档；重复清空通知和历史重载不会再将它改成空记录。
          v22.3 修复：重启时从本地对话索引恢复聊天列表，包括服务器已清空并从列表移除的私聊；聊天列表显示最后一条存档预览。
