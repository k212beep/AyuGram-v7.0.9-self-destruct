      - name: Validate language keys and prepare C++ checks
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $storageSource = Get-Content "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\ayu\data\messages_storage.cpp" -Raw -ErrorAction Stop
          $mediaRestoreStart = $storageSource.IndexOf("AyuRestoredMedia restorePermanentMedia")
          if ($mediaRestoreStart -lt 0) {
            throw "Could not locate permanent media restoration."
          }
          $mediaRestoreEnd = $storageSource.IndexOf("namespace {", $mediaRestoreStart)
          if ($mediaRestoreEnd -le $mediaRestoreStart) {
            throw "Could not isolate permanent media restoration."
          }
          $mediaRestoreRegion = $storageSource.Substring($mediaRestoreStart, $mediaRestoreEnd - $mediaRestoreStart)
          foreach ($forbidden in @("readAll()", "RandomValue<PhotoId>", "RandomValue<DocumentId>", "FromImageInMemory")) {
            if ($mediaRestoreRegion.Contains($forbidden)) {
              throw "Permanent media restoration still eagerly reads or duplicates media: $forbidden"
            }
