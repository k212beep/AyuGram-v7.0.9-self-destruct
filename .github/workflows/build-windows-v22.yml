          from pathlib import Path
          import re
          import subprocess
          import sys
          
          
          TOKEN = re.compile(r'\s+|//[^\r\n]*|/\*.*?\*/|"(?:\\[^\r\n]|[^"\\\r\n])*"|[=;]', re.S)
          KEY = re.compile(r'[a-z0-9_.-]+(?:#(?:one|other))?', re.I)
          TAG = re.compile(r'[a-z0-9_]+', re.I)
          PLURAL_TAGS = {'count', 'count_short', 'count_decimal'}
          
          
          def decode_string(token):
              return re.sub(r'\\(.)', lambda m: {
                  'n': '\n', 't': '\t', '"': '"', '\\': '\\'
              }.get(m.group(1), ''), token[1:-1])
          
          
          def parse_language(path):
              text = path.read_text(encoding='utf-8')
              if text.startswith('\ufeff'):
                  raise ValueError(f'{path}: UTF-8 BOM is not permitted')
              tokens = []
              offset = 0
              line = 1
              while offset < len(text):
                  match = TOKEN.match(text, offset)
                  if not match:
                      raise ValueError(f'{path}:{line}: invalid language token')
                  token = match.group()
                  if not token.isspace() and not token.startswith(('//', '/*')):
                      tokens.append((token, line))
                  line += token.count('\n')
                  offset = match.end()
              entries = {}
              for offset in range(0, len(tokens), 4):
                  group = tokens[offset:offset + 4]
                  if len(group) != 4:
                      raise ValueError(f'{path}: incomplete language entry')
                  key, equals, value, semicolon = [part[0] for part in group]
                  line = group[0][1]
                  if not key.startswith('"') or equals != '=' or not value.startswith('"') or semicolon != ';':
                      raise ValueError(f'{path}:{line}: expected "key" = "value";')
                  key, value = decode_string(key), decode_string(value)
                  if not KEY.fullmatch(key) or '__' in key:
                      raise ValueError(f'{path}:{line}: invalid language key {key!r}')
                  if key in entries:
                      raise ValueError(f'{path}:{line}: duplicate language key {key!r}')
                  tags = []
                  cursor = 0
                  while True:
                      start = value.find('{', cursor)
                      if start < 0:
                          break
                      end = value.find('}', start + 1)
                      if end < 0:
                          raise ValueError(f'{path}:{line}: unterminated placeholder in {key!r}')
                      placeholder = value[start + 1:end]
                      tag, colon, options = placeholder.partition(':')
                      if not TAG.fullmatch(tag) or '__' in tag:
                          raise ValueError(f'{path}:{line}: invalid placeholder {placeholder!r}')
                      if tag in tags:
                          raise ValueError(f'{path}:{line}: duplicate placeholder {tag!r} in {key!r}')
                      tags.append(tag)
                      if colon:
                          parts = options.split('|')
                          if len(parts) != 3 or any(part.count('#') > 1 for part in parts):
                              raise ValueError(f'{path}:{line}: invalid numeric placeholder {placeholder!r}')
                          if '#' in key:
                              raise ValueError(f'{path}:{line}: numeric options in a plural key are not supported')
                      if tag in PLURAL_TAGS and '#' not in key:
                          raise ValueError(
                              f'{path}:{line}: plural tag {tag!r} used in non-plural key {key!r}')
                      cursor = end + 1
                  entries[key] = (value, tags, line)
              phrases = {}
              for key, (_, tags, line) in entries.items():
                  base, marker, part = key.partition('#')
                  if marker and base in entries:
                      raise ValueError(f'{path}:{line}: plural and non-plural keys share {base!r}')
                  phrases.setdefault(base, set()).update(tags)
                  if marker:
                      phrases[base].add('count')
              for base in phrases:
                  if base + '#one' in entries and base + '#other' not in entries:
                      raise ValueError(f'{path}: plural key {base!r} has no #other fallback')
              return entries, phrases
          
          
          def validate_source_references(source, phrases):
              changed = subprocess.check_output(
                  ['git', '-C', str(source), 'diff', '--name-only', 'HEAD'], text=True).splitlines()
              changed += subprocess.check_output(
                  ['git', '-C', str(source), 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
              checked = 0
              for relative in dict.fromkeys(changed):
                  if not relative.endswith(('.cpp', '.h')):
                      continue
                  text = (source / relative).read_text(encoding='utf-8')
                  for match in re.finditer(r'\btr::((?:ayu|lng)_[A-Za-z0-9_]+)\b', text):
                      key = match.group(1)
                      if key not in phrases:
                          line = text.count('\n', 0, match.start()) + 1
                          raise ValueError(f'{relative}:{line}: unknown generated language key {key!r}')
                      checked += 1
              return checked
          
          
          def main():
              source = Path(sys.argv[1]).resolve()
              language = source / 'Telegram/Resources/langs/lang.strings'
              entries, phrases = parse_language(language)
              required = 'ayu_GroupMemoryCacheCleared'
              for part in ('one', 'other'):
                  if required + '#' + part not in entries:
                      raise ValueError(f'{language}: required cache notification #{part} is missing')
              references = validate_source_references(source, phrases)
              print(f'Language preflight passed: {len(entries)} entries, '
                    f'{len(phrases)} generated phrases, {references} source references')
          
          
          if __name__ == '__main__':
              main()
