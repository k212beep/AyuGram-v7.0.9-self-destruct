                  ['git', '-C', str(source), 'diff', '--name-only', 'HEAD'], text=True).splitlines()
              added = subprocess.check_output(
                  ['git', '-C', str(source), 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
              files = sorted(set(tracked + added))
              return [path for path in files
                      if path.startswith('Telegram/SourceFiles/') and path.endswith('.cpp')]
          
          
          def choose_object_targets(files, available):
              normalized = {target.replace('\\', '/'): target for target in available}
              selected = []
              for path in files:
                  suffix = 'Release/' + path.removeprefix('Telegram/') + '.obj'
                  expected = 'Telegram/CMakeFiles/Telegram.dir/' + suffix
                  target = normalized.get(expected)
                  if target is None:
                      matches = [original for name, original in normalized.items()
                                 if '/CMakeFiles/Telegram.dir/' in name and name.endswith('/' + suffix)]
                      if len(matches) != 1:
                          raise RuntimeError(f'Could not resolve the configured object target for {path}')
                      target = matches[0]
                  selected.append(target)
              return selected
          
          
          def main():
              source = Path(sys.argv[1]).resolve()
              output = source / 'out'
              files = modified_cpp_files(source)
              if not files:
                  raise RuntimeError('No modified C++ sources were found')
              ninja = ['ninja', '-C', str(output), '-f', 'build-Release.ninja']
              inventory = subprocess.run(
                  ninja + ['-t', 'targets', 'all'],
                  check=True, capture_output=True, text=True, encoding='utf-8', errors='replace')
              available = [line.rsplit(': ', 1)[0] for line in inventory.stdout.splitlines() if ': ' in line]
              targets = choose_object_targets(files, available)
              targets.sort(key=lambda target: (
                  0 if '/ayu/data/ayu_database.cpp.obj' in target.replace('\\', '/') else
                  1 if '/ayu/data/messages_storage.cpp.obj' in target.replace('\\', '/') else 2,
                  target))
              print(f'Compiling {len(targets)} patched C++ files with the configured MSVC flags', flush=True)
              for target in targets:
                  print(f'  {target}', flush=True)
              compiled = subprocess.run(ninja + ['-j', '2', '-k', '0'] + targets)
              if compiled.returncode:
                  print('Patched C++ compilation failed. All independent patched targets were attempted.',
                        file=sys.stderr, flush=True)
                  return compiled.returncode
              print('Patched C++ compilation passed; continuing with the remaining program and final link',
                    flush=True)
              return 0
          
          
          if __name__ == '__main__':
              raise SystemExit(main())
          '@
          [IO.File]::WriteAllText($cppScript, $cppPreflight, [Text.UTF8Encoding]::new($false))
          "CPP_PREFLIGHT_SCRIPT=$cppScript" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw "Visual Studio C++ tools were not found."
          }
          $devcmd = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          "VSINSTALLPATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VSDEVCMD=$devcmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install ATL and MFC for the v14.44 toolset
        shell: pwsh
        run: |
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $arguments = @(
            "modify"
            "--installPath `"$env:VSINSTALLPATH`""
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL"
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC"
            "--quiet"
            "--norestart"
            "--nocache"
          )
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          $exitCode = $process.ExitCode
          if ($exitCode -notin @(0, 3010)) {
            throw "Visual Studio component installation failed with exit code $exitCode."
          }
          $toolset = Get-ChildItem "$env:VSINSTALLPATH\VC\Tools\MSVC" -Directory |
            Where-Object Name -Like "14.44.*" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $toolset -or -not (Test-Path "$($toolset.FullName)\atlmfc\include\atlbase.h")) {
            throw "The v14.44 ATL/MFC headers were not installed."
          }
          Write-Host "Using ATL/MFC from $($toolset.FullName)."

      - name: Prepare libraries and build AyuGram
        shell: cmd
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          call "%VSDEVCMD%" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          rem Use VideoLAN's official GitHub mirror if code.videolan.org is unreachable.
          git config --global url.https://github.com/videolan/.insteadOf https://code.videolan.org/videolan/
          cd /d "%BUILD_ROOT%"
          call tdesktop\Telegram\build\prepare\win.bat
          if errorlevel 1 exit /b 1
          cd /d "%BUILD_ROOT%\tdesktop\Telegram"
          where ninja
          if errorlevel 1 exit /b 1
          set CMAKE_BUILD_PARALLEL_LEVEL=2
          set _CL_=/MP1
          rem Omit release debug symbols so the final link does not exhaust runner memory.
          call configure.bat "-GNinja Multi-Config" -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT:STRING= -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627
          if errorlevel 1 exit /b 1
          python "%CPP_PREFLIGHT_SCRIPT%" "%BUILD_ROOT%\tdesktop"
          if errorlevel 1 exit /b 1
          cmake --build ..\out --config Release --target Telegram --parallel 2 -- -k 0
          if errorlevel 1 exit /b 1
          if not exist "%BUILD_ROOT%\tdesktop\out\Release\AyuGram.exe" exit /b 1

      - name: Create the portable ZIP
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\output"
          $official = "$output\official.zip"
          $package = "$output\package"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Invoke-WebRequest -Uri $env:OFFICIAL_ZIP_URL -OutFile $official
          $actual = (Get-FileHash $official -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:OFFICIAL_ZIP_SHA256) {
            throw "Official ZIP checksum mismatch: $actual"
          }
          Expand-Archive -Path $official -DestinationPath $package
          Copy-Item "$env:BUILD_ROOT\tdesktop\out\Release\AyuGram.exe" "$package\AyuGram.exe" -Force
          @"
          AyuGram v7.0.9 定制版（阅后即焚、永久保留与媒体秒发 v22.2）
          构建标识：$env:RECIPE_REVISION

          设置位置：AyuGram 设置 -> 阅后即焚与保留
          默认自毁时间：3 秒，可设置 1–60 秒。
          发送照片或视频时，发送窗口会显示“阅后即焚”复选框。
          改变复选框后可勾选“记住此选择”，下次会沿用，直到再次改变并记住。
          多个媒体会拆开逐个发送。定时发送、机器人、群组、频道、收藏夹和“作为文件”不受影响。
          照片的自毁时间会贯穿本地消息、上传和最终发送请求。阅后即焚照片不再默认显示马赛克；视频继续保持原来的遮罩显示。

          收到的私聊照片、视频、语音、贴纸和文件会自动下载到：
          tdata\AyuPermanentMedia\账号编号\聊天编号_用户名
          “下载完成后自动启动自毁”开启时，保存成功后自动启动倒计时；关闭时需右键手动启动。
          接收或确认发送的普通私聊消息立即同步写入本地数据库，按“账号 + 聊天 + 原消息编号”唯一保存；不再等删除通知才保存正文。
          同时保存完整消息结构，保留文本、格式、回复、转发、相册分组和各类媒体引用；媒体下载完成后回写永久文件路径。
          收到的普通及阅后即焚媒体继续永久保存；我方普通媒体发送时主动落盘。只有本机已接收到的消息和成功下载的媒体原文件可恢复，未接收或下载失败的内容无法凭空补回。
          v21 修复：被删除的尾部消息和已自毁提示在切换聊天、重载历史及重启后重新挂回视图；同秒消息按原编号排序，并保持正确的聊天列表尾部。
          归档消息恢复发送方向和已读/媒体已读状态；后续读回执同步写入数据库。媒体文件查找限定账号和聊天目录，避免同编号消息串用其它聊天的媒体。
          v21 补充：对方双向清空聊天记录时保护最后一条普通消息的原内容并归档；重复清空通知和历史重载不会再将它改成空记录。
          v22.2 修复：重启时从本地对话索引恢复聊天列表，包括服务器已清空并从列表移除的私聊；聊天列表显示最后一条存档预览。
          服务器历史已空时，重新进入或重载对话会重新显示完整的本地存档；剩余的一两条本地缓存不会限制恢复范围。
          兼容旧的删除记录表、媒体目录和初始文件编号；新的媒体被编辑替换时使用独立文件名，重复使用同一视频不会删除另一条消息的永久文件。
          v22.2：修正 PowerShell 独立步骤间变量不可共享导致的构建中断；每一步自行读取所需源码，保留全部源码和媒体恢复检查。
          v22.1：修正 Windows 消息类型转换和缺少声明导致的编译错误；修复大量存档反复恢复时的全量扫描与媒体对象重复创建。
          同一存档媒体使用稳定本地身份，图片通过本地文件按需异步读取；不会在重建历史时提前把全部原图加载进内存。
          历史范围、存档或缓存变化时重新核对；相同范围的重复界面更新复用恢复结果。重复已读和清空回执不再重复写盘。
          卸载聊天时释放可从磁盘重建的旧存档消息缓存，保留聊天列表预览和正在传输的媒体；再次进入会从磁盘恢复完整记录。
          只显示聊天列表时，仅恢复一条预览。旧服务器消息和空占位消息不再覆盖较新的本地预览；反复重载复用已有存档项。
          我方阅后即焚媒体继续按原规则自毁；本机主动清空和关闭保存时保留原有行为。
          我方阅后即焚照片和视频不写入永久缓存；对方读取后保留标准的“照片/视频已自毁”提示。
