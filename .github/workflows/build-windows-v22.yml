          v21：普通照片作为相册发送时，成功后会逐张记录各自的指纹与服务器引用。以后单独发送其中任意一张可直接复用；首次相册仍正常上传。
          相册视频、编辑、定时、快捷回复、付费媒体和带单独封面/贴纸的媒体仍排除在复用路径之外；普通单发照片和视频保持原有复用功能。
          历史片段范围、存档或缓存变化时按服务器范围重新核对，并按原消息编号稳定排序；同一状态的反复更新不重复查询全部存档。
          恢复范围改用 History 的公开消息编号接口，避免依赖未完整定义的视图元素类型。
          删除到达但媒体尚未落盘时会继续后台下载；清空已删除消息也会清理尚未显示的恢复项。
          使用 AyuGram 菜单中的“清空已删除消息”，会同时删除对应记录和文件。
          群组默认不保存；在目标群聊右上角菜单选择 AyuGram → 永久保存此群，可单独启用普通群或超级群。频道和机器人仍不处理；长期使用会占用磁盘空间。

          新增：AyuGram 设置 -> 阅后即焚与保留 -> 一键清除所有群组内存缓存。
          一次处理所有已登录账号的普通群与超级群，跳过设置为永久保存的群。释放历史视图、驻留消息、图片/文件数据和过滤结果缓存；共享于私聊或受保护群的媒体会保留。
          清理保留聊天列表必要预览、正在发送/下载及待通知的消息。重新进入群聊时按需加载；不执行服务器删除，不清除本地永久归档、磁盘下载文件或照片秒发引用。
