                      h.getReadyFor(ShowAtTheEndMsgId);
                      require(h.order()==expected(),"confirmed empty history was forgotten after unload");
                      auto live=h.add(129,1033); h.setLastServerMessage(live);
                      require(!h.ayuServerHistoryEmpty(),"new live message did not invalidate empty-server state");
                      require(h.lastMessage()==live,"new server message did not replace archived preview");
                  }
                  {
                      History h(&peer,&session);
                      auto server=h.add(10,1000); h.setLastServerMessage(server);
                      h._loadedAtTop=h._loadedAtBottom=false;
                      h.dialogEntryApplied();
                      require(h.chatListMessage()->ayuOriginalMessageId()==MsgId(128),"newer saved preview lost behind older server top");
                      require(h.items.size()==2&&h.isEmpty(),"preview forced entire archive to load");
                      h.setLastMessage(server);
                      require(h.chatListMessage()->ayuOriginalMessageId()==MsgId(128),"older page replaced newer saved preview");
                      require(h.lastServerMessage()==server,"server tail was lost while keeping local preview");
                  }
                  {
                      History h(&peer,&session);
                      h._loadedAtTop=h._loadedAtBottom=false;
                      h.addItemToBlock(h.add(50,1012)); h.addItemToBlock(h.add(60,1015));
                      h.applyDialogTopMessage(60); h.checkLocalMessages();
                      for (auto id:h.order()) require(id>=50&&id<=60,"partial live-server page attached archives outside coverage");
                      require(!h.loadedAtTop()&&!h.loadedAtBottom(),"partial server page incorrectly marked complete");
                      require(h.minMsgId()==MsgId(50)&&h.maxMsgId()==MsgId(60),"local snapshots corrupted server pagination anchors");
                  }
                  {
                      History h(&peer,&session);
                      auto live=h.add(128,1032); live->text="live authoritative";
                      static DocumentData document; live->payload.documentData=&document;
                      h.setLastServerMessage(live); h.dialogEntryApplied();
                      require(h.chatListMessage()==live&&h.items.size()==1,"live server media replaced by saved snapshot");
                  }
                  {
                      AyuSettings::getInstance().keep=false;
                      History h(&peer,&session); h.applyDialogTopMessage(0); h.dialogEntryApplied();
                      require(h.items.empty(),"disabled retention reloaded ordinary snapshots");
                      auto r=AyuDatabase::rows[20]; r.documentType=int(AyuMediaType::ExpiredVideo);
                      AyuDatabase::rows.push_back(r);
                      h.dialogEntryApplied();
                      require(h.chatListMessage()&&h.chatListMessage()->ayuExpiredMediaType()==2,"expiry notice preview lost when retention disabled");
                      require(h.chatListMessage()->ayuOriginalMessageId()==MsgId(21),"expiry-only preview query selected ordinary record");
                  }
                  {
                      seed(); peer.eligible=false;
                      History h(&peer,&session); h.applyDialogTopMessage(0); h.dialogEntryApplied();
                      require(h.items.empty(),"ineligible dialog archive restored");
                      peer.eligible=true;
                  }
                  {
                      seed(); History h(&peer,&session);
                      h.applyDialogTopMessage(0); h.dialogEntryApplied();
                      const auto preview=h.chatListMessage(); const auto count=h.items.size();
                      ApiWrap api{&h}; api.deleteHistory(&peer,true,false);
                      require(api.boundary==MsgId(0),"local preview used as server deletion boundary");
                      require(h.items.size()==count&&h.chatListMessage()==preview,"clear preparation destroyed local preview");
                      auto live=h.add(300,1100); h.applyDialogTopMessage(300);
                      h._lastServerMessage=nullptr; // server metadata remains known if a placeholder is unloaded
                      api.deleteHistory(&peer,true,false);
                      require(api.boundary==MsgId(300),"server dialog metadata lost after preview restoration");
                      h.setLastServerMessage(live);
                      h._ayuDialogTopMessageId=301;
                      api.deleteHistory(&peer,true,false);
                      require(api.boundary==MsgId(301),"older loaded page narrowed server clear boundary");
                      h._lastServerMessage=std::nullopt; h._ayuDialogTopMessageId=std::nullopt;
                      const auto requests=session.entryRequests;
                      api.deleteHistory(&peer,true,false);
                      require(session.entryRequests==requests+1,"clear request did not resolve unknown server boundary exactly once");
                      require(api.boundary==MsgId(0),"empty server clear did not complete after one dialog request");
                  }
                  {
                      seed(); History h(&peer,&session);
                      h.applyDialogTopMessage(0); h.dialogEntryApplied();
                      auto outgoing=h.add(2000000800,1033,true); h.setLastMessage(outgoing);
                      // setRealId clears Local and then unregisters the client-side item.
                      outgoing->id=129; outgoing->local=false;
                      h.unregisterClientSideMessage(outgoing);
                      require(!h.ayuServerHistoryEmpty(),"send acknowledgement kept stale empty-server state");
                      require(h.lastServerMessageId()==MsgId(129),"send acknowledgement did not advance server metadata");
                      h.clear(History::ClearType::Unload);
                      h.getReadyFor(ShowAtTheEndMsgId);
                      require(!h.loadedAtTop(),"re-entry skipped server history containing newly sent message");
                      require(h.lastMessage()==outgoing,"send acknowledgement lost outgoing preview");
                  }
              }
          
              if(test=="all") {
                AyuDatabase::rows.clear(); AyuDatabase::savedRows.clear();
                for(int id=1;id<=128;++id){SavedMessage v;v.messageId=id;v.date=3000;v.text="received to disk before deletion";v.archiveDeleted=false;v.flags=id%2?2:0;AyuDatabase::savedRows.push_back(v);}
                History h(&peer,&session);
                h.applyDialogTopMessage(0);h.dialogEntryApplied();
                require(h.lastMessage()&&h.lastMessage()->ayuOriginalMessageId()==128,"new snapshot preview missing");
                h._loadedAtTop=h._loadedAtBottom=true;h.checkLocalMessages();
                require(h.order().size()==128,"receive-time snapshots did not restore complete cleared history");
                const auto reads=AyuDatabase::fullReads;
                for(int i=0;i<500;++i)h.checkLocalMessages();
                require(AyuDatabase::fullReads==reads,"unchanged history repeatedly re-read entire archive");
                ++AyuDatabase::revision;h.checkLocalMessages();
                require(AyuDatabase::fullReads==reads+1,"archive change did not invalidate reconciliation cache");
                h.clear(History::ClearType::Unload);
                require(h.items.size()==1,"unloaded archive retained every cached message");
                h.getReadyFor(ShowAtTheEndMsgId);
                require(h.order().size()==128,"releasing cached archive lost disk history");
          
                for(int cycle=0;cycle<6;++cycle){h.clear(History::ClearType::Unload);h._loadedAtTop=h._loadedAtBottom=false;h.getReadyFor(ShowAtTheEndMsgId);require(h.order().size()==128,"new snapshots lost rows after view unload");}
                require(h.order().front()==1&&h.order().back()==128,"new snapshots same-second order incorrect");
