          extern "C" const char *__asan_default_options() { return "detect_leaks=0"; }
          extern "C" int __lsan_is_turned_off() { return 1; }
          namespace gsl {
          template<class F> struct Finalizer {
              F callback;
              ~Finalizer() { callback(); }
          };
          template<class F> auto finally(F callback) { return Finalizer<F>{callback}; }
          }
          using ID = long long;
          using int64 = int64_t;
          using uint64 = uint64_t;
          using MessageGroupId = uint64_t;
          using TimeId = int;
          uint64_t dateReads=0;
          template<class T> struct not_null {
              T ptr;
              not_null(T p) : ptr(p) { assert(p); }
              T operator->() const { return ptr; }
              T get() const { return ptr; }
              operator T() const { return ptr; }
              bool operator==(const not_null &v) const { return ptr==v.ptr; }
              bool operator==(T value) const { return ptr==value; }
          };
          template<class T> struct FlatSet : std::vector<T> {
              auto emplace(T value) {
                  auto i=std::find(this->begin(),this->end(),value);
                  if (i!=this->end()) return std::pair{i,false};
                  this->push_back(value); return std::pair{std::prev(this->end()),true};
              }
              bool remove(T value) {
                  const auto i=std::find(this->begin(),this->end(),value);
                  if (i==this->end()) return false;
                  this->erase(i); return true;
              }
          };
          struct MsgId {
              long long bare = 0;
              MsgId(long long n = 0) : bare(n) {}
              explicit operator bool() const { return bare != 0; }
              auto operator<=>(const MsgId &) const = default;
          };
          MsgId operator-(MsgId id) { return -id.bare; }
          constexpr int ServerMaxMsgId = 1000000000;
          const MsgId ShowAtTheEndMsgId(-1), ShowAtUnreadMsgId(-2);
          bool IsServerMsgId(MsgId id) { return id.bare > 0 && id.bare < ServerMaxMsgId; }
          bool IsClientMsgId(MsgId id) { return id.bare>=ServerMaxMsgId; }
