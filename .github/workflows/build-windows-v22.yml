          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AyuGram-v7.0.9-self-destruct-persistence-reuse-v22.2.zip" | Set-Content "$zip.sha256" -Encoding ascii

