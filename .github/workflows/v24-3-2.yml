          path: |
            output/AyuGram-v7.0.9-self-destruct-persistence-reuse-v24-3-2.zip
            output/AyuGram-v7.0.9-self-destruct-persistence-reuse-v24-3-2.zip.sha256
          if-no-files-found: error
          compression-level: 0
