              def set_media_file(self, path: Path) -> None:
                  asset = inspect_media(path)
                  if self.media_queue.pending:
                      self.cancel_media_tasks()
                  self.media_asset = asset
                  self.media_name_var.set(asset.name)
                  size = f"{asset.size / 1024 / 1024:.2f} MB" if asset.size >= 1024 * 1024 else f"{asset.size / 1024:.1f} KB"
                  self.media_info_var.set(f"{asset.kind}  ·  {size}")
                  self.refresh_media_status()
                  self.log("媒体", f"已选择 {asset.name}。")

              def choose_media(self) -> None:
                  filename = filedialog.askopenfilename(title="选择关注后发送的媒体文件", filetypes=[
                      ("媒体文件", " ".join("*" + suffix for suffix in MEDIA_EXTENSIONS)), ("所有文件", "*.*")])
                  if not filename:
                      return
                  try:
                      self.set_media_file(Path(filename))
                  except (ValueError, OSError) as exc:
                      messagebox.showerror("媒体文件不可用", str(exc), parent=self.root)

              def clear_media(self) -> None:
                  self.cancel_media_tasks()
                  self.media_asset = None
                  self.follow_media_var.set(False)
                  self.media_name_var.set("尚未选择媒体文件")
                  self.media_info_var.set("支持图片、视频、音频")
                  self.refresh_media_status()

              def toggle_follow_media(self) -> None:
                  if not self.follow_media_var.get():
                      self.cancel_media_tasks()
                  self.refresh_media_status()

              def refresh_media_status(self) -> None:
                  if not self.follow_media_var.get():
                      state = "关注后媒体规则未启用"
                  elif self.media_asset is None:
                      state = "请选择媒体文件"
                  else:
                      state = "等待关注回执" if not self.media_queue.pending else "正在处理媒体任务"
                  self.media_status_var.set(f"{state}\n待处理 {len(self.media_queue.pending)} · 已处理 {self.media_queue.completed} · 异常 {self.media_queue.failed}")
                  self.stop_button.configure(state="normal" if self.session.active or self.media_queue.pending else "disabled")

              def accept_follow_receipts(self, receipts: list[Recipient]) -> tuple[int, int, int]:
                  if not self.follow_media_var.get():
                      raise ValueError("请先启用“对方关注后发送媒体文件”。")
                  if self.media_asset is None:
                      raise ValueError("请先导入媒体文件。")
                  targets = {record.douyin_id: record for record in self.target_records()}
                  matched = [targets[receipt.douyin_id] for receipt in receipts if receipt.douyin_id in targets]
                  skipped = len(receipts) - len(matched)
                  added, duplicate = self.media_queue.submit(matched, self.media_asset)
                  self.log("关注", f"回执匹配后新增媒体任务 {added} 条，合并重复 {duplicate} 条，范围外 {skipped} 条。")
                  self.refresh_media_status()
                  if self.media_queue.pending and self.media_timer is None:
                      self.media_timer = self.root.after(500, self.process_media_tick)
                  return added, duplicate, skipped

              def import_follow_receipts(self) -> None:
                  if not self.follow_media_var.get() or self.media_asset is None:
                      messagebox.showinfo("媒体规则", "请先启用关注后媒体规则，并选择媒体文件。", parent=self.root)
                      return
                  filenames = filedialog.askopenfilenames(title="导入关注回执名单", filetypes=[("名单文件", "*.txt *.csv *.tsv"), ("所有文件", "*.*")])
                  if not filenames:
                      return
                  try:
                      receipts = []
                      for filename in filenames:
                          merge_records(receipts, read_list(Path(filename)).records)
                      added, duplicate, skipped = self.accept_follow_receipts(receipts)
                      self.toast_var.set(f"关注回执已导入：新增媒体任务 {added} 条，重复 {duplicate} 条，范围外 {skipped} 条。")
                  except (ValueError, OSError) as exc:
                      messagebox.showerror("回执导入失败", str(exc), parent=self.root)

              def process_media_tick(self) -> None:
                  self.media_timer = None
                  task = self.media_queue.process_next()
                  if task is not None:
                      detail = f"{task.recipient.nickname or task.recipient.douyin_id} ({task.recipient.douyin_id}) · {task.asset.name} · {task.status}"
                      self.log("媒体", detail + (f"：{task.error}" if task.error else ""))
                  self.refresh_media_status()
                  if self.media_queue.pending:
                      self.media_timer = self.root.after(500, self.process_media_tick)

              def cancel_media_tasks(self) -> None:
                  if self.media_timer is not None:
                      self.root.after_cancel(self.media_timer)
                      self.media_timer = None
