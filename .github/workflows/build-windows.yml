                      ctypes.windll.user32.SetProcessDPIAware()
                  except (AttributeError, OSError):
                      pass
              if args.smoke_test:
                  smoke_test(args.smoke_test)
                  return 0
              root = tk.Tk()
              MessengerApp(root)
              root.mainloop()
              return 0


