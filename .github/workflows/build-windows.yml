          import tempfile
          import unittest
          from pathlib import Path

          from app import (Recipient, Session, csv_cell, decode_file, merge_records,
                           parse_text, read_list, render_message, valid_id)


          class ImportTests(unittest.TestCase):
              def test_supplied_txt_formats(self):
                  text = ("妹妹 昵称 示例用户 A  女19岁  抖音号 001234  资料位置 江苏 镇江  IP属地 江苏\n"
                          "昵称 Example Display Name  空  抖音号 user.name  评论次数 1  （未知1次）\n"
                          "昵称 示例餐馆  二号门店  男  抖音号 demo_003  资料位置 空\n"
                          "好朋友 昵称 昵称带空格 A B  女  抖音号 AbC_999  评论次数 5\n")
                  result = parse_text(text, "评论区")
                  self.assertEqual([r.douyin_id for r in result.records], ["001234", "user.name", "demo_003", "AbC_999"])
                  self.assertEqual([r.nickname for r in result.records], ["示例用户 A", "Example Display Name", "示例餐馆  二号门店", "昵称带空格 A B"])
                  self.assertEqual(result.parsed, 4)
                  self.assertEqual(result.skipped, 0)

              def test_csv_with_quoted_name_and_headers(self):
                  result = parse_text('抖音号,昵称,来源\n001234,"名字,含逗号",关注 / 粉丝\nabc,用户,评论区\n')
                  self.assertEqual(result.records[0].nickname, "名字,含逗号")
                  self.assertEqual(result.records[0].sources, ["关注", "粉丝"])
                  self.assertEqual(result.records[0].douyin_id, "001234")
                  self.assertEqual(len(result.records), 2)

              def test_tsv_and_chinese_comma(self):
                  for delimiter in ("\t", "，"):
                      result = parse_text(f"抖音ID{delimiter}昵称\nhello_01{delimiter}张三")
                      self.assertEqual(result.records[0].nickname, "张三")

              def test_plain_ids_invalid_lines_and_exact_deduplication(self):
                  result = parse_text("# 注释\n@00123\n00123,abc;def\n非法ID\n..\n昵称 信息不完整\n")
                  self.assertEqual([r.douyin_id for r in result.records], ["00123", "abc", "def"])
                  self.assertEqual(result.duplicates, 1)
                  self.assertEqual(result.skipped, 3)

              def test_merge_sources_and_preserve_id_strings(self):
                  records = [Recipient("00001", "", ["关注"])]
                  added, repeated = merge_records(records, [Recipient("00001", "张三", ["粉丝"]),
                                                            Recipient("1.2345", "李四", ["评论区"])])
                  self.assertEqual((added, repeated), (1, 1))
                  self.assertEqual(records[0].nickname, "张三")
                  self.assertEqual(records[0].sources, ["关注", "粉丝"])
                  self.assertEqual(records[1].douyin_id, "1.2345")

              def test_encodings(self):
                  for encoding in ("utf-8-sig", "utf-16", "utf-32", "gb18030"):
                      text = "昵称 张三  男  抖音号 001234  资料位置 空"
                      self.assertEqual(decode_file(text.encode(encoding)), text)

              def test_file_source(self):
                  with tempfile.TemporaryDirectory() as directory:
                      path = Path(directory) / "@0000_共同好友__26人(2).txt"
                      path.write_text("00123", encoding="utf-8")
                      result = read_list(path)
                      self.assertEqual(result.records[0].sources, ["共同好友"])

              def test_empty_and_invalid(self):
                  self.assertEqual(parse_text("").records, [])
                  for invalid in ("", "..", "https://example.com", "a/b", "a b", "x" * 65):
                      self.assertFalse(valid_id(invalid))
                  for value in ("0001", "name.name", "abc_DEF", "id-123"):
                      self.assertTrue(valid_id(value))


          class SimulationTests(unittest.TestCase):
              def setUp(self):
                  self.records = [Recipient("demo_001", "张三"), Recipient("demo_002", "李四")]
                  self.session = Session()

              def test_pause_resume_finish_and_restart(self):
                  self.session.start(self.records, "你好，{昵称}")
                  self.assertEqual(self.session.tick().douyin_id, "demo_001")
                  self.session.pause()
                  elapsed = self.session.elapsed
                  self.assertIsNone(self.session.tick())
                  self.assertEqual(self.session.cursor, 1)
                  self.assertEqual(self.session.elapsed, elapsed)
                  self.session.resume()
                  self.assertEqual(self.session.tick().douyin_id, "demo_002")
                  self.assertEqual(self.session.state, "completed")
                  self.assertEqual(self.session.remaining, 0)
                  self.assertIsNone(self.session.tick())
                  self.session.start(self.records, "再次演示")
                  self.assertEqual(self.session.cursor, 0)
                  self.assertEqual(self.session.statuses["demo_001"], "等待处理")

              def test_stop_while_paused(self):
                  self.session.start(self.records, "演示")
                  self.session.tick()
                  self.session.pause()
                  self.session.stop()
                  self.assertEqual(self.session.state, "stopped")
                  self.assertEqual(self.session.statuses, {"demo_001": "已处理", "demo_002": "已停止"})
                  self.assertIsNone(self.session.tick())

              def test_validation(self):
                  for records, message in (([], "演示"), (self.records, "  "), (self.records, "a" * 2001)):
                      with self.assertRaises(ValueError):
                          self.session.start(records, message)
                  self.session.start(self.records, "演示")
                  with self.assertRaises(ValueError):
                      self.session.start(self.records, "不允许重入")

              def test_template_substitutes_only_supported_variables(self):
                  self.assertEqual(render_message("{昵称}/{抖音号}/{普通花括号}", self.records[0]), "张三/demo_001/{普通花括号}")
                  self.assertEqual(render_message("你好{昵称}", Recipient("00001")), "你好00001")

              def test_csv_text_is_safe_to_open_in_spreadsheet(self):
                  self.assertEqual(csv_cell("=1+1"), "'=1+1")
                  self.assertEqual(csv_cell("普通文本"), "普通文本")


          if __name__ == "__main__":
              unittest.main()
