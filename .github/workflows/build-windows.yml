      - name: Write embedded app.py (8/14)
        run: |
          $payload = @'
                  self.collection_status_color = "muted"
                  self.collection_detail_var.set("已选择名单，点击“导入并保存”开始。")
                  self.refresh_collection_files()
                  self.sync_collection_controls()

              def choose_collection_files(self) -> None:
                  paths = filedialog.askopenfilenames(parent=self.collection_dialog, title="选择采集名单（手动导入，支持多选）",
                      filetypes=[("名单文件", "*.txt *.csv *.tsv"), ("所有文件", "*.*")])
                  if paths:
                      self.set_collection_paths(paths)

              def sync_collection_controls(self) -> None:
                  if self.collection_dialog is None:
                      return
                  running = self.collection_importer.pending
                  enabled = not running and not self.session.active
                  for widget in [self.collection_target_entry, self.collection_lookup_button, self.collection_choose_button,
                                 self.collection_import_button, *self.collection_type_buttons]:
                      widget.configure(state="normal" if enabled else "disabled")
                  self.collection_retry_button.configure(state="normal" if enabled and self.collection_status_var.get() == "导入失败" else "disabled")
                  self.collection_open_button.configure(state="normal" if self.collection_saved_path is not None else "disabled")
                  self.collection_status_label.configure(fg=COLORS[self.collection_status_color])
                  if running:
                      self.collection_progress.configure(mode="indeterminate")
                      self.collection_progress.start(15)
                  else:
                      self.collection_progress.stop()
                      self.collection_progress.configure(mode="determinate", value=100 if self.collection_saved_path is not None else 0)

              def start_collection_import(self) -> None:
                  if self.collection_importer.pending:
                      return
                  try:
                      if self.session.active:
                          raise ValueError("请先停止当前群发任务，再导入采集名单。")
                      target = collection_target(self.collection_target_var.get())
                      if not self.collection_paths:
                          raise ValueError("请先选择需要导入的名单文件。")
                      self.collection_target_var.set(target)
                      self.collection_importer.request(tuple(self.collection_paths), self.collection_kind_var.get(), target,
                          self.profile_path.parent / "collections", existing_ids=[r.douyin_id for r in self.records])
                  except ValueError as exc:
                      self.collection_status_var.set("导入失败")
                      self.collection_status_color = "red"
                      self.collection_detail_var.set(str(exc))
                      self.collection_saved_path = None
                      self.collection_saved_var.set("本次任务未保存文件")
                      self.sync_collection_controls()
                      return
                  self.collection_saved_path = None
                  self.collection_saved_var.set("正在读取并保存…")
                  self.collection_status_var.set("正在导入并保存…")
                  self.collection_status_color = "blue"
                  self.collection_detail_var.set(f"正在处理 {len(self.collection_paths)} 个本机名单文件。")
                  self.toast_var.set("正在导入名单并保存，可在“资料采集”查看进度。")
                  self.set_busy(False)
                  self.sync_collection_controls()
                  self.collection_timer = self.root.after(60, self.poll_collection_import)

              def poll_collection_import(self) -> None:
                  self.collection_timer = None
                  result = self.collection_importer.poll()
                  if result is None:
                      if self.collection_importer.pending:
                          self.collection_timer = self.root.after(60, self.poll_collection_import)
                      return
                  if result.error:
                      self.collection_status_var.set("导入失败")
                      self.collection_status_color = "red"
                      self.collection_detail_var.set(result.error)
                      self.collection_saved_var.set("本次任务未保存文件")
                      self.toast_var.set("资料导入失败，请在“资料采集”查看原因并重试。")
                      self.log("资料导入", f"导入失败：{result.error}")
                  else:
                      batch = result.batch
                      self.collection_saved_path = result.saved_path
                      self.collection_saved_var.set(str(result.saved_path))
                      try:
                          added, repeated = merge_records(self.records, batch.records)
                      except ValueError as exc:
                          self.collection_status_var.set("已保存，加入名单失败")
                          self.collection_status_color = "amber"
                          self.collection_detail_var.set(str(exc))
                          self.toast_var.set("文件已保存，加入名单失败，请在“资料采集”查看原因。")
                      else:
                          self.import_duplicates += repeated + batch.duplicates
                          for path in batch.paths:
                              if path not in self.imported_files:
                                  self.imported_files.append(path)
                          self.imported_names_var.set("已导入：" + "\n".join(path.name for path in self.imported_files))
                          self.sync_filter_choices()
                          self.reset_filters()
                          self.update_stats()
                          self.refresh_collection_totals()
                          self.collection_status_var.set("导入成功 · 已保存")
                          self.collection_status_color = "accent"
                          self.collection_detail_var.set(f"已采集{batch.kind} {len(batch.records):,} 人（手动导入），新增 {added:,} 人，"
                              f"合并重复 {repeated + batch.duplicates:,} 条，跳过无效项 {batch.skipped:,} 条。")
                          self.toast_var.set(f"{batch.kind}名单导入并保存完成，新增 {added:,} 人。")
                          self.log("资料导入", f"任务 {batch.target}：{batch.kind}名单 {len(batch.records):,} 人，手动导入并保存至 {result.saved_path.name}。")
                  self.set_busy(self.session.active)
                  self.sync_collection_controls()

              def open_collection_folder(self) -> None:
                  if self.collection_saved_path is None or not self.collection_saved_path.is_file():
                      messagebox.showinfo("保存文件不可用", "文件已移动或删除，请重新导入并保存。", parent=self.collection_dialog)
                      return
                  try:
                      if sys.platform == "win32":
                          os.startfile(str(self.collection_saved_path.parent))
                      else:
                          self.root.clipboard_clear()
                          self.root.clipboard_append(str(self.collection_saved_path.parent))
