# Upload this single file as .github/workflows/build-windows.yml
# It embeds all source and uses no real recipient data, Secrets, or account logins.
name: Build Windows App

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64


      - name: Write embedded app.py (1/9)
        run: |
          $payload = @'
          """Desktop messaging workbench with a local task queue."""
          from __future__ import annotations

          import argparse
          import csv
          import json
          import math
          import os
          import re
          import sys
          import tempfile
          import time
          import traceback
          from collections import deque
          from dataclasses import dataclass, field
          from datetime import datetime
          from functools import lru_cache
          from pathlib import Path


          APP_NAME = "抖音群发工作台"
          VERSION = "1.6.0"
          MAX_FILE_BYTES = 5 * 1024 * 1024
          MAX_RECIPIENTS = 20000
          MAX_MESSAGE = 200
          MEDIA_EXTENSIONS = {
              ".png": "图片", ".jpg": "图片", ".jpeg": "图片", ".gif": "图片", ".webp": "图片", ".bmp": "图片",
              ".mp4": "视频", ".mov": "视频", ".mkv": "视频", ".avi": "视频", ".webm": "视频",
              ".mp3": "音频", ".wav": "音频", ".m4a": "音频", ".aac": "音频", ".ogg": "音频", ".flac": "音频",
          }
          ID_RE = re.compile(r"(?=[A-Za-z0-9_.-]*[A-Za-z0-9])[A-Za-z0-9_.-]{1,64}\Z")
          LABELED_ID = re.compile(r"(?:抖音号|抖音ID|douyin[_ ]?id)\s*[:：=]?\s*([^\s,，;；]+)", re.I)
          ID_HEADERS = {"抖音号", "抖音id", "douyinid", "id", "账号"}
          NAME_HEADERS = {"昵称", "nickname", "name", "姓名"}
          SOURCE_HEADERS = {"来源", "source", "分组"}
          GENDER_HEADERS = {"性别", "gender", "sex"}
          AGE_HEADERS = {"年龄", "age", "岁数"}
          REGION_HEADERS = {"资料位置", "资料地区", "资料所在地", "资料所在地区", "个人资料位置", "个人资料地区",
                            "个人地区", "地区", "所在地", "region", "location", "profileregion", "profilelocation"}
          IP_REGION_HEADERS = {"ip属地", "ip归属地", "ip所在地", "ip地区", "ip位置", "ipregion", "iplocation"}
          LOCATION_LABELS = re.compile(
              r"(?P<ip>i\s*p\s*(?:归\s*属\s*地|属\s*地|所\s*在\s*地|地\s*区|位\s*置))|"
              r"(?P<region>(?:个\s*人\s*)?资\s*料\s*(?:所\s*在\s*地(?:\s*区)?|位\s*置|地\s*区)|"
              r"(?:所\s*在\s*地|地\s*区)(?=\s*[:：=]))|"
              r"(?P<other>评\s*论\s*次\s*数|抖音号|抖音\s*ID|douyin[_ ]?id|昵\s*称|性\s*别|年\s*龄|来\s*源)", re.I)
          TABLE_COLUMNS = {
              "name": ("昵称", 135, 60), "id": ("抖音号", 148, 76),
              "gender": ("性别", 52, 44), "age": ("年龄", 52, 44),
              "region": ("资料地区", 150, 74), "ip_region": ("IP属地", 110, 66),
              "source": ("来源", 120, 64), "status": ("状态", 82, 76),
          }
          COLORS = {
              "bg": "#0B1019", "side": "#101722", "card": "#151E2C",
              "input": "#0E1622", "line": "#263449", "text": "#F0F4FC",
              "muted": "#92A0B7", "accent": "#53E3C2", "blue": "#7EAAFF",
              "amber": "#F4C981", "red": "#F595A5", "hover": "#233149",
          }


          @dataclass
          class Recipient:
              douyin_id: str
              nickname: str = ""
              sources: list[str] = field(default_factory=list)
              gender: str = ""
              age: int | None = None
              region: str = ""
              ip_region: str = ""
              raw_details: list[str] = field(default_factory=list)


          @dataclass
          class ImportResult:
              records: list[Recipient]
              parsed: int = 0
              skipped: int = 0
              duplicates: int = 0


          @dataclass
          class AccountProfile:
              account: str = ""
              nickname: str = ""
              show_account: bool = True
              show_nickname: bool = True
              mask_account: bool = False


          def normalize_profile(profile: AccountProfile) -> AccountProfile:
              if not isinstance(profile.account, str) or not isinstance(profile.nickname, str):
                  raise ValueError("账号和昵称必须是文本。")
              account = profile.account.strip().removeprefix("@")
              nickname = profile.nickname.strip()
              if account and not valid_id(account):
                  raise ValueError("账号限 1–64 位字母、数字、下划线、短横线或小数点。")
              if len(nickname) > 40 or any(ord(char) < 32 for char in nickname):
                  raise ValueError("昵称最多 40 字，不能包含换行或控制字符。")
              flags = (profile.show_account, profile.show_nickname, profile.mask_account)
              if any(type(flag) is not bool for flag in flags):
                  raise ValueError("账号显示选项格式不正确。")
              return AccountProfile(account, nickname, *flags)


          def profile_display_text(profile: AccountProfile) -> str:
              lines = []
              if profile.show_nickname and profile.nickname:
                  nickname = profile.nickname
                  lines.append(nickname if len(nickname) <= 20 else nickname[:19] + "…")
              if profile.show_account and profile.account:
                  account = profile.account
                  if profile.mask_account:
                      account = account[:3] + "****" + account[-3:] if len(account) > 6 else "*" * len(account)
                  elif len(account) > 28:
                      account = account[:16] + "…" + account[-8:]
                  lines.append(f"账号：{account}")
              return "\n".join(lines)


          def default_profile_path() -> Path:
              if sys.platform == "win32":
                  base = Path(os.environ.get("LOCALAPPDATA", str(Path.home() / "AppData" / "Local")))
              else:
                  base = Path(os.environ.get("XDG_CONFIG_HOME", str(Path.home() / ".config")))
              return base / "DouyinSender" / "settings.json"


          def load_profile(path: Path) -> AccountProfile:
              if not path.exists():
                  return AccountProfile()
              if path.stat().st_size > 32768:
                  raise ValueError("账号设置文件过大。")
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or data.get("schema_version") != 1:
                  raise ValueError("账号设置文件格式不正确。")
              values = data.get("profile")
              if not isinstance(values, dict):
                  raise ValueError("账号设置内容不正确。")
              defaults = AccountProfile()
              fields = ("account", "nickname", "show_account", "show_nickname", "mask_account")
              return normalize_profile(AccountProfile(**{name: values.get(name, getattr(defaults, name)) for name in fields}))


          def write_json_atomic(path: Path, data: dict) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              temporary_path = None
              try:
                  with tempfile.NamedTemporaryFile(mode="w", encoding="utf-8", dir=path.parent,
                                                   prefix="settings-", suffix=".tmp", delete=False) as handle:
                      temporary_path = Path(handle.name)
                      json.dump(data, handle, ensure_ascii=False, indent=2)
                      handle.write("\n")
                  os.replace(temporary_path, path)
              finally:
                  if temporary_path is not None:
                      temporary_path.unlink(missing_ok=True)


          def save_profile(path: Path, profile: AccountProfile) -> AccountProfile:
              profile = normalize_profile(profile)
              write_json_atomic(path, {"schema_version": 1, "profile": {
                  "account": profile.account, "nickname": profile.nickname,
                  "show_account": profile.show_account, "show_nickname": profile.show_nickname,
                  "mask_account": profile.mask_account,
              }})
              return profile


          def duration_seconds(hours: str, minutes: str, seconds: str) -> int:
              values = [str(value).strip() for value in (hours, minutes, seconds)]
              if not all(re.fullmatch(r"\d+", value) for value in values):
                  raise ValueError("时、分、秒请填写非负整数。")
              h, m, s = map(int, values)
              if h > 99999 or m > 59 or s > 59:
                  raise ValueError("小时范围为 0–99999，分钟和秒范围为 0–59。")
              return h * 3600 + m * 60 + s


          def format_duration(seconds: float) -> str:
              total = max(0, int(seconds))
              return f"{total // 3600:02d}:{total // 60 % 60:02d}:{total % 60:02d}"


          def load_runtime_offset(path: Path) -> int:
              if not path.exists():
                  return 0
              if path.stat().st_size > 4096:
                  raise ValueError("计时设置文件过大。")
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or data.get("schema_version") != 1:
                  raise ValueError("计时设置格式不正确。")
              value = data.get("initial_seconds", 0)
              if type(value) is not int or not 0 <= value <= 99999 * 3600 + 3599:
                  raise ValueError("初始时长格式不正确。")
              return value


          def save_runtime_offset(path: Path, seconds: int) -> None:
              if type(seconds) is not int or not 0 <= seconds <= 99999 * 3600 + 3599:
                  raise ValueError("初始时长格式不正确。")
              write_json_atomic(path, {"schema_version": 1, "initial_seconds": seconds})


          class RuntimeClock:
              def __init__(self, initial_seconds: int = 0) -> None:
                  self.started = time.monotonic()
                  self.display_started = self.started
                  self.initial_seconds = initial_seconds

              @property
              def actual(self) -> float:
                  return max(0, time.monotonic() - self.started)

              @property
              def displayed(self) -> float:
                  return self.initial_seconds + max(0, time.monotonic() - self.display_started)

              def set_initial(self, seconds: int) -> None:
                  if type(seconds) is not int or seconds < 0:
                      raise ValueError("初始时长必须是非负整数。")
                  self.initial_seconds = seconds
                  self.display_started = time.monotonic()


          @dataclass(frozen=True)
          class MediaAsset:
              path: Path
              name: str
              kind: str
              size: int
              modified_ns: int


          def inspect_media(path: Path) -> MediaAsset:
              path = path.resolve()
              if not path.is_file():
                  raise ValueError("请选择可读取的媒体文件。")
              kind = MEDIA_EXTENSIONS.get(path.suffix.casefold())
              if kind is None:
                  raise ValueError("请选择图片、视频或音频文件。")
              stat = path.stat()
              if stat.st_size == 0:
                  raise ValueError("媒体文件为空，请重新选择。")
              return MediaAsset(path, path.name, kind, stat.st_size, stat.st_mtime_ns)


          @dataclass
          class MediaTask:
              recipient: Recipient
              asset: MediaAsset
              status: str = "等待处理"
              error: str = ""


          class FollowMediaQueue:
              """Process explicit follow receipts into local media tasks."""
              def __init__(self) -> None:
                  self.pending: deque[MediaTask] = deque()
                  self.seen: set[tuple] = set()
                  self.completed = 0
                  self.failed = 0

              @staticmethod
              def key(recipient: Recipient, asset: MediaAsset) -> tuple:
                  return recipient.douyin_id, os.path.normcase(str(asset.path)), asset.size, asset.modified_ns

              def submit(self, recipients: list[Recipient], asset: MediaAsset) -> tuple[int, int]:
                  if inspect_media(asset.path) != asset:
                      raise ValueError("媒体文件已变更，请重新选择。")
                  added = duplicate = 0
                  for record in recipients:
                      key = self.key(record, asset)
                      if key in self.seen:
                          duplicate += 1
                          continue
                      self.seen.add(key)
                      self.pending.append(MediaTask(record, asset))
                      added += 1
                  return added, duplicate

              def process_next(self) -> MediaTask | None:
                  if not self.pending:
                      return None
                  task = self.pending.popleft()
                  try:
                      if inspect_media(task.asset.path) != task.asset:
                          raise ValueError("媒体文件已变更，请重新选择。")
                      task.status = "已处理"
                      self.completed += 1
                  except (OSError, ValueError) as exc:
                      task.status = "文件不可用"
                      task.error = str(exc)
                      self.failed += 1
                      self.seen.discard(self.key(task.recipient, task.asset))
                  return task

              def cancel_pending(self) -> int:
                  count = len(self.pending)
                  while self.pending:
                      task = self.pending.popleft()
                      self.seen.discard(self.key(task.recipient, task.asset))
                  return count


          def valid_id(value: str) -> bool:
              return bool(ID_RE.fullmatch(value))


          def decode_file(data: bytes) -> str:
              if data.startswith((b"\xff\xfe\x00\x00", b"\x00\x00\xfe\xff")):
                  return data.decode("utf-32")
              if data.startswith((b"\xff\xfe", b"\xfe\xff")):
                  return data.decode("utf-16")
              for encoding in ("utf-8-sig", "gb18030"):
                  try:
                      text = data.decode(encoding)
                      if "\x00" not in text:
                          return text
                  except UnicodeError:
                      continue
              raise ValueError("无法识别文件编码。请另存为 UTF-8、带 BOM 的 UTF-16 或 GB18030 文本。")


          def source_name(filename: str) -> str:
              stem = Path(filename).stem
              for name in ("共同好友", "评论区", "关注", "粉丝"):
                  if name in stem:
                      return name
              return stem[:60] or "导入名单"


          def optional_text(value: str) -> str:
              value = value.strip()
              return "" if value.casefold() in {"", "空", "无", "未知", "不详", "未填写", "未填", "none", "null", "n/a", "-", "—"} else value


          def normalize_header(value: str) -> str:
              return re.sub(r"[\s_\-:：=]+", "", value.lstrip("\ufeff")).casefold()


          def extract_locations(line: str) -> tuple[str, str]:
              """End a location at the next field label, regardless of spacing/order."""
              labels = list(LOCATION_LABELS.finditer(line))
              values = {"region": "", "ip": ""}
              for index, match in enumerate(labels):
                  kind = match.lastgroup
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'app.py'), $payload + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))

      - name: Write embedded app.py (2/9)
        run: |
          $payload = @'
                  if kind not in values:
                      continue
                  end = labels[index + 1].start() if index + 1 < len(labels) else len(line)
                  value = line[match.end():end].strip(" \t\u3000:：=,，;；|")
                  value = optional_text(re.sub(r"[\s\u3000]+", " ", value))
                  if value and not values[kind]:
                      values[kind] = value
              return values["region"], values["ip"]


          def allocate_column_widths(available: int, minimums: dict[str, int] | None = None) -> dict[str, int]:
              """Keep every column inside the viewport, reserving status width first."""
              available = max(len(TABLE_COLUMNS), int(available))
              minimums = {key: max(1, (minimums or {}).get(key, value[2])) for key, value in TABLE_COLUMNS.items()}
              keys = list(TABLE_COLUMNS)
              if available < sum(minimums.values()):
                  status = min(minimums["status"], available - len(keys) + 1)
                  keys.remove("status")
                  budget = available - status - len(keys)
                  weights = {key: minimums[key] for key in keys}
                  widths = {"status": status, **{key: 1 for key in keys}}
              else:
                  widths = dict(minimums)
                  budget = available - sum(widths.values())
                  weights = {key: max(1, TABLE_COLUMNS[key][1] - minimums[key]) for key in keys}
              total = sum(weights.values())
              shares = {key: budget * weights[key] / total for key in keys}
              for key in keys:
                  widths[key] += int(shares[key])
              remainder = available - sum(widths.values())
              for key in sorted(keys, key=lambda key: shares[key] % 1, reverse=True)[:remainder]:
                  widths[key] += 1
              return {key: widths[key] for key in TABLE_COLUMNS}


          def wrap_cell_text(value: str, max_width: int, measure) -> str:
              """Wrap without deleting characters or shortening the displayed value."""
              output = []
              for paragraph in str(value).split("\n"):
                  remaining = paragraph
                  while remaining and measure(remaining) > max_width:
                      low, high = 1, len(remaining)
                      while low < high:
                          middle = (low + high + 1) // 2
                          if measure(remaining[:middle]) <= max_width:
                              low = middle
                          else:
                              high = middle - 1
                      output.append(remaining[:low])
                      remaining = remaining[low:]
                  output.append(remaining)
              return "\n".join(output)


          def parse_age(value: str) -> int | None:
              match = re.fullmatch(r"(\d{1,3})\s*岁?", optional_text(value))
              if match and 0 <= int(match.group(1)) <= 150:
                  return int(match.group(1))
              return None


          def parse_gender(value: str) -> str:
              value = optional_text(value)
              mapping = {"m": "男", "male": "男", "男性": "男", "f": "女", "female": "女", "女性": "女"}
              if re.fullmatch(r"[男女](?:\s*\d{1,3}\s*岁)?", value):
                  return value[0]
              return mapping.get(value.casefold(), value)


          def merge_recipient_details(current: Recipient, incoming: Recipient) -> None:
              for name in ("nickname", "gender", "region", "ip_region"):
                  if not getattr(current, name) and getattr(incoming, name):
                      setattr(current, name, getattr(incoming, name))
              if current.age is None and incoming.age is not None:
                  current.age = incoming.age
              for name in ("sources", "raw_details"):
                  target = getattr(current, name)
                  target.extend(value for value in getattr(incoming, name) if value not in target)


          def filter_records(records: list[Recipient], query: str = "", source: str = "全部来源",
                             gender: str = "全部性别", age_mode: str = "全部年龄", min_age: int | None = None,
                             max_age: int | None = None, region_query: str = "", region_field: str = "任一地区") -> list[Recipient]:
              if (min_age is not None and not 0 <= min_age <= 150) or (max_age is not None and not 0 <= max_age <= 150):
                  raise ValueError("年龄范围请填写 0–150 之间的整数。")
              if min_age is not None and max_age is not None and min_age > max_age:
                  raise ValueError("最小年龄不能大于最大年龄。")
              query = query.strip().casefold()
              region_query = re.sub(r"\s+", "", region_query).casefold()
              matches = []
              for record in records:
                  if query and query not in (record.nickname + " " + record.douyin_id).casefold():
                      continue
                  if source != "全部来源" and source not in record.sources:
                      continue
                  if (gender == "未填写" and record.gender) or (gender not in {"全部性别", "未填写"} and record.gender != gender):
                      continue
                  if (age_mode == "已填年龄" and record.age is None) or (age_mode == "未填年龄" and record.age is not None):
                      continue
                  if min_age is not None and (record.age is None or record.age < min_age):
                      continue
                  if max_age is not None and (record.age is None or record.age > max_age):
                      continue
                  regions = [record.region] if region_field == "资料地区" else [record.ip_region] if region_field == "IP属地" else [record.region, record.ip_region]
                  if region_query and not any(region_query in re.sub(r"\s+", "", text).casefold() for text in regions):
                      continue
                  matches.append(record)
              return matches


          def sort_records(records: list[Recipient], column: str = "", descending: bool = False,
                           statuses: dict[str, str] | None = None) -> list[Recipient]:
              if not column:
                  return list(records)
              def key(record):
                  values = {"name": record.nickname, "id": record.douyin_id, "gender": record.gender,
                            "age": record.age, "region": record.region, "ip_region": record.ip_region,
                            "source": " / ".join(record.sources), "status": (statuses or {}).get(record.douyin_id, "待开始")}
                  value = values.get(column, "")
                  return value.casefold() if isinstance(value, str) else value
              known = [record for record in records if key(record) not in (None, "")]
              missing = [record for record in records if key(record) in (None, "")]
              return sorted(known, key=key, reverse=descending) + missing


          def recipient_details_text(record: Recipient, status: str = "待开始") -> str:
              fields = [("昵称", record.nickname), ("抖音号", record.douyin_id), ("性别", record.gender),
                        ("年龄", f"{record.age} 岁" if record.age is not None else ""),
                        ("资料地区", record.region), ("IP属地", record.ip_region),
                        ("来源", " / ".join(record.sources)), ("状态", status)]
              text = "\n\n".join(f"{label}：{value or '未填写'}" for label, value in fields)
              if record.raw_details:
                  text += "\n\n原始资料：\n\n" + "\n\n".join(record.raw_details)
              return text


          def parse_text(text: str, source: str = "导入名单") -> ImportResult:
              """Accept supplied labeled TXT, one ID per line, and headed CSV/TSV."""
              result = ImportResult([])
              lines = [line.strip() for line in text.lstrip("\ufeff").splitlines()
                       if line.strip() and not line.lstrip().startswith("#")]
              if not lines:
                  return result
              first = lines[0]
              delimiter = "\t" if "\t" in first else ("," if "," in first else "，")
              first_cells = next(csv.reader([first], delimiter=delimiter))
              headers = [normalize_header(cell) for cell in first_cells]
              headed = any(header in ID_HEADERS for header in headers)
              id_column = next((i for i, h in enumerate(headers) if h in ID_HEADERS), None)
              name_column = next((i for i, h in enumerate(headers) if h in NAME_HEADERS), None)
              source_column = next((i for i, h in enumerate(headers) if h in SOURCE_HEADERS), None)
              gender_column = next((i for i, h in enumerate(headers) if h in GENDER_HEADERS), None)
              age_column = next((i for i, h in enumerate(headers) if h in AGE_HEADERS), None)
              region_column = next((i for i, h in enumerate(headers) if h in REGION_HEADERS), None)
              ip_column = next((i for i, h in enumerate(headers) if h in IP_REGION_HEADERS), None)
              seen: dict[str, Recipient] = {}

              def add(value: str, nickname: str = "", label: str = source, gender: str = "", age: str = "",
                      region: str = "", ip_region: str = "", raw: str = "") -> None:
                  value = value.strip().lstrip("\ufeff").removeprefix("@").strip()
                  if not valid_id(value):
                      result.skipped += 1
                      return
                  result.parsed += 1
                  labels = [part.strip() for part in label.split(" / ") if part.strip()] or [source]
                  record = Recipient(value, nickname.strip(), list(dict.fromkeys(labels)), parse_gender(gender),
                                     parse_age(age), optional_text(region), optional_text(ip_region),
                                     [f"{source}：{raw}"] if raw else [])
                  if value in seen:
                      result.duplicates += 1
                      merge_recipient_details(seen[value], record)
                      return
                  seen[value] = record
                  result.records.append(record)

              if headed:
                  try:
                      for row in csv.reader(lines[1:], delimiter=delimiter, strict=True):
                          if id_column is None or len(row) <= id_column:
                              result.skipped += 1
                              continue
                          nickname = row[name_column] if name_column is not None and len(row) > name_column else ""
                          label = row[source_column] if source_column is not None and len(row) > source_column else source
                          def cell(column):
                              return row[column] if column is not None and len(row) > column else ""
                          gender = cell(gender_column)
                          age = cell(age_column)
                          if not age and (match := re.fullmatch(r"[男女]\s*(\d{1,3}\s*岁)", gender.strip())):
                              age = match.group(1)
                          raw = " | ".join(f"{headers[i]}：{value}" for i, value in enumerate(row) if i < len(headers))
                          add(row[id_column], nickname, label, gender, age, cell(region_column), cell(ip_column), raw)
                  except csv.Error as exc:
                      raise ValueError(f"CSV 格式有误：{exc}") from exc
                  return result

              for line in lines:
                  match = LABELED_ID.search(line)
                  if match:
                      nickname = ""
                      gender = age = ""
                      before_id = line[:match.start()]
                      if "昵称" in before_id:
                          nickname = before_id.split("昵称", 1)[1].strip()
                          demographic = re.search(r"\s{2,}(空|[男女](?:\s*\d{1,3}\s*岁)?|\d{1,3}\s*岁)\s*$", nickname)
                          if demographic:
                              value = demographic.group(1)
                              nickname = nickname[:demographic.start()].strip()
                              gender = value[0] if value[0] in "男女" else ""
                              age_match = re.search(r"\d{1,3}\s*岁", value)
                              age = age_match.group(0) if age_match else ""
                      region, ip_region = extract_locations(line)
                      add(match.group(1), nickname, source, gender, age, region, ip_region, line)
                  elif "昵称" in line or "资料位置" in line:
                      result.skipped += 1
                  else:
                      # Bare-ID files may also separate IDs with commas, semicolons or tabs.
                      for token in re.split(r"[\s,，;；]+", line):
                          if token:
                              add(token)
              return result


          def read_list(path: Path) -> ImportResult:
              if path.stat().st_size > MAX_FILE_BYTES:
                  raise ValueError("单个文件不得超过 5 MB。")
              return parse_text(decode_file(path.read_bytes()), source_name(path.name))


          def merge_records(existing: list[Recipient], incoming: list[Recipient]) -> tuple[int, int]:
              by_id = {r.douyin_id: r for r in existing}
              added = repeated = 0
              new_ids = {r.douyin_id for r in incoming if r.douyin_id not in by_id}
              if len(existing) + len(new_ids) > MAX_RECIPIENTS:
                  raise ValueError(f"名单最多支持 {MAX_RECIPIENTS:,} 人，请拆分文件。")
              for record in incoming:
                  current = by_id.get(record.douyin_id)
                  if current is not None:
