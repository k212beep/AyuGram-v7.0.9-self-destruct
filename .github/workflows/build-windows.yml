              def test_shutdown_waits_for_cancelled_worker_without_publishing_success(self):
                  entered = threading.Event()
                  def slow_read(paths, kind, target, event):
                      entered.set()
                      event.wait(3)
                      raise CollectionCancelled()
                  importer = CollectionImporter()
                  with mock.patch("app.read_collection_batch", side_effect=slow_read):
                      importer.request([Path("unused.txt")], "粉丝", "owner", Path("unused"))
                      self.assertTrue(entered.wait(2))
                      with self.assertRaises(ValueError):
                          importer.request([], "粉丝", "owner", Path("unused"))
                      importer.shutdown()
                  self.assertFalse(importer.pending)
                  self.assertTrue(all(not worker.is_alive() for worker in importer.workers))
                  self.assertIsNone(importer.poll())


