              def test_visibility_and_masking(self):
                  profile = AccountProfile("0000012345", "张三")
                  self.assertIn("张三", profile_display_text(profile))
                  self.assertIn("0000012345", profile_display_text(profile))
                  profile.show_account = False
                  self.assertEqual(profile_display_text(profile), "张三")
                  profile.show_account = True
                  profile.show_nickname = False
                  profile.mask_account = True
                  text = profile_display_text(profile)
                  self.assertNotIn("张三", text)
                  self.assertNotIn("0000012345", text)
                  self.assertIn("000****345", text)
                  profile.show_account = False
                  self.assertEqual(profile_display_text(profile), "")

              def test_short_identifier_is_fully_masked(self):
