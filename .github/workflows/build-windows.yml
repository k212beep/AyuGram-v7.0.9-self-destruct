                  canvas = self.media_cover_canvas
                  if self.media_preview_source is not None:
                      self.media_preview_photo = self.draw_media_image(canvas, self.media_preview_source)
                  else:
                      canvas.delete("all")
                      canvas.create_text(max(24, canvas.winfo_width()) / 2, max(24, canvas.winfo_height()) / 2,
                                         text=self.media_preview_placeholder, width=max(16, canvas.winfo_width() - 24),
                                         fill=COLORS["muted"], font=("Microsoft YaHei UI", ui_font_size(10)), justify="center")

