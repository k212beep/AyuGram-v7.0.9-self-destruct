              def import_files(self) -> None:
                  if self.session.active or self.collection_importer.pending:
                      return
                  paths = filedialog.askopenfilenames(title="导入接收人名单（支持多选）", filetypes=[
                      ("名单文件", "*.txt *.csv *.tsv"), ("文本文件", "*.txt"), ("所有文件", "*.*")])
                  if not paths:
