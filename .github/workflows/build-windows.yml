          # 抖音群发工作台

          深色中文桌面界面，支持导入接收人、编辑消息、群发任务交互、暂停、继续、停止和导出日志。
          当前程序提供名单导入、内容编辑与本地任务队列；“已处理”表示队列处理完成。
          程序未接入抖音消息接口。
          程序无需抖音登录，无需 Cookie 或 API 密钥。

          ## 只上传一个 YML 即可构建

          1. 打开自己的 GitHub 仓库，在**默认分支**选择 **Add file → Create new file**。
          2. 文件名填写 `.github/workflows/build-windows.yml`。
          3. 将交付的 `build-windows.yml` 全文粘贴进去，提交保存。文件中已经包含完整程序源码和测试，不需要再上传 Python 源码、名单或安装包。
          4. 提交此工作流文件后会自动构建。也可打开 **Actions → Build Windows App → Run workflow → Run workflow** 手动运行。
          5. 构建成功后，在该次运行页面底部的 **Artifacts** 下载 `DouyinSender-Windows-x64`。
          6. 解压后双击 `DouyinSender.exe`。目标环境为 Windows 10 / 11 64 位，无需安装 Python。

          提交或修改 `.github/workflows/build-windows.yml` 后会自动构建，同时保留手动触发；不需要配置任何 Secrets。
          工作流使用 Windows 环境构建，并依次执行解析/队列测试、源码 GUI 检查、打包后的 EXE GUI 检查。
          若某项检查失败，该次运行不会发布 EXE 下载产物。`smoke-source.json` 和 `smoke-exe.json` 记录成功检查结果。

          ## 导入你的四份名单

          启动 EXE 后点击“导入名单”，按住 Ctrl 可同时选择上传的四份 TXT。
          程序直接从“抖音号”字段取 ID，并提取昵称；会识别共同好友、关注、粉丝和评论区来源。

          本次四份附件共 282 条记录，按抖音号**原样精确匹配**后有 225 个不同 ID、57 条重复。
          也可以导入单独交付的 `导入名单_225人.csv`。真实名单不嵌入构建工作流和源码压缩包。
          若导入原始四份 TXT，会显示“已合并重复 57”；若导入已去重 CSV，则显示“已合并重复 0”。

          支持 UTF-8、UTF-8 BOM、带 BOM 的 UTF-16 / UTF-32 和 GB18030 编码。
          支持下列格式，ID 按文本保留，包含前导零或小数点的 ID 不会被转成数值：

          ```text
          昵称 联系人甲  空  抖音号 demo_001  资料位置 空  IP属地 空
          ```

          ```text
          demo_001
          demo_002
          ```

          ```csv
          抖音号,昵称,来源
          demo_001,联系人甲,示例名单
          demo_002,联系人乙,示例名单
          ```

          单个文件上限 5 MB，当前名单最多 20,000 人。导入为追加模式，重复 ID 合并来源和缺失昵称。
          ID 大小写保持原样；不同大小写不会被自动合并。TXT 中无法识别的项目会计入跳过数量。

          ## 界面细节

          - 昵称 / 抖音号搜索、来源筛选、批量选中。
          - 消息支持 `{昵称}`、`{抖音号}`，右侧预览会替换为对应接收人的信息。
          - 消息上限 2,000 字，发送间隔可填 0.1–10 秒 / 人。
          - 默认处理全部已导入名单；搜索和来源筛选只影响显示。勾选“仅处理选中”后，才限定为表格中选中的人。
          - 任务开始后锁定名单和编辑器；暂停后可继续，停止后保留本轮状态，再次开始创建新一轮。
          - 实时进度、用时、本轮待处理数量、运行日志；日志导出为带 BOM 的 UTF-8 CSV。
          - 名单和群发内容只在当前窗口内存中保存，关闭后清除；仅手动导出日志会写出所选文件。
          - 标题、按钮、进度、提示和运行日志采用常规任务管理文案，右上角显示当前版本。

          ## v1.2.0 界面调整

          统一标题、按钮、状态、提示与日志的任务管理文案；移除模式角标和示例入口。
          主按钮为“开始群发”，名单状态为“等待处理 / 已处理”，进度为“正在处理 / 任务完成”。
          当前版本保留自动构建；上传工作流后，重新下载本次构建的 EXE 即可看到调整。

          ## 本地运行与构建

          安装包含 Tkinter 的 Python 3.12 后：

          ```powershell
          python app.py
          python -m unittest -v
          python app.py --smoke-test smoke-source.json
          python -m pip install PyInstaller==6.22.3
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name DouyinSender app.py
          ```

          可直接运行 `build_windows.bat`。输出位于 `dist/DouyinSender.exe`。
          本地修改源码后，运行 `python make_workflow.py` 可重新生成包含最新源码的独立工作流。
          若缺少 Tk/Tcl 或程序启动失败，错误信息会写到用户 TEMP 目录中的 `douyin-sender-error.log`。

          ## 当前验证范围

          交付前已在当前环境执行名单解析和任务队列逻辑测试，并检查 YML 与内嵌源码一致性。
          当前环境没有 Windows，Windows GUI 和 EXE 检查会在你手动运行 GitHub Actions 后实际执行。
          当前交付物是源码与编译配置；EXE 由该工作流成功运行后生成。

          ## 官方参考

          - [GitHub 手动运行工作流](https://docs.github.com/en/actions/how-tos/manage-workflow-runs/manually-run-a-workflow)
          - [actions/setup-python](https://github.com/actions/setup-python)
          - [actions/upload-artifact](https://github.com/actions/upload-artifact)
          - [PyInstaller 用法](https://pyinstaller.org/en/stable/usage.html)
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'README.md'), $payload + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))

      - name: Test list parsing and task queue
        run: |
          python -m unittest -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Windows GUI from source
        run: |
          python app.py --smoke-test smoke-source.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path smoke-source.json)) { throw 'Source GUI smoke report missing' }

      - name: Install pinned build dependency
        run: |
          python -m pip install PyInstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build standalone Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name DouyinSender app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check packaged EXE and prepare download
        run: |
          $exe = (Resolve-Path 'dist/DouyinSender.exe').Path
          $report = Join-Path $PWD 'smoke-exe.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', ('"' + $report + '"')) -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged EXE startup timed out'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Packaged EXE failed: $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'EXE GUI smoke report missing' }
          $result = Get-Content $report -Raw -Encoding utf8 | ConvertFrom-Json
          if ($result.ok -ne $true) { throw 'EXE GUI smoke check failed' }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $exe 'release/DouyinSender.exe'
          Copy-Item README.md 'release/README.md'
          Copy-Item smoke-source.json,smoke-exe.json -Destination release
          $hash = (Get-FileHash 'release/DouyinSender.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS.txt'), "$hash  DouyinSender.exe`n", [Text.UTF8Encoding]::new($false))
          "Built DouyinSender.exe. Download DouyinSender-Windows-x64 from Artifacts." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: DouyinSender-Windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
