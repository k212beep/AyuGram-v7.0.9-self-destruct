          class CollectionImporter:
              """Read and save user-selected files without using Tk or a network service."""
              def __init__(self) -> None:
                  self.pending = False
                  self.generation = 0
                  self.cancel_event: threading.Event | None = None
                  self.results = SimpleQueue()
                  self.workers: list[threading.Thread] = []

              def request(self, paths, kind: str, target: str, directory: Path, existing_ids=()) -> None:
                  if self.pending:
                      raise ValueError("名单正在导入，请等待当前任务完成。")
                  self.generation += 1
                  generation = self.generation
                  event = self.cancel_event = threading.Event()
                  self.pending = True
                  known = set(existing_ids)

                  def run():
                      try:
                          batch = read_collection_batch(paths, kind, target, event)
                          if len(known | {r.douyin_id for r in batch.records}) > MAX_RECIPIENTS:
                              raise ValueError(f"合并后的名单超过 {MAX_RECIPIENTS:,} 人，请先清理名单或拆分文件。")
                          saved = save_collection_batch(batch, directory, event)
                          result = CollectionResult(batch, saved)
                      except CollectionCancelled:
                          return
                      except PermissionError:
                          result = CollectionResult(error="无法保存文件，请检查保存目录权限或关闭占用程序。")
                      except (OSError, ValueError, UnicodeError) as exc:
                          result = CollectionResult(error=str(exc))
                      except Exception:
                          result = CollectionResult(error="名单导入或保存失败，请检查文件后重试。")
                      if not event.is_set():
                          self.results.put((generation, result))

                  worker = threading.Thread(target=run, name="collection-import", daemon=True)
                  self.workers = [thread for thread in self.workers if thread.is_alive()]
                  self.workers.append(worker)
                  worker.start()

              def poll(self) -> CollectionResult | None:
                  while True:
                      try:
                          generation, result = self.results.get_nowait()
                      except Empty:
                          return None
                      if generation == self.generation:
                          self.pending = False
                          return result

              def shutdown(self) -> None:
                  if self.cancel_event is not None:
                      self.cancel_event.set()
                  self.generation += 1
                  self.pending = False
                  deadline = time.monotonic() + 3
                  for thread in self.workers:
                      thread.join(timeout=max(0, deadline - time.monotonic()))


          class Session:
              """Deterministic local queue, with no network or account integration."""
              def __init__(self) -> None:
                  self.state = "idle"
                  self.queue: list[Recipient] = []
                  self.template = ""
                  self.cursor = 0
                  self.statuses: dict[str, str] = {}
                  self.started_at: float | None = None
                  self.elapsed_before = 0.0

              @property
              def active(self) -> bool:
                  return self.state in {"running", "paused"}

              @property
              def remaining(self) -> int:
                  return len(self.queue) - self.cursor

              @property
              def elapsed(self) -> float:
                  return self.elapsed_before + (time.monotonic() - self.started_at if self.started_at is not None else 0)

              def start(self, records: list[Recipient], template: str) -> None:
                  if self.active:
                      raise ValueError("请先停止当前任务。")
                  if not records:
                      raise ValueError("请先导入名单；选择“仅选中”时，请在名单中选中接收人。")
                  if not template.strip():
                      raise ValueError("请填写群发内容。")
                  if len(template) > MAX_MESSAGE:
                      raise ValueError(f"群发内容不得超过 {MAX_MESSAGE} 字。")
                  for record in records:
                      if len(render_message(template, record)) > MAX_MESSAGE:
                          raise ValueError(f"接收人 {record.nickname or record.douyin_id} 替换变量后的内容超过 {MAX_MESSAGE} 字。")
                  self.queue = list(records)
                  self.template = template
                  self.cursor = 0
                  self.statuses = {r.douyin_id: "等待处理" for r in records}
                  self.elapsed_before = 0.0
                  self.started_at = time.monotonic()
                  self.state = "running"

              def tick(self) -> Recipient | None:
                  if self.state != "running" or self.cursor >= len(self.queue):
                      return None
                  recipient = self.queue[self.cursor]
                  self.statuses[recipient.douyin_id] = "已处理"
                  self.cursor += 1
                  if self.cursor == len(self.queue):
                      self._freeze_clock()
                      self.state = "completed"
                  return recipient

              def _freeze_clock(self) -> None:
                  self.elapsed_before = self.elapsed
                  self.started_at = None

              def pause(self) -> None:
                  if self.state == "running":
                      self._freeze_clock()
                      self.state = "paused"

              def resume(self) -> None:
                  if self.state == "paused":
                      self.started_at = time.monotonic()
                      self.state = "running"

              def stop(self) -> None:
                  if self.active:
                      self._freeze_clock()
                      for recipient in self.queue[self.cursor:]:
                          self.statuses[recipient.douyin_id] = "已停止"
                      self.state = "stopped"


