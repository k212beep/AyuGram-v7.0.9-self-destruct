name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'commentdesk/**'
      - 'tests/**'
      - 'assets/**'
      - 'build.py'
      - 'requirements-build.txt'
      - 'QUICKSTART.txt'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Test import, matching, replies and export
        run: python -m unittest discover -s tests -v

      - name: Check empty desktop startup
        run: python app.py --smoke-test --smoke-test-report source-smoke.json

      - name: Build portable EXE
        run: python build.py

      - name: Smoke test packaged EXE
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE 'dist/CommentDesk.exe'
          $exeProcess = Start-Process -FilePath $exePath -ArgumentList @('--smoke-test', '--smoke-test-report', 'frozen-smoke.json') -PassThru
          if (-not $exeProcess.WaitForExit(90000)) {
            $exeProcess.Kill()
            throw 'Packaged EXE smoke test timed out.'
          }
          if ($exeProcess.ExitCode -ne 0) {
            throw "Packaged EXE exited with code $($exeProcess.ExitCode)."
          }
          if (-not (Test-Path 'frozen-smoke.json')) {
            throw 'The packaged EXE did not produce its smoke test report.'
          }
          $report = Get-Content 'frozen-smoke.json' -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.frozen) {
            throw 'Packaged EXE smoke test failed.'
          }
          if (-not $report.empty_startup -or $report.users -ne 0 -or $report.comments -ne 0) {
            throw 'The application must start empty and wait for manual import.'
          }

      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: CommentDesk-Windows-x64
          path: dist/CommentDesk-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload smoke test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CommentDesk-test-reports
          path: |
            source-smoke.json
            frozen-smoke.json
          if-no-files-found: ignore
          retention-days: 14
