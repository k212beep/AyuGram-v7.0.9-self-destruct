          # 抖音群发工作台

          深色中文桌面界面，支持导入接收人、编辑消息、群发任务交互、暂停、继续、停止和导出日志。
          当前程序提供名单导入、内容编辑与本地任务队列；“已处理”表示队列处理完成。
          程序未接入抖音消息或资料采集接口。“资料采集”窗口管理手动导入的数据，抖音号查询检索当前本地名单。
          程序无需抖音登录，无需 Cookie 或 API 密钥。

          ## 只上传一个 YML 即可构建

          1. 打开自己的 GitHub 仓库，在**默认分支**选择 **Add file → Create new file**。
          2. 文件名填写 `.github/workflows/build-windows.yml`。
          3. 将交付的 `build-windows.yml` 全文粘贴进去，提交保存；更新时编辑并覆盖原文件。不要另外保留 `build-windows (2).yml` 等旧版本副本，否则每个副本都会触发构建。文件中已经包含完整程序源码和测试，不需要再上传 Python 源码、名单或安装包。
          4. 提交此工作流文件后会自动构建。也可打开 **Actions → Build Windows App → Run workflow → Run workflow** 手动运行。
          5. 构建成功后，在该次运行页面底部的 **Artifacts** 下载 `DouyinSender-Windows-x64`。
          6. 解压后双击 `DouyinSender.exe`。目标环境为 Windows 10 / 11 64 位，无需安装 Python。

          此工作流在每次 push 提交后自动构建，同时保留手动触发；不需要配置任何 Secrets。
          已移除固定文件名的路径限制，工作流文件可使用其他 `.yml` 或 `.yaml` 文件名，但必须位于仓库的 `.github/workflows/` 目录。
          上传后需点击“Commit changes”完成提交，并在仓库设置中允许 GitHub Actions 运行。
          工作流使用 Windows 环境构建，并依次执行解析/队列测试、源码 GUI 检查、打包后的 EXE GUI 检查。
          若某项检查失败，该次运行不会发布 EXE 下载产物。`smoke-source.json` 和 `smoke-exe.json` 记录检查结果。
          失败时会额外上传 `DouyinSender-diagnostics-…`，其中保存已有的检查报告和错误日志；具体报错也可在红色失败步骤中查看。

          ## 导入你的四份名单

          启动 EXE 后点击“导入名单”，按住 Ctrl 可同时选择上传的四份 TXT。
          程序直接从“抖音号”字段取 ID，并提取昵称；会识别共同好友、关注、粉丝和评论区来源。

          本次四份附件共 282 条记录，按抖音号**原样精确匹配**后有 225 个不同 ID、57 条重复。
          也可以导入单独交付的新版 `导入名单_225人.csv`，包含性别、年龄、资料地区和 IP 属地。真实名单不嵌入构建工作流和源码压缩包。
          若导入原始四份 TXT，会显示“已合并重复 57”；若导入已去重 CSV，则显示“已合并重复 0”。

          支持 UTF-8、UTF-8 BOM、带 BOM 的 UTF-16 / UTF-32 和 GB18030 编码。
          支持下列格式，ID 按文本保留，包含前导零或小数点的 ID 不会被转成数值：

          ```text
          昵称 联系人甲  空  抖音号 demo_001  资料位置 空  IP属地 空
          ```

          ```text
          demo_001
          demo_002
          ```

          ```csv
          抖音号,昵称,性别,年龄,资料地区,IP属地,来源
          demo_001,联系人甲,女,29,江苏 镇江,江苏,导入名单
          demo_002,联系人乙,男,31,上海 静安,上海,导入名单
          ```

          单个文件上限 5 MB，当前名单最多 20,000 人。导入为追加模式，重复 ID 合并来源和缺失昵称。
          ID 大小写保持原样；不同大小写不会被自动合并。TXT 中无法识别的项目会计入跳过数量。

          ## 界面细节

          - 昵称 / 抖音号搜索、来源、性别、年龄区间、年龄是否填写、地区组合筛选、批量选中。
          - 表格包含昵称、抖音号、性别、年龄、资料地区、IP 属地、来源和状态；列宽随窗口自动分配，长内容完整换行，无需水平滚动。
          - 点击任意表头切换升降序；年龄按数值排序，缺失值始终排在最后。双击接收人或选中后按 Enter 查看完整字段与导入原文。
          - 消息支持 `{昵称}`、`{抖音号}`，右侧预览会替换为对应接收人的信息。
          - 消息上限 200 字，发送间隔可填 0.1–10 秒 / 人。变量替换后的每条消息也必须在 200 字以内。
          - 任务范围默认采用“当前筛选结果”，可切换“全部导入名单”或“仅选中的接收人”。点击“全选结果”或在表格按 Ctrl+A 可选中当前结果。
          - 开始后固定本轮接收人和顺序；运行期间改变筛选只影响显示，下次开始才采用新的结果。
          - 任务开始后锁定名单和编辑器；暂停后可继续，停止后保留本轮状态，再次开始创建新一轮。
          - 实时进度、用时、本轮待处理数量、运行日志；日志导出为带 BOM 的 UTF-8 CSV。
          - 工作台名单和群发内容保存在当前会话；通过“资料采集”保存的 CSV 会独立保留在本机。账号显示设置单独保存，下次启动自动恢复。
          - 标题、按钮、进度、提示和运行日志采用常规任务管理文案，左侧底部显示版本，右上角显示设置的账号信息。

          ## v1.3.0 账号显示设置

          点击窗口右上角或左侧菜单的“账号设置”，填写账号和昵称，再点击“保存设置”。
          支持仅显示账号、仅显示昵称、同时显示两项或全部隐藏；还可勾选“遮挡账号”隐藏中间部分。
          长账号或昵称会在页头缩略显示，设置窗口中保留完整内容；“清空信息”后点击保存可清除已存信息。
          取消设置窗口会保留原设置。

          这些字段用于自定义工作台显示，不会生成登录凭据、改变真实认证状态或改变消息模板中的接收人变量。
          程序不会索取或保存抖音密码、Cookie、验证码。
          Windows 设置文件位于 `%LOCALAPPDATA%/DouyinSender/settings.json`，只存账号、昵称与显示选项。
          账号设置文件损坏时会恢复默认显示，原文件不会自动覆盖，可在设置中重新保存。

          ## v1.4.0 名单资料、筛选与排序

          TXT 导入会保留原文中的性别、年龄、资料地区和 IP 属地；重复 ID 合并来源，并补全缺失资料。
          同一字段存在不同值时保留首次导入的非空值，原始行可在资料详情中核对。
          未提供的信息显示“未填写”，不从昵称或评论地区分布推断性别、年龄和 IP 属地。
          资料地区与 IP 属地分开显示、分开筛选；地区支持省、市关键词和可选的完整地区值。
          年龄区间两端均包含，允许单独设置下限或上限；可单独查看已填或未填年龄。
          “重置”会清除筛选和排序，恢复原始导入顺序；不会清除名单。

          若先前导入的是只包含 ID、昵称和来源的旧 CSV，请重新导入原始 TXT 或本次新版完整资料 CSV。
          旧版 CSV 仍可导入，但其中没有保存的资料会显示为“未填写”。

          ## v1.5.0 列表、媒体规则和计时

          接收人列表采用紧凑行高，名单、消息和媒体保持三栏同时显示；v1.10.0 将整套界面缩小至约 85%。
          日志与操作按钮固定在主界面下方，记录支持滚动查看和导出。

          在“关注后媒体”中点击“导入媒体”可选择图片、视频或音频，界面显示完整文件名、类型与大小。
          勾选“对方关注后发送媒体文件”后，点击“关注回执”导入回执 TXT / CSV / TSV；回执 ID 与当前任务范围匹配后，自动加入本地媒体任务队列。
          同一 ID 和同一媒体文件的重复回执只生成一次任务；选择其他文件可以生成新任务。
          文件丢失或变更会标为异常；重新选择可用文件后可重新导入回执。
          关闭规则、清除媒体或点击“停止”会取消未处理的媒体任务。规则不主动轮询抖音，也不自行生成关注事件；尚未接入真实关注通知和媒体发送接口。
          文件类型依据扩展名识别，媒体预览功能见下方 v1.7.0 说明。

          右下角每秒读取运行电脑的本地日期和时间；Windows 时区与系统时间改变后，显示也随之更新。
          底部“本次运行”从程序启动起计数；“已运行”支持设置初始时长，然后从设定值继续累计。
          点击“计时设置”可填写时、分、秒，保存后立即生效；初始值写入 `%LOCALAPPDATA%/DouyinSender/runtime-settings.json`，下次启动从该初始值开始。
          计时采用单调时钟，不受手动调整 Windows 系统时间影响。

          本程序的消息上限调整为 200 字；这是一项界面产品设置，不作为抖音官方私信规则说明。
          字数包含模板字符与替换后的个性化内容，超过上限会提示修改。

          当前版本保留任意 push 自动构建；上传工作流后，重新下载本次构建的 EXE 即可看到调整。

          ## v1.6.0 完整名单显示与导入修正

          名单表格采用 9 号字体，状态列保留“等待处理”等状态所需的宽度，所有列始终放在当前表格宽度内。
          较长的昵称、抖音号、资料地区和来源自动换行，行高随完整内容调整；窗口缩放时重新分配列宽。
          统计卡片改为单行的小字号布局，为下方名单留出空间。

          “导入名单”按钮左侧显示成功导入的完整文件名，多文件逐一列出；长文件名自动换行，不使用省略号。
          追加导入会保留之前的文件名，重复导入同一路径不会重复列出；失败或无有效 ID 的文件不会显示为已导入。
          清空名单时同时清空已导入文件名。

          地区提取改为按字段标签确定边界，兼容单空格、双空格、制表符、全角空格以及逗号、分号、竖线分隔。
          资料地区与 IP 属地可互换字段顺序；支持“资料位置 / 资料地区 / 资料所在地”和“IP 属地 / IP归属地 / IP地区”等写法。
          CSV / TSV 的表头也兼容空格、大小写与常见别名。评论次数中的地区分布不会作为资料地区或 IP 属地。

          已逐条核对本次原始附件的 282 行，并校验去重 CSV 的字段一致性：225 人中，86 人有资料地区，156 人有 IP 属地。
          原始文件写“空”或没有提供的字段继续显示“未填写”。请在新版 EXE 中重新导入原始 TXT 或完整资料 CSV，旧三列表格没有保存地区信息。

          构建包含 49 项逻辑测试，并在 Windows 源码与 EXE 检查中验证三个窗口宽度下的列宽、状态可见性、完整换行、文件名显示和清空操作。

          ## v1.7.0 视频封面与媒体预览

          导入视频后，主界面右侧“媒体素材”面板直接显示该视频的实际画面。
          上方显示完整文件名，下方显示文件类型与大小，方便确认当前选中的视频。
          封面从视频前段画面中提取，横屏与竖屏均保持原有比例；点击封面或“高清预览”可打开放大的预览窗口。
          导入图片时显示图片预览；音频显示对应文件信息与音频占位提示。

          封面读取在后台进行。更换文件时立即清除旧封面并取消旧任务；清除媒体时同步清除预览和预览窗口。
          损坏文件或读取超时会显示提示，可重新导入；程序退出时会停止正在读取封面的任务。
          Windows 编译配置会将视频读取组件打入 EXE，并检查打包后的视频封面读取，无需单独安装播放器或视频工具。

          Windows 源码与 EXE 检查会使用真实短视频验证封面的颜色、横竖屏比例、放大、切换、清除、图片预览和异常提示。
          封面读取使用 imageio-ffmpeg 0.6.0 所附的 FFmpeg；组件来源与许可证信息一并写入构建产物的 `THIRD_PARTY_NOTICES.txt`。

          ## v1.8.0 竖屏高清预览与界面更新

          针对 1080×1920 的 9:16 竖屏视频，封面保留 1080×1920 分辨率。
          较大的画面等比缩至最长边 1920 像素；较小的画面保持原尺寸。
          缩略预览从完整封面使用 Lanczos 高质量缩放，替代原来的整数抽样，减少细线和文字的锯齿。

          媒体面板提供独立的竖屏封面展示区，与消息内容同时显示。
          封面区域高度随窗口调整；完整文件名、类型、大小、封面尺寸与横竖屏信息集中显示。
          发送规则与关注回执置于独立卡片，导入后按钮切换为“更换文件”。
          整体采用深蓝底色、分层卡片和薄荷绿操作强调色，统一边框、文字与间距。

          点击“高清预览”打开大图：竖屏素材使用更高的预览窗口。
          “适应窗口”完整显示封面；“100% 原尺寸”逐像素显示，可用滚动条、鼠标滚轮或按住拖动查看细节。
          预览底部显示当前缩放比例与封面尺寸；Ctrl+0 适应窗口，Ctrl+1 切换原尺寸，Esc 关闭。
          切换模式与调整窗口时始终从完整封面渲染。

          当前包含 69 项逻辑检查，覆盖真实 1080×1920 / 1920×1080 视频取帧、缩放、细条纹平滑、四角完整性与原尺寸像素保留。
          Windows 源码及 EXE 检查另行验证各区域同屏显示、高清预览、100% 模式和滚动；实际结果由 GitHub Actions 运行后生成。
          构建会一并打包 Pillow 13.0.0 和 FFmpeg 读取组件。

          ## v1.9.0 主界面全部平铺

          主界面采用固定三栏：左侧接收人名单，中间群发内容与消息预览，右侧视频封面与关注后发送规则。
          视频画面完整等比显示在右侧，可直接确认当前素材；“高清预览”用于额外查看原尺寸细节。
          所有面板同时可见，主界面不再设置页签、展开 / 收起或隐藏区域的按钮。
          取消左侧大导航栏，将账号设置、计时设置和导出日志放在顶部，为名单和视频腾出宽度。

          运行日志常驻下方；开始、暂停、停止和进度条放在独立的底部操作栏。
          名单、日志和文字框可在各自区域滚动，主界面使用固定网格排版。
          默认窗口宽度可达 1800 像素，三个面板随窗口分配空间，封面随可用空间等比调整。
          导入视频只更新右侧画面，消息内容和名单保持同屏显示。

          保留 69 项逻辑检查。Windows 源码和 EXE 检查会在四种窗口尺寸下逐一检查主要控件可见且位于父容器内，
          并确认没有页签或折叠按钮；检查结果写入构建产物的 `smoke-source.json` 与 `smoke-exe.json`。

          ## v1.9.1 小窗口布局修复

          修复 Windows 检查中的 `Hidden section` 错误：主容器改用网格，只有三栏工作区伸缩，
          底部日志、开始 / 暂停 / 停止、进度条和时间栏各自保留高度，避免被内容区挤出窗口。
          名单、内容编辑与视频封面仍在同一个界面直接显示。

          Windows 源码和 EXE 检查新增 1060 × 680 最小窗口，保留另外四种窗口尺寸检查，
          同时验证操作栏、本地时间和运行时间完整显示。失败报告会记录控件名称、位置和尺寸，便于定位。

          ## v1.10.0 对齐、评论次数与紧凑界面

          昵称、抖音号、资料地区、IP 属地等文字列的表头和资料统一靠左，并校正标题与单元格边距。
          性别、年龄和评论次数统一居中。窄窗口优先保证表头完整，资料按列宽换行，不需要左右拖动查找状态。

          新增“评论次数”列，支持评论区 TXT 中的 `评论次数 5`、`评论数 12 次`，
          以及 CSV / TSV 中的“评论次数”“评论数”“评论数量”或 `comment_count` 等列名。
          0 显示为 0，缺失或无效数值显示为 —；不会将评论地区分布当成 IP 属地或凭空推算次数。
          同一 ID 重复导入时保留较大的已知次数，不重复相加。

          点击“评论次数”表头可按数字升序 / 降序排序，未知值排在最后。
          名单标题右侧的“评论次数”勾选框控制该列的显示和隐藏，并在下次启动时恢复选择。
          隐藏后数据仍保留，完整资料中也可查看；其余列会自动使用腾出的宽度。

          窗口、字体、控件内外边距与栏宽按约 85% 统一缩小，保留现有配色、三栏和常驻视频预览。
          默认最大窗口约为 1530 × 867，最小为 901 × 578，实际初始尺寸会适应屏幕。
          视频保持等比适配；高清预览的 100% 模式仍按原始画面像素显示。

          ## v1.11.0 资料采集入口与分类导入

          顶部新增“资料采集”，在独立窗口中填写任务抖音号、选择评论区 / 粉丝 / 关注，再选择名单文件。
          主界面继续保留紧凑三栏和常驻视频预览，不增加折叠区或切换媒体页签。
          “查询本地名单”只在当前导入记录中匹配抖音号；任务抖音号用于记录备注，不验证资料与平台账号的归属关系。
          窗口和保存文件均明确标注“手动导入”。

          点击“导入并保存”后，后台实际读取 TXT / CSV / TSV、解析完整字段并去重，再保存一份 CSV。
          所选类型作为本次导入的分类，原始行与文件名称一并保留；已经在工作台中的相同 ID 会合并来源和资料。
          读取期间显示进度；文件真正保存后才显示“导入成功 · 已保存”与“已采集评论区 xx 人（手动导入）”等结果。
          缺失、无效文件或保存失败会显示具体原因，并提供“重试导入”。成功和失败状态来自实际操作结果。

          保存目录为 `%LOCALAPPDATA%/DouyinSender/collections/`，文件名包含类别、任务抖音号、时间和唯一后缀。
          保存内容包括完整资料、评论次数、导入原文、任务抖音号和数据来源；“打开保存位置”可在资源管理器中查看。
          文件在成功写完后才成为正式 CSV；失败或取消的临时文件会清理，不覆盖以前保存的名单。
          关闭采集窗口后导入仍可继续，重新打开可查看完成结果；程序退出时会结束尚未完成的读取。

          主界面底部和采集窗口下方显示当前工作台的评论区、粉丝、关注人数，各类按 ID 分别去重。
          同一人可以属于多个类别；统计数由导入资料产生，不代表平台账号的实际粉丝或关注总量。
          清空工作台后人数归零，已保存的 CSV 仍保留；重启后可重新导入这些文件恢复名单。

          ## 本地运行与构建

          安装包含 Tkinter 的 Python 3.12 后：

          ```powershell
          python -m pip install -r requirements.txt
          python app.py
          python -m unittest -v
          python app.py --smoke-test smoke-source.json
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --collect-all imageio_ffmpeg --copy-metadata imageio-ffmpeg --copy-metadata Pillow --name DouyinSender app.py
          ```

          也可直接运行 `build_windows.bat`，脚本会先安装依赖。输出位于 `dist/DouyinSender.exe`。
          本地修改源码后，运行 `python make_workflow.py` 可重新生成包含最新源码的独立工作流。
          若缺少 Tk/Tcl 或程序启动失败，错误信息会写到用户 TEMP 目录中的 `douyin-sender-error.log`。

          ## 当前验证范围

          交付前已通过 90 项逻辑测试和 YML 内嵌源码一致性校验。
          另在 Linux 的 Tk 8.6 中文界面中通过完整源码 GUI 检查，覆盖 1280 × 768 小屏、901 × 578 最小窗口和多种窗口尺寸，
          验证表头和资料列对应、评论列隐藏 / 恢复、数字排序、缩放、底部操作栏、时间和视频封面可见。
          资料采集窗口另外检查本地抖音号查询、失败后真实重试、三种分类保存、保存文件可重新导入、
          最小窗口控件完整显示，以及关闭采集窗口后后台任务正常完成。
          已使用原有四份附件复核：282 条记录合并为 225 个 ID、57 条重复，评论区 14 人的评论次数全部读出。
          当前环境没有 Windows，Windows GUI 和 EXE 检查会在你上传更新、提交工作流后实际执行。
          当前交付物是源码与编译配置；EXE 由该工作流成功运行后生成。

