              def refresh_clock_labels(self) -> None:
                  self.local_time_var.set(datetime.now().strftime("本地时间：%Y-%m-%d %H:%M:%S"))
                  self.runtime_var.set(f"本次运行 {format_duration(self.runtime_clock.actual)}  ·  已运行 {format_duration(self.runtime_clock.displayed)}")

              def tick_clock(self) -> None:
                  self.clock_timer = None
                  self.refresh_clock_labels()
                  self.clock_timer = self.root.after(1000, self.tick_clock)

              def apply_runtime_duration(self, seconds: int) -> None:
                  save_runtime_offset(self.runtime_path, seconds)
                  self.runtime_clock.set_initial(seconds)
                  self.refresh_clock_labels()
                  self.log("计时", f"初始已运行时长已设为 {format_duration(seconds)}。")
                  self.toast_var.set("计时设置已保存，已运行时长将从设定值继续累计。")

              def open_runtime_settings(self) -> None:
                  if self.runtime_dialog is not None and self.runtime_dialog.winfo_exists():
                      self.runtime_dialog.lift()
                      return
                  dialog = tk.Toplevel(self.root)
                  self.runtime_dialog = dialog
                  dialog.title("计时设置")
                  dialog.configure(bg=COLORS["card"])
                  dialog.resizable(False, False)
                  dialog.transient(self.root)
                  content = tk.Frame(dialog, bg=COLORS["card"])
                  content.pack(fill="both", expand=True, padx=24, pady=20)
                  self.label(content, "初始已运行时长", 15, bold=True).pack(anchor="w")
                  self.label(content, "保存后从设定值继续计数，下一次启动沿用此初始值。", 9, "muted").pack(anchor="w", pady=(8, 12))
                  current = self.runtime_clock.initial_seconds
                  self.runtime_form = [tk.StringVar(value=str(value)) for value in (current // 3600, current // 60 % 60, current % 60)]
                  row = tk.Frame(content, bg=COLORS["card"])
                  row.pack(fill="x", pady=8)
                  for variable, caption, maximum in zip(self.runtime_form, ("时", "分", "秒"), (99999, 59, 59)):
                      tk.Spinbox(row, from_=0, to=maximum, width=5, textvariable=variable, bg=COLORS["input"],
                                 fg=COLORS["text"], buttonbackground=COLORS["line"], relief="flat").pack(side="left", ipady=6)
                      self.label(row, caption, 10, "muted").pack(side="left", padx=(5, 14))
                  self.label(content, f"本次运行：{format_duration(self.runtime_clock.actual)}", 9, "muted").pack(anchor="w", pady=(8, 12))
                  def close_dialog():
                      dialog.grab_release()
                      dialog.destroy()
                      self.runtime_dialog = None
                  def save():
                      try:
                          self.apply_runtime_duration(duration_seconds(*(variable.get() for variable in self.runtime_form)))
                      except (ValueError, OSError) as exc:
                          messagebox.showerror("保存失败", str(exc), parent=dialog)
                          return
                      close_dialog()
                  actions = tk.Frame(content, bg=COLORS["card"])
                  actions.pack(fill="x", pady=(8, 0))
                  self.button(actions, "从零开始", lambda: [v.set("0") for v in self.runtime_form], padx=10).pack(side="left")
                  self.runtime_save_button = self.button(actions, "保存设置", save, primary=True)
                  self.runtime_save_button.pack(side="right")
                  self.button(actions, "取消", close_dialog, padx=10).pack(side="right", padx=8)
                  dialog.protocol("WM_DELETE_WINDOW", close_dialog)
                  dialog.bind("<Escape>", lambda _event: close_dialog())
