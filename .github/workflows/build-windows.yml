                      messagebox.showwarning("部分文件未导入", "\n".join(errors), parent=self.root)

              def load_sample(self) -> None:
                  if self.session.active:
                      return
                  sample = [Recipient(f"demo_{i:03d}", f"示例用户 {i:02d}", ["示例名单"]) for i in range(1, 7)]
                  new, duplicate = merge_records(self.records, sample)
                  self.import_duplicates += duplicate
                  groups = list(dict.fromkeys(s for r in self.records for s in r.sources))
                  self.source_combo.configure(values=["全部来源", *groups])
                  self.refresh_table()
                  self.update_stats()
                  self.toast_var.set(f"已加入 {new} 位示例联系人，可编辑消息后开始任务。")
                  self.log("导入", f"载入示例名单，新增 {new} 人。")

              def clear_list(self) -> None:
                  if self.session.active or not self.records:
                      return
                  if not messagebox.askyesno("清空名单", "确定清空当前名单和任务状态？原始文件会保留。", parent=self.root):
                      return
                  self.records.clear()
                  self.session = Session()
                  self.import_duplicates = 0
                  self.source_combo.configure(values=["全部来源"])
                  self.source_var.set("全部来源")
                  self.refresh_table()
                  self.update_stats()
                  self.toast_var.set("名单已清空。")
                  self.log("名单", "已清空当前名单。")

              def message_changed(self, _event=None) -> None:
                  if self.message.edit_modified():
                      self.message.edit_modified(False)
                      self.update_preview()

              def update_preview(self) -> None:
                  template = self.message.get("1.0", "end-1c")
                  self.count_var.set(f"{len(template):,} / {MAX_MESSAGE} 字")
                  self.counter_label.configure(fg=COLORS["red"] if len(template) > MAX_MESSAGE else COLORS["muted"])
                  selection = self.table.selection()
                  record = next((r for r in self.records if selection and r.douyin_id == selection[0]), None)
                  if record is None and self.records:
                      record = self.records[0]
                  if record is None:
                      self.preview_target.set("尚未选择接收人")
                  else:
                      self.preview_target.set(f"接收人：{record.nickname or record.douyin_id}  ·  {record.douyin_id}")
                  self.preview.configure(state="normal")
                  self.preview.delete("1.0", "end")
                  self.preview.insert("1.0", render_message(template, record) if record else "导入名单后，可查看接收人专属消息。")
                  self.preview.configure(state="disabled")

              def set_busy(self, busy: bool) -> None:
                  for widget in [self.import_button, self.clear_button, self.start_button,
                                 self.interval_spin, self.selection_check]:
                      widget.configure(state="disabled" if busy else "normal")
                  self.message.configure(state="disabled" if busy else "normal")
                  self.pause_button.configure(state="normal" if busy else "disabled")
                  self.stop_button.configure(state="normal" if busy else "disabled")
                  self.pause_button.configure(text="继续" if self.session.state == "paused" else "暂停")

              def start(self) -> None:
                  try:
                      interval = float(self.interval_var.get())
                      if not math.isfinite(interval) or not 0.1 <= interval <= 10:
                          raise ValueError("发送间隔请填写 0.1 至 10 秒之间的数字。")
                      targets = self.records
                      if self.selected_only.get():
                          selected = set(self.table.selection())
                          targets = [r for r in self.records if r.douyin_id in selected]
                      self.session.start(targets, self.message.get("1.0", "end-1c"))
                  except ValueError as exc:
                      messagebox.showinfo("请检查任务设置", str(exc), parent=self.root)
                      return
                  self.interval_ms = round(interval * 1000)
                  self.set_busy(True)
                  self.refresh_table()
                  self.log("开始", f"任务已创建，共 {len(targets)} 位接收人，间隔 {interval:g} 秒 / 人。")
                  self.toast_var.set("任务进行中 · 可随时暂停或停止")
                  self.update_stats()
                  self.schedule_tick()

              def schedule_tick(self) -> None:
                  self.cancel_tick()
                  if self.session.state == "running":
                      self.timer = self.root.after(self.interval_ms, self.tick)

              def cancel_tick(self) -> None:
                  if self.timer is not None:
                      self.root.after_cancel(self.timer)
                      self.timer = None

              def tick(self) -> None:
                  self.timer = None
                  recipient = self.session.tick()
                  if recipient is None:
                      return
                  if self.table.exists(recipient.douyin_id):
                      self.table.set(recipient.douyin_id, "status", "已处理")
                      self.table.item(recipient.douyin_id, tags=("done",))
                  self.log("处理", f"{recipient.nickname or recipient.douyin_id} ({recipient.douyin_id}) · 已处理")
                  self.update_stats()
                  if self.session.state == "completed":
                      self.set_busy(False)
                      self.log("完成", f"本轮任务已完成，共处理 {self.session.cursor} 人。")
                      self.toast_var.set("任务已完成 · 可导出日志或开始新一轮")
                  else:
                      self.schedule_tick()

              def toggle_pause(self) -> None:
                  if self.session.state == "running":
                      self.cancel_tick()
                      self.session.pause()
                      self.log("暂停", "任务已暂停，点击“继续”接着处理。")
                      self.toast_var.set("已暂停 · 当前进度保留")
                  elif self.session.state == "paused":
                      self.session.resume()
                      self.schedule_tick()
                      self.log("继续", "继续处理本轮任务。")
                      self.toast_var.set("任务进行中 · 可随时暂停或停止")
                  self.pause_button.configure(text="继续" if self.session.state == "paused" else "暂停")
                  self.update_stats()

              def stop(self) -> None:
                  if not self.session.active:
                      return
                  self.cancel_tick()
                  self.session.stop()
                  self.set_busy(False)
                  self.refresh_table()
                  self.update_stats()
                  self.log("停止", f"任务已停止，本轮已处理 {self.session.cursor} / {len(self.session.queue)} 人。")
                  self.toast_var.set("任务已停止 · 再次开始会创建新一轮任务")

              def update_stats(self) -> None:
                  for variable, value in zip(self.stat_vars, [len(self.records), self.import_duplicates,
                                                              self.session.cursor, self.session.remaining]):
                      variable.set(f"{value:,}")
                  total = len(self.session.queue)
                  percent = self.session.cursor / total * 100 if total else 0
                  self.progress_var.set(percent)
                  states = {"idle": "等待开始", "running": "正在处理", "paused": "已暂停",
                            "completed": "任务完成", "stopped": "已停止"}
                  if total:
                      seconds = int(self.session.elapsed)
                      remaining = self.session.remaining * getattr(self, "interval_ms", 800) / 1000
                      self.progress_text.set(f"{states[self.session.state]}  {self.session.cursor} / {total} 人  ·  {percent:.0f}%\n"
                                             f"用时 {seconds // 60:02d}:{seconds % 60:02d}  ·  预计剩余 {remaining:.0f} 秒")
                  else:
                      self.progress_text.set("等待开始 · 默认处理全部名单，筛选仅影响列表显示")

              def log(self, category: str, text: str) -> None:
                  stamp = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
                  self.logs.append((stamp, category, text))
                  self.log_text.configure(state="normal")
                  self.log_text.insert("end", f"{stamp[11:]}  [{category}]  {text}\n")
                  if len(self.logs) > 400:
                      self.log_text.delete("1.0", "2.0")
                  self.log_text.see("end")
                  self.log_text.configure(state="disabled")

              def export_logs(self) -> None:
                  filename = filedialog.asksaveasfilename(title="导出运行日志", defaultextension=".csv",
                                                         initialfile=f"群发日志_{datetime.now():%Y%m%d_%H%M%S}.csv",
                                                         filetypes=[("CSV 日志", "*.csv")])
                  if not filename:
                      return
                  try:
                      with open(filename, "w", encoding="utf-8-sig", newline="") as handle:
                          writer = csv.writer(handle)
                          writer.writerow(["时间", "事件", "日志内容"])
                          for stamp, category, text in self.logs:
                              writer.writerow([stamp, category, csv_cell(text)])
                  except OSError as exc:
                      messagebox.showerror("导出失败", str(exc), parent=self.root)
                      return
                  self.toast_var.set(f"运行日志已导出：{Path(filename).name}")

              def close(self) -> None:
                  if self.session.active and not messagebox.askyesno("退出工作台", "当前任务尚未结束，确定退出？", parent=self.root):
                      return
                  self.cancel_tick()
                  self.root.destroy()


          def smoke_test(report_path: Path) -> None:
              """Run on the Windows builder, from both source and the packaged EXE."""
              root = tk.Tk()
              root.withdraw()
              try:
                  app = MessengerApp(root)
                  app.load_sample()
                  root.update_idletasks()
                  assert len(app.table.get_children()) == 6
                  app.start()
                  app.cancel_tick()
                  app.tick()
                  app.cancel_tick()
                  assert app.session.cursor == 1
                  app.toggle_pause()
                  assert app.session.state == "paused" and app.timer is None
                  app.toggle_pause()
                  app.cancel_tick()
                  assert app.session.state == "running"
                  app.stop()
                  assert app.session.state == "stopped" and app.session.cursor == 1
                  app.start()
                  app.cancel_tick()
                  for _ in range(6):
                      app.tick()
                      app.cancel_tick()
                  assert app.session.state == "completed" and app.session.cursor == 6
                  assert app.table.set("demo_001", "status") == "已处理"
                  app.search_var.set("demo_003")
                  app.refresh_table()
                  assert len(app.table.get_children()) == 1
                  report_path.write_text(json.dumps({"ok": True, "mode": "local_queue", "version": VERSION,
                                                     "tk_version": root.tk.call("info", "patchlevel"),
                                                     "checks": ["widgets", "sample_import", "start", "pause", "resume", "stop", "complete", "filter"]},
                                                    ensure_ascii=False, indent=2), encoding="utf-8")
              finally:
                  root.destroy()


          def main() -> int:
              # Delay Tk loading so importer/queue tests also run on headless systems.
              global tk, filedialog, messagebox, ttk
