          class FollowMediaTests(unittest.TestCase):
              def test_file_metadata_and_invalid_inputs(self):
                  with tempfile.TemporaryDirectory() as directory:
                      path = Path(directory) / "欢迎关注 文件.PNG"
                      path.write_bytes(b"image-file")
                      asset = inspect_media(path)
