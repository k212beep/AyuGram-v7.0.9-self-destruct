name: Build AyuGram v7.0.9 custom

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-windows.yml

permissions:
  contents: read

concurrency:
  group: ayugram-v7.0.9-custom
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: https://github.com/AyuGram/AyuGramDesktop.git
  SOURCE_TAG: v7.0.9
  SOURCE_SHA: 032ad328549cff9f612d106d8660fbc03eb43130
  OFFICIAL_ZIP_URL: https://github.com/AyuGram/AyuGramDesktop/releases/download/v7.0.9/AyuGram.zip
  OFFICIAL_ZIP_SHA256: 5360e93f71a5acb4938ade03872dc7ce556c41853d63c0144f26ddbda74768c3

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout build recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Select a drive with enough free space
        shell: pwsh
        run: |
          $minimum = 45GB
          $selected = $null
          foreach ($name in @("D", "C")) {
            $drive = Get-PSDrive -Name $name -ErrorAction SilentlyContinue
            if ($drive -and $drive.Free -ge $minimum) {
              $selected = $drive
              break
            }
          }
          if (-not $selected) {
            Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
            throw "The runner has less than 45 GB free. Retry the workflow later."
          }
          $root = "$($selected.Name):\AyuBuild"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          "BUILD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $root with $([math]::Round($selected.Free / 1GB, 1)) GB free."

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Clone the fixed source and apply the patch
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git clone --branch $env:SOURCE_TAG --depth 1 --recurse-submodules --shallow-submodules $env:SOURCE_REPOSITORY "$env:BUILD_ROOT\tdesktop"
          $actual = (git -C "$env:BUILD_ROOT\tdesktop" rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Unexpected source commit: $actual"
          }
          $patch = "$env:RUNNER_TEMP\self-destruct-photo.patch"
