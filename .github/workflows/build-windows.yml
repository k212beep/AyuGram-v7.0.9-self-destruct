                  width, height = struct.unpack(">II", png[16:24])
                  self.assertTrue(1 <= width <= 1920 and 1 <= height <= 1920)
                  return width, height

              def wait_result(self, loader):
                  deadline = time.monotonic() + 5
                  while time.monotonic() < deadline:
                      if (result := loader.poll()) is not None:
                          return result
                      time.sleep(0.005)
                  self.fail("封面任务没有及时返回结果")

              def test_real_short_video_with_unicode_path(self):
                  png = media_cover_png(inspect_media(self.landscape))
                  width, height = self.assert_valid_png(png)
                  self.assertAlmostEqual(width / height, 16 / 9, delta=0.01)
                  self.assertEqual((width, height), (1920, 1080))

              def test_portrait_keeps_its_aspect_ratio(self):
                  png = media_cover_png(inspect_media(self.portrait))
                  width, height = self.assert_valid_png(png)
                  self.assertLess(width, height)
                  self.assertAlmostEqual(width / height, 9 / 16, delta=0.01)
                  self.assertEqual((width, height), (1080, 1920))

              def test_imported_picture_can_also_be_previewed(self):
                  png = media_cover_png(inspect_media(self.landscape))
                  with tempfile.TemporaryDirectory() as directory:
                      path = Path(directory) / "图片 预览.PNG"
                      path.write_bytes(png)
                      width, height = self.assert_valid_png(media_cover_png(inspect_media(path)))
                      self.assertGreater(width, height)

              def test_corrupt_video_fails_without_returning_a_cover(self):
                  with tempfile.TemporaryDirectory() as directory:
                      path = Path(directory) / "无法播放.mp4"
                      path.write_bytes(b"not-a-video")
                      with self.assertRaisesRegex(ValueError, "无法读取封面"):
                          media_cover_png(inspect_media(path))

              def test_changed_and_audio_files_do_not_produce_video_covers(self):
                  with tempfile.TemporaryDirectory() as directory:
                      path = Path(directory) / "待更换.mp4"
                      path.write_bytes(self.landscape.read_bytes())
                      asset = inspect_media(path)
                      path.write_bytes(b"changed-video")
                      with self.assertRaisesRegex(ValueError, "已变更"):
                          media_cover_png(asset)
                      audio = Path(directory) / "音频.mp3"
                      audio.write_bytes(b"audio-file")
                      with self.assertRaisesRegex(ValueError, "音频"):
                          media_cover_png(inspect_media(audio))

              def test_cancelled_request_does_not_start_a_decoder(self):
                  cancelled = threading.Event()
                  cancelled.set()
                  with mock.patch("app.subprocess.Popen") as popen:
                      with self.assertRaises(PreviewCancelled):
                          media_cover_png(inspect_media(self.landscape), cancelled)
                  popen.assert_not_called()

              def test_timeout_kills_the_decoder_process(self):
                  process = mock.Mock()
                  process.poll.return_value = None
                  process.communicate.return_value = (b"", b"")
                  with mock.patch("app.preview_executable", return_value="decoder"), mock.patch("app.subprocess.Popen", return_value=process):
                      with self.assertRaisesRegex(ValueError, "超时"):
                          media_cover_png(inspect_media(self.landscape), timeout=0)
                  process.kill.assert_called_once()

              def test_cancellation_while_decoding_kills_the_process(self):
                  cancelled = threading.Event()
                  process = mock.Mock()
                  process.poll.return_value = None

                  def communicate(timeout=None):
                      if timeout is not None:
                          cancelled.set()
                          raise subprocess.TimeoutExpired("decoder", timeout)
                      return b"", b""

                  process.communicate.side_effect = communicate
                  with mock.patch("app.preview_executable", return_value="decoder"), mock.patch("app.subprocess.Popen", return_value=process):
                      with self.assertRaises(PreviewCancelled):
                          media_cover_png(inspect_media(self.landscape), cancelled)
                  process.kill.assert_called_once()

              def test_switching_files_discards_the_previous_queued_cover(self):
                  old, new = inspect_media(self.landscape), inspect_media(self.portrait)
                  loader = MediaPreviewLoader()
                  with mock.patch("app.media_cover_png", side_effect=lambda asset, _event: asset.name.encode("utf-8")):
                      loader.request(old)
                      deadline = time.monotonic() + 5
                      while loader.results.empty() and time.monotonic() < deadline:
                          time.sleep(0.005)
                      self.assertFalse(loader.results.empty())
                      loader.request(new)
                      result = self.wait_result(loader)
                  self.assertEqual((result.asset, result.png), (new, new.name.encode("utf-8")))
                  self.assertFalse(loader.pending)

              def test_clearing_a_pending_preview_never_returns_the_old_cover(self):
                  entered, release, finished = threading.Event(), threading.Event(), threading.Event()

                  def decode(_asset, _event):
                      entered.set()
                      release.wait(5)
                      finished.set()
                      return b"old-cover"

                  loader = MediaPreviewLoader()
                  try:
                      with mock.patch("app.media_cover_png", side_effect=decode):
                          loader.request(inspect_media(self.landscape))
                          self.assertTrue(entered.wait(5))
                          loader.cancel()
                          release.set()
                          self.assertTrue(finished.wait(5))
                          self.assertIsNone(loader.poll())
                          self.assertFalse(loader.pending)
                  finally:
                      release.set()

              def test_background_error_becomes_a_readable_preview_failure(self):
                  loader = MediaPreviewLoader()
                  with mock.patch("app.media_cover_png", side_effect=ValueError("无法读取封面")):
                      loader.request(inspect_media(self.landscape))
                      result = self.wait_result(loader)
                  self.assertEqual(result.error, "无法读取封面")
                  self.assertEqual(result.png, b"")
                  self.assertFalse(loader.pending)

              def test_shutdown_waits_for_pending_decoder_to_stop(self):
                  entered = threading.Event()

                  def decode(_asset, cancel):
                      entered.set()
                      if cancel.wait(5):
                          raise PreviewCancelled()
                      return b"unexpected-cover"

                  loader = MediaPreviewLoader()
                  with mock.patch("app.media_cover_png", side_effect=decode):
                      loader.request(inspect_media(self.landscape))
                      self.assertTrue(entered.wait(5))
                      loader.shutdown()
                  self.assertEqual(loader.workers, [])
                  self.assertFalse(loader.pending)
                  self.assertIsNone(loader.poll())


