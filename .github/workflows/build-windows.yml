              def refresh_account_display(self) -> None:
                  text = profile_display_text(self.account_profile)
                  if not text and (self.account_profile.show_account or self.account_profile.show_nickname):
                      text = "未设置账号信息"
                  self.account_display_var.set(text)

              def apply_account_profile(self, profile: AccountProfile) -> None:
                  saved = save_profile(self.profile_path, profile)
                  self.account_profile = saved
                  self.refresh_account_display()
                  self.toast_var.set("账号显示设置已保存，下次启动自动恢复。")
                  self.log("设置", "已更新账号显示设置。")

              def open_account_settings(self) -> None:
                  if self.account_dialog is not None and self.account_dialog.winfo_exists():
                      self.account_dialog.lift()
                      return
                  dialog = tk.Toplevel(self.root)
                  self.account_dialog = dialog
                  dialog.title("账号设置")
                  dialog.configure(bg=COLORS["card"])
                  dialog.resizable(False, False)
                  dialog.transient(self.root)
                  dialog.geometry("470x470")
