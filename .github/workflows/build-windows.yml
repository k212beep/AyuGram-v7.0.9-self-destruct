# Upload this single file as .github/workflows/build-windows.yml
# It embeds all source and uses no real recipient data, Secrets, or account logins.
name: Build Windows App

on:
  push:
    paths:
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64


      - name: Write embedded app.py (1/4)
        run: |
          $payload = @'
          """Desktop messaging workbench with a local task queue."""
          from __future__ import annotations

          import argparse
          import csv
          import json
          import math
          import os
          import re
          import sys
          import time
          import traceback
          from dataclasses import dataclass, field
          from datetime import datetime
          from pathlib import Path


          APP_NAME = "抖音群发工作台"
          VERSION = "1.2.0"
          MAX_FILE_BYTES = 5 * 1024 * 1024
          MAX_RECIPIENTS = 20000
          MAX_MESSAGE = 2000
          ID_RE = re.compile(r"(?=[A-Za-z0-9_.-]*[A-Za-z0-9])[A-Za-z0-9_.-]{1,64}\Z")
          LABELED_ID = re.compile(r"(?:抖音号|抖音ID|douyin[_ ]?id)\s*[:：=]?\s*([^\s,，;；]+)", re.I)
          ID_HEADERS = {"抖音号", "抖音id", "douyin_id", "douyinid", "id", "账号"}
          NAME_HEADERS = {"昵称", "nickname", "name", "姓名"}
          SOURCE_HEADERS = {"来源", "source", "分组"}
          COLORS = {
              "bg": "#0B1019", "side": "#101722", "card": "#151E2C",
              "input": "#0E1622", "line": "#263449", "text": "#F0F4FC",
              "muted": "#92A0B7", "accent": "#53E3C2", "blue": "#7EAAFF",
              "amber": "#F4C981", "red": "#F595A5", "hover": "#233149",
          }


          @dataclass
          class Recipient:
              douyin_id: str
              nickname: str = ""
              sources: list[str] = field(default_factory=list)


          @dataclass
          class ImportResult:
              records: list[Recipient]
              parsed: int = 0
              skipped: int = 0
              duplicates: int = 0


          def valid_id(value: str) -> bool:
              return bool(ID_RE.fullmatch(value))


          def decode_file(data: bytes) -> str:
              if data.startswith((b"\xff\xfe\x00\x00", b"\x00\x00\xfe\xff")):
                  return data.decode("utf-32")
              if data.startswith((b"\xff\xfe", b"\xfe\xff")):
                  return data.decode("utf-16")
              for encoding in ("utf-8-sig", "gb18030"):
                  try:
                      text = data.decode(encoding)
                      if "\x00" not in text:
                          return text
                  except UnicodeError:
                      continue
              raise ValueError("无法识别文件编码。请另存为 UTF-8、带 BOM 的 UTF-16 或 GB18030 文本。")


          def source_name(filename: str) -> str:
              stem = Path(filename).stem
              for name in ("共同好友", "评论区", "关注", "粉丝"):
                  if name in stem:
                      return name
              return stem[:60] or "导入名单"


          def parse_text(text: str, source: str = "导入名单") -> ImportResult:
              """Accept supplied labeled TXT, one ID per line, and headed CSV/TSV."""
              result = ImportResult([])
              lines = [line.strip() for line in text.lstrip("\ufeff").splitlines()
                       if line.strip() and not line.lstrip().startswith("#")]
              if not lines:
                  return result
              first = lines[0]
              delimiter = "\t" if "\t" in first else ("," if "," in first else "，")
              first_cells = next(csv.reader([first], delimiter=delimiter))
              headers = [cell.strip().lower() for cell in first_cells]
              headed = any(header in ID_HEADERS for header in headers)
              id_column = next((i for i, h in enumerate(headers) if h in ID_HEADERS), None)
              name_column = next((i for i, h in enumerate(headers) if h in NAME_HEADERS), None)
              source_column = next((i for i, h in enumerate(headers) if h in SOURCE_HEADERS), None)
              seen: dict[str, Recipient] = {}

              def add(value: str, nickname: str = "", label: str = source) -> None:
                  value = value.strip().lstrip("\ufeff").removeprefix("@").strip()
                  if not valid_id(value):
                      result.skipped += 1
                      return
                  result.parsed += 1
                  labels = [part.strip() for part in label.split(" / ") if part.strip()] or [source]
                  if value in seen:
                      result.duplicates += 1
                      existing = seen[value]
                      if not existing.nickname and nickname:
                          existing.nickname = nickname.strip()
                      for group in labels:
                          if group not in existing.sources:
                              existing.sources.append(group)
                      return
                  record = Recipient(value, nickname.strip(), list(dict.fromkeys(labels)))
                  seen[value] = record
                  result.records.append(record)

              if headed:
                  try:
                      for row in csv.reader(lines[1:], delimiter=delimiter, strict=True):
                          if id_column is None or len(row) <= id_column:
                              result.skipped += 1
                              continue
                          nickname = row[name_column] if name_column is not None and len(row) > name_column else ""
                          label = row[source_column] if source_column is not None and len(row) > source_column else source
                          add(row[id_column], nickname, label)
                  except csv.Error as exc:
                      raise ValueError(f"CSV 格式有误：{exc}") from exc
                  return result

              for line in lines:
                  match = LABELED_ID.search(line)
                  if match:
                      nickname = ""
                      before_id = line[:match.start()]
                      if "昵称" in before_id:
                          nickname = before_id.split("昵称", 1)[1].strip()
                          # Remove the final demographics field, preserving spaces inside nicknames.
                          nickname = re.sub(r"\s{2,}(?:空|[男女](?:\d{1,3}岁)?)\s*$", "", nickname).strip()
                      add(match.group(1), nickname)
                  elif "昵称" in line or "资料位置" in line:
                      result.skipped += 1
                  else:
                      # Bare-ID files may also separate IDs with commas, semicolons or tabs.
                      for token in re.split(r"[\s,，;；]+", line):
                          if token:
                              add(token)
              return result


          def read_list(path: Path) -> ImportResult:
              if path.stat().st_size > MAX_FILE_BYTES:
                  raise ValueError("单个文件不得超过 5 MB。")
              return parse_text(decode_file(path.read_bytes()), source_name(path.name))


          def merge_records(existing: list[Recipient], incoming: list[Recipient]) -> tuple[int, int]:
              by_id = {r.douyin_id: r for r in existing}
              added = repeated = 0
              new_ids = {r.douyin_id for r in incoming if r.douyin_id not in by_id}
              if len(existing) + len(new_ids) > MAX_RECIPIENTS:
                  raise ValueError(f"名单最多支持 {MAX_RECIPIENTS:,} 人，请拆分文件。")
              for record in incoming:
                  current = by_id.get(record.douyin_id)
                  if current is not None:
                      repeated += 1
                      if not current.nickname:
                          current.nickname = record.nickname
                      current.sources.extend(s for s in record.sources if s not in current.sources)
                  else:
                      clone = Recipient(record.douyin_id, record.nickname, list(record.sources))
                      existing.append(clone)
                      by_id[clone.douyin_id] = clone
                      added += 1
              return added, repeated


          def render_message(template: str, recipient: Recipient) -> str:
              return template.replace("{昵称}", recipient.nickname or recipient.douyin_id).replace("{抖音号}", recipient.douyin_id)


          def csv_cell(value: str) -> str:
              # Keep exported text from being interpreted as a spreadsheet formula.
              return "'" + value if value.startswith(("=", "+", "-", "@", "\t", "\r", "\n")) else value


          class Session:
              """Deterministic local queue, with no network or account integration."""
              def __init__(self) -> None:
                  self.state = "idle"
                  self.queue: list[Recipient] = []
                  self.template = ""
                  self.cursor = 0
                  self.statuses: dict[str, str] = {}
                  self.started_at: float | None = None
                  self.elapsed_before = 0.0

              @property
              def active(self) -> bool:
                  return self.state in {"running", "paused"}

              @property
              def remaining(self) -> int:
                  return len(self.queue) - self.cursor

              @property
              def elapsed(self) -> float:
                  return self.elapsed_before + (time.monotonic() - self.started_at if self.started_at is not None else 0)

              def start(self, records: list[Recipient], template: str) -> None:
                  if self.active:
                      raise ValueError("请先停止当前任务。")
                  if not records:
                      raise ValueError("请先导入名单；选择“仅选中”时，请在名单中选中接收人。")
                  if not template.strip():
                      raise ValueError("请填写群发内容。")
                  if len(template) > MAX_MESSAGE:
                      raise ValueError(f"群发内容不得超过 {MAX_MESSAGE} 字。")
                  self.queue = list(records)
                  self.template = template
                  self.cursor = 0
                  self.statuses = {r.douyin_id: "等待处理" for r in records}
                  self.elapsed_before = 0.0
                  self.started_at = time.monotonic()
                  self.state = "running"

              def tick(self) -> Recipient | None:
                  if self.state != "running" or self.cursor >= len(self.queue):
                      return None
                  recipient = self.queue[self.cursor]
                  self.statuses[recipient.douyin_id] = "已处理"
                  self.cursor += 1
                  if self.cursor == len(self.queue):
                      self._freeze_clock()
                      self.state = "completed"
                  return recipient

              def _freeze_clock(self) -> None:
                  self.elapsed_before = self.elapsed
                  self.started_at = None

              def pause(self) -> None:
                  if self.state == "running":
                      self._freeze_clock()
                      self.state = "paused"

              def resume(self) -> None:
                  if self.state == "paused":
                      self.started_at = time.monotonic()
                      self.state = "running"

              def stop(self) -> None:
                  if self.active:
                      self._freeze_clock()
                      for recipient in self.queue[self.cursor:]:
                          self.statuses[recipient.douyin_id] = "已停止"
                      self.state = "stopped"


          class MessengerApp:
              def __init__(self, root: tk.Tk) -> None:
                  self.root = root
                  self.records: list[Recipient] = []
                  self.session = Session()
                  self.logs: list[tuple[str, str, str]] = []
                  self.import_duplicates = 0
                  self.timer: str | None = None
                  self.search_timer: str | None = None
                  self.search_var = tk.StringVar()
                  self.source_var = tk.StringVar(value="全部来源")
                  self.selected_only = tk.BooleanVar(value=False)
                  self.interval_var = tk.StringVar(value="0.8")
                  self.toast_var = tk.StringVar(value="就绪 · 点击“导入名单”开始")
                  self.count_var = tk.StringVar(value=f"0 / {MAX_MESSAGE} 字")
                  self.progress_var = tk.DoubleVar(value=0)
                  self.progress_text = tk.StringVar(value="等待开始")
                  self.preview_target = tk.StringVar(value="选择名单中的一位用户以预览")
                  root.title(APP_NAME)
                  root.configure(bg=COLORS["bg"])
                  root.geometry("1240x850")
                  root.minsize(1060, 760)
                  root.protocol("WM_DELETE_WINDOW", self.close)
                  root.option_add("*Font", ("Microsoft YaHei UI", 10))
                  self.configure_styles()
                  self.build_ui()
                  root.bind("<Control-o>", lambda _event: self.import_files())
                  self.search_var.trace_add("write", self.search_changed)
                  self.source_var.trace_add("write", lambda *_: self.refresh_table())
                  self.log("系统", "工作台已就绪，请导入接收人名单。")
                  self.update_stats()

              def configure_styles(self) -> None:
                  style = ttk.Style(self.root)
                  style.theme_use("clam")
                  style.configure("TFrame", background=COLORS["card"])
                  style.configure("TCombobox", fieldbackground=COLORS["input"], background=COLORS["line"],
                                  foreground=COLORS["text"], arrowcolor=COLORS["muted"], padding=5)
                  style.map("TCombobox", fieldbackground=[("readonly", COLORS["input"])],
                            selectbackground=[("readonly", COLORS["input"])],
                            selectforeground=[("readonly", COLORS["text"])])
                  style.configure("Treeview", background=COLORS["input"], fieldbackground=COLORS["input"],
                                  foreground=COLORS["text"], rowheight=33, borderwidth=0,
                                  font=("Microsoft YaHei UI", 10))
                  style.configure("Treeview.Heading", background=COLORS["card"], foreground=COLORS["muted"],
                                  relief="flat", padding=(8, 9), font=("Microsoft YaHei UI", 9))
                  style.map("Treeview", background=[("selected", "#214D53")], foreground=[("selected", "#FFFFFF")])
                  style.map("Treeview.Heading", background=[("active", COLORS["hover"])])
                  style.configure("Vertical.TScrollbar", background=COLORS["line"], troughcolor=COLORS["input"],
                                  borderwidth=0, arrowcolor=COLORS["muted"])
                  style.configure("Horizontal.TProgressbar", troughcolor=COLORS["input"],
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'app.py'), $payload + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))

      - name: Write embedded app.py (2/4)
        run: |
          $payload = @'
                                  background=COLORS["accent"], borderwidth=0, thickness=7)
                  self.root.option_add("*TCombobox*Listbox.background", COLORS["input"])
                  self.root.option_add("*TCombobox*Listbox.foreground", COLORS["text"])

              def label(self, parent, text="", size=10, color="text", bold=False, **options):
                  return tk.Label(parent, text=text, bg=parent.cget("bg"), fg=COLORS[color],
                                  font=("Microsoft YaHei UI", size, "bold" if bold else "normal"), **options)

              def button(self, parent, text, command, primary=False, danger=False, **options):
                  bg = COLORS["accent"] if primary else COLORS["hover"]
                  fg = COLORS["bg"] if primary else COLORS["red"] if danger else COLORS["text"]
                  padding = {"padx": 14, "pady": 8}
                  padding.update(options)
                  return tk.Button(parent, text=text, command=command, bg=bg, fg=fg,
                                   activebackground="#83EFD6" if primary else COLORS["line"],
                                   activeforeground=COLORS["bg"] if primary else COLORS["text"],
                                   disabledforeground="#66748A", relief="flat", bd=0, cursor="hand2",
                                   font=("Microsoft YaHei UI", 10, "bold" if primary else "normal"), **padding)

              def card(self, parent):
                  return tk.Frame(parent, bg=COLORS["card"], highlightbackground=COLORS["line"], highlightthickness=1)

              def build_ui(self) -> None:
                  side = tk.Frame(self.root, bg=COLORS["side"], width=190)
                  side.pack(side="left", fill="y")
                  side.pack_propagate(False)
                  brand = tk.Frame(side, bg=COLORS["side"])
                  brand.pack(fill="x", padx=22, pady=(30, 28))
                  self.label(brand, "S /", 30, "accent", True).pack(anchor="w")
                  self.label(brand, "SEND STUDIO", 13, bold=True).pack(anchor="w", pady=(3, 0))
                  self.label(brand, "批量消息管理", 9, "muted").pack(anchor="w", pady=(5, 0))
                  for text, command in [
                      ("01    群发任务", lambda: self.message.focus_set()),
                      ("02    导入名单", self.import_files),
                      ("03    导出日志", self.export_logs),
                  ]:
                      self.button(side, text, command, anchor="w").pack(fill="x", padx=14, pady=4)
                  note = tk.Frame(side, bg=COLORS["side"])
                  note.pack(side="bottom", fill="x", padx=22, pady=26)
                  self.label(note, "任务工作台", 10, "muted", True).pack(anchor="w")
                  self.label(note, "名单管理 · 消息预览\n任务进度 · 运行记录", 9, "muted", justify="left").pack(anchor="w", pady=(10, 14))
                  self.label(note, f"WINDOWS  /  v{VERSION}", 8, "muted").pack(anchor="w")

                  main = tk.Frame(self.root, bg=COLORS["bg"])
                  main.pack(side="left", expand=True, fill="both", padx=24, pady=20)
                  header = tk.Frame(main, bg=COLORS["bg"])
                  header.pack(fill="x")
                  self.label(header, "WORKSPACE / MESSAGING", 9, "muted").pack(anchor="w")
                  title_row = tk.Frame(header, bg=COLORS["bg"])
                  title_row.pack(fill="x", pady=(4, 2))
                  self.label(title_row, "抖音群发工作台", 23, bold=True).pack(side="left")
                  self.label(title_row, f"v{VERSION}", 10, "muted").pack(side="right", pady=7)
                  self.label(header, "集中管理接收人名单、消息内容与任务进度。", 10, "muted").pack(anchor="w")

                  stats = tk.Frame(main, bg=COLORS["bg"])
                  stats.pack(fill="x", pady=(16, 14))
                  self.stat_vars = [tk.StringVar(value="0") for _ in range(4)]
                  for i, (caption, color) in enumerate([("名单人数", "text"), ("已合并重复", "blue"),
                                                        ("已处理", "accent"), ("本轮待处理", "amber")]):
                      stats.columnconfigure(i, weight=1, uniform="stat")
                      card = self.card(stats)
                      card.grid(row=0, column=i, sticky="ew", padx=(0 if i == 0 else 5, 0 if i == 3 else 5))
                      self.label(card, caption, 9, "muted").pack(anchor="w", padx=14, pady=(10, 0))
                      self.label(card, size=23, color=color, bold=True, textvariable=self.stat_vars[i]).pack(anchor="w", padx=14, pady=(0, 9))

                  body = tk.Frame(main, bg=COLORS["bg"])
                  body.pack(fill="both", expand=True)
                  body.columnconfigure(0, weight=6, minsize=395)
                  body.columnconfigure(1, weight=5, minsize=340)
                  body.rowconfigure(0, weight=1)
                  list_card = self.card(body)
                  list_card.grid(row=0, column=0, sticky="nsew", padx=(0, 12))
                  list_card.columnconfigure(0, weight=1)
                  list_card.rowconfigure(3, weight=1)
                  list_header = tk.Frame(list_card, bg=COLORS["card"])
                  list_header.grid(row=0, column=0, sticky="ew", padx=14, pady=(12, 10))
                  self.label(list_header, "接收人名单", 12, bold=True).pack(side="left")
                  self.import_button = self.button(list_header, "+ 导入名单", self.import_files, primary=True)
                  self.import_button.pack(side="right")
                  filters = tk.Frame(list_card, bg=COLORS["card"])
                  filters.grid(row=1, column=0, sticky="ew", padx=14)
                  self.search_entry = tk.Entry(filters, textvariable=self.search_var, bg=COLORS["input"],
                                               fg=COLORS["text"], insertbackground=COLORS["accent"], relief="flat", width=15)
                  self.search_entry.pack(side="left", fill="x", expand=True, ipady=7)
                  self.source_combo = ttk.Combobox(filters, textvariable=self.source_var,
                                                   values=["全部来源"], state="readonly", width=9)
                  self.source_combo.pack(side="left", padx=(8, 0))
                  self.label(list_card, "搜索昵称 / 抖音号  ·  Ctrl+O 导入  ·  支持多选", 8, "muted").grid(
                      row=2, column=0, sticky="w", padx=14, pady=(5, 8))
                  table_frame = tk.Frame(list_card, bg=COLORS["input"])
                  table_frame.grid(row=3, column=0, sticky="nsew", padx=14)
                  self.table = ttk.Treeview(table_frame, columns=("name", "id", "source", "status"),
                                            show="headings", selectmode="extended", height=8)
                  for column, caption, width, minimum in [
                      ("name", "昵称", 110, 70), ("id", "抖音号", 120, 80),
                      ("source", "来源", 72, 48), ("status", "状态", 78, 65),
                  ]:
                      self.table.heading(column, text=caption)
                      self.table.column(column, width=width, minwidth=minimum, stretch=True)
                  yscroll = ttk.Scrollbar(table_frame, command=self.table.yview)
                  self.table.configure(yscrollcommand=yscroll.set)
                  yscroll.pack(side="right", fill="y")
                  self.table.pack(side="left", fill="both", expand=True)
                  self.table.tag_configure("done", foreground=COLORS["accent"])
                  self.table.tag_configure("stopped", foreground=COLORS["muted"])
                  self.table.bind("<<TreeviewSelect>>", lambda _event: self.update_preview())
                  bottom = tk.Frame(list_card, bg=COLORS["card"])
                  bottom.grid(row=4, column=0, sticky="ew", padx=14, pady=10)
                  self.visible_var = tk.StringVar(value="显示 0 / 0 人")
                  self.label(bottom, size=9, color="muted", textvariable=self.visible_var).pack(side="left")
                  self.clear_button = self.button(bottom, "清空", self.clear_list, danger=True)
                  self.clear_button.pack(side="right")

                  compose = self.card(body)
                  compose.grid(row=0, column=1, sticky="nsew")
                  self.label(compose, "群发内容", 12, bold=True).pack(anchor="w", padx=16, pady=(14, 4))
                  self.label(compose, "支持 {昵称}、{抖音号} 个性化变量", 9, "muted").pack(anchor="w", padx=16, pady=(0, 8))
                  self.message = tk.Text(compose, height=4, width=1, wrap="word", undo=True, bg=COLORS["input"],
                                         fg=COLORS["text"], insertbackground=COLORS["accent"], relief="flat",
                                         padx=10, pady=10, font=("Microsoft YaHei UI", 10))
                  self.message.pack(fill="x", padx=16)
                  self.message.insert("1.0", "你好，{昵称}！感谢关注，后续有新消息会在这里与你分享。")
                  self.message.edit_modified(False)
                  self.message.bind("<<Modified>>", self.message_changed)
                  self.counter_label = self.label(compose, size=8, color="muted", textvariable=self.count_var)
                  self.counter_label.pack(anchor="e", padx=16, pady=(4, 7))
                  self.label(compose, "消息预览", 10, bold=True).pack(anchor="w", padx=16)
                  self.label(compose, size=8, color="muted", textvariable=self.preview_target).pack(anchor="w", padx=16, pady=(2, 4))
                  self.preview = tk.Text(compose, height=2, width=1, wrap="word", bg=COLORS["input"], fg=COLORS["muted"],
                                         relief="flat", padx=10, pady=8, state="disabled", font=("Microsoft YaHei UI", 9))
                  self.preview.pack(fill="x", padx=16)
                  settings = tk.Frame(compose, bg=COLORS["card"])
                  settings.pack(fill="x", padx=16, pady=(10, 4))
                  self.label(settings, "发送间隔", 9, "muted").pack(side="left")
                  self.interval_spin = tk.Spinbox(settings, from_=0.1, to=10, increment=0.1, width=4,
                                                  textvariable=self.interval_var, bg=COLORS["input"], fg=COLORS["text"],
                                                  buttonbackground=COLORS["line"], insertbackground=COLORS["text"], relief="flat")
                  self.interval_spin.pack(side="left", padx=(8, 4), ipady=3)
                  self.label(settings, "秒 / 人", 9, "muted").pack(side="left")
                  self.selection_check = tk.Checkbutton(compose, text="仅处理选中的接收人（默认处理全部名单）",
                                                         variable=self.selected_only, bg=COLORS["card"], fg=COLORS["muted"],
                                                         activebackground=COLORS["card"], activeforeground=COLORS["text"],
                                                         selectcolor=COLORS["input"], font=("Microsoft YaHei UI", 9))
                  self.selection_check.pack(anchor="w", padx=12)
                  actions = tk.Frame(compose, bg=COLORS["card"])
