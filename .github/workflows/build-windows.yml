              def import_paths(self, paths) -> list[str]:
                  if self.collection_importer.pending:
                      return ["资料正在导入并保存，请等待完成后再导入名单。"]
                  if self.session.active:
                      return ["当前任务尚未结束，请停止后再导入名单。"]
                  added = repeated = skipped = 0
                  errors = []
                  for filename in paths:
                      path = Path(filename)
                      try:
                          result = read_list(path)
                          new, duplicate = merge_records(self.records, result.records)
                          added += new
                          repeated += duplicate + result.duplicates
                          skipped += result.skipped
                          if not result.records:
                              errors.append(f"{path.name}：没有可导入的抖音号。")
                          elif path.resolve() not in self.imported_files:
                              self.imported_files.append(path.resolve())
                      except (OSError, ValueError, UnicodeError) as exc:
                          errors.append(f"{path.name}：{exc}")
                  self.import_duplicates += repeated
                  self.imported_names_var.set("已导入：" + "\n".join(path.name for path in self.imported_files)
                                             if self.imported_files else "尚未导入文件")
                  self.sync_filter_choices()
                  self.reset_filters()
                  self.update_stats()
                  self.refresh_collection_totals()
                  summary = f"导入完成：新增 {added} 人，合并重复 {repeated} 条，跳过无效项 {skipped} 条。"
                  self.toast_var.set(summary)
                  self.log("导入", summary)
                  return errors

