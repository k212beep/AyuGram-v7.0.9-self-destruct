                  variables = {
                      "account": tk.StringVar(value=profile.account),
                      "nickname": tk.StringVar(value=profile.nickname),
                      "show_account": tk.BooleanVar(value=profile.show_account),
                      "show_nickname": tk.BooleanVar(value=profile.show_nickname),
                      "mask_account": tk.BooleanVar(value=profile.mask_account),
                  }
                  self.account_form = variables
                  content = tk.Frame(dialog, bg=COLORS["card"])
                  content.pack(fill="both", expand=True, padx=24, pady=20)
                  self.label(content, "账号信息", 16, bold=True).pack(anchor="w")
                  self.label(content, "设置窗口中显示的账号和昵称。", 9, "muted").pack(anchor="w", pady=(4, 12))
                  entries = []
                  for name, caption in (("account", "账号 / 抖音号"), ("nickname", "昵称")):
                      self.label(content, caption, 10).pack(anchor="w", pady=(6, 4))
                      entry = tk.Entry(content, textvariable=variables[name], bg=COLORS["input"], fg=COLORS["text"],
                                       insertbackground=COLORS["accent"], relief="flat")
                      entry.pack(fill="x", ipady=7)
                      entries.append(entry)
                  options = tk.Frame(content, bg=COLORS["card"])
                  options.pack(fill="x", pady=(12, 8))
                  for name, caption in (("show_account", "显示账号"), ("show_nickname", "显示昵称"), ("mask_account", "遮挡账号")):
                      tk.Checkbutton(options, text=caption, variable=variables[name], bg=COLORS["card"],
