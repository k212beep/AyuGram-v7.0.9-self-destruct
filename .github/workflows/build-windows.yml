          raw = base64.b64decode("".join(payload.split()), validate=True)
          assert hashlib.sha256(raw).hexdigest() == "56a41fe50c3c08e85d5252cc2960e7577aed444394d9bd6f3f1e0e5bf4b4ca84", "Source bundle checksum mismatch"
          destination = Path("commentdesk-build")
          destination.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or ".." in path.parts or "\\" in item.filename or ":" in item.filename:
                      raise ValueError("Invalid source path")
              archive.extractall(destination)
          required = ("app.py", "build.py", "requirements-build.txt", "commentdesk/core.py", "commentdesk/gui.py")
          assert all((destination / name).is_file() for name in required), "Missing bundled program source"
          print("Prepared CommentDesk source. No user data files are required.")
          '@ | python -

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Test import, matching, replies, packaging and workflow
        run: python -m unittest discover -s tests -v

      - name: Check empty desktop startup
        run: python app.py --smoke-test --smoke-test-report source-smoke.json

      - name: Build portable EXE
        run: python build.py

      - name: Smoke test packaged EXE
        run: |
          @'
          import json, subprocess
          from pathlib import Path
          executable = Path('dist/CommentDesk.exe').resolve()
          subprocess.run([str(executable), '--smoke-test', '--smoke-test-report', 'frozen-smoke.json'], check=True, timeout=90)
          report = json.loads(Path('frozen-smoke.json').read_text(encoding='utf-8'))
          assert report.get('ok') and report.get('frozen'), 'Packaged EXE smoke test failed'
          assert report.get('empty_startup') and report.get('users') == 0 and report.get('comments') == 0, 'Application must start empty'
          print(json.dumps(report))
          '@ | python -

      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: CommentDesk-Windows-x64
          path: commentdesk-build/dist/CommentDesk-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload smoke test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CommentDesk-test-reports
          path: |
            commentdesk-build/source-smoke.json
            commentdesk-build/frozen-smoke.json
          if-no-files-found: ignore
          retention-days: 14
