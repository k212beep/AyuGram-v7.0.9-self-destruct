                          normalize_profile(profile)

              def test_corrupt_or_wrong_schema_is_rejected(self):
                  with tempfile.TemporaryDirectory() as directory:
                      path = Path(directory) / "settings.json"
                      for contents in ('not json', '[]', '{"schema_version":2,"profile":{}}',
                                       '{"schema_version":1,"profile":{"account":123}}',
                                       '{"schema_version":1,"profile":{"show_account":"false"}}'):
                          path.write_text(contents, encoding="utf-8")
                          with self.assertRaises(ValueError):
