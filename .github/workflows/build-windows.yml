                      for filename, content in (("empty.mp4", b""), ("script.exe", b"data")):
                          invalid = Path(directory) / filename
                          invalid.write_bytes(content)
                          with self.assertRaises(ValueError):
                              inspect_media(invalid)

              def test_receipts_are_deduplicated_before_and_after_processing(self):
                  with tempfile.TemporaryDirectory() as directory:
                      path = Path(directory) / "welcome.mp4"
                      path.write_bytes(b"video-file")
                      asset = inspect_media(path)
                      queue = FollowMediaQueue()
                      recipients = [Recipient("00123"), Recipient("00456")]
                      self.assertEqual(queue.submit(recipients, asset), (2, 0))
                      self.assertEqual(queue.submit(recipients, asset), (0, 2))
                      self.assertEqual(queue.process_next().status, "已处理")
                      self.assertEqual(queue.submit(recipients, asset), (0, 2))
                      queue.process_next()
                      self.assertEqual((queue.completed, len(queue.pending)), (2, 0))
                      self.assertIsNone(queue.process_next())

              def test_changed_media_is_rejected_and_can_be_reselected(self):
                  with tempfile.TemporaryDirectory() as directory:
                      path = Path(directory) / "welcome.mp4"
                      path.write_bytes(b"old-video")
                      asset = inspect_media(path)
                      recipient = Recipient("00123")
                      queue = FollowMediaQueue()
                      queue.submit([recipient], asset)
                      path.write_bytes(b"new-longer-video")
                      with self.assertRaises(ValueError):
                          queue.submit([Recipient("00456")], asset)
                      failed = queue.process_next()
                      self.assertEqual(failed.status, "文件不可用")
                      self.assertEqual((queue.completed, queue.failed), (0, 1))
                      self.assertEqual(queue.submit([recipient], inspect_media(path)), (1, 0))
                      self.assertEqual(queue.process_next().status, "已处理")

              def test_missing_file_and_cancelled_tasks_can_be_retried(self):
                  with tempfile.TemporaryDirectory() as directory:
                      path = Path(directory) / "welcome.mp3"
                      path.write_bytes(b"audio-file")
                      asset = inspect_media(path)
                      recipients = [Recipient("00123"), Recipient("00456")]
                      queue = FollowMediaQueue()
                      queue.submit(recipients, asset)
                      self.assertEqual(queue.cancel_pending(), 2)
                      self.assertEqual(queue.submit(recipients, asset), (2, 0))
                      path.unlink()
                      self.assertEqual(queue.process_next().status, "文件不可用")
                      self.assertEqual(queue.failed, 1)

              def test_each_different_file_has_its_own_deduplication_key(self):
                  with tempfile.TemporaryDirectory() as directory:
                      queue = FollowMediaQueue()
                      record = Recipient("00123")
                      for filename in ("one.jpg", "two.jpg"):
                          path = Path(directory) / filename
                          path.write_bytes(b"image-file")
                          self.assertEqual(queue.submit([record], inspect_media(path)), (1, 0))
