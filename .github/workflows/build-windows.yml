              def close_collection(self) -> None:
                  if self.collection_dialog is not None:
                      self.collection_progress.stop()
                      self.collection_dialog.destroy()
                      self.collection_dialog = None

              def lookup_collection_target(self) -> None:
                  try:
                      target = collection_target(self.collection_target_var.get())
                  except ValueError as exc:
                      self.collection_lookup_var.set(str(exc))
                      return
                  self.collection_target_var.set(target)
                  record = next((r for r in self.records if r.douyin_id == target), None)
                  self.collection_lookup_var.set(
                      f"本地匹配：{record.nickname or record.douyin_id} · {record.douyin_id}。" if record else
                      f"当前导入名单中未找到 {target}；可用此编号标记新导入的资料。")

              def refresh_collection_files(self) -> None:
                  if self.collection_dialog is None:
                      return
                  self.collection_files_var.set(f"已选择 {len(self.collection_paths)} 个文件" if self.collection_paths else "尚未选择名单文件")
                  self.collection_file_text.configure(state="normal")
                  self.collection_file_text.delete("1.0", "end")
                  self.collection_file_text.insert("1.0", "\n".join(path.name for path in self.collection_paths)
                                                   or "支持 TXT、CSV、TSV；按所选类型归入评论区、粉丝或关注名单。")
                  self.collection_file_text.configure(state="disabled")

              def set_collection_paths(self, paths) -> None:
                  if self.collection_importer.pending:
                      return
                  self.collection_paths = list(dict.fromkeys(Path(path).resolve() for path in paths))
                  self.collection_saved_path = None
                  self.collection_saved_var.set("尚未保存文件")
                  self.collection_status_var.set("待导入")
