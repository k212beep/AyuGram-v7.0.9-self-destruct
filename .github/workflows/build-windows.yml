              def refresh_account_display(self) -> None:
                  text = profile_display_text(self.account_profile)
                  if not text and (self.account_profile.show_account or self.account_profile.show_nickname):
                      text = "未设置账号信息"
                  self.account_display_var.set(text)

              def apply_account_profile(self, profile: AccountProfile) -> None:
                  saved = save_profile(self.profile_path, profile)
                  self.account_profile = saved
                  self.refresh_account_display()
                  self.toast_var.set("账号显示设置已保存，下次启动自动恢复。")
                  self.log("设置", "已更新账号显示设置。")

              def open_account_settings(self) -> None:
                  if self.account_dialog is not None and self.account_dialog.winfo_exists():
                      self.account_dialog.lift()
                      return
                  dialog = tk.Toplevel(self.root)
                  self.account_dialog = dialog
                  dialog.title("账号设置")
                  dialog.configure(bg=COLORS["card"])
                  dialog.resizable(False, False)
                  dialog.transient(self.root)
                  dialog.geometry("470x470")
                  profile = self.account_profile
                  variables = {
                      "account": tk.StringVar(value=profile.account),
                      "nickname": tk.StringVar(value=profile.nickname),
                      "show_account": tk.BooleanVar(value=profile.show_account),
                      "show_nickname": tk.BooleanVar(value=profile.show_nickname),
                      "mask_account": tk.BooleanVar(value=profile.mask_account),
                  }
                  self.account_form = variables
                  content = tk.Frame(dialog, bg=COLORS["card"])
                  content.pack(fill="both", expand=True, padx=24, pady=20)
                  self.label(content, "账号信息", 16, bold=True).pack(anchor="w")
                  self.label(content, "设置窗口中显示的账号和昵称。", 9, "muted").pack(anchor="w", pady=(4, 12))
                  entries = []
                  for name, caption in (("account", "账号 / 抖音号"), ("nickname", "昵称")):
                      self.label(content, caption, 10).pack(anchor="w", pady=(6, 4))
                      entry = tk.Entry(content, textvariable=variables[name], bg=COLORS["input"], fg=COLORS["text"],
                                       insertbackground=COLORS["accent"], relief="flat")
                      entry.pack(fill="x", ipady=7)
                      entries.append(entry)
                  options = tk.Frame(content, bg=COLORS["card"])
                  options.pack(fill="x", pady=(12, 8))
                  for name, caption in (("show_account", "显示账号"), ("show_nickname", "显示昵称"), ("mask_account", "遮挡账号")):
                      tk.Checkbutton(options, text=caption, variable=variables[name], bg=COLORS["card"],
                                     fg=COLORS["muted"], activebackground=COLORS["card"], activeforeground=COLORS["text"],
                                     selectcolor=COLORS["input"], font=("Microsoft YaHei UI", 10)).pack(side="left", padx=(0, 10))
                  self.label(content, "显示预览", 9, "muted").pack(anchor="w")
                  preview_var = tk.StringVar()
                  self.label(content, size=10, textvariable=preview_var, justify="left", anchor="w", height=2).pack(fill="x", pady=(5, 8))

                  def get_profile():
                      return AccountProfile(**{name: variable.get() for name, variable in variables.items()})

                  def update_preview(*_args):
                      try:
                          candidate = normalize_profile(get_profile())
                          text = profile_display_text(candidate)
                          if not candidate.show_account and not candidate.show_nickname:
                              text = "账号与昵称均已隐藏"
                          preview_var.set(text or "未设置账号信息")
                      except ValueError as exc:
                          preview_var.set(str(exc))

                  def close_dialog():
                      dialog.grab_release()
                      dialog.destroy()
                      self.account_dialog = None

                  def save():
                      try:
                          self.apply_account_profile(get_profile())
                      except (ValueError, OSError) as exc:
                          messagebox.showerror("保存失败", str(exc), parent=dialog)
                          return
                      close_dialog()

                  def clear_fields():
                      variables["account"].set("")
                      variables["nickname"].set("")
                      variables["show_account"].set(True)
                      variables["show_nickname"].set(True)
                      variables["mask_account"].set(False)

                  actions = tk.Frame(content, bg=COLORS["card"])
                  actions.pack(side="bottom", fill="x", pady=(4, 0))
                  self.button(actions, "清空信息", clear_fields, danger=True, padx=10).pack(side="left")
                  self.account_save_button = self.button(actions, "保存设置", save, primary=True)
                  self.account_save_button.pack(side="right")
                  self.button(actions, "取消", close_dialog, padx=10).pack(side="right", padx=8)
                  dialog.protocol("WM_DELETE_WINDOW", close_dialog)
                  dialog.bind("<Escape>", lambda _event: close_dialog())
                  for variable in variables.values():
                      variable.trace_add("write", update_preview)
                  update_preview()
                  dialog.update_idletasks()
                  dialog.grab_set()
                  entries[0].focus_set()

              def search_changed(self, *_args) -> None:
                  if self.search_timer is not None:
                      self.root.after_cancel(self.search_timer)
                  self.search_timer = self.root.after(180, self.refresh_table)

              def refresh_table(self) -> None:
                  if self.search_timer is not None:
                      self.root.after_cancel(self.search_timer)
                      self.search_timer = None
                  try:
                      visible_records = self.filtered_records()
                  except ValueError as exc:
                      self.filter_hint_var.set(str(exc))
                      self.filter_hint_label.configure(fg=COLORS["red"])
                      return
                  self.filter_hint_var.set("搜索昵称 / 抖音号 · 表头排序 · 双击查看完整资料")
                  self.filter_hint_label.configure(fg=COLORS["muted"])
                  self.visible_records = visible_records
                  selected = set(self.table.selection())
                  children = self.table.get_children()
                  if children:
                      self.table.delete(*children)
                  visible = []
                  for recipient in visible_records:
                      status = self.session.statuses.get(recipient.douyin_id, "待开始")
                      tag = "done" if status == "已处理" else "stopped" if status == "已停止" else ""
                      self.table.insert("", "end", iid=recipient.douyin_id,
                                        values=(recipient.nickname or "未填写", recipient.douyin_id, recipient.gender or "未填写",
                                                recipient.age if recipient.age is not None else "未填写", recipient.region or "未填写",
                                                recipient.ip_region or "未填写", " / ".join(recipient.sources), status), tags=(tag,))
                      visible.append(recipient.douyin_id)
                  remaining_selection = selected.intersection(visible)
                  if remaining_selection:
                      self.table.selection_set(*remaining_selection)
                  self.visible_var.set(f"显示 {len(visible):,} / {len(self.records):,} 人")
                  for column, (caption, _width, _minimum) in TABLE_COLUMNS.items():
                      arrow = (" ▼" if self.sort_descending else " ▲") if column == self.sort_column else ""
                      self.table.heading(column, text=caption + arrow)
                  self.update_preview()

              def filtered_records(self) -> list[Recipient]:
                  def age_bound(variable):
                      text = variable.get().strip()
                      if not text:
                          return None
                      if not re.fullmatch(r"\d{1,3}", text):
                          raise ValueError("年龄范围请填写 0–150 之间的整数。")
                      return int(text)
                  records = filter_records(self.records, self.search_var.get(), self.source_var.get(),
                                           self.gender_var.get(), self.age_mode_var.get(), age_bound(self.min_age_var),
                                           age_bound(self.max_age_var), self.region_var.get(), self.region_field_var.get())
                  return sort_records(records, self.sort_column, self.sort_descending, self.session.statuses)

              def target_records(self) -> list[Recipient]:
                  visible = self.filtered_records()
                  if self.scope_var.get() == "全部导入名单":
                      return sort_records(self.records, self.sort_column, self.sort_descending, self.session.statuses)
                  if self.scope_var.get() == "仅选中的接收人":
                      selected = set(self.table.selection())
                      return [record for record in visible if record.douyin_id in selected]
                  return visible

              def sync_filter_choices(self) -> None:
                  groups = list(dict.fromkeys(s for record in self.records for s in record.sources))
                  self.source_combo.configure(values=["全部来源", *groups])
                  genders = list(dict.fromkeys(["男", "女", *[r.gender for r in self.records if r.gender]]))
                  self.gender_combo.configure(values=["全部性别", *genders, "未填写"])
                  regions = sorted({value for record in self.records for value in (record.region, record.ip_region) if value})
                  self.region_combo.configure(values=regions)

              def reset_filters(self) -> None:
                  for variable, value in ((self.search_var, ""), (self.source_var, "全部来源"),
                                          (self.gender_var, "全部性别"), (self.age_mode_var, "全部年龄"),
                                          (self.min_age_var, ""), (self.max_age_var, ""), (self.region_var, ""),
                                          (self.region_field_var, "任一地区")):
                      variable.set(value)
                  self.sort_column = ""
                  self.sort_descending = False
                  self.refresh_table()

              def sort_by(self, column: str) -> None:
                  self.sort_descending = not self.sort_descending if self.sort_column == column else False
                  self.sort_column = column
                  self.refresh_table()

              def select_visible(self):
                  children = self.table.get_children()
                  if children:
                      self.table.selection_set(*children)
                  return "break"

