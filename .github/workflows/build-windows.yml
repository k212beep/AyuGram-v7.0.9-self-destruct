              def label(self, parent, text="", size=10, color="text", bold=False, **options):
                  return tk.Label(parent, text=text, bg=parent.cget("bg"), fg=COLORS[color],
                                  font=("Microsoft YaHei UI", size, "bold" if bold else "normal"), **options)

              def button(self, parent, text, command, primary=False, danger=False, **options):
                  bg = COLORS["accent"] if primary else COLORS["hover"]
                  fg = COLORS["bg"] if primary else COLORS["red"] if danger else COLORS["text"]
                  padding = {"padx": 14, "pady": 8}
                  padding.update(options)
                  return tk.Button(parent, text=text, command=command, bg=bg, fg=fg,
                                   activebackground="#83EFD6" if primary else COLORS["line"],
                                   activeforeground=COLORS["bg"] if primary else COLORS["text"],
                                   disabledforeground="#66748A", relief="flat", bd=0, cursor="hand2",
                                   font=("Microsoft YaHei UI", 10, "bold" if primary else "normal"), **padding)

              def card(self, parent):
                  return tk.Frame(parent, bg=COLORS["card"], highlightbackground=COLORS["line"], highlightthickness=1)

              def scale_ui(self, parent) -> None:
                  """Scale each widget's fonts and pixel spacing once; retain text-unit widths."""
                  from tkinter import font as tkfont

                  pending = [parent]
                  while pending:
                      widget = pending.pop()
                      pending.extend(widget.winfo_children())
                      if getattr(widget, "_ui_scaled", False):
                          continue
                      widget._ui_scaled = True
                      options = widget.configure()
                      if "font" in options:
                          actual = tkfont.Font(root=self.root, font=widget.cget("font")).actual()
                          size = actual["size"]
                          size = ui_font_size(size) if size > 0 else -max(9, ui_pixels(-size))
                          font = (actual["family"], size, actual["weight"], actual["slant"])
                          if actual["underline"]:
                              font += ("underline",)
                          if actual["overstrike"]:
                              font += ("overstrike",)
                          widget.configure(font=font)
                      for option in ("padx", "pady", "highlightthickness", "borderwidth"):
                          if option in options:
                              widget.configure(**{option: ui_pixels(widget.winfo_pixels(widget.cget(option)))})
                      if isinstance(widget, tk.Canvas):
                          widget.configure(width=ui_pixels(widget.winfo_pixels(widget.cget("width"))),
                                           height=ui_pixels(widget.winfo_pixels(widget.cget("height"))))
                      manager = widget.winfo_manager()
                      if manager in {"pack", "grid"}:
                          info = widget.pack_info() if manager == "pack" else widget.grid_info()
                          changes = {}
                          for key in ("padx", "pady", "ipadx", "ipady"):
                              if key in info:
                                  value = info[key]
                                  values = value if isinstance(value, (tuple, list)) else widget.tk.splitlist(str(value))
                                  changes[key] = tuple(ui_pixels(widget.winfo_pixels(part)) for part in values)
                          if manager == "pack":
                              widget.pack_configure(**changes)
                          else:
                              widget.grid_configure(**changes)
                      columns, rows = widget.grid_size()
                      for index in range(columns):
                          widget.columnconfigure(index, minsize=ui_pixels(int(widget.columnconfigure(index)["minsize"])))
                      for index in range(rows):
                          widget.rowconfigure(index, minsize=ui_pixels(int(widget.rowconfigure(index)["minsize"])))

              def build_ui(self) -> None:
