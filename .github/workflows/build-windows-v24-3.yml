            @{ File = "Telegram\SourceFiles\ayu\ayu_settings.cpp"; Text = "persistentGroupKeys" }
            @{ File = "Telegram\SourceFiles\ayu\ui\context_menu\context_menu.cpp"; Text = "ayu_EnableGroupPersistence" }
            @{ File = "Telegram\SourceFiles\history\history.cpp"; Text = "AyuMessages::reinjectPermanentMedia(this);" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = "AyuMessages::messageIdChanged" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = "media.vttl_seconds().value_or_empty()" }
          )
          foreach ($check in $sourceChecks) {
            $file = "$env:BUILD_ROOT\tdesktop\$($check.File)"
            if (-not (Select-String -Path $file -SimpleMatch $check.Text -Quiet)) {
              throw "Patched source validation failed: $($check.File) -> $($check.Text)"
            }
          }
          $forbiddenChecks = @(
            @{ File = "Telegram\SourceFiles\apiwrap.cpp"; Text = "outgoingSelfDestructByDefault" }
            @{ File = "Telegram\SourceFiles\api\api_sending.cpp"; Text = "outgoingSelfDestructByDefault" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "5000" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "if (history->owner().message(peer, serverId))" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "outgoingToPersist" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "view->data()->id" }
            @{ File = "Telegram\SourceFiles\history\history.h"; Text = "_ayuDeletedMessagesReinjected" }
          )
          foreach ($check in $forbiddenChecks) {
            $file = "$env:BUILD_ROOT\tdesktop\$($check.File)"
            if (Select-String -Path $file -SimpleMatch $check.Text -Quiet) {
              throw "Forbidden stale source logic found: $($check.File) -> $($check.Text)"
            }
          }

          # A document/video class in this old source legitimately keeps the
          # same diagnostic text. Restrict this regression check to the photo
          # method whose old TTL rejection caused photos to be sent normally.
          $mediaTypesPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\data\data_media_types.cpp"
          $mediaTypesSource = Get-Content $mediaTypesPath -Raw
          $photoUpdateStart = $mediaTypesSource.IndexOf(
            "bool MediaPhoto::updateSentMedia")
          if ($photoUpdateStart -lt 0) {
            throw "Could not find MediaPhoto::updateSentMedia for validation."
          }
          $mediaFileStart = $mediaTypesSource.IndexOf(
            "MediaFile::MediaFile",
            $photoUpdateStart)
          if ($mediaFileStart -le $photoUpdateStart) {
            throw "Could not isolate MediaPhoto::updateSentMedia for validation."
          }
          $photoUpdateRegion = $mediaTypesSource.Substring(
            $photoUpdateStart,
            $mediaFileStart - $photoUpdateStart)
          $photoRejectsTtl = $photoUpdateRegion.Contains("mediaPhoto.vttl_seconds()") -or $photoUpdateRegion.Contains("or with ttl_seconds in updateSentMedia()")
          if ($photoRejectsTtl) {
            throw "MediaPhoto still rejects a valid TTL server response."
          }

          # The durable record must be committed before Telegram is asked to
          # start the countdown, otherwise a quick close can lose the record.
          $storagePath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\ayu\data\messages_storage.cpp"
          $storageSource = Get-Content $storagePath -Raw
          $archiveStart = $storageSource.IndexOf("void archivePermanentMedia")
          if ($archiveStart -lt 0) {
            throw "Could not find archivePermanentMedia for validation."
          }
          $prepareStart = $storageSource.IndexOf(
            "void preparePermanentMedia",
            $archiveStart)
          if ($prepareStart -le $archiveStart) {
            throw "Could not isolate archivePermanentMedia for validation."
          }
          $archiveRegion = $storageSource.Substring(
            $archiveStart,
            $prepareStart - $archiveStart)
          $databaseWrite = $archiveRegion.IndexOf(
            "AyuDatabase::addDeletedMessage(message);")
          $startCountdown = $archiveRegion.IndexOf(
            "StartSelfDestructAfterArchive(item, manuallyRequested);")
          $invalidArchiveOrder = ($databaseWrite -lt 0) -or ($startCountdown -lt 0) -or ($databaseWrite -ge $startCountdown)
          if ($invalidArchiveOrder) {
            throw "Permanent record is not written before self-destruct starts."
          }

          # Restart recovery must be repeatable and must reconcile only IDs
          # covered by the currently loaded server history range.
          $reinjectStart = $storageSource.IndexOf(
            "void reinjectPermanentMedia")
          $removeStart = $storageSource.IndexOf(
            "void removeDeletedMessage",
            $reinjectStart)
          if ($reinjectStart -lt 0 -or $removeStart -le $reinjectStart) {
            throw "Could not isolate reinjectPermanentMedia for validation."
          }
          $reinjectRegion = $storageSource.Substring(
            $reinjectStart,
            $removeStart - $reinjectStart)
          $rangeStart = $storageSource.IndexOf(
            "LoadedServerRange ComputeLoadedServerRange")
          $rangeEnd = $storageSource.IndexOf(
            "bool LoadedRangeCovers",
            $rangeStart)
          if ($rangeStart -lt 0 -or $rangeEnd -le $rangeStart) {
            throw "Could not isolate ComputeLoadedServerRange for validation."
          }
          $rangeRegion = $storageSource.Substring(
            $rangeStart,
            $rangeEnd - $rangeStart)
          if ($rangeRegion.Contains("view->data()") -or -not $rangeRegion.Contains("history->minMsgId()") -or -not $rangeRegion.Contains("history->maxMsgId()")) {
            throw "Loaded history range still depends on the incomplete view element type."
          }
          foreach ($required in @(
            "ComputeLoadedServerRange(history)"
            "LoadedRangeCovers(history, range, serverId)"
            "RestoreArchivedMessage("
            "history->noteAyuArchiveReconciled"
          )) {
            if (-not $reinjectRegion.Contains($required)) {
              throw "Restart reconciliation is incomplete: $required"
            }
          }
          $restoreStart = $storageSource.IndexOf("HistoryItem *RestoreArchivedMessage(")
          $restoreEnd = $storageSource.IndexOf("HistoryItem *restoreArchivedLastMessage", $restoreStart)
          if ($restoreStart -lt 0 -or $restoreEnd -le $restoreStart) {
            throw "Could not isolate archived message reconciliation."
          }
          $restoreRegion = $storageSource.Substring($restoreStart, $restoreEnd - $restoreStart)
          foreach ($required in @(
            "injected->destroy();"
            "existing->destroy();"
            "confirmedMissing || history->ayuServerHistoryEmpty()"
            "item->setAyuOriginalMessageId(serverId);"
          )) {
            if (-not $restoreRegion.Contains($required)) {
              throw "Archived message reconciliation is incomplete: $required"
            }
          }
          if ($archiveRegion.Contains("QFile::remove(source)")) {
            throw "Reusing a video must preserve its previous permanent archive file."
          }

          $historyPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\history\history.cpp"
          $historySource = Get-Content $historyPath -Raw
          $checkLocalStart = $historySource.IndexOf(
            "void History::checkLocalMessages")
          $checkLocalEnd = $historySource.IndexOf(
            "HistoryItem *History::joinedMessageInstance",
            $checkLocalStart)
          if ($checkLocalStart -lt 0 -or $checkLocalEnd -le $checkLocalStart) {
            throw "Could not isolate History::checkLocalMessages."
          }
          $checkLocalRegion = $historySource.Substring(
            $checkLocalStart,
            $checkLocalEnd - $checkLocalStart)
          $boundaryPosition = $checkLocalRegion.IndexOf("const auto firstDate")
          $reinjectPosition = $checkLocalRegion.IndexOf(
            "AyuMessages::reinjectPermanentMedia(this);")
          $invalidHistoryOrder = ($boundaryPosition -lt 0) -or ($reinjectPosition -lt 0) -or ($boundaryPosition -ge $reinjectPosition)
          if ($invalidHistoryOrder) {
            throw "History boundaries are not preserved before reconciliation."
          }

          # TTL photos must keep their TTL without being converted into a
          # spoiler. Videos retain their existing protected rendering path.
          $historyItemPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\history\history_item.cpp"
          $historyItemSource = Get-Content $historyItemPath -Raw
          $photoMediaStart = $historyItemSource.IndexOf(
            "const MTPDmessageMediaPhoto &media")
          $documentMediaStart = $historyItemSource.IndexOf(
            "const MTPDmessageMediaDocument &media",
            $photoMediaStart)
          if ($photoMediaStart -lt 0 -or $documentMediaStart -le $photoMediaStart) {
            throw "Could not isolate the photo media creation path."
          }
          $photoMediaRegion = $historyItemSource.Substring(
            $photoMediaStart,
            $documentMediaStart - $photoMediaStart)
          $photoForcesSpoiler = $photoMediaRegion.Contains(
            "media.vttl_seconds().has_value()")
          if ($photoForcesSpoiler -or -not $photoMediaRegion.Contains("media.is_spoiler()")) {
            throw "TTL photos are still forced behind a spoiler."
          }

          # Peer opening replaces outgoing media with a retained notice, without a local timer.
          $updatesPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\api\api_updates.cpp"
          $updatesSource = Get-Content $updatesPath -Raw
          $readCasePosition = $updatesSource.IndexOf("case mtpc_updateReadMessagesContents")
          $peerReadPosition = $updatesSource.IndexOf("if (AyuMessages::isOutgoingSelfDestructingMedia(item))", $readCasePosition)
          $unreadMediaPosition = $updatesSource.IndexOf("if (item->isUnreadMedia()", $peerReadPosition)
          if ($readCasePosition -lt 0 -or $peerReadPosition -lt 0 -or $unreadMediaPosition -le $peerReadPosition) {
            throw "Could not isolate the outgoing media read handler."
          }
          $peerReadRegion = $updatesSource.Substring($peerReadPosition, $unreadMediaPosition - $peerReadPosition)
          if (-not $peerReadRegion.Contains("AyuMessages::expireOutgoingMedia(item);") -or $peerReadRegion.Contains("item->destroy();") -or $peerReadRegion.Contains("item->markMediaAndMentionRead();")) {
            throw "Outgoing media read must retain a notice without a local countdown."
          }

          $loaderPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\storage\localimageloader.cpp"
          $loaderSource = Get-Content $loaderPath -Raw
          foreach ($required in @(
            "QCryptographicHash::Sha256"
            "ayuReuseFingerprint = hash.result().toHex()"
            "!_result->to.replaceMediaOf"
          )) {
            if (-not $loaderSource.Contains($required)) {
              throw "Upload fingerprint validation failed: $required"
            }
          }
          if ($loaderSource.Contains("&& !_result->to.options.ttlSeconds")) {
            throw "TTL media is still excluded from fingerprint generation."
          }

          $sendingPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\api\api_sending.cpp"
          $sendingSource = Get-Content $sendingPath -Raw
          $reuseLookupPosition = $sendingSource.IndexOf(
            "AyuMessages::reusableUploadMedia")
          $reusePreparePosition = $sendingSource.IndexOf(
            "prepareLocalMedia(file, false)",
            $reuseLookupPosition)
          $reuseSendPosition = $sendingSource.IndexOf(
            "sendAyuReusableMedia",
            $reusePreparePosition)
          if ($reuseLookupPosition -lt 0 -or $reusePreparePosition -lt 0 -or $reuseSendPosition -lt 0) {
            throw "Server-media reuse is not connected to the confirmed-file send path."
          }

          $databasePath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\ayu\data\ayu_database.cpp"
          $databaseSource = Get-Content $databasePath -Raw
          if (-not $databaseSource.Contains("make_table<AyuUploadReuse>") -or -not $databaseSource.Contains("storage.replace(entry)")) {
            throw "Persistent upload-reuse table is missing."
          }

          $uploadPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\storage\file_upload.cpp"
          $uploadSource = Get-Content $uploadPath -Raw
          if (-not $uploadSource.Contains(".ayuReuseFingerprint = entry.file->ayuReuseFingerprint")) {
            throw "The successful-upload fingerprint is not propagated."
          }

          if (-not $historySource.Contains("beforeOrderId <= originalId")) {
            throw "Restored messages do not use stable same-second ordering."
          }

          # Ninja uses per-source language-key subsets. AyuGram's pinned
          # code generator scans lng_* keys only, so teach it about ayu_* too.
          $langPatch = "$env:RUNNER_TEMP\ninja-lang-subsets-ayu.patch"
          $langPatchBase64 = @'
          ZGlmZiAtLWdpdCBhL2NvZGVnZW4vbGFuZy9zdWJzZXRzLmNwcCBiL2NvZGVnZW4vbGFuZy9zdWJz
          ZXRzLmNwcAppbmRleCBmZGE5MjZiLi44MTEwYjUyIDEwMDY0NAotLS0gYS9jb2RlZ2VuL2xhbmcv
          c3Vic2V0cy5jcHAKKysrIGIvY29kZWdlbi9sYW5nL3N1YnNldHMuY3BwCkBAIC0xNzIsMTEgKzE3
          MiwxNiBAQCB2b2lkIFNjYW4oY29uc3QgUUJ5dGVBcnJheSAmY29udGVudCwgU2Nhbm5lZCAmcmVz
          dWx0KSB7CiAJY29uc3QgYXV0byBkYXRhID0gY29udGVudC5jb25zdERhdGEoKTsKIAljb25zdCBh
          dXRvIHNpemUgPSBjb250ZW50LnNpemUoKTsKIAlmb3IgKGF1dG8gaSA9IHFzaXpldHlwZSgwKTsg
          aSArIDQgPCBzaXplOyArK2kpIHsKLQkJaWYgKGRhdGFbaV0gIT0gJ2wnCi0JCQl8fCBkYXRhW2kg
          KyAxXSAhPSAnbicKLQkJCXx8IGRhdGFbaSArIDJdICE9ICdnJwotCQkJfHwgZGF0YVtpICsgM10g
          IT0gJ18nCi0JCQl8fCAoaSA+IDAgJiYgSXNJZGVudGlmaWVyQ2hhcihkYXRhW2kgLSAxXSkpKSB7
          CisJCWNvbnN0IGF1dG8gaXNUZWxlZ3JhbUtleSA9IGRhdGFbaV0gPT0gJ2wnCisJCQkmJiBkYXRh
          W2kgKyAxXSA9PSAnbicKKwkJCSYmIGRhdGFbaSArIDJdID09ICdnJworCQkJJiYgZGF0YVtpICsg
          M10gPT0gJ18nOworCQljb25zdCBhdXRvIGlzQXl1R3JhbUtleSA9IGRhdGFbaV0gPT0gJ2EnCisJ
          CQkmJiBkYXRhW2kgKyAxXSA9PSAneScKKwkJCSYmIGRhdGFbaSArIDJdID09ICd1JworCQkJJiYg
          ZGF0YVtpICsgM10gPT0gJ18nOworCQlpZiAoKCFpc1RlbGVncmFtS2V5ICYmICFpc0F5dUdyYW1L
          ZXkpCisJCQkJfHwgKGkgPiAwICYmIElzSWRlbnRpZmllckNoYXIoZGF0YVtpIC0gMV0pKSkgewog
