          '@
          [IO.File]::WriteAllBytes($patch, [Convert]::FromBase64String(($patchBase64 -replace '\s', '')))
          $patchHash = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne $env:PATCH_SHA256) {
            throw "Embedded patch checksum mismatch: $patchHash"
          }
          git -C "$env:BUILD_ROOT\tdesktop" apply --check $patch
          git -C "$env:BUILD_ROOT\tdesktop" apply $patch
          git -C "$env:BUILD_ROOT\tdesktop" diff --check

          $requiredFiles = @(
            "Telegram\SourceFiles\ayu\ui\settings\settings_self_destruct.cpp"
            "Telegram\SourceFiles\ayu\ui\settings\settings_self_destruct.h"
          )
          foreach ($relative in $requiredFiles) {
            if (-not (Test-Path "$env:BUILD_ROOT\tdesktop\$relative")) {
              throw "Required patched file is missing: $relative"
            }
          }
          $sourceChecks = @(
            @{ File = "Telegram\SourceFiles\boxes\send_files_box.cpp"; Text = "ayu_SendSelfDestructMedia" }
            @{ File = "Telegram\SourceFiles\apiwrap.cpp"; Text = "action.options.ttlSeconds > 0" }
            @{ File = "Telegram\SourceFiles\api\api_sending.cpp"; Text = "f_ttl_seconds" }
            @{ File = "Telegram\SourceFiles\api\api_sending.cpp"; Text = "MessageFlag::MediaIsUnread" }
            @{ File = "Telegram\SourceFiles\api\api_media.cpp"; Text = "MTP_inputMediaUploadedDocument" }
            @{ File = "Telegram\SourceFiles\api\api_media.cpp"; Text = "MTP_inputMediaUploadedPhoto" }
            @{ File = "Telegram\SourceFiles\data\data_media_types.cpp"; Text = "crl::time MediaPhoto::ttlSeconds() const" }
            @{ File = "Telegram\SourceFiles\data\data_media_types.h"; Text = "crl::time _ttlSeconds = 0" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "requestManualSelfDestruct" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "PendingSelfDestructRequests" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "changeDeletedMessageId" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "MTP_messageMediaEmpty" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "IsExpiredMediaPlaceholder" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "existing->destroy();" }
            @{ File = "Telegram\SourceFiles\history\history.cpp"; Text = "_ayuDeletedMessagesReinjected" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = "AyuMessages::messageIdChanged" }
            @{ File = "Telegram\SourceFiles\history\history_item.cpp"; Text = "media.vttl_seconds().value_or_empty()" }
          )
          foreach ($check in $sourceChecks) {
            $file = "$env:BUILD_ROOT\tdesktop\$($check.File)"
            if (-not (Select-String -Path $file -SimpleMatch $check.Text -Quiet)) {
              throw "Patched source validation failed: $($check.File) -> $($check.Text)"
            }
          }
          $forbiddenChecks = @(
            @{ File = "Telegram\SourceFiles\apiwrap.cpp"; Text = "outgoingSelfDestructByDefault" }
            @{ File = "Telegram\SourceFiles\api\api_sending.cpp"; Text = "outgoingSelfDestructByDefault" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "5000" }
            @{ File = "Telegram\SourceFiles\ayu\data\messages_storage.cpp"; Text = "if (history->owner().message(peer, serverId))" }
          )
          foreach ($check in $forbiddenChecks) {
            $file = "$env:BUILD_ROOT\tdesktop\$($check.File)"
            if (Select-String -Path $file -SimpleMatch $check.Text -Quiet) {
              throw "Forbidden stale source logic found: $($check.File) -> $($check.Text)"
            }
          }

          # A document/video class in this old source legitimately keeps the
          # same diagnostic text. Restrict this regression check to the photo
          # method whose old TTL rejection caused photos to be sent normally.
          $mediaTypesPath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\data\data_media_types.cpp"
          $mediaTypesSource = Get-Content $mediaTypesPath -Raw
          $photoUpdateStart = $mediaTypesSource.IndexOf(
            "bool MediaPhoto::updateSentMedia")
          if ($photoUpdateStart -lt 0) {
            throw "Could not find MediaPhoto::updateSentMedia for validation."
          }
          $mediaFileStart = $mediaTypesSource.IndexOf(
            "MediaFile::MediaFile",
            $photoUpdateStart)
          if ($mediaFileStart -le $photoUpdateStart) {
            throw "Could not isolate MediaPhoto::updateSentMedia for validation."
          }
          $photoUpdateRegion = $mediaTypesSource.Substring(
            $photoUpdateStart,
            $mediaFileStart - $photoUpdateStart)
          if ($photoUpdateRegion.Contains("mediaPhoto.vttl_seconds()")
            -or $photoUpdateRegion.Contains(
              "or with ttl_seconds in updateSentMedia()")) {
            throw "MediaPhoto still rejects a valid TTL server response."
          }

          # The durable record must be committed before Telegram is asked to
          # start the countdown, otherwise a quick close can lose the record.
          $storagePath = "$env:BUILD_ROOT\tdesktop\Telegram\SourceFiles\ayu\data\messages_storage.cpp"
          $storageSource = Get-Content $storagePath -Raw
          $archiveStart = $storageSource.IndexOf("void archivePermanentMedia")
          if ($archiveStart -lt 0) {
            throw "Could not find archivePermanentMedia for validation."
          }
          $prepareStart = $storageSource.IndexOf(
            "void preparePermanentMedia",
            $archiveStart)
          if ($prepareStart -le $archiveStart) {
            throw "Could not isolate archivePermanentMedia for validation."
          }
          $archiveRegion = $storageSource.Substring(
            $archiveStart,
            $prepareStart - $archiveStart)
          $databaseWrite = $archiveRegion.IndexOf(
            "AyuDatabase::addDeletedMessage(message);")
          $startCountdown = $archiveRegion.IndexOf(
            "StartSelfDestructAfterArchive(item, manuallyRequested);")
          if ($databaseWrite -lt 0
            -or $startCountdown -lt 0
            -or $databaseWrite -ge $startCountdown) {
            throw "Permanent record is not written before self-destruct starts."
          }

          # Ninja uses per-source language-key subsets. AyuGram's pinned
          # code generator scans lng_* keys only, so teach it about ayu_* too.
          $langPatch = "$env:RUNNER_TEMP\ninja-lang-subsets-ayu.patch"
          $langPatchBase64 = @'
          ZGlmZiAtLWdpdCBhL2NvZGVnZW4vbGFuZy9zdWJzZXRzLmNwcCBiL2NvZGVnZW4vbGFuZy9zdWJz
          ZXRzLmNwcAppbmRleCBmZGE5MjZiLi44MTEwYjUyIDEwMDY0NAotLS0gYS9jb2RlZ2VuL2xhbmcv
          c3Vic2V0cy5jcHAKKysrIGIvY29kZWdlbi9sYW5nL3N1YnNldHMuY3BwCkBAIC0xNzIsMTEgKzE3
          MiwxNiBAQCB2b2lkIFNjYW4oY29uc3QgUUJ5dGVBcnJheSAmY29udGVudCwgU2Nhbm5lZCAmcmVz
          dWx0KSB7CiAJY29uc3QgYXV0byBkYXRhID0gY29udGVudC5jb25zdERhdGEoKTsKIAljb25zdCBh
          dXRvIHNpemUgPSBjb250ZW50LnNpemUoKTsKIAlmb3IgKGF1dG8gaSA9IHFzaXpldHlwZSgwKTsg
          aSArIDQgPCBzaXplOyArK2kpIHsKLQkJaWYgKGRhdGFbaV0gIT0gJ2wnCi0JCQl8fCBkYXRhW2kg
          KyAxXSAhPSAnbicKLQkJCXx8IGRhdGFbaSArIDJdICE9ICdnJwotCQkJfHwgZGF0YVtpICsgM10g
          IT0gJ18nCi0JCQl8fCAoaSA+IDAgJiYgSXNJZGVudGlmaWVyQ2hhcihkYXRhW2kgLSAxXSkpKSB7
          CisJCWNvbnN0IGF1dG8gaXNUZWxlZ3JhbUtleSA9IGRhdGFbaV0gPT0gJ2wnCisJCQkmJiBkYXRh
          W2kgKyAxXSA9PSAnbicKKwkJCSYmIGRhdGFbaSArIDJdID09ICdnJworCQkJJiYgZGF0YVtpICsg
          M10gPT0gJ18nOworCQljb25zdCBhdXRvIGlzQXl1R3JhbUtleSA9IGRhdGFbaV0gPT0gJ2EnCisJ
          CQkmJiBkYXRhW2kgKyAxXSA9PSAneScKKwkJCSYmIGRhdGFbaSArIDJdID09ICd1JworCQkJJiYg
          ZGF0YVtpICsgM10gPT0gJ18nOworCQlpZiAoKCFpc1RlbGVncmFtS2V5ICYmICFpc0F5dUdyYW1L
          ZXkpCisJCQkJfHwgKGkgPiAwICYmIElzSWRlbnRpZmllckNoYXIoZGF0YVtpIC0gMV0pKSkgewog
          CQkJY29udGludWU7CiAJCX0KIAkJYXV0byB0aWxsID0gaSArIDQ7Cg==
          '@
          [IO.File]::WriteAllBytes($langPatch, [Convert]::FromBase64String(($langPatchBase64 -replace '\s', '')))
          git -C "$env:BUILD_ROOT\tdesktop\Telegram\codegen" apply --check $langPatch
          git -C "$env:BUILD_ROOT\tdesktop\Telegram\codegen" apply $langPatch
          git -C "$env:BUILD_ROOT\tdesktop\Telegram\codegen" diff --check

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw "Visual Studio C++ tools were not found."
          }
          $devcmd = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          "VSINSTALLPATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VSDEVCMD=$devcmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install ATL and MFC for the v14.44 toolset
        shell: pwsh
        run: |
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $arguments = @(
            "modify"
            "--installPath `"$env:VSINSTALLPATH`""
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL"
            "--add Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC"
            "--quiet"
            "--norestart"
            "--nocache"
          )
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          $exitCode = $process.ExitCode
          if ($exitCode -notin @(0, 3010)) {
            throw "Visual Studio component installation failed with exit code $exitCode."
          }
          $toolset = Get-ChildItem "$env:VSINSTALLPATH\VC\Tools\MSVC" -Directory |
            Where-Object Name -Like "14.44.*" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $toolset -or -not (Test-Path "$($toolset.FullName)\atlmfc\include\atlbase.h")) {
            throw "The v14.44 ATL/MFC headers were not installed."
          }
          Write-Host "Using ATL/MFC from $($toolset.FullName)."

      - name: Prepare libraries and build AyuGram
        shell: cmd
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          call "%VSDEVCMD%" -vcvars_ver=14.44
          if errorlevel 1 exit /b 1
          cd /d "%BUILD_ROOT%"
          call tdesktop\Telegram\build\prepare\win.bat
          if errorlevel 1 exit /b 1
          cd /d "%BUILD_ROOT%\tdesktop\Telegram"
          where ninja
          if errorlevel 1 exit /b 1
          set CMAKE_BUILD_PARALLEL_LEVEL=2
          set _CL_=/MP1
          rem Omit release debug symbols so the final link does not exhaust runner memory.
          call configure.bat "-GNinja Multi-Config" -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT:STRING= -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627
          if errorlevel 1 exit /b 1
          cmake --build ..\out --config Release --target Telegram --parallel 2
          if errorlevel 1 exit /b 1
          if not exist "%BUILD_ROOT%\tdesktop\out\Release\AyuGram.exe" exit /b 1

      - name: Create the portable ZIP
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\output"
          $official = "$output\official.zip"
          $package = "$output\package"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Invoke-WebRequest -Uri $env:OFFICIAL_ZIP_URL -OutFile $official
          $actual = (Get-FileHash $official -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:OFFICIAL_ZIP_SHA256) {
            throw "Official ZIP checksum mismatch: $actual"
          }
          Expand-Archive -Path $official -DestinationPath $package
          Copy-Item "$env:BUILD_ROOT\tdesktop\out\Release\AyuGram.exe" "$package\AyuGram.exe" -Force
          @"
          AyuGram v7.0.9 定制版（阅后即焚与永久保留 v14）

          设置位置：AyuGram 设置 -> 阅后即焚与保留
          默认自毁时间：3 秒，可设置 1–60 秒。
          发送照片或视频时，发送窗口会显示“阅后即焚”复选框。
          改变复选框后可勾选“记住此选择”，下次会沿用，直到再次改变并记住。
          多个媒体会拆开逐个发送。定时发送、机器人、群组、频道、收藏夹和“作为文件”不受影响。
          v14 修复：照片的自毁时间会贯穿本地消息、上传和最终发送请求；视频逻辑保持不变。

          收到的私聊照片和视频会先自动下载到：
          tdata\AyuPermanentMedia\账号编号\聊天编号_用户名
          “下载完成后自动启动自毁”开启时，保存成功后自动启动倒计时；关闭时需右键手动启动。
          对方或服务器删除、阅后即焚以及重启软件后，文本、已下载照片和视频仍会重新显示。
          v14 修复：重启后若服务器只返回已焚毁媒体的空壳，会用硬盘中的永久副本恢复显示。
          使用 AyuGram 菜单中的“清空已删除消息”，会同时删除对应记录和文件。
          永久保留功能不处理群组、频道和机器人；长期使用会占用磁盘空间。

          本程序没有官方数字签名。首次启动时 Windows 可能显示安全提示。
          "@ | Set-Content -Path "$package\使用说明.txt" -Encoding utf8
          $zip = "$output\AyuGram-v7.0.9-self-destruct-persistence-v14.zip"
          Compress-Archive -Path "$package\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AyuGram-v7.0.9-self-destruct-persistence-v14.zip" | Set-Content "$zip.sha256" -Encoding ascii

      - name: Upload the finished program
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AyuGram-v7.0.9-self-destruct-persistence-v14
          path: |
            output/AyuGram-v7.0.9-self-destruct-persistence-v14.zip
            output/AyuGram-v7.0.9-self-destruct-persistence-v14.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
