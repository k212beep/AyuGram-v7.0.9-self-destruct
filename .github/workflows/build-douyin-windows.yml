          ## 本地运行与构建

          安装包含 Tkinter 的 Python 3.12 后：

          ```powershell
          python -m pip install -r requirements.txt
          python app.py
          python -m unittest -v
          python app.py --smoke-test smoke-source.json
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --collect-all imageio_ffmpeg --copy-metadata imageio-ffmpeg --copy-metadata Pillow --name DouyinSender app.py
          ```

          也可直接运行 `build_windows.bat`，脚本会先安装依赖。输出位于 `dist/DouyinSender.exe`。
          本地修改源码后，运行 `python make_workflow.py` 可重新生成包含最新源码的独立工作流。
          若缺少 Tk/Tcl 或程序启动失败，错误信息会写到用户 TEMP 目录中的 `douyin-sender-error.log`。

          ## 当前验证范围

          交付前已通过 115 项逻辑测试和 YML 内嵌源码一致性校验。
          另在 Linux 的 Tk 8.6 中文界面中通过完整源码 GUI 检查，覆盖 1280 × 768 小屏、901 × 578 最小窗口和多种窗口尺寸，
          验证表头和资料列对应、评论列隐藏 / 恢复、数字排序、缩放、右侧紧凑操作区与日志、左侧分类按钮、时间和视频封面可见。
          资料采集窗口另外检查本地抖音号查询、失败后真实重试、三种分类保存、保存文件可重新导入、
          最小窗口和放大字体下控件完整显示，以及关闭采集窗口后后台任务正常完成。
          窗口自检另覆盖隐藏后恢复、延迟显示以及永久隐藏超时，避免将尚未处理的 Windows 显示消息当成布局失败。
          已使用原有四份附件复核：282 条记录合并为 225 个 ID、57 条重复，评论区 14 人的评论次数全部读出。
          当前环境没有 Windows，Windows GUI 和 EXE 检查会在你上传更新、提交工作流后实际执行。
          当前交付物是源码与编译配置；EXE 由该工作流成功运行后生成。

          ## 官方参考

          - [GitHub 手动运行工作流](https://docs.github.com/en/actions/how-tos/manage-workflow-runs/manually-run-a-workflow)
          - [actions/setup-python](https://github.com/actions/setup-python)
          - [actions/upload-artifact](https://github.com/actions/upload-artifact)
          - [PyInstaller 用法](https://pyinstaller.org/en/stable/usage.html)
          - [imageio-ffmpeg 源码与许可证](https://github.com/imageio/imageio-ffmpeg)
          - [FFmpeg 视频滤镜](https://ffmpeg.org/ffmpeg-filters.html)
          - [FFmpeg 源码与许可证](https://ffmpeg.org/download.html)
          - [Pillow 缩放与 ImageTk](https://pillow.readthedocs.io/en/stable/reference/ImageTk.html)
          '@
          [IO.File]::AppendAllText((Join-Path $PWD 'README.md'), $payload + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))

      - name: Write embedded requirements.txt (1/1)
        run: |
          $payload = @'
          imageio-ffmpeg==0.6.0
          Pillow==13.0.0
          PyInstaller==6.22.3
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'requirements.txt'), $payload + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))

      - name: Install pinned build and media dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test list parsing and task queue
        run: |
          python -m unittest -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Windows GUI from source
        run: |
          python app.py --smoke-test smoke-source.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path smoke-source.json)) { throw 'Source GUI smoke report missing' }

      - name: Build standalone Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --collect-all imageio_ffmpeg --copy-metadata imageio-ffmpeg --copy-metadata Pillow --name DouyinSender app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check packaged EXE and prepare download
        run: |
          $exe = (Resolve-Path 'dist/DouyinSender.exe').Path
          $report = Join-Path $PWD 'smoke-exe.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', ('"' + $report + '"')) -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged EXE startup timed out'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Packaged EXE failed: $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'EXE GUI smoke report missing' }
          $result = Get-Content $report -Raw -Encoding utf8 | ConvertFrom-Json
          if ($result.ok -ne $true) { throw 'EXE GUI smoke check failed' }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $exe 'release/DouyinSender.exe'
          Copy-Item README.md 'release/README.md'
          Copy-Item smoke-source.json,smoke-exe.json -Destination release
          $notices = @'
          from pathlib import Path
          from importlib.metadata import distribution
          import subprocess
          import imageio_ffmpeg
          parts = ['imageio-ffmpeg 0.6.0: https://github.com/imageio/imageio-ffmpeg',
                   'Pillow 13.0.0: https://github.com/python-pillow/Pillow',
                   'FFmpeg sources and license: https://ffmpeg.org/download.html',
                   'FFmpeg binary build sources: https://github.com/imageio/imageio-binaries']
          for name in ('imageio-ffmpeg', 'Pillow'):
              package = distribution(name)
              for item in package.files or []:
                  if item.name.lower().startswith('license'):
                      parts.append(package.locate_file(item).read_text(encoding='utf-8', errors='replace'))
          result = subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), '-L'], stdout=subprocess.PIPE,
                                  stderr=subprocess.STDOUT, check=True)
          parts.append(result.stdout.decode('utf-8', errors='replace'))
          Path('release/THIRD_PARTY_NOTICES.txt').write_text('\n\n'.join(parts), encoding='utf-8')
          '@
          $notices | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash 'release/DouyinSender.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS.txt'), "$hash  DouyinSender.exe`n", [Text.UTF8Encoding]::new($false))
          "Built DouyinSender.exe. Download DouyinSender-Windows-x64 from Artifacts." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: DouyinSender-Windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Collect failure diagnostics
        if: failure()
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          foreach ($report in @('smoke-source.json', 'smoke-exe.json')) {
            if (Test-Path $report) {
              Copy-Item $report -Destination diagnostics
              $details = Get-Content $report -Raw -Encoding utf8 | ConvertFrom-Json
              Write-Output "$report : $($details.error)"
              $details.layout_checks | Select-Object -Last 1 | ConvertTo-Json -Depth 8
            }
          }
          $errorLog = Join-Path $env:TEMP 'douyin-sender-error.log'
          if (Test-Path $errorLog) { Copy-Item $errorLog -Destination diagnostics }
          'See the first failed step in the Actions job log for its traceback.' | Set-Content diagnostics/README.txt -Encoding utf8

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: DouyinSender-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
