          @dataclass
          class TargetProfile:
              nickname: str = ""
              fans_private: bool = False
              following_private: bool = False
              fans_count: int | None = None
              following_count: int | None = None
              region: str = ""
              live_ip: str = ""
              fans_collected_count: int | None = None
              following_collected_count: int | None = None


          @dataclass
          class CollectionPreferences:
              last_target: str = ""
              targets: dict[str, TargetProfile] = field(default_factory=dict)


          def parse_target_count(value: str) -> int | None:
              text = value.strip()
              if not text:
                  return None
              if not re.fullmatch(r"\d+|\d{1,3}(?:,\d{3})+", text):
                  raise ValueError("粉丝和关注人数请填写非负整数，或留空。")
              count = int(text.replace(",", ""))
              if count > 999999999999:
                  raise ValueError("粉丝和关注人数最大为 999999999999。")
              return count


          def normalize_collection_preferences(preferences: CollectionPreferences) -> CollectionPreferences:
              if not isinstance(preferences.last_target, str) or not isinstance(preferences.targets, dict):
                  raise ValueError("目标资料设置格式不正确。")
              last_target = collection_target(preferences.last_target) if preferences.last_target.strip() else ""
              if len(preferences.targets) > 2000:
                  raise ValueError("目标资料设置最多保存 2000 个账号。")
              targets = {}
              for target, profile in preferences.targets.items():
                  if not isinstance(target, str) or not isinstance(profile, TargetProfile):
                      raise ValueError("目标资料内容不正确。")
                  target = collection_target(target)
                  if not isinstance(profile.nickname, str):
                      raise ValueError("目标昵称必须为文本。")
                  nickname = profile.nickname.strip()
                  if len(nickname) > 40 or any(ord(char) < 32 for char in nickname):
                      raise ValueError("目标昵称最多 40 字，不能包含换行或控制字符。")
                  if type(profile.fans_private) is not bool or type(profile.following_private) is not bool:
                      raise ValueError("隐私标记必须为开或关。")
                  for count in (profile.fans_count, profile.following_count,
                                profile.fans_collected_count, profile.following_collected_count):
                      if count is not None and (type(count) is not int or not 0 <= count <= 999999999999):
                          raise ValueError("粉丝和关注人数请填写 0–999999999999 之间的整数，或留空。")
                  for caption, value, limit in (("资料位置", profile.region, 80), ("实时IP", profile.live_ip, 64)):
                      if not isinstance(value, str) or len(value.strip()) > limit or any(ord(char) < 32 for char in value):
                          raise ValueError(f"{caption}最多 {limit} 字，不能包含换行或控制字符。")
                  if target in targets:
                      raise ValueError("目标抖音号设置重复。")
                  targets[target] = TargetProfile(nickname, profile.fans_private, profile.following_private,
                                                 profile.fans_count, profile.following_count, profile.region.strip(), profile.live_ip.strip(),
                                                 profile.fans_collected_count, profile.following_collected_count)
              return CollectionPreferences(last_target, targets)


          def load_collection_preferences(path: Path) -> CollectionPreferences:
              if not path.exists():
                  return CollectionPreferences()
              if path.stat().st_size > 512 * 1024:
                  raise ValueError("目标资料设置文件过大。")
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or data.get("schema_version") != 1 or not isinstance(data.get("targets"), dict):
                  raise ValueError("目标资料设置文件格式不正确。")
              targets = {}
              for target, values in data["targets"].items():
                  if not isinstance(values, dict):
                      raise ValueError("目标资料设置内容不正确。")
                  targets[target] = TargetProfile(values.get("nickname", ""), values.get("fans_private", False), values.get("following_private", False),
                                                 values.get("fans_count"), values.get("following_count"), values.get("region", ""), values.get("live_ip", ""),
                                                 values.get("fans_collected_count"), values.get("following_collected_count"))
              return normalize_collection_preferences(CollectionPreferences(data.get("last_target", ""), targets))


          def save_collection_preferences(path: Path, preferences: CollectionPreferences) -> CollectionPreferences:
              preferences = normalize_collection_preferences(preferences)
              write_json_atomic(path, {"schema_version": 1, "last_target": preferences.last_target,
                  "targets": {target: {"nickname": profile.nickname, "fans_private": profile.fans_private,
                                       "following_private": profile.following_private, "fans_count": profile.fans_count,
                                       "following_count": profile.following_count, "region": profile.region, "live_ip": profile.live_ip,
                                       "fans_collected_count": profile.fans_collected_count,
                                       "following_collected_count": profile.following_collected_count}
                              for target, profile in preferences.targets.items()}})
              return preferences


          @dataclass(frozen=True)
          class TargetLookupResult:
              state: str = "idle"
              target: str = ""
              nickname: str = ""
              fans_count: int | None = None
              following_count: int | None = None
              region: str = ""
              live_ip: str = ""


          def target_lookup_result(value: str, preferences: CollectionPreferences, records: list[Recipient]) -> TargetLookupResult:
              if not value.strip():
                  return TargetLookupResult()
              try:
                  target = collection_target(value)
              except ValueError:
                  return TargetLookupResult("invalid")
              profile = preferences.targets.get(target, TargetProfile())
              record = next((record for record in records if record.douyin_id == target and record.nickname), None)
              nickname = profile.nickname or (record.nickname if record is not None else "")
              if not nickname:
                  return TargetLookupResult("missing", target)
              return TargetLookupResult("success", target, nickname, profile.fans_count, profile.following_count,
                  profile.region or (record.region if record is not None else ""),
                  profile.live_ip or (record.ip_region if record is not None else ""))


          def format_target_lookup_text(result: TargetLookupResult) -> str:
              if result.state != "success":
                  return {"idle": "填写目标抖音号，点击“搜索账号”设置账号资料",
                          "invalid": "获取失败 · 目标抖音号格式不正确", "missing": "获取失败 · 请先设置账号资料"}[result.state]

              def brief(text: str, maximum: int) -> str:
                  return text if len(text) <= maximum else text[:maximum - 1] + "…"

              fans = f"{result.fans_count:,}" if result.fans_count is not None else "—"
              following = f"{result.following_count:,}" if result.following_count is not None else "—"
              return (f"获取成功 · 昵称：{brief(result.nickname, 20)}\n"
                      f"粉丝 {fans} 人 · 关注 {following} 人\n"
                      f"资料位置：{brief(result.region or '未填写', 18)} · 实时IP：{brief(result.live_ip or '未填写', 24)}")


          def target_lookup_text(value: str, preferences: CollectionPreferences, records: list[Recipient]) -> str:
              return format_target_lookup_text(target_lookup_result(value, preferences, records))


          def privacy_failure_reason(preferences: CollectionPreferences, target: str, kind: str) -> str:
