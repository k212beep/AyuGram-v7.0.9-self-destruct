              def restore_collection_receipt(self) -> None:
                  target, kind = self.current_collection_key(self.collection_kind_var.get())
                  receipt = self.collection_receipts.get((target, kind), CollectionReceipt())
                  self.collection_paths = list(receipt.paths)
                  self.collection_saved_path = receipt.saved_path
                  self.collection_saved_var.set(str(receipt.saved_path) if receipt.saved_path else "本次任务未保存文件")
                  reason = privacy_failure_reason(self.collection_preferences, target, kind)
                  self.collection_status_var.set("采集成功 · 已保存至本地" if receipt.state == "success" and not reason else "采集失败")
                  self.collection_status_color = "accent" if receipt.state == "success" and not reason else "red"
                  self.collection_detail_var.set(reason or self.collection_receipt_detail(target, kind, receipt))
                  self.refresh_collection_files()
                  self.sync_collection_controls()

              def collection_receipt_detail(self, target: str, kind: str, receipt: CollectionReceipt) -> str:
                  if receipt.state != "success":
                      return receipt.detail
                  count = collection_display_count(self.collection_preferences, target, kind, receipt.count)
                  return f"已采集{kind} {count:,} 人 · 已保存至本地，{receipt.detail}"

              def set_collection_failure(self, detail: str, key=None) -> None:
                  key = key or self.current_collection_key(self.collection_kind_var.get())
                  self.collection_receipts[key] = CollectionReceipt(detail=detail, paths=list(self.collection_paths))
                  self.collection_status_var.set("采集失败")
                  self.collection_status_color = "red"
                  self.collection_detail_var.set(detail)
                  self.collection_saved_path = None
                  self.collection_saved_var.set("本次任务未保存文件")
                  self.refresh_collection_cards()
                  self.sync_collection_controls()

              def collect_once(self, kind: str | None = None) -> None:
                  if self.session.active:
                      return
                  if self.collection_importer.pending:
                      self.open_collection()
                      return
                  if kind is not None:
                      self.collection_kind_var.set(kind)
                  try:
                      target = collection_target(self.collection_target_var.get())
                      reason = privacy_failure_reason(self.collection_preferences, target, self.collection_kind_var.get())
                      if reason:
                          raise ValueError(reason)
                  except ValueError as exc:
                      self.set_collection_failure(str(exc))
                      self.toast_var.set(str(exc))
                      return
                  paths = filedialog.askopenfilenames(parent=self.collection_dialog or self.root,
                      title=f"{self.collection_kind_var.get()} · 一键采集 · 选择名单",
                      filetypes=[("名单文件", "*.txt *.csv *.tsv"), ("所有文件", "*.*")])
                  if paths:
                      self.set_collection_paths(paths)
                      self.start_collection_import()

