          同时验证操作栏、本地时间和运行时间完整显示。失败报告会记录控件名称、位置和尺寸，便于定位。

          ## v1.10.0 对齐、评论次数与紧凑界面

          昵称、抖音号、资料地区、IP 属地等文字列的表头和资料统一靠左，并校正标题与单元格边距。
          性别、年龄和评论次数统一居中。窄窗口优先保证表头完整，资料按列宽换行，不需要左右拖动查找状态。

          新增“评论次数”列，支持评论区 TXT 中的 `评论次数 5`、`评论数 12 次`，
          以及 CSV / TSV 中的“评论次数”“评论数”“评论数量”或 `comment_count` 等列名。
          0 显示为 0，缺失或无效数值显示为 —；不会将评论地区分布当成 IP 属地或凭空推算次数。
          同一 ID 重复导入时保留较大的已知次数，不重复相加。

          点击“评论次数”表头可按数字升序 / 降序排序，未知值排在最后。
          名单标题右侧的“评论次数”勾选框控制该列的显示和隐藏，并在下次启动时恢复选择。
          隐藏后数据仍保留，完整资料中也可查看；其余列会自动使用腾出的宽度。

          窗口、字体、控件内外边距与栏宽按约 85% 统一缩小，保留现有配色、三栏和常驻视频预览。
          默认最大窗口约为 1530 × 867，最小为 901 × 578，实际初始尺寸会适应屏幕。
          视频保持等比适配；高清预览的 100% 模式仍按原始画面像素显示。

          ## v1.11.0 资料采集入口与分类导入

          顶部新增“资料采集”，在独立窗口中填写任务抖音号、选择评论区 / 粉丝 / 关注，再选择名单文件。
          主界面继续保留紧凑三栏和常驻视频预览，不增加折叠区或切换媒体页签。
          “查询本地名单”只在当前导入记录中匹配抖音号；任务抖音号用于记录备注，不验证资料与平台账号的归属关系。
          窗口和保存文件均明确标注“手动导入”。

          点击“导入并保存”后，后台实际读取 TXT / CSV / TSV、解析完整字段并去重，再保存一份 CSV。
          所选类型作为本次导入的分类，原始行与文件名称一并保留；已经在工作台中的相同 ID 会合并来源和资料。
          读取期间显示进度；文件真正保存后才显示“导入成功 · 已保存”与“已采集评论区 xx 人（手动导入）”等结果。
          缺失、无效文件或保存失败会显示具体原因，并提供“重试导入”。成功和失败状态来自实际操作结果。

          保存目录为 `%LOCALAPPDATA%/DouyinSender/collections/`，文件名包含类别、任务抖音号、时间和唯一后缀。
          保存内容包括完整资料、评论次数、导入原文、任务抖音号和数据来源；“打开保存位置”可在资源管理器中查看。
          文件在成功写完后才成为正式 CSV；失败或取消的临时文件会清理，不覆盖以前保存的名单。
          关闭采集窗口后导入仍可继续，重新打开可查看完成结果；程序退出时会结束尚未完成的读取。

          主界面底部和采集窗口下方显示当前工作台的评论区、粉丝、关注人数，各类按 ID 分别去重。
          同一人可以属于多个类别；统计数由导入资料产生，不代表平台账号的实际粉丝或关注总量。
          清空工作台后人数归零，已保存的 CSV 仍保留；重启后可重新导入这些文件恢复名单。

          ## v1.11.1 采集窗口尺寸修复

          v1.11.0 在 Windows 源码 GUI 检查中发现：采集窗口缩到固定最小高度后，“返回工作台”按钮超出容器下边界。
          现在根据实际字体、缩放和全部控件的布局需求计算最小尺寸，默认尺寸也随之调整；主工作台的尺寸与三栏布局保留。
          GUI 检查覆盖正常字体和放大 25% 后的采集窗口、缩到最小尺寸后的所有控件边界，仍保留完整可见性检查。
          若检查失败，诊断报告会附带窗口尺寸、实际布局需求及各控件位置，便于核对。

          ## v1.12.0 左侧名单与右侧紧凑操作区

          左侧名单使用工作区的全部高度，导入名单、采集评论区、采集粉丝、采集关注和分类人数集中在左侧。
          三个分类按钮直接打开并选择对应类型；导入正在进行时，点击入口只返回当前任务，不改变其分类。
          采集窗口继续管理手动导入的数据，成功与失败均来自实际读取和保存结果。

          右侧上方并排显示群发内容、消息预览和媒体素材，视频封面保持常驻。
          “开始群发 / 暂停 / 停止”和进度放在群发内容下方，运行日志与导出按钮放在媒体素材下方。
          底部保留一行运行时长与 Windows 本地时间，操作区与日志不再占用横跨整个窗口的大排空间。
          名单、内容和媒体同时显示，保留 85% 缩放和既有最小窗口尺寸。

          发送间隔改为 0.8–120 秒 / 人，默认 0.8 秒；输入、任务校验和实际计时采用相同范围。
          120 秒仍可即时暂停或停止，无需等待间隔结束。无效数值、超范围和无穷值会提示检查设置。

          ## v1.12.1 Windows 界面自检恢复时序修复

          v1.12.0 的 Windows 构建已通过 92 项逻辑测试和前 16 次布局检查，随后在隐藏并恢复主窗口时报告整套控件未显示。
          Windows 的窗口显示消息需要完整事件循环处理；原检查只处理空闲布局任务，在显示完成前提前判断了控件可见性。
          现在先处理窗口事件并等待实际可见，再检查每个控件是否显示、是否超出父容器。等待上限为 5 秒，始终不显示的窗口仍会失败。
          报告额外记录主窗口状态、是否映射与是否可见。

          新增真实 GUI 回归：主窗口隐藏后分别延迟 25 / 75 毫秒恢复，验证检查能等待显示；另验证一直隐藏的窗口会超时失败。
          采集窗口尺寸、左侧分类入口、右侧紧凑操作区、视频常驻预览和 0.8–120 秒发送间隔一并保留验证。

          ## v1.13.0 目标资料与分类状态

          删除“全部来源”下拉框与独立“导入名单”按钮，左侧上方增加可手动填写的“目标抖音号”。
          下面分别显示“评论区 · 一键采集”“粉丝 · 一键采集”“关注 · 一键采集”和各自的成功 / 失败状态。
          点击按钮直接选择本地数据文件，随后自动读取、精确去重、分类和保存 CSV，无需再点击确认导入。
          只有读取并保存成功才显示“采集成功 · 已采集 XX 人”；人数为本次选择文件中的有效去重 ID 数，不是平台总人数。
          没有提供文件时默认“采集失败 · 未选择数据”；取消选择保留已有结果。切换目标后按目标和分类分别显示结果，清空名单后状态重置。
          详情窗口和文件信息保留“本地文件”来源，保存的 CSV 仍记录真实数据来源。

          点击“目标设置”填写目标抖音号、昵称及粉丝 / 关注的隐私标记。保存后主界面显示“获取成功 · 昵称：XXX（本地配置）”。
          没有配置昵称时可读取当前名单中相同 ID 的昵称，并显示“本地名单”；均未找到时显示获取失败，不生成随机昵称。
          隐私标记分别控制粉丝和关注，界面显示“账号已设置隐私，采集失败（手动标记）”；评论区不受该标记影响。
          未标记隐私时，文件缺失、无效和写入失败显示相应真实原因，不推断账号的隐私设置。
          昵称最多 40 字，目标 ID 按文本保留前导零。设置文件损坏时恢复空设置，不自动覆盖原文件。

          设置保存在 `%LOCALAPPDATA%/DouyinSender/collection-settings.json`，也可在程序关闭后修改：

          ```json
          {
            "schema_version": 1,
            "last_target": "00123",
            "targets": {
              "00123": {"nickname": "目标昵称", "fans_private": false, "following_private": false}
            }
          }
          ```

          状态记录只保存在本次运行中，重启后的成功人数仍需从文件重新获取；昵称及隐私标记会保留。
          沿用已在 GitHub 构建成功的 v1.12.1 窗口显示等待逻辑、右侧紧凑操作区、常驻视频预览和 0.8–120 秒间隔。

