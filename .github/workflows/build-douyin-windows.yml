              def scale_ui(self, parent) -> None:
                  """Scale each widget's fonts and pixel spacing once; retain text-unit widths."""
                  from tkinter import font as tkfont

                  pending = [parent]
                  while pending:
                      widget = pending.pop()
                      pending.extend(widget.winfo_children())
                      if getattr(widget, "_ui_scaled", False):
                          continue
                      widget._ui_scaled = True
                      options = widget.configure()
                      if "font" in options:
                          actual = tkfont.Font(root=self.root, font=widget.cget("font")).actual()
                          size = actual["size"]
                          size = ui_font_size(size) if size > 0 else -max(9, ui_pixels(-size))
                          font = (actual["family"], size, actual["weight"], actual["slant"])
                          if actual["underline"]:
                              font += ("underline",)
                          if actual["overstrike"]:
                              font += ("overstrike",)
                          widget.configure(font=font)
                      for option in ("padx", "pady", "highlightthickness", "borderwidth"):
                          if option in options:
                              widget.configure(**{option: ui_pixels(widget.winfo_pixels(widget.cget(option)))})
                      if isinstance(widget, tk.Canvas):
                          widget.configure(width=ui_pixels(widget.winfo_pixels(widget.cget("width"))),
                                           height=ui_pixels(widget.winfo_pixels(widget.cget("height"))))
                      manager = widget.winfo_manager()
                      if manager in {"pack", "grid"}:
                          info = widget.pack_info() if manager == "pack" else widget.grid_info()
                          changes = {}
                          for key in ("padx", "pady", "ipadx", "ipady"):
                              if key in info:
                                  value = info[key]
                                  values = value if isinstance(value, (tuple, list)) else widget.tk.splitlist(str(value))
                                  changes[key] = tuple(ui_pixels(widget.winfo_pixels(part)) for part in values)
                          if manager == "pack":
                              widget.pack_configure(**changes)
                          else:
                              widget.grid_configure(**changes)
                      columns, rows = widget.grid_size()
                      for index in range(columns):
                          widget.columnconfigure(index, minsize=ui_pixels(int(widget.columnconfigure(index)["minsize"])))
                      for index in range(rows):
                          widget.rowconfigure(index, minsize=ui_pixels(int(widget.rowconfigure(index)["minsize"])))

              def build_ui(self) -> None:
                  main = tk.Frame(self.root, bg=COLORS["bg"])
                  main.pack(fill="both", expand=True, padx=14, pady=9)
                  main.columnconfigure(0, weight=1)
                  # The roster uses the full workspace height. Compact task controls and
                  # logs sit below the two right-hand panels instead of across the window.
                  main.rowconfigure(2, weight=1)
                  header = tk.Frame(main, bg=COLORS["bg"])
                  header.grid(row=0, column=0, sticky="ew", pady=(0, 4))
                  self.label(header, "抖音群发工作台", 17, bold=True).pack(side="left")
                  self.label(header, f"v{VERSION}", 8, "muted").pack(side="left", padx=10)
                  self.button(header, "账号设置", self.open_account_settings, padx=10, pady=5).pack(side="right")
                  self.button(header, "计时设置", self.open_runtime_settings, padx=10, pady=5).pack(side="right", padx=7)
                  self.account_display_label = self.label(header, size=8, textvariable=self.account_display_var,
                                                           justify="right", anchor="e")
                  self.account_display_label.pack(side="right", padx=12)

                  stats = self.stats_frame = tk.Frame(main, bg=COLORS["bg"])
                  stats.grid(row=1, column=0, sticky="ew", pady=(0, 5))
                  self.stat_vars = [tk.StringVar(value="0") for _ in range(4)]
                  self.stat_value_labels = []
                  for i, (caption, color) in enumerate([("名单人数", "text"), ("已合并重复", "blue"),
                                                        ("已处理", "accent"), ("本轮待处理", "amber")]):
                      stats.columnconfigure(i, weight=1, uniform="stat")
                      card = self.card(stats)
                      card.grid(row=0, column=i, sticky="ew", padx=(0 if i == 0 else 4, 0 if i == 3 else 4))
                      self.label(card, caption, 9, "muted").pack(side="left", padx=(9, 5), pady=4)
                      value_label = self.label(card, size=12, color=color, bold=True, textvariable=self.stat_vars[i])
                      value_label.pack(side="right", padx=9, pady=4)
                      self.stat_value_labels.append(value_label)

                  body = self.body = tk.Frame(main, bg=COLORS["bg"])
                  body.grid(row=2, column=0, sticky="nsew")
                  body.columnconfigure(0, weight=1, minsize=410)
                  body.columnconfigure(1, weight=0, minsize=250)
                  body.columnconfigure(2, weight=0, minsize=240)
                  self.body_layout_mode = "compact"
                  body.bind("<Configure>", self.update_body_columns)
                  body.rowconfigure(0, weight=1)
                  list_card = self.list_card = self.card(body)
                  list_card.grid(row=0, column=0, rowspan=3, sticky="nsew", padx=(0, 8))
                  list_card.columnconfigure(0, weight=1)
                  list_card.rowconfigure(3, weight=1)
                  list_header = tk.Frame(list_card, bg=COLORS["card"])
                  list_header.grid(row=0, column=0, sticky="ew", padx=10, pady=(9, 7))
                  list_header.columnconfigure(0, weight=1)
                  target_row = tk.Frame(list_header, bg=COLORS["card"])
                  target_row.grid(row=0, column=0, sticky="ew")
                  self.label(target_row, "目标抖音号", 10, "muted").pack(side="left", padx=(0, 7))
                  self.main_target_entry = tk.Entry(target_row, textvariable=self.collection_target_var, width=10,
                      bg=COLORS["input"], fg=COLORS["text"], insertbackground=COLORS["accent"], relief="flat", font=("Microsoft YaHei UI", 11))
                  self.main_target_entry.pack(side="left", fill="x", expand=True, ipady=5)
                  self.main_target_entry.bind("<Return>", lambda _event: self.lookup_collection_target())
                  self.target_config_button = self.button(target_row, "搜索账号", self.open_target_settings, padx=8, pady=5)
