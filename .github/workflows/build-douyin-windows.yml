                      values = tuple(self.wrapped_table_text(value, max(1, self.table_widths[column] - 2 * self.table_cell_padding))
                                     if column in self.table_widths else value for column, value in zip(TABLE_COLUMNS, raw_values))
                      max_lines = max(max_lines, *(value.count("\n") + 1 for column, value in zip(TABLE_COLUMNS, values)
