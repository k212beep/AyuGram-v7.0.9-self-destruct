          对于分类名单，总人数为评论区、粉丝、关注三项显示人数相加；粉丝、关注采用对应目标的自定义采集人数，留空时采用实际分类统计。
          评论次数旁改为“共 XX 人”，避免继续显示按文件行数计算的旧比例。存在不属于上述三类的普通名单时，其去重人数补充至总人数。
          修改设置、导入、切换目标、清空、重启及任务进度刷新均保持同步；分类汇总不会被排序、窗口重绘或任务计时重新覆盖。
          筛选命中人数显示在筛选提示行，顶部与名单底部继续显示总人数。名单记录、互相关注标记、任务队列和导出行数保持原有逻辑。

