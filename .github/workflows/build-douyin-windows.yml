              def schedule_target_result_layout(self) -> None:
                  if self.target_result_layout_timer is None:
                      self.target_result_layout_timer = self.root.after_idle(self.fit_target_result_card)

              def fit_target_result_card(self) -> None:
                  self.target_result_layout_timer = None
                  from tkinter import font as tkfont
                  for key, label in self.target_result_widgets.items():
                      font = tkfont.Font(root=self.root, font=label.cget("font"))
                      text = ellipsize_text(self.target_result_full_values.get(key, ""), max(1, label.winfo_width() - 4), font.measure)
                      if self.target_result_vars[key].get() != text:
                          self.target_result_vars[key].set(text)
                  canvas = self.target_result_avatar
                  width, height = canvas.winfo_width(), canvas.winfo_height()
                  result = self.target_result_data
                  initial = result.nickname[:1].upper()[:1] if result.state == "success" else "⌕" if result.state == "idle" else "!"
                  signature = (width, height, initial, result.state)
                  if signature == self.target_result_avatar_signature or min(width, height) < 8:
                      return
                  self.target_result_avatar_signature = signature
                  canvas.delete("all")
                  center_x, center_y = width / 2, height / 2
                  radius = max(1, min(width, height) / 2 - 2)
                  canvas.create_oval(center_x-radius, center_y-radius, center_x+radius, center_y+radius,
                                     fill="#18374B", outline="#326379", width=1)
                  canvas.create_oval(center_x-radius+4, center_y-radius+4, center_x+radius-4, center_y+radius-4,
                                     fill="#1B4054", outline="")
                  canvas.create_text(center_x, center_y-1, text=initial, fill="#E4FFFC", font=("Microsoft YaHei UI", ui_font_size(21), "bold"))
                  x, y, dot = center_x + radius * .7, center_y + radius * .7, ui_pixels(4)
                  canvas.create_oval(x-dot, y-dot, x+dot, y+dot, fill=COLORS["accent"] if result.state == "success" else COLORS["muted"],
                                     outline=canvas.cget("bg"), width=2)

              def refresh_collection_totals(self) -> None:
                  self.refresh_target_summary()

              def refresh_target_summary(self) -> None:
                  self.target_result_data = target_lookup_result(self.collection_target_var.get(), self.collection_preferences, self.records)
                  self.collection_lookup_var.set(format_target_lookup_text(self.target_result_data))
                  self.update_target_result_card()
                  target, _ = self.current_collection_key("评论区")
                  counts, self.collection_display_total = collection_display_summary(self.records, self.collection_preferences, target)
                  self.collection_totals_var.set("已采集：" + " · ".join(
                      f"{kind} {counts[kind]:,} 人"
                      for kind in COLLECTION_TYPES))
                  self.refresh_roster_count_labels()
                  self.refresh_collection_cards()

              def refresh_roster_count_labels(self) -> None:
                  self.stat_vars[0].set(f"{self.collection_display_total:,}")
                  self.visible_var.set(f"共 {self.collection_display_total:,} 人")

              def current_collection_key(self, kind: str) -> tuple[str, str]:
                  value = self.collection_target_var.get()
                  try:
                      target = collection_target(value)
                  except ValueError:
                      target = value.strip()
                  return target, kind

              def refresh_collection_cards(self) -> None:
                  for kind, variable in self.collection_status_vars.items():
                      target, _ = self.current_collection_key(kind)
                      reason = privacy_failure_reason(self.collection_preferences, target, kind)
                      receipt = self.collection_receipts.get((target, kind), CollectionReceipt())
                      if reason:
                          text, color = "账号已设置隐私\n采集失败", "red"
                      elif receipt.state == "success":
                          count = collection_display_count(self.collection_preferences, target, kind, receipt.count)
                          text, color = f"采集成功\n已采集 {count:,} 人", "accent"
                      elif receipt.state == "running":
                          text, color = "正在采集\n请稍候…", "blue"
                      else:
                          brief = "文件不存在" if "文件不存在" in receipt.detail else receipt.detail
                          brief = brief if len(brief) <= 10 else brief[:9] + "…"
                          text, color = f"采集失败\n{brief}", "red"
                      variable.set(text)
                      self.collection_card_labels[kind].configure(fg=COLORS[color])
                      badge = self.collection_saved_badges[kind]
                      if receipt.state == "success" and not reason and receipt.saved_path is not None:
                          badge.grid()
                      else:
                          badge.grid_remove()
                  self.refresh_mutual_follow_card()

              def refresh_mutual_follow_card(self) -> None:
                  target, _ = self.current_collection_key("粉丝")
                  self.mutual_follow_total = mutual_follow_count(self.collection_members, target)
                  if self.mutual_follow_total is None:
                      self.mutual_follow_var.set("0")
                      self.mutual_follow_card.grid_remove()
                  else:
                      self.mutual_follow_var.set(f"{self.mutual_follow_total:,}")
                      self.mutual_follow_card.grid()

              def open_target_settings(self) -> None:
                  if self.session.active or self.collection_importer.pending:
                      return
                  if self.target_settings_dialog is not None and self.target_settings_dialog.winfo_exists():
                      self.target_settings_dialog.lift()
                      return
                  dialog = self.target_settings_dialog = tk.Toplevel(self.root)
                  dialog.title("搜索账号")
