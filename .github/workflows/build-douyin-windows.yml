                  self.assertEqual(collection_display_summary(records, empty, "owner"), ({"评论区": 0, "粉丝": 1, "关注": 0}, 2))


          class SendIntervalTests(unittest.TestCase):
              def test_inclusive_bounds_and_timer_milliseconds(self):
                  for value, expected in (("0.8", 800), ("120", 120000), (" 120.0 ", 120000), ("0.9", 900), ("1.25", 1250)):
                      with self.subTest(value=value):
                          self.assertEqual(send_interval_ms(value), expected)

              def test_out_of_range_nonfinite_and_invalid_values_are_rejected(self):
                  for value in ("0.799999", "120.00001", "0", "-1", "nan", "inf", "-inf", "1e309", "", "abc", "0,8", None):
                      with self.subTest(value=value), self.assertRaisesRegex(ValueError, "0.8 至 120 秒"):
                          send_interval_ms(value)


          class MessageLimitTests(unittest.TestCase):
              def test_limit_accepts_boundary_and_rejects_overflow(self):
                  session = Session()
                  session.start([Recipient("00123")], "文" * MAX_MESSAGE)
                  session.stop()
                  with self.assertRaises(ValueError):
                      session.start([Recipient("00123")], "文" * (MAX_MESSAGE + 1))

              def test_personalized_message_also_obeys_limit(self):
                  session = Session()
                  template = "文" * (MAX_MESSAGE - len("{昵称}")) + "{昵称}"
                  self.assertEqual(len(template), MAX_MESSAGE)
                  with self.assertRaises(ValueError):
                      session.start([Recipient("00123", "一个较长的接收人昵称")], template)
                  self.assertEqual(session.state, "idle")


          if __name__ == "__main__":
              unittest.main()
