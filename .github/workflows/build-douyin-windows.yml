          删除“接收人名单”标题行和主界面的文件说明行，“目标设置”按钮改名为“搜索账号”，继续打开相同的资料设置窗口。
          名单筛选输入框移入性别 / 年龄筛选行，评论次数显示开关移至名单底部。
          账号摘要显示昵称、粉丝人数、关注人数、资料位置与实时IP；移除“本地配置”“本地名单”“手动标记”等界面说明。
          账号摘要和采集状态字体增大，正文提高对比度；右下角“当前时间”使用更大的加粗字体，仍每秒读取运行电脑的 Windows 日期和时间。
          主界面、采集区、设置窗口及日志中的相关文案一并更新。

          点击“搜索账号”填写粉丝数、关注数、资料位置和实时IP。人数可留空或填写非负整数，支持 `1,234` 格式。
