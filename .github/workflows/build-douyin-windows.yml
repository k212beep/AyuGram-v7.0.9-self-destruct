              def draw_media_image(self, canvas, source, original: bool = False):
                  from PIL import ImageTk

                  old_scroll = (canvas.xview()[0], canvas.yview()[0])
                  canvas.delete("all")
                  padding = ui_pixels(12)
                  width, height = max(2 * padding, canvas.winfo_width()), max(2 * padding, canvas.winfo_height())
                  image = render_cover_image(source, width - 2 * padding, height - 2 * padding, original=original)
                  photo = ImageTk.PhotoImage(image, master=self.root)
                  x, y = max(padding, (width - image.width) / 2), max(padding, (height - image.height) / 2)
                  canvas.create_rectangle(x - 1, y - 1, x + image.width + 1, y + image.height + 1,
                                          outline="#3C5269", width=1)
                  canvas.create_image(x, y, image=photo, anchor="nw", tags=("cover_image",))
                  canvas.preview_scale = image.width / source.width
                  canvas.configure(scrollregion=(0, 0, max(width, image.width + 2 * padding), max(height, image.height + 2 * padding)))
                  if original:
                      canvas.xview_moveto(old_scroll[0])
                      canvas.yview_moveto(old_scroll[1])
                  else:
                      canvas.xview_moveto(0)
                      canvas.yview_moveto(0)
                  return photo

