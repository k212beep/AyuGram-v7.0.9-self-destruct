          点击“计时设置”可填写时、分、秒，保存后立即生效；初始值写入 `%LOCALAPPDATA%/DouyinSender/runtime-settings.json`，下次启动从该初始值开始。
          计时采用单调时钟，不受手动调整 Windows 系统时间影响。

