                      "comment_count": 76, "source": 118, "status": 86}.items() if key in columns}
                  self.table_widths = allocate_column_widths(available, minimums, columns=columns, maximums=maximums)
                  for column, (caption, _width, _minimum) in TABLE_COLUMNS.items():
