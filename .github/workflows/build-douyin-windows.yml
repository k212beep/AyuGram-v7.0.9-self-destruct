          删除媒体区的“1080 × 1920 · 9:16 竖屏”尺寸提示、独立“高清预览”按钮，以及封面读取成功后的高清 / 100% 原尺寸说明。
          视频封面和图片仍等比显示；点击画面可沿用现有的大图查看功能。读取中、文件变更或读取失败时保留对应提示，成功后自动收起提示行。
