                  heading_minimums = {key: self.table_heading_font.measure(captions[key]) + 2 * ui_pixels(1) + 2
                                     for key in columns}
                  minimums = {key: max(minimums[key], heading_minimums[key]) for key in columns}
                  maximums = {key: max(minimums[key], ui_pixels(limit)) for key, limit in {
