# Upload this single file as .github/workflows/build-douyin-windows.yml
# It embeds all source and uses no real recipient data, Secrets, or account logins.
name: Build Douyin Windows App
run-name: Douyin Windows v1.19.0 · ${{ github.ref_name }}

on:
  push:
    paths:
      - '.github/workflows/build-douyin-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: douyin-windows-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64


      - name: Write embedded app.py (1/20)
        run: |
          $payload = @'
          """Desktop messaging workbench with a local task queue."""
          from __future__ import annotations

          import argparse
          import csv
          import json
          import math
          import os
          import re
          import shutil
          import struct
          import subprocess
          import sys
          import tempfile
          import threading
          import time
          import traceback
          from collections import deque
          from dataclasses import dataclass, field
          from datetime import datetime
          from functools import lru_cache
          from io import BytesIO
          from pathlib import Path
          from queue import Empty, SimpleQueue


          APP_NAME = "抖音群发工作台"
          VERSION = "1.19.0"
          UI_SCALE = 0.85
          MAX_FILE_BYTES = 5 * 1024 * 1024
          MAX_RECIPIENTS = 20000
          MAX_MESSAGE = 200
          MIN_SEND_INTERVAL = 0.8
          MAX_SEND_INTERVAL = 120.0
          COVER_MAX_EDGE = 1920
          COLLECTION_TYPES = ("评论区", "粉丝", "关注")
          COLLECTION_CSV_FORMAT = "DouyinSender-collection-v1"
          MEDIA_EXTENSIONS = {
              ".png": "图片", ".jpg": "图片", ".jpeg": "图片", ".gif": "图片", ".webp": "图片", ".bmp": "图片",
              ".mp4": "视频", ".mov": "视频", ".mkv": "视频", ".avi": "视频", ".webm": "视频",
              ".mp3": "音频", ".wav": "音频", ".m4a": "音频", ".aac": "音频", ".ogg": "音频", ".flac": "音频",
          }
          ID_RE = re.compile(r"(?=[A-Za-z0-9_.-]*[A-Za-z0-9])[A-Za-z0-9_.-]{1,64}\Z")
          LABELED_ID = re.compile(r"(?:抖音号|抖音ID|douyin[_ ]?id)\s*[:：=]?\s*([^\s,，;；]+)", re.I)
          ID_HEADERS = {"抖音号", "抖音id", "douyinid", "id", "账号"}
          NAME_HEADERS = {"昵称", "nickname", "name", "姓名"}
          SOURCE_HEADERS = {"来源", "source", "分组"}
          GENDER_HEADERS = {"性别", "gender", "sex"}
          AGE_HEADERS = {"年龄", "age", "岁数"}
          REGION_HEADERS = {"资料位置", "资料地区", "资料所在地", "资料所在地区", "个人资料位置", "个人资料地区",
                            "个人地区", "地区", "所在地", "region", "location", "profileregion", "profilelocation"}
          IP_REGION_HEADERS = {"ip属地", "ip归属地", "ip所在地", "ip地区", "ip位置", "ipregion", "iplocation"}
          COMMENT_COUNT_HEADERS = {"评论次数", "评论数", "评论数量", "commentcount", "commenttimes", "comments"}
          COMMENT_COUNT_LABEL = re.compile(
              r"(?:评\s*论\s*(?:次\s*数|数\s*量|数)|comment[_ ]?(?:count|times))\s*[:：=]?\s*", re.I)
          LOCATION_LABELS = re.compile(
              r"(?P<ip>i\s*p\s*(?:归\s*属\s*地|属\s*地|所\s*在\s*地|地\s*区|位\s*置))|"
              r"(?P<region>(?:个\s*人\s*)?资\s*料\s*(?:所\s*在\s*地(?:\s*区)?|位\s*置|地\s*区)|"
              r"(?:所\s*在\s*地|地\s*区)(?=\s*[:：=]))|"
              r"(?P<other>评\s*论\s*(?:次\s*数|数\s*量|数)|抖音号|抖音\s*ID|douyin[_ ]?id|昵\s*称|性\s*别|年\s*龄|来\s*源)", re.I)
          TABLE_COLUMNS = {
              "name": ("昵称", 220, 80), "id": ("抖音号", 156, 64),
              "gender": ("性别", 34, 26), "age": ("年龄", 36, 26),
              "region": ("资料地区", 100, 38), "ip_region": ("IP属地", 64, 38),
              "comment_count": ("评论次数", 66, 38),
              "source": ("来源", 104, 54), "status": ("状态", 76, 54),
          }
          TABLE_ANCHORS = {column: "center" for column in TABLE_COLUMNS}
          COLORS = {
              "bg": "#0B1020", "side": "#10182A", "card": "#151F33",
              "input": "#0C1425", "line": "#293952", "text": "#F0F5FF",
              "muted": "#A2B0C6", "accent": "#5EEAD4", "blue": "#8CB5FF",
              "amber": "#F4C981", "red": "#F595A5", "hover": "#233149",
          }


          @dataclass
          class Recipient:
              douyin_id: str
              nickname: str = ""
              sources: list[str] = field(default_factory=list)
              gender: str = ""
              age: int | None = None
              region: str = ""
              ip_region: str = ""
              raw_details: list[str] = field(default_factory=list)
              comment_count: int | None = None


          def ui_pixels(value: int | float) -> int:
              return max(1, math.floor(value * UI_SCALE + 0.5)) if value > 0 else 0


          def ui_font_size(value: int) -> int:
              return max(7, ui_pixels(value))


          @dataclass
          class ImportResult:
              records: list[Recipient]
              parsed: int = 0
              skipped: int = 0
              duplicates: int = 0


          @dataclass
          class AccountProfile:
              account: str = ""
              nickname: str = ""
              show_account: bool = True
              show_nickname: bool = True
              mask_account: bool = False


          def normalize_profile(profile: AccountProfile) -> AccountProfile:
              if not isinstance(profile.account, str) or not isinstance(profile.nickname, str):
                  raise ValueError("账号和昵称必须是文本。")
              account = profile.account.strip().removeprefix("@")
              nickname = profile.nickname.strip()
              if account and not valid_id(account):
                  raise ValueError("账号限 1–64 位字母、数字、下划线、短横线或小数点。")
              if len(nickname) > 40 or any(ord(char) < 32 for char in nickname):
                  raise ValueError("昵称最多 40 字，不能包含换行或控制字符。")
              flags = (profile.show_account, profile.show_nickname, profile.mask_account)
              if any(type(flag) is not bool for flag in flags):
                  raise ValueError("账号显示选项格式不正确。")
              return AccountProfile(account, nickname, *flags)


          def profile_display_text(profile: AccountProfile) -> str:
              lines = []
              if profile.show_nickname and profile.nickname:
                  nickname = profile.nickname
                  lines.append(nickname if len(nickname) <= 20 else nickname[:19] + "…")
              if profile.show_account and profile.account:
                  account = profile.account
                  if profile.mask_account:
                      account = account[:3] + "****" + account[-3:] if len(account) > 6 else "*" * len(account)
                  elif len(account) > 28:
                      account = account[:16] + "…" + account[-8:]
                  lines.append(f"账号：{account}")
              return "\n".join(lines)


          def default_profile_path() -> Path:
              if sys.platform == "win32":
                  base = Path(os.environ.get("LOCALAPPDATA", str(Path.home() / "AppData" / "Local")))
              else:
                  base = Path(os.environ.get("XDG_CONFIG_HOME", str(Path.home() / ".config")))
              return base / "DouyinSender" / "settings.json"


          def load_profile(path: Path) -> AccountProfile:
              if not path.exists():
                  return AccountProfile()
              if path.stat().st_size > 32768:
                  raise ValueError("账号设置文件过大。")
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or data.get("schema_version") != 1:
                  raise ValueError("账号设置文件格式不正确。")
              values = data.get("profile")
              if not isinstance(values, dict):
                  raise ValueError("账号设置内容不正确。")
              defaults = AccountProfile()
              fields = ("account", "nickname", "show_account", "show_nickname", "mask_account")
              return normalize_profile(AccountProfile(**{name: values.get(name, getattr(defaults, name)) for name in fields}))


          def write_json_atomic(path: Path, data: dict) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              temporary_path = None
              try:
                  with tempfile.NamedTemporaryFile(mode="w", encoding="utf-8", dir=path.parent,
                                                   prefix="settings-", suffix=".tmp", delete=False) as handle:
                      temporary_path = Path(handle.name)
                      json.dump(data, handle, ensure_ascii=False, indent=2)
                      handle.write("\n")
                  os.replace(temporary_path, path)
              finally:
                  if temporary_path is not None:
                      temporary_path.unlink(missing_ok=True)


          def save_profile(path: Path, profile: AccountProfile) -> AccountProfile:
              profile = normalize_profile(profile)
              write_json_atomic(path, {"schema_version": 1, "profile": {
                  "account": profile.account, "nickname": profile.nickname,
                  "show_account": profile.show_account, "show_nickname": profile.show_nickname,
                  "mask_account": profile.mask_account,
              }})
              return profile


          def duration_seconds(hours: str, minutes: str, seconds: str) -> int:
              values = [str(value).strip() for value in (hours, minutes, seconds)]
              if not all(re.fullmatch(r"\d+", value) for value in values):
                  raise ValueError("时、分、秒请填写非负整数。")
              h, m, s = map(int, values)
              if h > 99999 or m > 59 or s > 59:
                  raise ValueError("小时范围为 0–99999，分钟和秒范围为 0–59。")
              return h * 3600 + m * 60 + s


          def format_duration(seconds: float) -> str:
              total = max(0, int(seconds))
              return f"{total // 3600:02d}:{total // 60 % 60:02d}:{total % 60:02d}"


          def load_runtime_offset(path: Path) -> int:
              if not path.exists():
                  return 0
              if path.stat().st_size > 4096:
                  raise ValueError("计时设置文件过大。")
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or data.get("schema_version") != 1:
                  raise ValueError("计时设置格式不正确。")
              value = data.get("initial_seconds", 0)
              if type(value) is not int or not 0 <= value <= 99999 * 3600 + 3599:
                  raise ValueError("初始时长格式不正确。")
              return value


          def save_runtime_offset(path: Path, seconds: int) -> None:
              if type(seconds) is not int or not 0 <= seconds <= 99999 * 3600 + 3599:
                  raise ValueError("初始时长格式不正确。")
              write_json_atomic(path, {"schema_version": 1, "initial_seconds": seconds})


          def load_comment_column(path: Path) -> bool:
              if not path.exists():
                  return True
              if path.stat().st_size > 4096:
                  raise ValueError("列表显示设置文件过大。")
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or data.get("schema_version") != 1 or type(data.get("show_comment_count")) is not bool:
                  raise ValueError("列表显示设置格式不正确。")
              return data["show_comment_count"]


          def save_comment_column(path: Path, visible: bool) -> None:
              if type(visible) is not bool:
                  raise ValueError("评论次数列显示设置必须为开或关。")
              write_json_atomic(path, {"schema_version": 1, "show_comment_count": visible})


          class RuntimeClock:
              def __init__(self, initial_seconds: int = 0) -> None:
                  self.started = time.monotonic()
                  self.display_started = self.started
                  self.initial_seconds = initial_seconds

              @property
              def actual(self) -> float:
                  return max(0, time.monotonic() - self.started)

              @property
              def displayed(self) -> float:
                  return self.initial_seconds + max(0, time.monotonic() - self.display_started)

              def set_initial(self, seconds: int) -> None:
                  if type(seconds) is not int or seconds < 0:
                      raise ValueError("初始时长必须是非负整数。")
                  self.initial_seconds = seconds
                  self.display_started = time.monotonic()


          @dataclass(frozen=True)
          class MediaAsset:
              path: Path
              name: str
              kind: str
              size: int
              modified_ns: int


          def inspect_media(path: Path) -> MediaAsset:
              path = path.resolve()
              if not path.is_file():
                  raise ValueError("请选择可读取的媒体文件。")
              kind = MEDIA_EXTENSIONS.get(path.suffix.casefold())
              if kind is None:
                  raise ValueError("请选择图片、视频或音频文件。")
              stat = path.stat()
              if stat.st_size == 0:
                  raise ValueError("媒体文件为空，请重新选择。")
              return MediaAsset(path, path.name, kind, stat.st_size, stat.st_mtime_ns)


          class PreviewCancelled(Exception):
              pass


          def preview_executable() -> str:
              """Use the bundled decoder in the release; allow system ffmpeg for source runs."""
              try:
                  import imageio_ffmpeg
                  return imageio_ffmpeg.get_ffmpeg_exe()
              except (ImportError, RuntimeError, OSError):
                  if not getattr(sys, "frozen", False) and (executable := shutil.which("ffmpeg")):
                      return executable
                  raise ValueError("媒体预览组件不可用，请重新下载完整程序。") from None


          def media_cover_png(asset: MediaAsset, cancel: threading.Event | None = None, timeout: float = 15) -> bytes:
              """Extract a bounded, correctly proportioned frame without modifying the media."""
              if cancel is not None and cancel.is_set():
                  raise PreviewCancelled()
              if asset.kind == "音频":
                  raise ValueError("音频文件没有视频封面。")
              if inspect_media(asset.path) != asset:
                  raise ValueError("媒体文件已变更，请重新导入。")
              scale = (f"scale=w='max(2,trunc(min(iw*sar,min({COVER_MAX_EDGE},{COVER_MAX_EDGE}*dar))/2)*2)':"
                       f"h='max(2,trunc(min(ih,min({COVER_MAX_EDGE},{COVER_MAX_EDGE}/dar))/2)*2)':flags=lanczos,setsar=1")
              filters = scale + (",thumbnail=12" if asset.kind == "视频" else "")
              command = [preview_executable(), "-nostdin", "-hide_banner", "-loglevel", "error", "-threads", "1",
                         "-filter_threads", "1", "-protocol_whitelist", "file,pipe", "-i", str(asset.path),
                         "-map", "0:v:0", "-an", "-sn", "-dn", "-vf", filters, "-frames:v", "1",
                         "-threads", "1", "-c:v", "png", "-pix_fmt", "rgb24", "-f", "image2pipe", "pipe:1"]
              process = None
              try:
                  if cancel is not None and cancel.is_set():
                      raise PreviewCancelled()
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'app.py'), $payload + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))

      - name: Write embedded app.py (2/20)
        run: |
          $payload = @'
                  process = subprocess.Popen(command, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                             creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
                  deadline = time.monotonic() + timeout
                  while True:
                      if cancel is not None and cancel.is_set():
                          raise PreviewCancelled()
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise ValueError("封面读取超时，请重新导入或更换文件。")
                      try:
                          png, _errors = process.communicate(timeout=min(0.1, remaining))
                          break
                      except subprocess.TimeoutExpired:
                          continue
                  if cancel is not None and cancel.is_set():
                      raise PreviewCancelled()
                  if process.returncode or not png.startswith(b"\x89PNG\r\n\x1a\n") or len(png) < 24:
                      raise ValueError("无法读取封面，请确认媒体文件可以正常打开。")
                  width, height = struct.unpack(">II", png[16:24])
                  if not 1 <= width <= COVER_MAX_EDGE or not 1 <= height <= COVER_MAX_EDGE:
                      raise ValueError("封面尺寸不正确，请重新导入文件。")
                  if inspect_media(asset.path) != asset:
                      raise ValueError("媒体文件已变更，请重新导入。")
                  return png
              except OSError as exc:
                  raise ValueError("无法读取媒体封面，请重新导入或更换文件。") from exc
              finally:
                  if process is not None:
                      if process.poll() is None:
                          process.kill()
                      process.communicate()


          def decode_cover_image(png: bytes):
              from PIL import Image
              with Image.open(BytesIO(png)) as image:
                  if not 1 <= image.width <= COVER_MAX_EDGE or not 1 <= image.height <= COVER_MAX_EDGE:
                      raise ValueError("封面尺寸不正确。")
                  return image.convert("RGB")


          def fit_image_size(width: int, height: int, available_width: int, available_height: int) -> tuple[int, int]:
              if width <= 0 or height <= 0:
                  raise ValueError("图片尺寸必须大于零。")
              available_width, available_height = max(1, available_width), max(1, available_height)
              scale = min(1, available_width / width, available_height / height)
              return max(1, round(width * scale)), max(1, round(height * scale))


          def render_cover_image(image, available_width: int, available_height: int, original: bool = False):
              from PIL import Image
              if original:
                  return image
              size = fit_image_size(image.width, image.height, available_width, available_height)
              return image if size == image.size else image.resize(size, Image.Resampling.LANCZOS)


          def cover_dimensions_text(width: int, height: int) -> str:
              if width == height:
                  orientation = "方形"
              elif height > width:
                  orientation = "9:16 竖屏" if abs(width / height - 9 / 16) < 0.01 else "竖屏"
              else:
                  orientation = "16:9 横屏" if abs(width / height - 16 / 9) < 0.01 else "横屏"
              return f"{width} × {height} · {orientation}"


          @dataclass(frozen=True)
          class MediaPreviewResult:
              asset: MediaAsset
              png: bytes = b""
              error: str = ""


          class MediaPreviewLoader:
              """Workers only decode bytes; the Tk thread polls current-generation results."""
              def __init__(self) -> None:
                  self.generation = 0
                  self.pending = False
                  self.cancel_event: threading.Event | None = None
                  self.results = SimpleQueue()
                  self.workers: list[threading.Thread] = []

              def cancel(self) -> None:
                  if self.cancel_event is not None:
                      self.cancel_event.set()
                  self.generation += 1
                  self.pending = False

              def request(self, asset: MediaAsset) -> None:
                  self.cancel()
                  generation = self.generation
                  event = self.cancel_event = threading.Event()
                  self.pending = True

                  def decode():
                      try:
                          result = MediaPreviewResult(asset, media_cover_png(asset, event))
                      except PreviewCancelled:
                          return
                      except (ValueError, OSError) as exc:
                          result = MediaPreviewResult(asset, error=str(exc))
                      except Exception:
                          result = MediaPreviewResult(asset, error="封面读取失败，请重新导入或更换文件。")
                      if not event.is_set():
                          self.results.put((generation, result))

                  worker = threading.Thread(target=decode, name="media-cover", daemon=True)
                  self.workers = [thread for thread in self.workers if thread.is_alive()]
                  self.workers.append(worker)
                  worker.start()

              def shutdown(self) -> None:
                  self.cancel()
                  deadline = time.monotonic() + 3
                  for thread in self.workers:
                      thread.join(timeout=max(0, deadline - time.monotonic()))
                  self.workers = [thread for thread in self.workers if thread.is_alive()]

              def poll(self) -> MediaPreviewResult | None:
                  current = None
                  while True:
                      try:
                          generation, result = self.results.get_nowait()
                      except Empty:
                          break
                      if generation == self.generation:
                          current = result
                          self.pending = False
                  return current


          @dataclass
          class MediaTask:
              recipient: Recipient
              asset: MediaAsset
              status: str = "等待处理"
              error: str = ""


          class FollowMediaQueue:
              """Process explicit follow receipts into local media tasks."""
              def __init__(self) -> None:
                  self.pending: deque[MediaTask] = deque()
                  self.seen: set[tuple] = set()
                  self.completed = 0
                  self.failed = 0

              @staticmethod
              def key(recipient: Recipient, asset: MediaAsset) -> tuple:
                  return recipient.douyin_id, os.path.normcase(str(asset.path)), asset.size, asset.modified_ns

              def submit(self, recipients: list[Recipient], asset: MediaAsset) -> tuple[int, int]:
                  if inspect_media(asset.path) != asset:
                      raise ValueError("媒体文件已变更，请重新选择。")
                  added = duplicate = 0
                  for record in recipients:
                      key = self.key(record, asset)
                      if key in self.seen:
                          duplicate += 1
                          continue
                      self.seen.add(key)
                      self.pending.append(MediaTask(record, asset))
                      added += 1
                  return added, duplicate

              def process_next(self) -> MediaTask | None:
                  if not self.pending:
                      return None
                  task = self.pending.popleft()
                  try:
                      if inspect_media(task.asset.path) != task.asset:
                          raise ValueError("媒体文件已变更，请重新选择。")
                      task.status = "已处理"
                      self.completed += 1
                  except (OSError, ValueError) as exc:
                      task.status = "文件不可用"
                      task.error = str(exc)
                      self.failed += 1
                      self.seen.discard(self.key(task.recipient, task.asset))
                  return task

              def cancel_pending(self) -> int:
                  count = len(self.pending)
                  while self.pending:
                      task = self.pending.popleft()
                      self.seen.discard(self.key(task.recipient, task.asset))
                  return count


          def valid_id(value: str) -> bool:
              return bool(ID_RE.fullmatch(value))


          def decode_file(data: bytes) -> str:
              if data.startswith((b"\xff\xfe\x00\x00", b"\x00\x00\xfe\xff")):
                  return data.decode("utf-32")
              if data.startswith((b"\xff\xfe", b"\xfe\xff")):
                  return data.decode("utf-16")
              for encoding in ("utf-8-sig", "gb18030"):
                  try:
                      text = data.decode(encoding)
                      if "\x00" not in text:
                          return text
                  except UnicodeError:
                      continue
              raise ValueError("无法识别文件编码。请另存为 UTF-8、带 BOM 的 UTF-16 或 GB18030 文本。")


          def source_name(filename: str) -> str:
              stem = Path(filename).stem
              for name in ("共同好友", "评论区", "关注", "粉丝"):
                  if name in stem:
                      return name
              return stem[:60] or "导入名单"


          def optional_text(value: str) -> str:
              value = value.strip()
              return "" if value.casefold() in {"", "空", "无", "未知", "不详", "未填写", "未填", "none", "null", "n/a", "-", "—"} else value


          def normalize_header(value: str) -> str:
              return re.sub(r"[\s_\-:：=]+", "", value.lstrip("\ufeff")).casefold()


          def extract_locations(line: str) -> tuple[str, str]:
              """End a location at the next field label, regardless of spacing/order."""
              labels = list(LOCATION_LABELS.finditer(line))
              values = {"region": "", "ip": ""}
              for index, match in enumerate(labels):
                  kind = match.lastgroup
                  if kind not in values:
                      continue
                  end = labels[index + 1].start() if index + 1 < len(labels) else len(line)
                  value = line[match.end():end].strip(" \t\u3000:：=,，;；|")
                  value = optional_text(re.sub(r"[\s\u3000]+", " ", value))
                  if value and not values[kind]:
                      values[kind] = value
              return values["region"], values["ip"]


          def allocate_column_widths(available: int, minimums: dict[str, int] | None = None,
                                     columns: tuple[str, ...] | None = None,
                                     maximums: dict[str, int] | None = None) -> dict[str, int]:
              """Keep columns inside the viewport and give identity columns spare space."""
              columns = tuple(TABLE_COLUMNS) if columns is None else columns
              if not columns:
                  return {}
              available = max(len(columns), int(available))
              minimums = {key: max(1, (minimums or {}).get(key, TABLE_COLUMNS[key][2])) for key in columns}
              keys = list(columns)
              if available < sum(minimums.values()):
                  reserved = [key for key in ("status", "name") if key in keys] or [keys[-1]]
                  widths = {key: 1 for key in keys}
                  budget = available - len(keys)
                  for key in reserved:
                      extra = min(minimums[key] - 1, budget)
                      widths[key] += extra
                      budget -= extra
                      keys.remove(key)
                  weights = {key: minimums[key] for key in keys}
              else:
                  widths = dict(minimums)
                  budget = available - sum(widths.values())
                  weights = {key: 5 if key == "name" else 3 if key == "id" else 1 for key in keys}
              limits = {key: max(widths[key], (maximums or {}).get(key, available)) for key in columns}
              while budget:
                  active = [key for key in keys if widths[key] < limits[key]]
                  if not active:
                      # Identity columns absorb surplus if all optional caps are reached.
                      widths["name" if "name" in columns else columns[0]] += budget
                      break
                  total = sum(weights[key] for key in active) or 1
                  shares = {key: budget * weights[key] / total for key in active}
                  spent = 0
                  for key in active:
                      extra = min(limits[key] - widths[key], int(shares[key]))
                      widths[key] += extra
                      spent += extra
                  budget -= spent
                  if not spent:
                      for key in sorted(active, key=lambda key: shares[key], reverse=True):
                          widths[key] += 1
                          budget -= 1
                          if not budget:
                              break
              return {key: widths[key] for key in columns}


          def wrap_cell_text(value: str, max_width: int, measure) -> str:
              """Wrap without deleting characters or shortening the displayed value."""
              output = []
              for paragraph in str(value).split("\n"):
                  remaining = paragraph
                  while remaining and measure(remaining) > max_width:
                      low, high = 1, len(remaining)
                      while low < high:
                          middle = (low + high + 1) // 2
                          if measure(remaining[:middle]) <= max_width:
                              low = middle
                          else:
                              high = middle - 1
                      output.append(remaining[:low])
                      remaining = remaining[low:]
                  output.append(remaining)
              return "\n".join(output)


