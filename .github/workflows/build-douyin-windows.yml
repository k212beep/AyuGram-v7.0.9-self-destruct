          未提供的信息显示“未填写”，不从昵称或评论地区分布推断性别、年龄和 IP 属地。
          资料地区与 IP 属地分开显示、分开筛选；地区支持省、市关键词和可选的完整地区值。
          年龄区间两端均包含，允许单独设置下限或上限；可单独查看已填或未填年龄。
          “重置”会清除筛选和排序，恢复原始导入顺序；不会清除名单。

          若先前导入的是只包含 ID、昵称和来源的旧 CSV，请重新导入原始 TXT 或本次新版完整资料 CSV。
          旧版 CSV 仍可导入，但其中没有保存的资料会显示为“未填写”。

          ## v1.5.0 列表、媒体规则和计时

          接收人列表采用紧凑行高，名单、消息和媒体保持三栏同时显示；v1.10.0 将整套界面缩小至约 85%。
