          def parse_age(value: str) -> int | None:
              match = re.fullmatch(r"(\d{1,3})\s*岁?", optional_text(value))
              if match and 0 <= int(match.group(1)) <= 150:
                  return int(match.group(1))
              return None


          def parse_gender(value: str) -> str:
              value = optional_text(value)
              mapping = {"m": "男", "male": "男", "男性": "男", "f": "女", "female": "女", "女性": "女"}
              if re.fullmatch(r"[男女](?:\s*\d{1,3}\s*岁)?", value):
                  return value[0]
              return mapping.get(value.casefold(), value)


          def parse_comment_count(value: str) -> int | None:
              value = re.sub(r"\s*[次条]$", "", optional_text(value)).strip().replace("，", ",")
              if "," in value:
                  if not re.fullmatch(r"\d{1,3}(?:,\d{3})+", value):
                      return None
                  value = value.replace(",", "")
              return int(value) if re.fullmatch(r"\d{1,15}", value) else None


          def extract_comment_count(line: str) -> int | None:
              match = COMMENT_COUNT_LABEL.search(line)
              if match is None:
                  return None
              following = LOCATION_LABELS.search(line, match.end())
              value = line[match.end():following.start() if following else len(line)]
              value = re.split(r"[（(]", value, maxsplit=1)[0].strip(" \t\u3000:：=,，;；|")
              return parse_comment_count(value)


          def merge_recipient_details(current: Recipient, incoming: Recipient) -> None:
              for name in ("nickname", "gender", "region", "ip_region"):
                  if not getattr(current, name) and getattr(incoming, name):
                      setattr(current, name, getattr(incoming, name))
              if current.age is None and incoming.age is not None:
                  current.age = incoming.age
              if incoming.comment_count is not None:
                  current.comment_count = max(current.comment_count or 0, incoming.comment_count)
              for name in ("sources", "raw_details"):
                  target = getattr(current, name)
                  target.extend(value for value in getattr(incoming, name) if value not in target)


          def recipient_source_text(sources: list[str]) -> str:
              labels = list(dict.fromkeys(sources))
              if "粉丝" in labels and "关注" in labels:
                  first = min(labels.index("粉丝"), labels.index("关注"))
                  labels = [value for value in labels if value not in {"粉丝", "关注"}]
                  labels.insert(first, "互相关注")
              return " / ".join(labels)


          def filter_records(records: list[Recipient], query: str = "", source: str = "全部来源",
                             gender: str = "全部性别", age_mode: str = "全部年龄", min_age: int | None = None,
                             max_age: int | None = None, region_query: str = "", region_field: str = "任一地区") -> list[Recipient]:
              if (min_age is not None and not 0 <= min_age <= 150) or (max_age is not None and not 0 <= max_age <= 150):
                  raise ValueError("年龄范围请填写 0–150 之间的整数。")
              if min_age is not None and max_age is not None and min_age > max_age:
                  raise ValueError("最小年龄不能大于最大年龄。")
              query = query.strip().casefold()
              region_query = re.sub(r"\s+", "", region_query).casefold()
              matches = []
              for record in records:
                  if query and query not in (record.nickname + " " + record.douyin_id).casefold():
                      continue
                  if source != "全部来源" and source not in record.sources:
                      continue
                  if (gender == "未填写" and record.gender) or (gender not in {"全部性别", "未填写"} and record.gender != gender):
                      continue
                  if (age_mode == "已填年龄" and record.age is None) or (age_mode == "未填年龄" and record.age is not None):
                      continue
                  if min_age is not None and (record.age is None or record.age < min_age):
                      continue
                  if max_age is not None and (record.age is None or record.age > max_age):
                      continue
                  regions = [record.region] if region_field == "资料地区" else [record.ip_region] if region_field == "IP属地" else [record.region, record.ip_region]
                  if region_query and not any(region_query in re.sub(r"\s+", "", text).casefold() for text in regions):
                      continue
                  matches.append(record)
              return matches


          def sort_records(records: list[Recipient], column: str = "", descending: bool = False,
                           statuses: dict[str, str] | None = None) -> list[Recipient]:
              if not column:
                  return list(records)
              def key(record):
                  values = {"name": record.nickname, "id": record.douyin_id, "gender": record.gender,
                            "age": record.age, "region": record.region, "ip_region": record.ip_region,
                            "comment_count": record.comment_count,
                            "source": recipient_source_text(record.sources), "status": (statuses or {}).get(record.douyin_id, "待开始")}
                  value = values.get(column, "")
                  return value.casefold() if isinstance(value, str) else value
              known = [record for record in records if key(record) not in (None, "")]
              missing = [record for record in records if key(record) in (None, "")]
              return sorted(known, key=key, reverse=descending) + missing


          def recipient_details_text(record: Recipient, status: str = "待开始") -> str:
              fields = [("昵称", record.nickname), ("抖音号", record.douyin_id), ("性别", record.gender),
                        ("年龄", f"{record.age} 岁" if record.age is not None else ""),
                        ("资料地区", record.region), ("IP属地", record.ip_region),
                        ("评论次数", str(record.comment_count) if record.comment_count is not None else ""),
                        ("来源", recipient_source_text(record.sources)), ("状态", status)]
              text = "\n\n".join(f"{label}：{value or '未填写'}" for label, value in fields)
              if record.raw_details:
                  text += "\n\n原始资料：\n\n" + "\n\n".join(record.raw_details)
              return text


          def parse_text(text: str, source: str = "导入名单") -> ImportResult:
              """Accept supplied labeled TXT, one ID per line, and headed CSV/TSV."""
              result = ImportResult([])
              lines = [line.strip() for line in text.lstrip("\ufeff").splitlines()
                       if line.strip() and not line.lstrip().startswith("#")]
              if not lines:
                  return result
              first = lines[0]
              delimiter = "\t" if "\t" in first else ("," if "," in first else "，")
              first_cells = next(csv.reader([first], delimiter=delimiter))
              headers = [normalize_header(cell) for cell in first_cells]
              headed = any(header in ID_HEADERS for header in headers)
              id_column = next((i for i, h in enumerate(headers) if h in ID_HEADERS), None)
              name_column = next((i for i, h in enumerate(headers) if h in NAME_HEADERS), None)
              source_column = next((i for i, h in enumerate(headers) if h in SOURCE_HEADERS), None)
              gender_column = next((i for i, h in enumerate(headers) if h in GENDER_HEADERS), None)
              age_column = next((i for i, h in enumerate(headers) if h in AGE_HEADERS), None)
              region_column = next((i for i, h in enumerate(headers) if h in REGION_HEADERS), None)
              ip_column = next((i for i, h in enumerate(headers) if h in IP_REGION_HEADERS), None)
              comment_column = next((i for i, h in enumerate(headers) if h in COMMENT_COUNT_HEADERS), None)
              format_column = next((i for i, h in enumerate(headers) if h == "文件格式"), None)
              seen: dict[str, Recipient] = {}

              def add(value: str, nickname: str = "", label: str = source, gender: str = "", age: str = "",
                      region: str = "", ip_region: str = "", raw: str = "", comment_count: int | None = None) -> None:
                  value = value.strip().lstrip("\ufeff").removeprefix("@").strip()
                  if not valid_id(value):
                      result.skipped += 1
                      return
                  result.parsed += 1
                  labels = [part.strip() for part in label.split(" / ") if part.strip()] or [source]
                  record = Recipient(value, nickname.strip(), list(dict.fromkeys(labels)), parse_gender(gender),
                                     parse_age(age), optional_text(region), optional_text(ip_region),
                                     [f"{source}：{raw}"] if raw else [], comment_count=comment_count)
                  if value in seen:
                      result.duplicates += 1
                      merge_recipient_details(seen[value], record)
                      return
                  seen[value] = record
                  result.records.append(record)

              if headed:
                  try:
                      for row in csv.reader(lines[1:], delimiter=delimiter, strict=True):
                          if id_column is None or len(row) <= id_column:
                              result.skipped += 1
                              continue
                          if format_column is not None and len(row) > format_column and row[format_column] == COLLECTION_CSV_FORMAT:
                              # Our archive quotes spreadsheet-sensitive text, including a
                              # literal leading quote; undo exactly one marker on import.
                              row = [value.removeprefix("'") for value in row]
                          nickname = row[name_column] if name_column is not None and len(row) > name_column else ""
                          label = row[source_column] if source_column is not None and len(row) > source_column else source
                          def cell(column):
                              return row[column] if column is not None and len(row) > column else ""
                          gender = cell(gender_column)
                          age = cell(age_column)
                          if not age and (match := re.fullmatch(r"[男女]\s*(\d{1,3}\s*岁)", gender.strip())):
                              age = match.group(1)
                          raw = " | ".join(f"{headers[i]}：{value}" for i, value in enumerate(row) if i < len(headers))
                          add(row[id_column], nickname, label, gender, age, cell(region_column), cell(ip_column), raw,
                              comment_count=parse_comment_count(cell(comment_column)))
                  except csv.Error as exc:
                      raise ValueError(f"CSV 格式有误：{exc}") from exc
                  return result

              for line in lines:
                  match = LABELED_ID.search(line)
                  if match:
                      nickname = ""
                      gender = age = ""
                      before_id = line[:match.start()]
                      if "昵称" in before_id:
                          nickname = before_id.split("昵称", 1)[1].strip()
                          demographic = re.search(r"\s{2,}(空|[男女](?:\s*\d{1,3}\s*岁)?|\d{1,3}\s*岁)\s*$", nickname)
                          if demographic:
                              value = demographic.group(1)
                              nickname = nickname[:demographic.start()].strip()
                              gender = value[0] if value[0] in "男女" else ""
                              age_match = re.search(r"\d{1,3}\s*岁", value)
                              age = age_match.group(0) if age_match else ""
                      region, ip_region = extract_locations(line)
                      add(match.group(1), nickname, source, gender, age, region, ip_region, line,
                          comment_count=extract_comment_count(line[match.end():]))
                  elif "昵称" in line or "资料位置" in line:
                      result.skipped += 1
                  else:
                      # Bare-ID files may also separate IDs with commas, semicolons or tabs.
                      for token in re.split(r"[\s,，;；]+", line):
                          if token:
                              add(token)
              return result


