          def collection_counts(records: list[Recipient]) -> dict[str, int]:
              return {kind: len({record.douyin_id for record in records if kind in record.sources})
                      for kind in COLLECTION_TYPES}


          def mutual_follow_count(members: dict[tuple[str, str], set[str]], target: str) -> int | None:
              fans = members.get((target, "粉丝"))
              following = members.get((target, "关注"))
              if fans is None or following is None:
                  return None
              return len(fans & following)


          def collection_display_count(preferences: CollectionPreferences, target: str, kind: str, actual_count: int) -> int:
              profile = preferences.targets.get(target)
              field_name = {"粉丝": "fans_collected_count", "关注": "following_collected_count"}.get(kind)
              configured = getattr(profile, field_name, None) if field_name else None
              return actual_count if configured is None else configured


          def collection_display_summary(records: list[Recipient], preferences: CollectionPreferences,
                                         target: str) -> tuple[dict[str, int], int]:
              counts = {kind: collection_display_count(preferences, target, kind, count)
                        for kind, count in collection_counts(records).items()}
              categorized_ids = {record.douyin_id for record in records
                                 if any(kind in record.sources for kind in COLLECTION_TYPES)}
              other_ids = {record.douyin_id for record in records} - categorized_ids
              return counts, sum(counts.values()) + len(other_ids)


          class CollectionCancelled(Exception):
              pass


          def read_collection_batch(paths, kind: str, target: str, cancel: threading.Event | None = None) -> CollectionBatch:
              if kind not in COLLECTION_TYPES:
                  raise ValueError("请选择评论区、粉丝或关注名单。")
              batch = CollectionBatch(collection_target(target), kind, [], list(dict.fromkeys(Path(p).resolve() for p in paths)))
              if not batch.paths:
                  raise ValueError("请先选择需要导入的名单文件。")
              for path in batch.paths:
                  if cancel is not None and cancel.is_set():
                      raise CollectionCancelled()
                  try:
                      result = read_list(path)
                  except FileNotFoundError as exc:
                      raise ValueError(f"{path.name}：文件不存在，请重新选择。") from exc
                  except PermissionError as exc:
                      raise ValueError(f"{path.name}：无法读取文件，请检查访问权限或关闭占用程序。") from exc
                  except (OSError, ValueError, UnicodeError) as exc:
                      raise ValueError(f"{path.name}：{exc}") from exc
                  if not result.records:
                      raise ValueError(f"{path.name}：没有可导入的抖音号。")
                  for record in result.records:
                      record.sources = [kind]
                  _added, repeated = merge_records(batch.records, result.records)
                  batch.parsed += result.parsed
                  batch.duplicates += result.duplicates + repeated
                  batch.skipped += result.skipped
              return batch


