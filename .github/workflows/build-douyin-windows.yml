                  self.log("开始", f"任务已创建，范围：{self.scope_var.get()}，共 {len(targets)} 位接收人，间隔 {interval_ms / 1000:g} 秒 / 人。")
                  self.toast_var.set("任务进行中 · 可随时暂停或停止")
