                  self.label(content, "填写目标账号资料，并设置各分类状态。", 10, "blue").grid(row=1, column=0, columnspan=2, sticky="w", pady=(0, 12))
                  target = self.current_collection_key("评论区")[0]
                  profile = self.collection_preferences.targets.get(target, TargetProfile())
                  self.target_form = {
                      "target": tk.StringVar(value=target), "nickname": tk.StringVar(value=profile.nickname),
                      "fans_private": tk.BooleanVar(value=profile.fans_private),
                      "following_private": tk.BooleanVar(value=profile.following_private),
                      "fans_count": tk.StringVar(value="" if profile.fans_count is None else str(profile.fans_count)),
                      "following_count": tk.StringVar(value="" if profile.following_count is None else str(profile.following_count)),
                      "fans_collected_count": tk.StringVar(value="" if profile.fans_collected_count is None else str(profile.fans_collected_count)),
                      "following_collected_count": tk.StringVar(value="" if profile.following_collected_count is None else str(profile.following_collected_count)),
                      "region": tk.StringVar(value=profile.region), "live_ip": tk.StringVar(value=profile.live_ip),
                  }
                  self.target_settings_entries = []

                  def add_entry(parent, key, row, column, width):
                      entry = tk.Entry(parent, textvariable=self.target_form[key], width=width, bg=COLORS["input"],
                                       fg=COLORS["text"], insertbackground=COLORS["accent"], relief="flat", font=("Microsoft YaHei UI", 11))
                      entry.grid(row=row, column=column, sticky="ew", ipady=6, pady=6)
                      self.target_settings_entries.append(entry)

                  for row, (key, caption) in enumerate((("target", "目标抖音号"), ("nickname", "目标昵称"),
                                                      ("fans_count", "粉丝人数"), ("following_count", "关注人数"),
                                                      ("region", "资料位置"), ("live_ip", "实时IP")), 2):
                      self.label(content, caption, 10, "muted").grid(row=row, column=0, sticky="w", padx=(0, 10), pady=6)
                      if key in {"fans_count", "following_count"}:
                          count_row = tk.Frame(content, bg=COLORS["card"])
                          count_row.grid(row=row, column=1, sticky="ew")
                          count_row.columnconfigure((0, 2), weight=1, uniform="counts")
                          add_entry(count_row, key, 0, 0, 12)
                          self.label(count_row, "已采集人数", 10, "muted").grid(row=0, column=1, padx=(10, 8))
                          collected_key = "fans_collected_count" if key == "fans_count" else "following_collected_count"
                          add_entry(count_row, collected_key, 0, 2, 12)
                      else:
                          add_entry(content, key, row, 1, 28)
                  for row, key, caption in ((8, "fans_private", "粉丝：账号已设置隐私"),
                                            (9, "following_private", "关注：账号已设置隐私")):
                      tk.Checkbutton(content, text=caption, variable=self.target_form[key], bg=COLORS["card"],
                          fg=COLORS["text"], activebackground=COLORS["card"], selectcolor=COLORS["input"],
                          font=("Microsoft YaHei UI", 9)).grid(row=row, column=0, columnspan=2, sticky="w", pady=4)
                  self.label(content, "已采集人数留空时按名单统计；填写后保持固定。", 9, "muted").grid(row=10, column=0, columnspan=2, sticky="w", pady=(8, 12))
                  actions = tk.Frame(content, bg=COLORS["card"])
                  actions.grid(row=11, column=0, columnspan=2, sticky="e")

                  def close_settings():
                      dialog.destroy()
                      self.target_settings_dialog = None

                  def save_settings():
                      if self.session.active or self.collection_importer.pending:
                          messagebox.showinfo("任务进行中", "请等待当前任务完成后再保存目标资料。", parent=dialog)
                          return
                      try:
                          identifier = collection_target(self.target_form["target"].get())
                          targets = dict(self.collection_preferences.targets)
                          targets[identifier] = TargetProfile(self.target_form["nickname"].get(), self.target_form["fans_private"].get(),
                                                             self.target_form["following_private"].get(),
                                                             parse_target_count(self.target_form["fans_count"].get()),
                                                             parse_target_count(self.target_form["following_count"].get()),
                                                             self.target_form["region"].get(), self.target_form["live_ip"].get(),
                                                             parse_target_count(self.target_form["fans_collected_count"].get()),
                                                             parse_target_count(self.target_form["following_collected_count"].get()))
                          preferences = save_collection_preferences(self.collection_preferences_path, CollectionPreferences(identifier, targets))
                      except (OSError, ValueError) as exc:
                          messagebox.showinfo("目标资料未保存", str(exc), parent=dialog)
                          return
                      self.collection_preferences = preferences
                      self.collection_target_var.set(identifier)
                      self.refresh_target_summary()
                      if self.collection_dialog is not None and self.collection_dialog.winfo_exists():
                          self.restore_collection_receipt()
                      self.toast_var.set("目标资料已保存。")
                      close_settings()

                  self.button(actions, "取消", close_settings, padx=12).pack(side="left", padx=(0, 8))
                  self.target_settings_save_button = self.button(actions, "保存设置", save_settings, primary=True, padx=14)
                  self.target_settings_save_button.pack(side="left")
                  dialog.protocol("WM_DELETE_WINDOW", close_settings)
                  dialog.bind("<Escape>", lambda _event: close_settings())
                  self.scale_ui(dialog)
                  dialog.update_idletasks()
