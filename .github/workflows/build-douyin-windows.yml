          已逐条核对本次原始附件的 282 行，并校验去重 CSV 的字段一致性：225 人中，86 人有资料地区，156 人有 IP 属地。
          原始文件写“空”或没有提供的字段继续显示“未填写”。请在新版 EXE 中重新导入原始 TXT 或完整资料 CSV，旧三列表格没有保存地区信息。

