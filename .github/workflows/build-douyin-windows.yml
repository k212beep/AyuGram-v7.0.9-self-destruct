# Upload this single file as .github/workflows/build-douyin-windows.yml
# Compressed app sources are verified and restored on the runner.
name: Build Douyin Windows App
run-name: Douyin Windows v1.20.1 · ${{ github.ref_name }}

on:
  push:
    paths:
      - '.github/workflows/build-douyin-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: douyin-windows-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
