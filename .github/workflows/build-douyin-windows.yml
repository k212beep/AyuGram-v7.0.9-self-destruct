          ## v1.16.0 自定义采集人数与互相关注

          点击“搜索账号”，在粉丝人数、关注人数右侧分别设置“已采集人数”。两项按目标抖音号独立保存，
          可填 0–999999999999 的整数或带千位分隔符的数字；填写后，分类成功提示、采集详情、底部汇总及之后的采集完成提示采用固定值，
          不会随导入、重复导入或更换名单而变化。留空则恢复文件统计。评论区仍按文件中的有效去重 ID 统计。
          这两项与账号资料的粉丝总人数、关注总人数分开；没有导入文件或采集失败时，分类仍显示相应失败状态。
          固定值保存在 `collection-settings.json` 的 `fans_collected_count` 和 `following_collected_count` 字段中，兼容既有设置。
          它们仅控制人数显示，不会扩充接收名单、改变导出文件行数或真实去重统计；重启保留设置，采集成功状态仍需本次读取文件后产生。

          同一抖音号同时存在于粉丝、关注文件中时，接收名单来源显示“互相关注”，详情与来源排序使用相同文字。
          若同时来自评论区，则显示“评论区 / 互相关注”（按首次导入来源顺序排列）。原有粉丝、关注分类仍保留用于统计和数据处理，
          不会重复添加接收人；前导零保留，昵称相同但抖音号不同不会合并。

          ## v1.16.1 采集保存标识

          评论区、粉丝、关注读取并保存成功后，在“采集成功 / 已采集 XX 人”下方显示绿色“✓ 已保存至本地”标识。
          采集详情与完成提示同步显示“已保存至本地”；标识只对应本次成功保存的分类，采集中、失败、切换至未采集目标及清空名单后隐藏。
          分类状态随文字自然换行，避免长人数和保存标识被固定高度截断；沿用自定义采集人数及互相关注显示。

