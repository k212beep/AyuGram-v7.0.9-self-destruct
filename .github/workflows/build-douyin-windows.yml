                  added = repeated = skipped = 0
                  errors = []
                  for filename in paths:
                      path = Path(filename)
                      try:
                          result = read_list(path)
                          new, duplicate = merge_records(self.records, result.records)
                          added += new
                          repeated += duplicate + result.duplicates
                          skipped += result.skipped
                          if not result.records:
                              errors.append(f"{path.name}：没有可导入的抖音号。")
                          elif path.resolve() not in self.imported_files:
                              self.imported_files.append(path.resolve())
