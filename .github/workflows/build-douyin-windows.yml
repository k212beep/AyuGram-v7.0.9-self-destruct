          def wait_for_window_mapping(window, timeout_seconds: float = 5.0) -> None:
              """Pump native window events before testing visibility, with a bounded wait."""
              deadline = time.monotonic() + timeout_seconds
              while True:
                  # update_idletasks alone does not process Windows show/map messages.
                  window.update()
                  if window.winfo_viewable():
                      window.update_idletasks()
                      return
                  if time.monotonic() >= deadline:
                      raise RuntimeError(f"GUI window did not become visible within {timeout_seconds:g}s; state={window.state()}")
                  time.sleep(.01)


