              def schedule_table_grid(self) -> None:
                  if self.table_grid_timer is None:
                      self.table_grid_timer = self.root.after_idle(self.draw_table_grid)

              def forward_table_grid_event(self, event, sequence):
                  x, y = event.x_root - self.table.winfo_rootx(), event.y_root - self.table.winfo_rooty()
                  self.table.focus_set()
                  if sequence == "<Double-Button-1>":
                      event.x, event.y, event.widget = x, y, self.table
                      self.show_clicked_recipient(event)
                  else:
                      options = {"x": x, "y": y, "state": event.state}
                      if sequence == "<MouseWheel>":
                          options["delta"] = event.delta
                      self.table.event_generate(sequence, **options)
                  return "break"

              def draw_table_grid(self) -> None:
                  self.table_grid_timer = None
                  width, height = self.table.winfo_width(), self.table.winfo_height()
                  if width < 8 or height < 8 or not self.table_widths:
                      return
                  columns = self.displayed_columns()
                  heading_bottom = 0
                  sample_x = 2 + self.table_widths[columns[0]] // 2
                  for y in range(min(height, ui_pixels(100))):
                      if self.table.identify_region(sample_x, y) == "heading":
                          heading_bottom = y + 1
                      elif heading_bottom:
                          break
                  first = self.table.identify_row(heading_bottom + 2)
                  box = self.table.bbox(first) if first else ()
                  start_x = box[0] if box else 2
                  first_y = box[1] if box else heading_bottom
                  row_height = box[3] if box else self.table_row_height
                  positions = [start_x]
                  for column in columns:
                      positions.append(positions[-1] + self.table_widths[column])
                  segments = [(min(width - 2, x), 1, 1, height - 2) for x in positions]
                  segments += [(start_x, y - 1, max(1, positions[-1] - start_x), 1)
                               for y in range(max(2, first_y), height, max(1, row_height))]
                  if segments == getattr(self, "table_grid_segments", None):
                      return
                  while len(self.table_grid_lines) < len(segments):
                      line = tk.Frame(self.table, bg="#30435B", bd=0, highlightthickness=0)
                      for sequence in ("<Button-1>", "<ButtonRelease-1>", "<Double-Button-1>",
                                       "<B1-Motion>", "<MouseWheel>", "<Button-4>", "<Button-5>"):
                          line.bind(sequence, lambda event, seq=sequence: self.forward_table_grid_event(event, seq))
                      self.table_grid_lines.append(line)
                  for line, (x, y, line_width, line_height) in zip(self.table_grid_lines, segments):
                      line.place(x=x, y=y, width=line_width, height=line_height)
                      line.lift()
                  for line in self.table_grid_lines[len(segments):]:
                      line.place_forget()
                  self.table_grid_segments = segments
                  self.table_grid_header_bottom = first_y

