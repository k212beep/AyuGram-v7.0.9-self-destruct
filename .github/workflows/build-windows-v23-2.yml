          if ($langEntries.Count -eq 0) { throw "No language entries were found." }
          foreach ($entry in $langEntries) {
            $key = $entry.Groups[1].Value
            $value = $entry.Groups[2].Value
            if ($key -notmatch '#(zero|one|two|few|many|other)$' -and $value -match '\{count(?:_short|_decimal)?(?=[:}])') {
              throw "Reserved plural tag in non-plural language key: $key"
            }
          }

